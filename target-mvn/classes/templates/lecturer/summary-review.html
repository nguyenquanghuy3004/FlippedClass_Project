<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Review Summary - Lecturer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script>
    if (!localStorage.getItem('jwt_token')) window.location.href = '/login';
  </script>
  <link rel="stylesheet" th:href="@{/assets/css/summary-review.css}">
</head>

<body>

  <header class="lesson-topbar">
    <a class="brand-link" th:href="@{/}">
      <span class="brand-mark"><i class="ti ti-school"></i></span>
      <span>Flipped<span>Class</span> (Lecturer)</span>
    </a>
    <a id="backBtn" class="back-link" href="javascript:history.back()">
      <i class="ti ti-arrow-left"></i>
      Back
    </a>
    
    <div class="topbar-spacer"></div>

    <div class="student-user-menu topbar-user-menu">
      <div class="d-flex align-items-center gap-2">
        <img class="rounded-circle border" th:src="@{/assets/images/avatar-1.jpg}"
          style="width: 35px; height: 35px; object-fit: cover;" alt="Avatar">
        <span class="fw-bold" style="color: #1e293b;">Lecturer View</span>
      </div>
    </div>
  </header>

  <div id="mainContent">
    <div class="state-center">
      <i class="ti ti-loader-2 ti-spin"></i>
      <p>Loading summary...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const token = localStorage.getItem('jwt_token');
    const pathMatch = window.location.pathname.match(/\/lecturer\/summaries\/(\d+)\/review/);
    const summaryId = pathMatch?.[1] || new URLSearchParams(window.location.search).get('summaryId') || '';

    function authHeaders(json = true) {
      const h = { Authorization: `Bearer ${token}` };
      if (json) h['Content-Type'] = 'application/json';
      return h;
    }

    function escapeHtml(v) {
      return String(v ?? '')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;').replaceAll('"', '&quot;');
    }

    function parseSummaryContent(raw) {
      try { return JSON.parse(raw); }
      catch { return { keyTakeaways: raw, confusingPoints: '' }; }
    }

    async function loadAndRender() {
      if (!summaryId) {
        document.getElementById('mainContent').innerHTML = `
        <div class="state-center"><i class="ti ti-alert-circle"></i><p>No summary ID provided.</p></div>`;
        return;
      }
      try {
        const res = await fetch(`/api/lesson-summaries/${summaryId}`, { headers: authHeaders(false) });
        if (!res.ok) throw new Error('Failed to load summary');
        const s = await res.json();
        renderPage(s);
      } catch (e) {
        document.getElementById('mainContent').innerHTML = `
        <div class="state-center"><i class="ti ti-alert-circle"></i><p>${escapeHtml(e.message)}</p></div>`;
      }
    }

    function renderPage(s) {
      const parsed = parseSummaryContent(s.summaryContent || '');
      const isReviewed = s.status === 'REVIEWED';
      const dateStr = s.submittedAt ? new Date(s.submittedAt).toLocaleString('vi-VN') : '—';
      const reviewedStr = s.reviewedAt ? new Date(s.reviewedAt).toLocaleString('vi-VN') : '—';

      // Update back button
      if (s.learningNodeId) {
        document.getElementById('backBtn').href = `/lecturer/learning-nodes/${s.learningNodeId}/preview`;
      }
      // Update topbar title
      const titleEl = document.getElementById('topbarTitle');
      if (titleEl) titleEl.textContent = s.studentName ? `Reviewing: ${s.studentName}` : 'Review Summary';

      document.getElementById('mainContent').innerHTML = `
      <div class="page-wrap">

        <!-- HERO BANNER -->
        <div class="review-hero">
          <div>
            <div class="review-hero-title">📋 Lesson Summary Review</div>
            <div class="review-hero-sub">Student: <strong>${escapeHtml(s.studentName || 'Unknown')}</strong> &nbsp;·&nbsp; Submitted: ${dateStr}</div>
          </div>
          <span class="review-hero-badge">
            <i class="ti ${isReviewed ? 'ti-check' : 'ti-clock'}"></i>
            ${isReviewed ? 'Reviewed' : 'Pending Review'}
          </span>
        </div>

        <!-- LEFT: Summary Content -->
        <div>
          <div class="card">
            <div class="card-header">
              <div class="icon icon-blue"><i class="ti ti-notebook"></i></div>
              <div>
                <h2>Lesson Summary</h2>
                <p>Submitted by <strong>${escapeHtml(s.studentName || 'Student')}</strong></p>
              </div>
              <div style="margin-left:auto;">
                <span class="status-badge ${isReviewed ? 'status-reviewed' : 'status-pending'}">
                  <i class="ti ${isReviewed ? 'ti-check' : 'ti-clock'}"></i>
                  ${isReviewed ? 'Reviewed' : 'Pending'}
                </span>
              </div>
            </div>
            <div class="card-body">
              <div class="meta-bar">
                <div class="meta-bar-item">
                  <label>Student</label>
                  <span>${escapeHtml(s.studentName || '—')}</span>
                </div>
                <div class="meta-bar-divider"></div>
                <div class="meta-bar-item">
                  <label>Submitted At</label>
                  <span>${dateStr}</span>
                </div>
                <div class="meta-bar-divider"></div>
                <div class="meta-bar-item">
                  <label>Status</label>
                  <span>${isReviewed ? ' Reviewed' : 'Pending'}</span>
                </div>
                <div class="meta-bar-divider"></div>
                <div class="meta-bar-item">
                  <label>Reviewed At</label>
                  <span>${reviewedStr}</span>
                </div>
              </div>

              <div class="summary-section">
                <div class="section-label label-blue">
                  <i class="ti ti-book-2"></i> Key Takeaways
                </div>
                <div class="section-text">${escapeHtml(parsed.keyTakeaways || '(No content)')}</div>
              </div>

              <div class="summary-section" style="margin-top:1.5rem;">
                <div class="section-label label-amber">
                  <i class="ti ti-help-circle"></i> Concepts / Confusing Points
                </div>
                <div class="section-text">${escapeHtml(parsed.confusingPoints || '(None mentioned)')}</div>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT: Feedback Form (sticky) -->
        <div class="feedback-sticky">
          <div class="card">
            <div class="card-header">
              <div class="icon icon-green"><i class="ti ti-message-circle-2"></i></div>
              <div>
                <h2>Lecturer Feedback</h2>
                <p>Write constructive feedback for the student.</p>
              </div>
            </div>
            <div class="card-body">
              ${isReviewed && s.lecturerFeedback ? `
                <div style="margin-bottom:1rem;">
                  <div class="section-label label-green"><i class="ti ti-check"></i> Previous Feedback</div>
                  <div class="existing-feedback">${escapeHtml(s.lecturerFeedback)}</div>
                </div>
              ` : ''}
              <label class="feedback-label" for="feedbackInput">
                ${isReviewed ? 'Update Feedback' : 'Write Feedback'}
              </label>
              <textarea id="feedbackInput" class="feedback-textarea"
                placeholder="Provide detailed, constructive feedback on the student's understanding..."
              >${escapeHtml(s.lecturerFeedback || '')}</textarea>
              <div id="successMsg" style="display:none;" class="alert-success">
                <i class="ti ti-circle-check"></i> Feedback submitted successfully!
              </div>
              <button id="submitBtn" class="btn-submit" onclick="submitFeedback(${s.id})">
                <i class="ti ti-send"></i> Submit Feedback
              </button>
            </div>
          </div>
        </div>

      </div>
    `;
    }

    async function submitFeedback(id) {
      const feedback = document.getElementById('feedbackInput').value.trim();
      if (!feedback) { alert('Please write feedback before submitting.'); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';

      try {
        const res = await fetch(`/api/lesson-summaries/${id}/feedback`, {
          method: 'PUT',
          headers: authHeaders(true),
          body: JSON.stringify({ lecturerFeedback: feedback })
        });
        if (!res.ok) throw new Error('Failed to submit feedback');

        document.getElementById('successMsg').style.display = 'flex';
        btn.innerHTML = '<i class="ti ti-check"></i> Feedback Submitted';
        btn.style.background = '#10b981';
        setTimeout(() => {
          btn.disabled = false;
          btn.style.background = '';
          btn.innerHTML = '<i class="ti ti-send"></i> Update Feedback';
          document.getElementById('successMsg').style.display = 'none';
        }, 2500);
      } catch (e) {
        alert(e.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-send"></i> Submit Feedback';
      }
    }

    loadAndRender();
  </script>
</body>

</html>
