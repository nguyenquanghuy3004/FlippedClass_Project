<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>User Detail</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="fs-3 mb-1">User Details</h1>
                        <p>View detailed information and manage this user's account.</p>
                    </div>
                    <a href="/admin/users" class="btn btn-outline-secondary">
                        <i class="ti ti-arrow-left me-1"></i> Back to Users
                    </a>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <!-- Main Info -->
            <div class="col-md-8">
                <div class="card h-100">
                    <div class="card-header bg-white px-4 py-3 border-bottom">
                        <h5 class="mb-0">Profile Information</h5>
                    </div>
                    <div class="card-body p-4">
                        <input type="hidden" id="userId" th:value="${userId}">
                        <div class="row mb-3">
                            <div class="col-sm-4 text-muted fw-semibold">User ID</div>
                            <div class="col-sm-8 fw-bold" id="u-id">...</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4 text-muted fw-semibold">Email</div>
                            <div class="col-sm-8" id="u-email">...</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4 text-muted fw-semibold">Roles</div>
                            <div class="col-sm-8" id="u-roles">...</div>
                        </div>
                        
                        <hr class="my-4 border-secondary opacity-25">
                        
                        <h6 class="fw-bold mb-3">Learning Activity</h6>
                        <div class="row text-center">
                            <div class="col-6 border-end">
                                <h3 class="fw-bold text-primary mb-1" id="u-joined">0</h3>
                                <div class="small text-muted">Spaces Joined</div>
                            </div>
                            <div class="col-6">
                                <h3 class="fw-bold text-success mb-1" id="u-owned">0</h3>
                                <div class="small text-muted">Spaces Owned</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Actions -->
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-header bg-white px-4 py-3 border-bottom">
                        <h5 class="mb-0">Account Status</h5>
                    </div>
                    <div class="card-body p-4 text-center">
                        <div class="mb-4">
                            <div class="text-muted fw-semibold mb-2">Current Status</div>
                            <div id="u-status">
                                <!-- Status badge here -->
                            </div>
                        </div>

                        <button id="btn-toggle-status" class="btn btn-warning w-100 mb-3" onclick="toggleStatus()">
                            Toggle Lock Status
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            let currentStatus = '';
            
            $(document).ready(function() {
                loadUserDetail();
            });

            function loadUserDetail() {
                const id = $('#userId').val();
                $.ajax({
                    url: `/api/admin/users/${id}`,
                    method: 'GET',
                    success: function(data) {
                        $('#u-id').text(data.user.id);
                        $('#u-email').text(data.user.email);
                        
                        currentStatus = data.user.status;
                        if(currentStatus === 'ACTIVE') {
                            $('#u-status').html('<span class="badge badge-active">ACTIVE</span>');
                            $('#btn-toggle-status').text('Lock Account').removeClass('btn-success').addClass('btn-warning');
                        } else {
                            $('#u-status').html('<span class="badge badge-locked">LOCKED</span>');
                            $('#btn-toggle-status').text('Unlock Account').removeClass('btn-warning').addClass('btn-success');
                        }
                        
                        $('#u-roles').text(data.user.roles.join(', '));
                        $('#u-joined').text(data.spacesJoined);
                        $('#u-owned').text(data.spacesOwned);
                    }
                });
            }

            function toggleStatus() {
                const id = $('#userId').val();
                const action = currentStatus === 'ACTIVE' ? 'lock' : 'unlock';
                $.ajax({
                    url: `/api/admin/users/${id}/${action}`,
                    method: 'POST',
                    success: function() {
                        alert('Status updated successfully');
                        loadUserDetail();
                    }
                });
            }
        </script>
    </th:block>
</body>
</html>
