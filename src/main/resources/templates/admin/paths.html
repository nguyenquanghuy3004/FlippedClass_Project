<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>Learning Paths - Admin</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fs-3 mb-0">Learning Paths</h1>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="ti ti-search text-muted"></i></span>
                        <input type="text" class="form-control bg-light border-0" id="searchInput" placeholder="Search paths by title...">
                        <button class="btn btn-primary" onclick="searchPaths()">Search</button>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Path Info</th>
                        <th>Space</th>
                        <th>Lecturer Email</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="pathsTableBody">
                    <!-- Data rendered via JS -->
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <span class="text-muted small" id="pageInfo">Showing 0 results</span>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="pagination">
                        <!-- Pagination rendered via JS -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let currentPage = 0;
        let pageSize = 10;
        let currentKeyword = '';

        function loadPaths(page = 0, keyword = '') {
            currentPage = page;
            currentKeyword = keyword;
            const url = `/api/admin/curriculum/paths?page=${page}&size=${pageSize}&keyword=${encodeURIComponent(keyword)}`;
            
            $.ajax({
                url: url,
                type: 'GET',
                success: function(response) {
                    renderTable(response.content);
                    renderPagination(response);
                    $('#pageInfo').text(`Showing ${response.numberOfElements} of ${response.totalElements} results`);
                },
                error: function(err) {
                    Swal.fire('Error!', 'Error loading paths', 'error');
                }
            });
        }

        function renderTable(paths) {
            const tbody = $('#pathsTableBody');
            tbody.empty();
            
            if (paths.length === 0) {
                tbody.append('<tr><td colspan="6" class="text-center py-4 text-muted">No paths found</td></tr>');
                return;
            }

            paths.forEach(p => {
                let statusBadge = '';
                if (p.status === 'ACTIVE' || p.status === 'PUBLISHED') statusBadge = '<span class="badge bg-success bg-opacity-10 text-success">ACTIVE</span>';
                else if (p.status === 'ARCHIVED') statusBadge = '<span class="badge bg-warning bg-opacity-10 text-warning">ARCHIVED</span>';
                else statusBadge = `<span class="badge bg-danger bg-opacity-10 text-danger">${p.status}</span>`;

                let actionBtn = '';
                if (p.status !== 'DELETED') {
                    actionBtn += `<button class="btn btn-sm btn-outline-danger ms-1" onclick="updateStatus(${p.id}, 'DELETED')"><i class="ti ti-trash"></i></button>`;
                }
                if (p.status !== 'ARCHIVED') {
                    actionBtn += `<button class="btn btn-sm btn-outline-warning ms-1" onclick="updateStatus(${p.id}, 'ARCHIVED')"><i class="ti ti-archive"></i></button>`;
                }
                if (p.status !== 'ACTIVE') {
                    actionBtn += `<button class="btn btn-sm btn-outline-success ms-1" onclick="updateStatus(${p.id}, 'ACTIVE')"><i class="ti ti-refresh"></i></button>`;
                }

                const tr = `
                    <tr>
                        <td>#${p.id}</td>
                        <td>
                            <div class="fw-bold">${p.title}</div>
                            <div class="small text-muted">${p.nodeCount} nodes</div>
                        </td>
                        <td>${p.spaceName}</td>
                        <td>${p.lecturerEmail}</td>
                        <td>${statusBadge}</td>
                        <td>${actionBtn}</td>
                    </tr>
                `;
                tbody.append(tr);
            });
        }

        function renderPagination(pageData) {
            const pagination = $('#pagination');
            pagination.empty();
            
            if (pageData.totalPages <= 1) return;

            const prevClass = pageData.first ? 'disabled' : '';
            pagination.append(`<li class="page-item ${prevClass}"><a class="page-link" href="#" onclick="loadPaths(${currentPage - 1}, '${currentKeyword}')">Prev</a></li>`);

            for (let i = 0; i < pageData.totalPages; i++) {
                const activeClass = i === currentPage ? 'active' : '';
                pagination.append(`<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="loadPaths(${i}, '${currentKeyword}')">${i + 1}</a></li>`);
            }

            const nextClass = pageData.last ? 'disabled' : '';
            pagination.append(`<li class="page-item ${nextClass}"><a class="page-link" href="#" onclick="loadPaths(${currentPage + 1}, '${currentKeyword}')">Next</a></li>`);
        }

        function searchPaths() {
            const kw = $('#searchInput').val();
            loadPaths(0, kw);
        }

        function updateStatus(id, newStatus) {
            Swal.fire({
                title: 'Are you sure?',
                text: `Are you sure you want to change status to ${newStatus}?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: newStatus === 'DELETED' ? '#d33' : '#3085d6',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Yes, update it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    $.ajax({
                        url: `/api/admin/curriculum/paths/${id}/status?status=${newStatus}`,
                        type: 'PUT',
                        success: function() {
                            Swal.fire('Updated!', 'Status updated successfully.', 'success');
                            loadPaths(currentPage, currentKeyword);
                        },
                        error: function() {
                            Swal.fire('Error!', 'Error updating status', 'error');
                        }
                    });
                }
            });
        }

        $(document).ready(function() {
            loadPaths();
            $('#searchInput').on('keypress', function(e) {
                if(e.which == 13) searchPaths();
            });
        });
    </script>
</th:block>
</body>
</html>
