<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>Learning Spaces - Admin</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="fs-3 mb-1">Learning Spaces</h1>
            <p class="text-muted">Manage all learning spaces in the system.</p>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-white p-4 border-bottom-0">
            <div class="row g-3 align-items-center">
                <div class="col-md-6">
                    <h5 class="mb-0 fw-bold">Spaces Directory</h5>
                </div>
                <div class="col-md-3">
                    <select id="statusFilter" class="form-select form-select-sm">
                        <option value="">All Statuses</option>
                        <option value="ACTIVE">Active</option>
                        <option value="ARCHIVE">Archived</option>
                        <option value="DELETE">Deleted</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search by name or owner...">
                </div>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Space Name</th>
                            <th>Owner</th>
                            <th>Created Date</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="spacesTableBody">
                        <!-- Rendered via JS -->
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white p-4 border-top">
            <div class="d-flex align-items-center justify-content-between">
                <span class="text-muted small" id="paginationInfo">Showing 0 spaces</span>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="paginationControls">
                        <!-- Rendered via JS -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let currentPage = 0;
        let totalPages = 0;
        const size = 10;
        
        function loadSpaces(page = 0) {
            const keyword = document.getElementById('searchInput').value;
            const status = document.getElementById('statusFilter').value;
            
            let url = `/api/admin/spaces?page=${page}&size=${size}`;
            if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
            if (status) url += `&status=${status}`;

            $.ajax({
                url: url,
                type: 'GET',
                success: function(response) {
                    currentPage = response.number;
                    totalPages = response.totalPages;
                    renderTable(response.content);
                    renderPagination(response);
                    
                    document.getElementById('paginationInfo').textContent = 
                        `Showing ${response.numberOfElements} of ${response.totalElements} spaces`;
                },
                error: function(err) {
                    console.error('Failed to load spaces', err);
                    $('#spacesTableBody').html('<tr><td colspan="6" class="text-center text-danger">Error loading data.</td></tr>');
                }
            });
        }

        function renderTable(spaces) {
            const tbody = document.getElementById('spacesTableBody');
            tbody.innerHTML = '';
            
            if (!spaces || spaces.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No spaces found.</td></tr>';
                return;
            }

            spaces.forEach(space => {
                let statusBadge = '';
                if (space.status === 'ACTIVE') statusBadge = '<span class="badge bg-success bg-opacity-10 text-success px-2 py-1 rounded-pill">ACTIVE</span>';
                else if (space.status === 'ARCHIVE') statusBadge = '<span class="badge bg-warning bg-opacity-10 text-warning px-2 py-1 rounded-pill">ARCHIVED</span>';
                else if (space.status === 'DELETE') statusBadge = '<span class="badge bg-danger bg-opacity-10 text-danger px-2 py-1 rounded-pill">DELETED</span>';
                
                const date = new Date(space.createdAt).toLocaleDateString('vi-VN');

                let actionButtons = `<a href="/admin/spaces/${space.id}" class="btn btn-sm btn-light text-primary me-2"><i class="ti ti-eye"></i> View</a>`;
                
                if (space.status === 'ACTIVE') {
                    actionButtons += `<button class="btn btn-sm btn-light text-warning me-2" onclick="updateStatus(${space.id}, 'ARCHIVE')"><i class="ti ti-archive"></i> Archive</button>`;
                    actionButtons += `<button class="btn btn-sm btn-light text-danger" onclick="updateStatus(${space.id}, 'DELETE')"><i class="ti ti-trash"></i> Delete</button>`;
                } else if (space.status === 'ARCHIVE') {
                    actionButtons += `<button class="btn btn-sm btn-light text-success me-2" onclick="updateStatus(${space.id}, 'ACTIVE')"><i class="ti ti-refresh"></i> Restore</button>`;
                    actionButtons += `<button class="btn btn-sm btn-light text-danger" onclick="updateStatus(${space.id}, 'DELETE')"><i class="ti ti-trash"></i> Delete</button>`;
                } else if (space.status === 'DELETE') {
                    actionButtons += `<button class="btn btn-sm btn-light text-success" onclick="updateStatus(${space.id}, 'ACTIVE')"><i class="ti ti-refresh"></i> Restore</button>`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="ps-4 fw-medium text-muted">#${space.id}</td>
                    <td class="fw-bold">${space.name}</td>
                    <td class="text-muted"><i class="ti ti-mail me-1"></i>${space.ownerEmail}</td>
                    <td class="text-muted">${date}</td>
                    <td>${statusBadge}</td>
                    <td class="text-end pe-4">${actionButtons}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderPagination(response) {
            const ul = document.getElementById('paginationControls');
            ul.innerHTML = '';
            
            if (response.totalPages <= 1) return;
            
            let prevClass = response.first ? 'disabled' : '';
            ul.innerHTML += `<li class="page-item ${prevClass}"><a class="page-link" href="#" onclick="loadSpaces(${currentPage - 1})">Prev</a></li>`;
            
            for (let i = 0; i < response.totalPages; i++) {
                let activeClass = (i === currentPage) ? 'active' : '';
                ul.innerHTML += `<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="loadSpaces(${i})">${i + 1}</a></li>`;
            }
            
            let nextClass = response.last ? 'disabled' : '';
            ul.innerHTML += `<li class="page-item ${nextClass}"><a class="page-link" href="#" onclick="loadSpaces(${currentPage + 1})">Next</a></li>`;
        }

        function updateStatus(id, newStatus) {
            Swal.fire({
                title: 'Are you sure?',
                text: `Are you sure you want to mark this space as ${newStatus}?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: newStatus === 'DELETE' ? '#d33' : '#3085d6',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Yes, update it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    $.ajax({
                        url: `/api/admin/spaces/${id}/status?status=${newStatus}`,
                        type: 'PUT',
                        success: function() {
                            Swal.fire('Updated!', 'Status updated successfully.', 'success');
                            loadSpaces(currentPage);
                        },
                        error: function(err) {
                            Swal.fire('Error!', 'Error updating status.', 'error');
                            console.error(err);
                        }
                    });
                }
            });
        }

        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') loadSpaces(0);
        });
        document.getElementById('statusFilter').addEventListener('change', function() {
            loadSpaces(0);
        });

        // Initial Load
        document.addEventListener("DOMContentLoaded", function() {
            loadSpaces(0);
        });
    </script>
</th:block>
</body>
</html>
