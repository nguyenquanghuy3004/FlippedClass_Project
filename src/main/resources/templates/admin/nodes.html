<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>Learning Nodes - Admin</title>
  <script>
(function() {
    function handleUnauthorized() {
        console.warn('Phiên đăng nhập đã hết hạn hoặc không hợp lệ. Đang chuyển hướng về trang đăng nhập...');
        localStorage.removeItem('jwt_token');
        sessionStorage.removeItem('jwt_token');
        window.location.href = '/signin';
    }
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        try {
            const response = await originalFetch.apply(this, args);
            if (response.status === 401) {
                handleUnauthorized();
            }
            return response;
        } catch (error) {
            throw error;
        }
    };
    const originalXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function() {
        this.addEventListener('load', function() {
            if (this.status === 401) {
                handleUnauthorized();
            }
        });
        originalXhrOpen.apply(this, arguments);
    };
})();
</script>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fs-3 mb-0">Learning Nodes</h1>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="ti ti-search text-muted"></i></span>
                        <input type="text" class="form-control bg-light border-0" id="searchInput" placeholder="Search nodes by title...">
                        <button class="btn btn-primary" onclick="searchNodes()">Search</button>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Node Info</th>
                        <th>Path Title</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="nodesTableBody">
                    <!-- Data rendered via JS -->
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <span class="text-muted small" id="pageInfo">Showing 0 results</span>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="pagination">
                        <!-- Pagination rendered via JS -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let currentPage = 0;
        let pageSize = 10;
        let currentKeyword = '';

        function loadNodes(page = 0, keyword = '') {
            currentPage = page;
            currentKeyword = keyword;
            const url = `/api/admin/curriculum/nodes?page=${page}&size=${pageSize}&keyword=${encodeURIComponent(keyword)}`;
            
            $.ajax({
                url: url,
                type: 'GET',
                success: function(response) {
                    renderTable(response.content);
                    renderPagination(response);
                    $('#pageInfo').text(`Showing ${response.numberOfElements} of ${response.totalElements} results`);
                },
                error: function(err) {
                    alert('Error loading nodes');
                }
            });
        }

        function renderTable(nodes) {
            const tbody = $('#nodesTableBody');
            tbody.empty();
            
            if (nodes.length === 0) {
                tbody.append('<tr><td colspan="6" class="text-center py-4 text-muted">No nodes found</td></tr>');
                return;
            }

            nodes.forEach(n => {
                let statusBadge = '';
                if (!n.status || n.status === 'ACTIVE' || n.status === 'PUBLISHED') statusBadge = '<span class="badge bg-success bg-opacity-10 text-success">ACTIVE</span>';
                else if (n.status === 'HIDDEN' || n.status === 'ARCHIVED') statusBadge = '<span class="badge bg-warning bg-opacity-10 text-warning">HIDDEN</span>';
                else statusBadge = `<span class="badge bg-danger bg-opacity-10 text-danger">${n.status}</span>`;

                let actionBtn = '';
                if (n.status !== 'DELETED') {
                    actionBtn += `<button class="btn btn-sm btn-outline-danger ms-1" onclick="updateStatus(${n.id}, 'DELETED')"><i class="ti ti-trash"></i></button>`;
                }
                if (n.status !== 'HIDDEN') {
                    actionBtn += `<button class="btn btn-sm btn-outline-warning ms-1" onclick="updateStatus(${n.id}, 'HIDDEN')"><i class="ti ti-eye-off"></i></button>`;
                }
                if (n.status !== 'ACTIVE' && n.status !== 'PUBLISHED') {
                    actionBtn += `<button class="btn btn-sm btn-outline-success ms-1" onclick="updateStatus(${n.id}, 'ACTIVE')"><i class="ti ti-eye"></i></button>`;
                }

                const tr = `
                    <tr>
                        <td>#${n.id}</td>
                        <td>
                            <div class="fw-bold">${n.title}</div>
                            <div class="small text-muted">${n.spaceName}</div>
                        </td>
                        <td>${n.pathTitle}</td>
                        <td><span class="badge bg-secondary">${n.nodeType}</span></td>
                        <td>${statusBadge}</td>
                        <td>${actionBtn}</td>
                    </tr>
                `;
                tbody.append(tr);
            });
        }

        function renderPagination(pageData) {
            const pagination = $('#pagination');
            pagination.empty();
            
            if (pageData.totalPages <= 1) return;

            const prevClass = pageData.first ? 'disabled' : '';
            pagination.append(`<li class="page-item ${prevClass}"><a class="page-link" href="#" onclick="loadNodes(${currentPage - 1}, '${currentKeyword}')">Prev</a></li>`);

            for (let i = 0; i < pageData.totalPages; i++) {
                const activeClass = i === currentPage ? 'active' : '';
                pagination.append(`<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="loadNodes(${i}, '${currentKeyword}')">${i + 1}</a></li>`);
            }

            const nextClass = pageData.last ? 'disabled' : '';
            pagination.append(`<li class="page-item ${nextClass}"><a class="page-link" href="#" onclick="loadNodes(${currentPage + 1}, '${currentKeyword}')">Next</a></li>`);
        }

        function searchNodes() {
            const kw = $('#searchInput').val();
            loadNodes(0, kw);
        }

        function updateStatus(id, newStatus) {
            if(!confirm(`Are you sure you want to change status to ${newStatus}?`)) return;
            $.ajax({
                url: `/api/admin/curriculum/nodes/${id}/status?status=${newStatus}`,
                type: 'PUT',
                success: function() {
                    loadNodes(currentPage, currentKeyword);
                },
                error: function() {
                    alert('Error updating status');
                }
            });
        }

        $(document).ready(function() {
            loadNodes();
            $('#searchInput').on('keypress', function(e) {
                if(e.which == 13) searchNodes();
            });
        });
    </script>
</th:block>
</body>
</html>
