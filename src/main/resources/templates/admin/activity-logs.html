<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>Activity Logs</title>
  <script>
(function() {
    function handleUnauthorized() {
        console.warn('Phiên đăng nhập đã hết hạn hoặc không hợp lệ. Đang chuyển hướng về trang đăng nhập...');
        localStorage.removeItem('jwt_token');
        sessionStorage.removeItem('jwt_token');
        window.location.href = '/signin';
    }
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        try {
            const response = await originalFetch.apply(this, args);
            if (response.status === 401) {
                handleUnauthorized();
            }
            return response;
        } catch (error) {
            throw error;
        }
    };
    const originalXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function() {
        this.addEventListener('load', function() {
            if (this.status === 401) {
                handleUnauthorized();
            }
        });
        originalXhrOpen.apply(this, arguments);
    };
})();
</script>
</head>
<body>
    <div layout:fragment="content">
        <div class="admin-card">
            <h5 class="fw-bold mb-4">System Activity Logs (Last 50 events)</h5>
            
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>User</th>
                            <th>Action Type</th>
                            <th>Description</th>
                            <th>IP Address</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body">
                        <!-- Loaded via AJAX -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            $(document).ready(function() {
                loadLogs();
            });

            function loadLogs() {
                $.ajax({
                    url: '/api/admin/logs',
                    method: 'GET',
                    success: function(logs) {
                        let html = '';
                        logs.forEach(log => {
                            html += `
                                <tr>
                                    <td class="text-muted small">${new Date(log.createdAt).toLocaleString()}</td>
                                    <td class="fw-bold">${log.userEmail}</td>
                                    <td><span class="badge bg-secondary">${log.activityType}</span></td>
                                    <td>${log.description || ''}</td>
                                    <td class="text-muted small">${log.ipAddress || 'Unknown'}</td>
                                </tr>
                            `;
                        });
                        $('#logs-table-body').html(html);
                    }
                });
            }
        </script>
    </th:block>
</body>
</html>
