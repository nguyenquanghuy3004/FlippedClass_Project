<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{admin/layout}">

<head>
    <title>Admin Dashboard</title>
    <style>
        .stat-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            background: linear-gradient(135deg, rgba(255, 255, 255, 1) 0%, rgba(248, 249, 250, 1) 100%);
            border: 1px solid rgba(0, 0, 0, 0.05) !important;
            border-radius: 12px;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08) !important;
            color: inherit;
        }

        .stat-card:hover .stat-icon i {
            transform: scale(1.15);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 26px;
        }

        .stat-icon i {
            transition: transform 0.3s ease;
        }

        @keyframes pulseGlow {
            0% {
                background-color: rgba(13, 110, 253, 0.2);
                box-shadow: 0 0 0 0 rgba(13, 110, 253, 0.4);
            }

            70% {
                background-color: rgba(13, 110, 253, 0.05);
                box-shadow: 0 0 0 10px rgba(13, 110, 253, 0);
            }

            100% {
                background-color: transparent;
                box-shadow: 0 0 0 0 rgba(13, 110, 253, 0);
            }
        }

        .highlight-new {
            animation: pulseGlow 2.5s ease-out forwards;
        }
    </style>
</head>

<body>
    <div layout:fragment="content" class="fade-in-up">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fs-3 mb-0">System Overview</h1>
        </div>

        <div class="row g-4">
            <!-- Users Card -->
            <div class="col-sm-6 col-xl-3">
                <a href="/admin/users" class="card border-0 shadow-sm stat-card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                                <i class="ti ti-users"></i>
                            </div>
                            <h5 class="mb-0 ms-3">Users</h5>
                        </div>
                        <h2 class="mb-0 fw-bold" th:text="${stats.totalUsers}">0</h2>
                        <p class="text-muted small mt-2 mb-0">Total registered users</p>
                    </div>
                </a>
            </div>

            <!-- Spaces Card -->
            <div class="col-sm-6 col-xl-3">
                <a href="/admin/spaces" class="card border-0 shadow-sm stat-card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <div class="stat-icon bg-success bg-opacity-10 text-success">
                                <i class="ti ti-box-seam"></i>
                            </div>
                            <h5 class="mb-0 ms-3">Spaces</h5>
                        </div>
                        <h2 class="mb-0 fw-bold" th:text="${stats.totalSpaces}">0</h2>
                        <p class="text-muted small mt-2 mb-0">Total learning spaces</p>
                    </div>
                </a>
            </div>

            <!-- Paths Card -->
            <div class="col-sm-6 col-xl-3">
                <a href="/admin/paths" class="card border-0 shadow-sm stat-card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                                <i class="ti ti-map-2"></i>
                            </div>
                            <h5 class="mb-0 ms-3">Paths</h5>
                        </div>
                        <h2 class="mb-0 fw-bold" th:text="${stats.totalPaths}">0</h2>
                        <p class="text-muted small mt-2 mb-0">Total learning paths</p>
                    </div>
                </a>
            </div>

            <!-- Nodes Card -->
            <div class="col-sm-6 col-xl-3">
                <a href="/admin/nodes" class="card border-0 shadow-sm stat-card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <div class="stat-icon bg-info bg-opacity-10 text-info">
                                <i class="ti ti-book-2"></i>
                            </div>
                            <h5 class="mb-0 ms-3">Nodes</h5>
                        </div>
                        <h2 class="mb-0 fw-bold" th:text="${stats.totalNodes}">0</h2>
                        <p class="text-muted small mt-2 mb-0">Total learning nodes</p>
                    </div>
                </a>
            </div>
        </div>

        <!-- Global Activity Log -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div
                        class="card-header bg-white px-4 py-3 border-bottom d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="ti ti-activity text-primary me-2"></i>Recent Global Activity
                        </h5>
                        <span class="badge bg-success" id="sse-status">Connected</span>
                    </div>
                    <!-- Filter Toolbar -->
                    <div class="card-body px-4 py-3 border-bottom bg-light">
                        <form id="filterForm" class="row g-2 align-items-center"
                            onsubmit="event.preventDefault(); currentPage=0; loadGlobalActivities();">
                            <div class="col-md-5">
                                <input type="text" id="filterKeyword" class="form-control form-control-sm"
                                    placeholder="Search email, action, details...">
                            </div>
                            <div class="col-md-3">
                                <input type="date" id="filterDate" class="form-control form-control-sm"
                                    placeholder="Date">
                            </div>
                            <div class="col-md-4 d-flex gap-2">
                                <button type="submit" class="btn btn-sm btn-primary w-100"><i class="ti ti-filter"></i>
                                    Lọc</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary w-100"
                                    onclick="clearFilters()"><i class="ti ti-x"></i> Xóa</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-body p-4">
                        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                            <table class="table table-hover align-middle">
                                <thead class="table-light sticky-top" style="z-index: 1;">
                                    <tr>
                                        <th style="width: 20%">Time</th>
                                        <th style="width: 20%">Action</th>
                                        <th style="width: 60%">Details</th>
                                    </tr>
                                </thead>
                                <tbody id="globalActivityList">
                                    <tr id="no-activity-msg">
                                        <td colspan="3" class="text-center text-muted py-4">No recent activities found.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top py-3 d-flex justify-content-between align-items-center">
                        <span class="text-muted small" id="page-info">Showing page 1 of 1</span>
                        <nav aria-label="Page navigation">
                            <ul class="pagination pagination-sm mb-0" id="pagination-controls">
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            $(document).ready(function () {
                loadGlobalActivities();
                setupGlobalSseConnection();
            });

            let currentPage = 0;

            function loadGlobalActivities() {
                const keyword = $('#filterKeyword').val();
                const dateStr = $('#filterDate').val();

                let url = `/api/admin/users/global/activities?page=${currentPage}&size=10`;
                if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
                if (dateStr) url += `&filterDate=${dateStr}`;

                $.ajax({
                    url: url,
                    method: 'GET',
                    success: function (response) {
                        $('#globalActivityList').empty();
                        const activities = response.content;
                        if (activities.length > 0) {
                            activities.forEach(activity => appendActivity(activity, false));
                        } else {
                            $('#globalActivityList').html('<tr id="no-activity-msg"><td colspan="3" class="text-center text-muted py-4">No recent activities found.</td></tr>');
                        }
                        updatePagination(response);
                    }
                });
            }

            function updatePagination(response) {
                const totalPages = response.totalPages;
                const number = response.number;

                $('#page-info').text(`Showing page ${number + 1} of ${totalPages || 1}`);

                let html = '';

                // Prev
                html += `<li class="page-item ${number === 0 ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0)" onclick="goToPage(${number - 1})">Previous</a>
                     </li>`;

                // Pages
                for (let i = 0; i < totalPages; i++) {
                    if (i >= number - 2 && i <= number + 2) {
                        html += `<li class="page-item ${i === number ? 'active' : ''}">
                                <a class="page-link" href="javascript:void(0)" onclick="goToPage(${i})">${i + 1}</a>
                             </li>`;
                    }
                }

                // Next
                html += `<li class="page-item ${number >= totalPages - 1 ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0)" onclick="goToPage(${number + 1})">Next</a>
                     </li>`;

                $('#pagination-controls').html(html);
            }

            function goToPage(page) {
                currentPage = page;
                loadGlobalActivities();
            }

            function clearFilters() {
                $('#filterKeyword').val('');
                $('#filterDate').val('');
                currentPage = 0;
                loadGlobalActivities();
            }

            function setupGlobalSseConnection() {
                const eventSource = new EventSource(`/api/admin/users/global/activity-stream`);

                eventSource.addEventListener('activity', function (event) {
                    const activity = JSON.parse(event.data);

                    // Client-side filtering
                    const keyword = $('#filterKeyword').val().toLowerCase();
                    const dateStr = $('#filterDate').val();

                    let matches = true;
                    if (keyword) {
                        const content = (activity.userEmail + ' ' + activity.actionType + ' ' + activity.description).toLowerCase();
                        if (!content.includes(keyword)) matches = false;
                    }

                    if (matches && dateStr) {
                        // Extract YYYY-MM-DD from createdAt
                        const actDate = new Date(activity.createdAt).toISOString().split('T')[0];
                        if (actDate !== dateStr) matches = false;
                    }

                    if (matches && currentPage === 0) {
                        $('#no-activity-msg').hide();
                        appendActivity(activity, true);

                        // Maintain list size (10 items max)
                        if ($('#globalActivityList tr').length > 10) {
                            $('#globalActivityList tr:last').remove();
                        }
                    }
                });

                eventSource.onopen = function () {
                    $('#sse-status').text('Connected').removeClass('bg-danger').addClass('bg-success');
                };

                eventSource.onerror = function () {
                    $('#sse-status').text('Disconnected').removeClass('bg-success').addClass('bg-danger');
                };
            }

            function appendActivity(activity, isNew) {
                const date = new Date(activity.createdAt).toLocaleString();
                const itemHtml = `
                <tr id="act-${activity.id}" class="${isNew ? 'highlight-new' : ''}">
                    <td class="text-muted small">${date}</td>
                    <td><span class="badge bg-primary bg-opacity-10 text-primary">${activity.actionType}</span></td>
                    <td><strong>${activity.userEmail || 'User'}</strong>: ${activity.description}</td>
                </tr>
            `;

                if (isNew) {
                    $('#globalActivityList').prepend(itemHtml);
                    setTimeout(() => {
                        $(`#act-${activity.id}`).removeClass('highlight-new');
                    }, 2500);
                } else {
                    $('#globalActivityList').append(itemHtml);
                }
            }
        </script>
    </th:block>
</body>

</html>
