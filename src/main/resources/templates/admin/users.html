<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>Manage Users</title>
  <script>
(function() {
    function handleUnauthorized() {
        console.warn('Phiên đăng nhập đã hết hạn hoặc không hợp lệ. Đang chuyển hướng về trang đăng nhập...');
        localStorage.removeItem('jwt_token');
        sessionStorage.removeItem('jwt_token');
        window.location.href = '/signin';
    }
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        try {
            const response = await originalFetch.apply(this, args);
            if (response.status === 401) {
                handleUnauthorized();
            }
            return response;
        } catch (error) {
            throw error;
        }
    };
    const originalXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function() {
        this.addEventListener('load', function() {
            if (this.status === 401) {
                handleUnauthorized();
            }
        });
        originalXhrOpen.apply(this, arguments);
    };
})();
</script>
</head>
<body>
    <div layout:fragment="content">
        <div class="row">
          <div class="col-12">
            <div class="mb-6">
              <h1 class="fs-3 mb-1">User Directory</h1>
              <p>View and manage all registered users in the system.</p>
            </div>
          </div>
        </div>

        <div class="card">
            <div class="card-header bg-white px-4 py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Users List</h5>
            </div>
            <div class="card-body p-4">
                <!-- Filters -->
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <input type="text" id="filter-keyword" class="form-select" placeholder="Search by name or email...">
                    </div>
                    <div class="col-md-3">
                        <select id="filter-role" class="form-select">
                            <option value="">All Roles</option>
                            <option value="STUDENT">STUDENT</option>
                            <option value="MENTOR">MENTOR</option>
                            <option value="SUPPORTER">SUPPORTER</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="filter-status" class="form-select">
                            <option value="">All Statuses</option>
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="LOCKED">LOCKED</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="loadUsers(0)">Search</button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>User</th>
                                <th>Email</th>
                                <th>Roles</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body">
                            <!-- Loaded via AJAX -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <nav class="mt-4">
                    <ul class="pagination justify-content-end mb-0" id="pagination">
                        <!-- Loaded via AJAX -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            let currentPage = 0;
            
            $(document).ready(function() {
                loadUsers(0);
            });

            function loadUsers(page) {
                currentPage = page;
                const keyword = $('#filter-keyword').val();
                const role = $('#filter-role').val();
                const status = $('#filter-status').val();
                
                let url = `/api/admin/users?page=${page}&size=10`;
                if(keyword) url += `&keyword=${keyword}`;
                if(role) url += `&role=${role}`;
                if(status) url += `&status=${status}`;

                $.ajax({
                    url: url,
                    method: 'GET',
                    success: function(data) {
                        renderTable(data.content);
                        renderPagination(data);
                    }
                });
            }

            function renderTable(users) {
                let html = '';
                if(users.length === 0) {
                    html = '<tr><td colspan="6" class="text-center py-4 text-muted">No users found.</td></tr>';
                } else {
                    users.forEach(user => {
                        let statusBadge = user.status === 'ACTIVE' 
                            ? '<span class="badge bg-success bg-opacity-10 text-success">ACTIVE</span>' 
                            : '<span class="badge bg-danger bg-opacity-10 text-danger">LOCKED</span>';
                            
                        html += `
                            <tr>
                                <td>#${user.id}</td>
                                <td>
                                    <div class="fw-bold text-dark">${user.fullName || 'N/A'}</div>
                                    <div class="small text-muted">${user.username || ''}</div>
                                </td>
                                <td>${user.email}</td>
                                <td>${user.roles.join(', ')}</td>
                                <td>${statusBadge}</td>
                                <td>
                                    <a href="/admin/users/${user.id}" class="btn btn-sm btn-outline-info">View</a>
                                </td>
                            </tr>
                        `;
                    });
                }
                $('#user-table-body').html(html);
            }

            function renderPagination(pageData) {
                let html = '';
                if(pageData.totalPages > 1) {
                    const prevDisabled = pageData.first ? 'disabled' : '';
                    html += `<li class="page-item ${prevDisabled}"><a class="page-link" href="#" onclick="loadUsers(${currentPage - 1}); return false;">Previous</a></li>`;
                    
                    for(let i = 0; i < pageData.totalPages; i++) {
                        const active = i === currentPage ? 'active' : '';
                        html += `<li class="page-item ${active}"><a class="page-link" href="#" onclick="loadUsers(${i}); return false;">${i + 1}</a></li>`;
                    }
                    
                    const nextDisabled = pageData.last ? 'disabled' : '';
                    html += `<li class="page-item ${nextDisabled}"><a class="page-link" href="#" onclick="loadUsers(${currentPage + 1}); return false;">Next</a></li>`;
                }
                $('#pagination').html(html);
            }
        </script>
    </th:block>
</body>
</html>
