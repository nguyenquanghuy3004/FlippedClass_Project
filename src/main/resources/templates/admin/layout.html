<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
  <meta charset="UTF-8" />
  <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">FCMS Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="manifest" th:href="@{/assets/site.webmanifest}">

  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <!-- FontAwesome for fallback -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f8f9fc;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body>
  <div id="overlay" class="overlay"></div>
  <!-- TOPBAR -->
  <nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3">
    <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm ">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>

    <!-- MOBILE -->
    <button id="mobileBtn" class="btn btn-light btn-icon btn-sm d-lg-none me-2">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>
    <div>
      <ul class="list-unstyled d-flex align-items-center mb-0 gap-1">
        <!-- Dropdown -->
        <li class="ms-3 dropdown">
          <a href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <img th:src="@{/assets/images/avatar-1.jpg}" alt="User" class="avatar avatar-sm rounded-circle" />
          </a>
          <div class="dropdown-menu dropdown-menu-end p-0" style="min-width: 200px;">
            <div>
              <div class="d-flex gap-3 align-items-center border-dashed border-bottom px-3 py-3">
                <img th:src="@{/assets/images/avatar-1.jpg}" alt="User" class="avatar avatar-md rounded-circle" />
                <div>
                  <h4 class="mb-0 small">Admin User</h4>
                  <p class="mb-0 small">@admin</p>
                </div>
              </div>
              <div class="p-3 d-flex flex-column gap-1 small lh-lg">
                <a href="#!" class="text-danger" onclick="logout()">
                  <span><i class="ti ti-logout me-2"></i>Log out</span>
                </a>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar">
    <div class="logo-area">
      <a href="/admin" class="d-inline-flex">
        <i class="fa-solid fa-graduation-cap text-primary fs-3"></i>
        <span class="logo-text ms-2 fw-bold text-primary fs-4"> FCMS Admin</span>
      </a>
    </div>
    <ul class="nav flex-column">
      <li class="px-4 py-2"><small class="nav-text">Main</small></li>
      <li>
        <a class="nav-link" href="/admin/dashboard">
          <i class="ti ti-home"></i><span class="nav-text">Dashboard</span>
        </a>
      </li>
      <li class="px-4 py-2"><small class="nav-text">Management</small></li>
      <li>
        <a class="nav-link" href="/admin/users">
          <i class="ti ti-users"></i><span class="nav-text">Manage Users</span>
        </a>
      </li>
      <li>
        <a class="nav-link" href="/admin/spaces">
          <i class="ti ti-box-seam"></i><span class="nav-text">Learning Spaces</span>
        </a>
      </li>
    </ul>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="content" class="content py-10">
    <div class="container-fluid">

      <div layout:fragment="content">
        <!-- Dynamic Content goes here -->
      </div>

      <div class="row">
        <div class="col-12">
          <footer class="text-center py-2 mt-6 text-secondary ">
            <p class="mb-0">FCMS Admin Dashboard. Powered by InApp Theme</p>
          </footer>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // Authentication Check
    const token = localStorage.getItem('jwt_token');
    if (!token) {
        window.location.href = '/signin';
    } else {
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (!payload.roles || (!payload.roles.includes('ADMIN') && !payload.roles.includes('ROLE_ADMIN'))) {
                alert('Access Denied. Admin privileges required.');
                window.location.href = '/signin';
            }
        } catch (e) {
            window.location.href = '/signin';
        }
    }

    // Sidebar Active State
    document.addEventListener("DOMContentLoaded", function() {
        const currentUrl = window.location.pathname;
        document.querySelectorAll('.sidebar .nav-link').forEach(link => {
            const href = link.getAttribute('href');
            if (currentUrl.startsWith(href) || (currentUrl === '/admin' && href === '/admin/dashboard')) {
                link.classList.add('active');
            }
        });
    });

    // Setup AJAX to include JWT token
    $.ajaxSetup({
      beforeSend: function (xhr) {
        const token = localStorage.getItem('jwt_token');
        if (token) {
          xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        }
      }
    });

    function logout() {
      localStorage.removeItem('jwt_token');
      window.location.href = '/signin';
    }
  </script>
  <th:block layout:fragment="scripts"></th:block>
</body>

</html>
