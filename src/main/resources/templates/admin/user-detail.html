<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>User Detail</title>
    <style>
        .activity-log-container {
            max-height: 400px;
            overflow-y: auto;
        }
        .activity-item {
            border-left: 3px solid #dee2e6;
            padding-left: 15px;
            position: relative;
            margin-bottom: 15px;
            transition: background-color 0.5s ease;
        }
        .activity-item::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 5px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #0d6efd;
        }
        .activity-item.highlight {
            background-color: #fff3cd;
            border-left-color: #ffc107;
        }
        .activity-item.highlight::before {
            border-color: #ffc107;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="fs-3 mb-1">User Details</h1>
                        <p>View detailed information and manage this user's account.</p>
                    </div>
                    <a href="/admin/users" class="btn btn-outline-secondary">
                        <i class="ti ti-arrow-left me-1"></i> Back to Users
                    </a>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <!-- Main Info -->
            <div class="col-md-8">
                <div class="card mb-3">
                    <div class="card-header bg-white px-4 py-3 border-bottom">
                        <h5 class="mb-0">Profile Information</h5>
                    </div>
                    <div class="card-body p-4">
                        <input type="hidden" id="userId" th:value="${userId}">
                        <div class="row mb-3">
                            <div class="col-sm-4 text-muted fw-semibold">User ID</div>
                            <div class="col-sm-8 fw-bold" id="u-id">...</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4 text-muted fw-semibold">Email</div>
                            <div class="col-sm-8" id="u-email">...</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4 text-muted fw-semibold">Roles</div>
                            <div class="col-sm-8" id="u-roles">...</div>
                        </div>
                        
                        <hr class="my-4 border-secondary opacity-25">
                        
                        <h6 class="fw-bold mb-3">Learning Stats</h6>
                        <div class="row text-center">
                            <div class="col-4 border-end">
                                <h3 class="fw-bold text-primary mb-1" id="u-joined">0</h3>
                                <div class="small text-muted">Spaces Joined</div>
                            </div>
                            <div class="col-4 border-end">
                                <h3 class="fw-bold text-success mb-1" id="u-owned">0</h3>
                                <div class="small text-muted">Spaces Owned</div>
                            </div>
                            <div class="col-4">
                                <h3 class="fw-bold text-info mb-1" id="u-time">0m</h3>
                                <div class="small text-muted">Active Time</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Real-time Activity Log -->
                <div class="card">
                    <div class="card-header bg-white px-4 py-3 border-bottom d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="ti ti-activity text-primary me-2"></i>Real-time Activity Log
                        </h5>
                        <span class="badge bg-success" id="sse-status">Connected</span>
                    </div>
                    <div class="card-body p-4">
                        <div class="activity-log-container pe-2" id="activityList">
                            <div class="text-center text-muted" id="no-activity-msg">No recent activities found.</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Actions -->
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-header bg-white px-4 py-3 border-bottom">
                        <h5 class="mb-0">Account Status</h5>
                    </div>
                    <div class="card-body p-4 text-center">
                        <div class="mb-4">
                            <div class="text-muted fw-semibold mb-2">Current Status</div>
                            <div id="u-status">
                                <!-- Status badge here -->
                            </div>
                        </div>

                        <button id="btn-toggle-status" class="btn btn-warning w-100 mb-3" onclick="toggleStatus()">
                            Toggle Lock Status
                        </button>
                        <button class="btn btn-danger w-100" onclick="resetPassword()">
                            Reset Password
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            let currentStatus = '';
            
            $(document).ready(function() {
                loadUserDetail();
                loadRecentActivities();
                setupSseConnection();
            });

            function loadUserDetail() {
                const id = $('#userId').val();
                $.ajax({
                    url: `/api/admin/users/${id}`,
                    method: 'GET',
                    success: function(data) {
                        $('#u-id').text(data.user.id);
                        $('#u-email').text(data.user.email);
                        
                        currentStatus = data.user.status;
                        if(currentStatus === 'ACTIVE') {
                            $('#u-status').html('<span class="badge bg-success bg-opacity-10 text-success">ACTIVE</span>');
                            $('#btn-toggle-status').text('Lock Account').removeClass('btn-success').addClass('btn-warning');
                        } else {
                            $('#u-status').html('<span class="badge bg-danger bg-opacity-10 text-danger">LOCKED</span>');
                            $('#btn-toggle-status').text('Unlock Account').removeClass('btn-warning').addClass('btn-success');
                        }
                        
                        $('#u-roles').text(data.user.roles.join(', '));
                        $('#u-joined').text(data.spacesJoined);
                        $('#u-owned').text(data.spacesOwned);
                        $('#u-time').text(data.totalActiveTimeFormatted || '0m');
                    }
                });
            }

            function toggleStatus() {
                const id = $('#userId').val();
                const action = currentStatus === 'ACTIVE' ? 'lock' : 'unlock';
                Swal.fire({
                    title: 'Are you sure?',
                    text: `Do you want to ${action} this user account?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: currentStatus === 'ACTIVE' ? '#d33' : '#28a745',
                    cancelButtonColor: '#6c757d',
                    confirmButtonText: `Yes, ${action} it!`
                }).then((result) => {
                    if (result.isConfirmed) {
                        $.ajax({
                            url: `/api/admin/users/${id}/${action}`,
                            method: 'POST',
                            success: function() {
                                Swal.fire('Updated!', 'Status updated successfully.', 'success');
                                loadUserDetail();
                            },
                            error: function() {
                                Swal.fire('Error!', 'Failed to update status.', 'error');
                            }
                        });
                    }
                });
            }

            function resetPassword() {
                const id = $('#userId').val();
                Swal.fire({
                    title: 'Reset Password',
                    text: "Enter new password for this user:",
                    input: 'password',
                    inputPlaceholder: 'New password',
                    inputAttributes: {
                        autocapitalize: 'off',
                        autocorrect: 'off'
                    },
                    showCancelButton: true,
                    confirmButtonText: 'Reset Password',
                    showLoaderOnConfirm: true,
                    preConfirm: (newPassword) => {
                        if (!newPassword || newPassword.trim() === "") {
                            Swal.showValidationMessage('Password cannot be empty!');
                            return false;
                        }
                        return $.ajax({
                            url: `/api/admin/users/${id}/reset-password`,
                            method: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify({ newPassword: newPassword })
                        }).catch(error => {
                            Swal.showValidationMessage(`Request failed: ${error.responseText || error.statusText}`);
                        });
                    },
                    allowOutsideClick: () => !Swal.isLoading()
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire('Reset!', 'Password has been reset successfully.', 'success');
                    }
                });
            }

            function loadRecentActivities() {
                const id = $('#userId').val();
                $.ajax({
                    url: `/api/admin/users/${id}/activities`,
                    method: 'GET',
                    success: function(activities) {
                        if (activities.length > 0) {
                            $('#no-activity-msg').hide();
                            activities.forEach(activity => appendActivity(activity, false));
                        }
                    }
                });
            }

            function setupSseConnection() {
                const id = $('#userId').val();
                const eventSource = new EventSource(`/api/admin/users/${id}/activity-stream`);
                
                eventSource.addEventListener('activity', function(event) {
                    const activity = JSON.parse(event.data);
                    $('#no-activity-msg').hide();
                    appendActivity(activity, true);
                });

                eventSource.onopen = function() {
                    $('#sse-status').text('Connected').removeClass('bg-danger').addClass('bg-success');
                };

                eventSource.onerror = function() {
                    $('#sse-status').text('Disconnected').removeClass('bg-success').addClass('bg-danger');
                };
            }

            function appendActivity(activity, isNew) {
                const date = new Date(activity.createdAt).toLocaleString();
                const itemHtml = `
                    <div class="activity-item ${isNew ? 'highlight' : ''}" id="act-${activity.id}">
                        <div class="d-flex justify-content-between">
                            <strong>${activity.actionType}</strong>
                            <small class="text-muted">${date}</small>
                        </div>
                        <p class="mb-0 text-muted small">${activity.description}</p>
                    </div>
                `;
                
                if (isNew) {
                    $('#activityList').prepend(itemHtml);
                    // Remove highlight after 3 seconds
                    setTimeout(() => {
                        $(`#act-${activity.id}`).removeClass('highlight');
                    }, 3000);
                } else {
                    $('#activityList').append(itemHtml);
                }
            }
        </script>
    </th:block>
</body>
</html>
