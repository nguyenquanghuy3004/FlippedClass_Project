<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>EduQuiz - Take Assessment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" th:href="@{/assets/css/student-take-quiz.css}">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="edu-navbar">
    <a href="#" class="edu-logo">
      <i class="ti ti-school"></i> EduQuiz
    </a>
    <div class="edu-user">
      <div class="edu-user-tools">
        <i class="ti ti-maximize"></i>
        <i class="ti ti-moon"></i>
      </div>
      <div class="d-flex align-items-center gap-2">
        <img th:src="@{/assets/images/avatar-1.jpg}" alt="User Avatar" style="width: 32px; height: 32px; border-radius: 50%;">
        <span style="font-weight: 600; font-size: 0.9rem; color: #1e293b;">Student Name</span>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="edu-container">
    
    <!-- Left Column: Info & Progress -->
    <aside>
      <!-- Info Card -->
      <div class="edu-card">
        <div class="quiz-title" id="quiz-title-display">Loading Quiz...</div>
        <div class="quiz-meta" id="quiz-topic-display">Topic: Loading...</div>
        
        <div class="timer-label">Time Remaining</div>
        <div class="timer-value" id="countdown">--:--</div>
        
        <div class="action-buttons">
          <button class="btn-edu-outline" onclick="window.history.back()">Back</button>
          <button class="btn-edu-primary" onclick="submitQuiz()">
            <i class="ti ti-device-floppy"></i> Submit
          </button>
        </div>
      </div>

      <!-- Progress Card -->
      <div class="edu-card">
        <div class="section-title">Section Progress (2)</div>
        
        <div class="progress-item">
          <div class="progress-header">
            <div class="progress-icon" style="color: #ec4899; background: #fdf2f8;"><i class="ti ti-book"></i></div>
            <div class="progress-name">Part 1: Grammar and Vocabulary</div>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <div class="progress-text">Completed: <span id="prog-p1">0/0</span></div>
            <div class="progress-text" style="color: #64748b;" id="prog-pct-p1">0%</div>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: 0%;" id="bar-p1"></div>
          </div>
        </div>

        <div class="progress-item">
          <div class="progress-header">
            <div class="progress-icon" style="color: #64748b; background: #f1f5f9;"><i class="ti ti-align-left"></i></div>
            <div class="progress-name">Part 2: Reading Comprehension</div>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <div class="progress-text">Completed: <span id="prog-p2">0/10</span></div>
            <div class="progress-text" style="color: #64748b;" id="prog-pct-p2">0%</div>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: 0%;" id="bar-p2"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Center Column: Questions -->
    <section id="questions-container">
      <div style="text-align: center; padding: 3rem;">
        <p style="color: #64748b;">Loading questions...</p>
      </div>
    </section>

    <!-- Right Column: Navigation Grid -->
    <aside class="nav-grid-container">
      <div class="edu-card">
        <div class="nav-grid-title">Question Index</div>
        <div class="nav-grid" id="navGrid">
          <!-- JS generated buttons -->
        </div>
      </div>
    </aside>

  </main>

  <script>
    // --- Auth Guard & Initialization ---
    const token = localStorage.getItem('jwt_token');
    const userId = localStorage.getItem('user_id');
    if (!token || !userId) {
      alert('You must be logged in to take a quiz.');
      window.location.href = '/signin';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const quizId = urlParams.get('quizId');
    if (!quizId) {
      alert('Quiz ID is missing!');
      window.location.href = '/student/dashboard';
    }

    let timeRemaining = 0;
    let timerInterval = null;
    let totalQuestions = 0;
    let quizQuestions = [];

    const countdownEl = document.getElementById('countdown');
    const navGrid = document.getElementById('navGrid');
    const questionsContainer = document.getElementById('questions-container');

    // --- Fetch Quiz Data ---
    async function initQuiz() {
      try {
        // --- 1. Check Previous Attempts ---
        const attemptsRes = await fetch(`/api/quizzes/attempts/student/${userId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (attemptsRes.ok) {
          const attempts = await attemptsRes.json();
          const hasAttempt = attempts.some(a => a.quizId == quizId);
          if (hasAttempt) {
            Swal.fire({
              icon: 'warning',
              title: 'Quiz Already Completed',
              text: 'You have already submitted this quiz. You cannot take it again.',
              confirmButtonText: 'Back to Dashboard'
            }).then(() => {
              window.location.href = '/student/dashboard';
            });
            return;
          }
        }

        // Fetch Quiz Info
        const quizRes = await fetch(`/api/quizzes/${quizId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!quizRes.ok) throw new Error('Failed to load quiz details.');
        const quizData = await quizRes.json();
        
        document.getElementById('quiz-title-display').innerText = quizData.title;
        document.getElementById('quiz-topic-display').innerText = quizData.courseName ? `Topic: ${quizData.courseName}` : 'Topic: General';
        
        // Start Timer
        timeRemaining = (quizData.durationMinutes || 30) * 60;
        startTimer();

        // Fetch Questions
        const qRes = await fetch(`/api/quizzes/${quizId}/questions`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!qRes.ok) throw new Error('Failed to load questions.');
        quizQuestions = await qRes.json();
        totalQuestions = quizQuestions.length;

        renderQuestions();
        renderNavGrid();
        updateProgress();

      } catch (err) {
        alert(err.message);
      }
    }

    // --- Timer Logic ---
    function startTimer() {
      timerInterval = setInterval(() => {
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert('Time is up! Submitting automatically...');
          submitQuiz(true); // auto submit
          return;
        }
        timeRemaining--;
        let m = Math.floor(timeRemaining / 60);
        let s = timeRemaining % 60;
        countdownEl.innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      }, 1000);
    }

    // --- Dynamic Rendering ---
    function renderQuestions() {
      questionsContainer.innerHTML = ''; // clear loading
      
      quizQuestions.forEach((q, index) => {
        const qNum = index + 1;
        let optionsMap = {};
        try {
          const parsed = JSON.parse(q.options || "{}");
          if (Array.isArray(parsed)) {
            parsed.forEach((item, idx) => optionsMap[idx.toString()] = item);
          } else if (typeof parsed === 'object' && parsed !== null) {
            optionsMap = parsed;
          } else {
            optionsMap = { "Ans": q.options };
          }
        } catch(e) {
          optionsMap = { "Ans": q.options };
        }

        let optionsHtml = '';
        Object.entries(optionsMap).forEach(([optKey, optText]) => {
          optionsHtml += `
            <label class="q-option">
              <input type="radio" name="q${q.id}" value="${optKey}" onchange="markAnswered(${q.id})">
              <div class="q-radio-custom"></div>
              <div class="q-option-text">${optText}</div>
            </label>
          `;
        });

        const qHtml = `
          <div class="edu-card q-card" id="q-card-${q.id}">
            <div class="q-header">
              <div class="q-number">Question ${qNum}</div>
              <div class="q-type">${q.questionType === 'SINGLE_CHOICE' ? 'Single Choice' : q.questionType} (${q.points} pts)</div>
            </div>
            <div class="q-text">${q.content}</div>
            <div class="q-options">
              ${optionsHtml}
            </div>
          </div>
        `;
        questionsContainer.insertAdjacentHTML('beforeend', qHtml);
      });
    }

    function renderNavGrid() {
      navGrid.innerHTML = '';
      quizQuestions.forEach((q, index) => {
        const btn = document.createElement('div');
        btn.className = 'nav-btn';
        btn.id = 'nav-btn-' + q.id;
        btn.innerText = index + 1;
        btn.onclick = () => scrollToQuestion(q.id);
        navGrid.appendChild(btn);
      });
    }

    // --- User Actions ---
    function markAnswered(questionId) {
      const btn = document.getElementById('nav-btn-' + questionId);
      if (btn) btn.classList.add('answered');
      updateProgress();
    }

    function updateProgress() {
      const answeredCount = document.querySelectorAll('.nav-btn.answered').length;
      document.getElementById('prog-p1').innerText = `${answeredCount}/${totalQuestions}`;
      const pct = totalQuestions === 0 ? 0 : (answeredCount / totalQuestions) * 100;
      document.getElementById('prog-pct-p1').innerText = `${Math.round(pct)}%`;
      document.getElementById('bar-p1').style.width = `${pct}%`;
    }

    function scrollToQuestion(questionId) {
      const qEl = document.getElementById('q-card-' + questionId);
      if (qEl) {
        const y = qEl.getBoundingClientRect().top + window.scrollY - 80;
        window.scrollTo({top: y, behavior: 'smooth'});
      }
    }

    // --- Submit Logic ---
    async function submitQuiz(autoSubmit = false) {
      const answeredCount = document.querySelectorAll('.nav-btn.answered').length;
      if (!autoSubmit && answeredCount < totalQuestions) {
        const result = await Swal.fire({
          title: 'Are you sure?',
          text: `You have only answered ${answeredCount} out of ${totalQuestions} questions. Do you really want to submit?`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'Yes, submit it!'
        });
        
        if (!result.isConfirmed) return;
      } else if (!autoSubmit) {
        const result = await Swal.fire({
          title: 'Ready to submit?',
          text: `You have answered all questions. Submit now?`,
          icon: 'question',
          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'Yes, submit it!'
        });
        
        if (!result.isConfirmed) return;
      }

      // Gather answers
      let answers = {};
      quizQuestions.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (selected) {
          answers[q.id] = selected.value;
        }
      });

      const payload = {
        studentId: parseInt(userId),
        answers: answers
      };

      try {
        const res = await fetch(`/api/quizzes/${quizId}/attempts`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || 'Failed to submit quiz.');
        }

        const result = await res.json();
        clearInterval(timerInterval);

        await Swal.fire({
          icon: 'success',
          title: 'Quiz Submitted Successfully!',
          html: `
            <div class="text-center mt-3">
               <h1 class="display-1 text-primary fw-bold mb-0">${result.score}%</h1>
               <p class="text-muted mt-2">Correct Answers: <strong>${result.correctAnswers} / ${result.totalQuestions}</strong></p>
            </div>
          `,
          confirmButtonText: 'Return to Dashboard',
          confirmButtonColor: '#3085d6',
          allowOutsideClick: false
        });
        
        window.location.href = '/student/dashboard';
      } catch (err) {
        Swal.fire('Error', err.message, 'error');
      }
    }

    // Run on load
    initQuiz();
  </script>
</body>
</html>
