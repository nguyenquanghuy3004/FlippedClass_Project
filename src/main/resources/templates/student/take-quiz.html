<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{student/layout}">

<head>
  <title>Take Quiz - FlippedClass</title>
  <th:block layout:fragment="head">
    <link rel="stylesheet" th:href="@{/assets/css/student-take-quiz.css}">
  </th:block>
</head>

<body>

<span layout:fragment="topbar-title"><strong>Take Quiz</strong> <span class="ms-2 text-muted fw-normal" style="font-size: 0.85rem;">Answer each question before time runs out</span></span>

<ul class="topbar-actions list-unstyled" layout:fragment="topbar-actions">
  <li class="d-flex align-items-center">
    <a class="btn-quiz btn-quiz-outline" href="/student/my-quizzes">
      <i class="ti ti-arrow-left"></i> My Quizzes
    </a>
  </li>
</ul>

<!-- MAIN CONTENT -->
<main id="content" class="content" layout:fragment="content">
  <div class="page-wrap">
    <section class="quiz-hero">
      <div class="hero-stats">
        <div class="hero-stat">
          <span>Subject</span>
          <strong id="hero-course">Loading</strong>
        </div>
        <div class="hero-stat">
          <span>Duration</span>
          <strong id="hero-duration">-- min</strong>
        </div>
        <div class="hero-stat">
          <span>Questions</span>
          <strong id="hero-total">-- questions</strong>
        </div>
      </div>
    </section>

    <div class="quiz-shell">
      <aside class="sticky-panel">
        <section class="quiz-card">
          <div class="panel-title"><i class="ti ti-clipboard-text"></i> Attempt Info</div>

          <div class="timer-box">
            <div class="timer-label">Time Left</div>
            <div class="timer-value" id="countdown">--:--</div>
          </div>

          <div class="action-buttons">
            <a class="btn-quiz btn-quiz-outline" href="/student/my-quizzes">
              <i class="ti ti-arrow-left"></i> Back
            </a>
            <button id="submitQuizButton" class="btn-quiz btn-quiz-primary" type="button">
              <i class="ti ti-send"></i> Submit
            </button>
          </div>
        </section>

        <section class="quiz-card">
          <div class="panel-title"><i class="ti ti-progress-check"></i> Progress</div>
          <div class="progress-row">
            <span>Answered</span>
            <strong><span id="answered-count">0</span>/<span id="total-count">0</span></strong>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>
          <div class="progress-row" style="margin-top: 0.65rem; margin-bottom: 0;">
            <span>Complete</span>
            <strong id="progress-percent">0%</strong>
          </div>
        </section>
      </aside>

      <section class="questions-column" id="questions-container">
        <div class="quiz-card loading-state">
          <i class="ti ti-loader-2"></i>
          Loading questions...
        </div>
      </section>

      <aside class="sticky-panel nav-panel">
        <section class="quiz-card">
          <div class="panel-title"><i class="ti ti-grid-dots"></i> Question List</div>
          <div class="nav-grid" id="navGrid"></div>
        </section>
      </aside>
    </div>
  </div>
</main>

<th:block layout:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  const token = localStorage.getItem('jwt_token');
  const userId = localStorage.getItem('user_id');
  const urlParams = new URLSearchParams(window.location.search);
  const quizId = urlParams.get('quizId');

  let timeRemaining = 0;
  let timerInterval = null;
  let totalQuestions = 0;
  let quizQuestions = [];
  let isSubmitting = false;

  const countdownEl = document.getElementById('countdown');
  const navGrid = document.getElementById('navGrid');
  const questionsContainer = document.getElementById('questions-container');
  const swalColors = { confirmButtonColor: '#5b5ce2', cancelButtonColor: '#b42318' };

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function authHeaders(json = false) {
    const headers = { Authorization: `Bearer ${token}` };
    if (json) headers['Content-Type'] = 'application/json';
    return headers;
  }

  function questionTypeLabel(type) {
    const normalizedType = normalizeQuestionType(type);
    const labels = {
      SINGLE_CHOICE: 'Single Choice',
      MULTIPLE_CHOICE: 'Multiple Choice',
      TRUE_FALSE: 'True/False',
      ESSAY: 'Essay'
    };
    return labels[normalizedType] || type || 'Question';
  }

  function normalizeOptionKey(key, index) {
    if (/^\d+$/.test(String(key))) return String.fromCharCode(65 + Number(key));
    return String(key || String.fromCharCode(65 + index));
  }

  function parseOptions(rawOptions) {
    if (!rawOptions) return [];
    try {
      const parsed = JSON.parse(rawOptions);
      if (Array.isArray(parsed)) return parsed.map((value, index) => [String(index), value]);
      if (typeof parsed === 'object' && parsed !== null) return Object.entries(parsed);
    } catch (error) {
      return [['Ans', rawOptions]];
    }
    return [['Ans', rawOptions]];
  }

  function normalizeQuestionType(type) {
    return String(type || '').toUpperCase();
  }

  function optionsForQuestion(question) {
    const type = normalizeQuestionType(question.questionType);
    const parsedOptions = parseOptions(question.options);
    if (parsedOptions.length) return parsedOptions;
    if (type === 'TRUE_FALSE') return [['true', 'True'], ['false', 'False']];
    return [];
  }

  function setStudentName(name) {
    const studentName = document.getElementById('studentName');
    if (studentName && name) studentName.textContent = name;
  }

  async function readError(response) {
    try {
      const data = await response.json();
      return data.message || data.error || 'Something went wrong.';
    } catch (error) {
      const text = await response.text();
      return text || 'Something went wrong.';
    }
  }

  function requireQuizId() {
    if (quizId) return true;
    Swal.fire({
      icon: 'warning',
      title: 'Missing quiz ID',
      text: 'Please choose a quiz from the dashboard before starting.',
      confirmButtonText: 'Back to My Quizzes',
      confirmButtonColor: swalColors.confirmButtonColor
    }).then(() => {
      window.location.href = '/student/my-quizzes';
    });
    return false;
  }

  async function initQuiz() {
    if (!token || !userId) {
      window.location.href = '/login';
      return;
    }

    if (!requireQuizId()) return;
    setStudentName(localStorage.getItem('username') || localStorage.getItem('full_name'));

    try {
      const attemptsRes = await fetch(`/api/quizzes/attempts/student/${userId}`, { headers: authHeaders() });
      if (attemptsRes.ok) {
        const attempts = await attemptsRes.json();
        const hasAttempt = attempts.some(attempt => String(attempt.quizId) === String(quizId));
        if (hasAttempt) {
          await Swal.fire({
            icon: 'warning',
            title: 'You already completed this quiz',
            text: 'This quiz was already submitted, so you cannot retake it.',
            confirmButtonText: 'Back to My Quizzes',
            confirmButtonColor: swalColors.confirmButtonColor
          });
          window.location.href = '/student/my-quizzes';
          return;
        }
      }

      const quizRes = await fetch(`/api/quizzes/${quizId}`, { headers: authHeaders() });
      if (!quizRes.ok) throw new Error('Could not load quiz information.');
      const quizData = await quizRes.json();

      const title = quizData.title || `Quiz #${quizId}`;
      const courseName = quizData.courseName || quizData.learningSpaceName || 'Chung';
      const duration = quizData.durationMinutes || 30;

      document.title = `${title} - FlippedClass`;
      document.getElementById('hero-course').textContent = courseName;
      document.getElementById('hero-duration').textContent = `${duration} min`;

      timeRemaining = duration * 60;
      renderTimer();
      startTimer();

      const questionsRes = await fetch(`/api/quizzes/${quizId}/questions`, { headers: authHeaders() });
      if (!questionsRes.ok) throw new Error('Could not load question list.');
      quizQuestions = await questionsRes.json();
      totalQuestions = quizQuestions.length;

      document.getElementById('hero-total').textContent = `${totalQuestions} questions`;
      document.getElementById('total-count').textContent = totalQuestions;

      renderQuestions();
      renderNavGrid();
      updateProgress();
    } catch (error) {
      questionsContainer.innerHTML = `
      <div class="quiz-card empty-state">
        <i class="ti ti-alert-circle"></i>
        ${escapeHtml(error.message)}
      </div>
    `;
    }
  }

  function renderTimer() {
    const minutes = Math.floor(timeRemaining / 60);
    const seconds = timeRemaining % 60;
    countdownEl.textContent = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    countdownEl.classList.toggle('is-warning', timeRemaining <= 300);
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        Swal.fire({
          icon: 'info',
          title: 'Time is up',
          text: 'The system will automatically submit your quiz.',
          confirmButtonText: 'OK',
          confirmButtonColor: swalColors.confirmButtonColor
        }).then(() => submitQuiz(true));
        return;
      }
      timeRemaining -= 1;
      renderTimer();
    }, 1000);
  }

  function renderQuestions() {
    if (!quizQuestions.length) {
      questionsContainer.innerHTML = `
      <div class="quiz-card empty-state">
        <i class="ti ti-notes-off"></i>
        This quiz has no questions yet.
      </div>
    `;
      return;
    }

    questionsContainer.innerHTML = '';
    quizQuestions.forEach((question, index) => {
      const questionNumber = index + 1;
      const type = normalizeQuestionType(question.questionType);
      const options = optionsForQuestion(question);
      const inputType = type === 'MULTIPLE_CHOICE' ? 'checkbox' : 'radio';
      const optionsHtml = type === 'ESSAY'
        ? `<textarea class="answer-textarea" name="q${question.id}" data-question-id="${question.id}" rows="4" placeholder="Type your answer here..."></textarea>`
        : options.map(([optionKey, optionText], optionIndex) => {
          const labelKey = normalizeOptionKey(optionKey, optionIndex);
          return `
        <label class="answer-option">
          <input type="${inputType}" name="q${question.id}" value="${escapeHtml(optionKey)}" data-question-id="${question.id}">
          <span class="radio-mark"></span>
          <span class="answer-content">
            <span class="answer-key">${escapeHtml(labelKey)}.</span>
            <span>${escapeHtml(optionText)}</span>
          </span>
        </label>
      `;
        }).join('');

      const questionHtml = `
      <article class="question-card" id="q-card-${question.id}">
        <div class="q-header">
          <div class="q-number"><i class="ti ti-circle-number-${Math.min(questionNumber, 9)}"></i> Question ${questionNumber}</div>
          <div class="q-type">${escapeHtml(questionTypeLabel(question.questionType))} - ${escapeHtml(question.points || 0)} points</div>
        </div>
        <div class="q-text">${escapeHtml(question.content)}</div>
        <div class="q-options">${optionsHtml}</div>
      </article>
    `;
      questionsContainer.insertAdjacentHTML('beforeend', questionHtml);
    });
  }

  function renderNavGrid() {
    navGrid.innerHTML = '';
    quizQuestions.forEach((question, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'nav-btn';
      button.id = `nav-btn-${question.id}`;
      button.textContent = index + 1;
      button.setAttribute('aria-label', `Go to question ${index + 1}`);
      button.addEventListener('click', () => scrollToQuestion(question.id));
      navGrid.appendChild(button);
    });
  }

  function markAnswered(questionId) {
    const answered = isQuestionAnswered(questionId);
    const navButton = document.getElementById(`nav-btn-${questionId}`);
    const questionCard = document.getElementById(`q-card-${questionId}`);
    navButton?.classList.toggle('answered', answered);
    questionCard?.classList.toggle('is-answered', answered);
    updateProgress();
  }

  function isQuestionAnswered(questionId) {
    const checked = document.querySelectorAll(`input[name="q${questionId}"]:checked`);
    if (checked.length) return true;
    const textarea = document.querySelector(`textarea[name="q${questionId}"]`);
    return Boolean(textarea && textarea.value.trim());
  }

  function updateProgress() {
    quizQuestions.forEach((question) => {
      const answered = isQuestionAnswered(question.id);
      document.getElementById(`nav-btn-${question.id}`)?.classList.toggle('answered', answered);
      document.getElementById(`q-card-${question.id}`)?.classList.toggle('is-answered', answered);
    });
    const answeredCount = quizQuestions.filter((question) => isQuestionAnswered(question.id)).length;
    const percent = totalQuestions === 0 ? 0 : Math.round((answeredCount / totalQuestions) * 100);
    document.getElementById('answered-count').textContent = answeredCount;
    document.getElementById('total-count').textContent = totalQuestions;
    document.getElementById('progress-percent').textContent = `${percent}%`;
    document.getElementById('progress-bar').style.width = `${percent}%`;
  }

  function scrollToQuestion(questionId) {
    const questionEl = document.getElementById(`q-card-${questionId}`);
    if (!questionEl) return;
    const y = questionEl.getBoundingClientRect().top + window.scrollY - 96;
    window.scrollTo({ top: y, behavior: 'smooth' });
  }

  async function confirmSubmit(autoSubmit, answeredCount) {
    if (autoSubmit) return true;
    const isIncomplete = answeredCount < totalQuestions;
    const result = await Swal.fire({
      title: isIncomplete ? 'You have unanswered questions' : 'Ready to submit?',
      text: isIncomplete
        ? `You answered ${answeredCount}/${totalQuestions} questions. Do you still want to submit?`
        : 'You answered all questions. Submit now?',
      icon: isIncomplete ? 'warning' : 'question',
      showCancelButton: true,
      confirmButtonText: 'Submit',
      cancelButtonText: 'Keep Working',
      confirmButtonColor: swalColors.confirmButtonColor,
      cancelButtonColor: swalColors.cancelButtonColor
    });
    return result.isConfirmed;
  }

  async function submitQuiz(autoSubmit = false) {
    if (isSubmitting) return;

    const answeredCount = quizQuestions.filter((question) => isQuestionAnswered(question.id)).length;
    const shouldSubmit = await confirmSubmit(autoSubmit, answeredCount);
    if (!shouldSubmit) return;

    const answers = {};
    quizQuestions.forEach(question => {
      const type = normalizeQuestionType(question.questionType);
      if (type === 'ESSAY') {
        const textarea = document.querySelector(`textarea[name="q${question.id}"]`);
        const value = textarea?.value.trim();
        if (value) answers[question.id] = value;
        return;
      }

      const selected = [...document.querySelectorAll(`input[name="q${question.id}"]:checked`)]
        .map((input) => input.value);
      if (selected.length) answers[question.id] = selected.join(',');
    });

    isSubmitting = true;
    try {
      const response = await fetch(`/api/quizzes/${quizId}/attempts`, {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify({
          studentId: Number(userId),
          answers
        })
      });

      if (!response.ok) throw new Error(await readError(response));
      const result = await response.json();
      clearInterval(timerInterval);

      await Swal.fire({
        icon: 'success',
        title: 'Submitted Successfully',
        html: `
        <div style="text-align:center; margin-top: 1rem;">
          <div style="font-size: 3.4rem; font-weight: 900; color: #5b5ce2; line-height: 1;">${escapeHtml(result.score ?? 0)}%</div>
          <p style="color: #6b7280; margin-top: 0.75rem; font-weight: 700;">Correct Answers: <strong>${escapeHtml(result.correctAnswers ?? 0)} / ${escapeHtml(result.totalQuestions ?? totalQuestions)}</strong></p>
        </div>
      `,
        confirmButtonText: 'Back to My Quizzes',
        confirmButtonColor: swalColors.confirmButtonColor,
        allowOutsideClick: false
      });

      window.location.href = '/student/my-quizzes';
    } catch (error) {
      isSubmitting = false;
      Swal.fire({
        icon: 'error',
        title: 'Could not submit quiz',
        text: error.message,
        confirmButtonText: 'Close',
        confirmButtonColor: swalColors.confirmButtonColor
      });
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('submitQuizButton')?.addEventListener('click', () => submitQuiz());
    questionsContainer.addEventListener('change', (event) => {
      const questionId = event.target.dataset.questionId;
      if (questionId) markAnswered(questionId);
    });
    questionsContainer.addEventListener('input', (event) => {
      const questionId = event.target.dataset.questionId;
      if (questionId) markAnswered(questionId);
    });
    initQuiz();
  });
</script>
</th:block>
</body>
</html>
