    <script th:inline="none">
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('embed') === 'true' || window.self !== window.top) {
          document.body.classList.add('is-embedded');
        }
      });

      /* --- Inlined from student-user-menu.js --- */
      (function () {
        const defaultAvatarUrl = '/assets/images/avatar-1.jpg';

        function storedUser() {
          return {
            fullName: localStorage.getItem('full_name') || localStorage.getItem('fullName') || '',
            username: localStorage.getItem('username') || '',
            avatarUrl: localStorage.getItem('avatar_url') || localStorage.getItem('avatarUrl') || ''
          };
        }

        function normalizeUser(user = {}) {
          const stored = storedUser();
          return {
            name: user.fullName || user.name || user.username || stored.fullName || stored.username || 'Student',
            username: user.username || stored.username || '',
            avatarUrl: user.avatarUrl || user.avatar_url || stored.avatarUrl || defaultAvatarUrl
          };
        }

        function setStudentMenuUser(user = {}) {
          const normalized = normalizeUser(user);

          if (normalized.name && normalized.name !== 'Student') {
            localStorage.setItem('full_name', normalized.name);
          }
          if (normalized.username) {
            localStorage.setItem('username', normalized.username);
          }
          if (normalized.avatarUrl && normalized.avatarUrl !== defaultAvatarUrl) {
            localStorage.setItem('avatar_url', normalized.avatarUrl);
          }

          document.querySelectorAll('[data-user-name]').forEach((element) => {
            element.textContent = normalized.name;
          });
          document.querySelectorAll('[data-user-avatar]').forEach((image) => {
            image.src = normalized.avatarUrl;
            image.onerror = () => {
              image.onerror = null;
              image.src = defaultAvatarUrl;
            };
          });

          const topbarName = document.getElementById('studentName');
          if (topbarName) topbarName.textContent = normalized.name;
        }

        function studentLogout() {
          ['jwt_token', 'user_id', 'full_name', 'fullName', 'username', 'avatar_url', 'avatarUrl', 'is_supporter'].forEach((key) => {
            localStorage.removeItem(key);
          });
          window.location.href = '/';
        }

        async function refreshStudentMenuUser() {
          const token = localStorage.getItem('jwt_token');
          const userId = localStorage.getItem('user_id');
          if (!token || !userId) return;

          try {
            const response = await fetch(`/api/users/${encodeURIComponent(userId)}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            if (!response.ok) return;
            const user = await response.json();
            setStudentMenuUser(user);
            if (user.supporter) {
              localStorage.setItem('is_supporter', 'true');
              document.querySelectorAll('#supporter-nav-item').forEach(el => el.style.display = 'block');
            } else {
              localStorage.removeItem('is_supporter');
              document.querySelectorAll('#supporter-nav-item').forEach(el => el.style.display = 'none');
            }
          } catch (error) {
            console.warn('Could not load user menu profile.', error);
          }
        }

        function closeAllMenus(exceptMenu = null) {
          document.querySelectorAll('[data-user-menu].is-open').forEach((menu) => {
            if (menu !== exceptMenu) {
              menu.classList.remove('is-open');
              menu.querySelector('[data-user-menu-toggle]')?.setAttribute('aria-expanded', 'false');
            }
          });
        }

        function initStudentUserMenus() {
          setStudentMenuUser();
          if (localStorage.getItem('is_supporter') === 'true') {
            document.querySelectorAll('#supporter-nav-item').forEach(el => el.style.display = 'block');
          }
          refreshStudentMenuUser();

          document.querySelectorAll('[data-user-menu]').forEach((menu) => {
            const toggle = menu.querySelector('[data-user-menu-toggle]');
            const logoutButton = menu.querySelector('[data-user-logout]');

            toggle?.addEventListener('click', (event) => {
              event.stopPropagation();
              const shouldOpen = !menu.classList.contains('is-open');
              closeAllMenus(menu);
              menu.classList.toggle('is-open', shouldOpen);
              toggle.setAttribute('aria-expanded', String(shouldOpen));
            });

            logoutButton?.addEventListener('click', studentLogout);
          });

          document.addEventListener('click', () => closeAllMenus());
          document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeAllMenus();
          });
        }

        window.setStudentMenuUser = setStudentMenuUser;
        window.studentLogout = studentLogout;
        if (!window.logout) window.logout = studentLogout;

        document.addEventListener('DOMContentLoaded', initStudentUserMenus);
      })();

      function goBackToQuizzes() {
        if (document.body.classList.contains('is-embedded')) {
          if (window.parent && window.parent.$) {
            window.parent.$('.quiz-iframe-container').slideUp();
          } else {
            document.body.innerHTML = '<div style="display:flex; height:100vh; align-items:center; justify-content:center; flex-direction:column;"><h2 style="color:#22c55e;">Quiz Completed!</h2><p>You can close this window now.</p></div>';
          }
        } else {
          window.location.href = '/student/my-quizzes';
        }
      }

    </script>

    <script th:inline="none">

      const token = localStorage.getItem('jwt_token');
      const userId = localStorage.getItem('user_id');
      const urlParams = new URLSearchParams(window.location.search);
      const quizId = urlParams.get('quizId');

      let timeRemaining = 0;
      let timerInterval = null;
      let totalQuestions = 0;
      let quizQuestions = [];
      let isSubmitting = false;

      const countdownEl = document.getElementById('countdown');
      const navGrid = document.getElementById('navGrid');
      const questionsContainer = document.getElementById('questions-container');
      const swalColors = { confirmButtonColor: '#5b5ce2', cancelButtonColor: '#b42318' };

      /**
       * Hàm escapeHtml: Tránh lỗi bảo mật XSS bằng cách mã hóa các ký tự đặc biệt trong HTML.
       * @param {string} value - Chuỗi ký tự cần mã hóa
       * @returns {string} Chuỗi đã được mã hóa an toàn
       */
      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      /**
       * Hàm authHeaders: Tạo HTTP Header chứa JWT Token phục vụ cho việc gọi API cần xác thực.
       * @param {boolean} json - Nếu true, sẽ thêm thuộc tính Content-Type: application/json
       * @returns {object} Đối tượng Headers chứa thông tin Authorization
       */
      function authHeaders(json = false) {
        const headers = { Authorization: `Bearer ${token}` };
        if (json) headers['Content-Type'] = 'application/json';
        return headers;
      }

      /**
       * Hàm questionTypeLabel: Trả về nhãn hiển thị thân thiện của loại câu hỏi.
       * @param {string} type - Mã loại câu hỏi từ Backend (ví dụ: SINGLE_CHOICE)
       * @returns {string} Nhãn tiếng Anh thân thiện tương ứng (ví dụ: Single Choice)
       */
      function questionTypeLabel(type) {
        const normalizedType = normalizeQuestionType(type);
        const labels = {
          SINGLE_CHOICE: 'Single Choice',
          MULTIPLE_CHOICE: 'Multiple Choice',
          TRUE_FALSE: 'True/False',
          ESSAY: 'Essay'
        };
        return labels[normalizedType] || type || 'Question';
      }

      /**
       * Hàm normalizeOptionKey: Chuẩn hóa nhãn của đáp án (A, B, C, D) từ index/key của đáp án.
       * @param {string|number} key - Khóa hoặc số thứ tự đáp án
       * @param {number} index - Vị trí của đáp án trong danh sách
       * @returns {string} Nhãn chữ cái (ví dụ: A, B, C, D)
       */
      function normalizeOptionKey(key, index) {
        if (/^\d+$/.test(String(key))) return String.fromCharCode(65 + Number(key));
        return String(key || String.fromCharCode(65 + index));
      }

      /**
       * Hàm parseOptions: Chuyển đổi dữ liệu JSON options từ DB thành mảng [khóa, nội dung] tương ứng.
       * @param {string} rawOptions - Chuỗi JSON chứa các phương án lựa chọn
       * @returns {Array} Mảng các phương án lựa chọn
       */
      function parseOptions(rawOptions) {
        if (!rawOptions) return [];
        try {
          const parsed = JSON.parse(rawOptions);
          if (Array.isArray(parsed)) return parsed.map((value, index) => [String(index), value]);
          if (typeof parsed === 'object' && parsed !== null) return Object.entries(parsed);
        } catch (error) {
          return [['Ans', rawOptions]];
        }
        return [['Ans', rawOptions]];
      }

      /**
       * Hàm normalizeQuestionType: Chuyển chuỗi loại câu hỏi sang viết hoa để so sánh chính xác.
       * @param {string} type - Chuỗi loại câu hỏi
       * @returns {string} Chuỗi viết hoa
       */
      function normalizeQuestionType(type) {
        return String(type || '').toUpperCase();
      }

      /**
       * Hàm optionsForQuestion: Lấy danh sách các đáp án cho một câu hỏi dựa vào loại câu hỏi.
       * @param {object} question - Đối tượng câu hỏi
       * @returns {Array} Danh sách các đáp án [optionKey, optionText]
       */
      function optionsForQuestion(question) {
        const type = normalizeQuestionType(question.questionType);
        const parsedOptions = parseOptions(question.options);
        if (parsedOptions.length) return parsedOptions;
        if (type === 'TRUE_FALSE') return [['true', 'True'], ['false', 'False']];
        return [];
      }

      /**
       * Hàm setStudentName: Hiển thị tên sinh viên trên thanh Topbar của giao diện.
       * @param {string} name - Tên sinh viên cần hiển thị
       */
      function setStudentName(name) {
        const studentName = document.getElementById('studentName');
        if (studentName && name) studentName.textContent = name;
      }

      /**
       * Hàm setupLayoutControls: Cài đặt sự kiện đóng/mở Sidebar (trên cả PC và giao diện Mobile).
       */
      function setupLayoutControls() {
        const toggleBtn = document.getElementById('toggleBtn');
        const mobileBtn = document.getElementById('mobileBtn');
        const overlay = document.getElementById('overlay');

        toggleBtn?.addEventListener('click', () => {
          if (window.innerWidth >= 992) {
            document.body.classList.toggle('sidebar-collapsed');
          } else {
            document.body.classList.toggle('sidebar-open');
          }
        });

        mobileBtn?.addEventListener('click', () => document.body.classList.add('sidebar-open'));
        overlay?.addEventListener('click', () => document.body.classList.remove('sidebar-open'));
      }

      /**
       * Hàm readError: Đọc thông tin lỗi trả về từ API (hỗ trợ cả định dạng JSON lẫn text thuần).
       * @param {Response} response - Đối tượng Response từ fetch
       * @returns {Promise<string>} Thông điệp lỗi
       */
      async function readError(response) {
        try {
          const data = await response.json();
          return data.message || data.error || 'Something went wrong.';
        } catch (error) {
          const text = await response.text();
          return text || 'Something went wrong.';
        }
      }

      /**
       * Hàm requireQuizId: Kiểm tra xem ID bài kiểm tra có trên URL không. Nếu không có sẽ thông báo lỗi và quay lại.
       * @returns {boolean} True nếu hợp lệ, False nếu thiếu ID
       */
      function requireQuizId() {
        if (quizId) return true;
        Swal.fire({
          icon: 'warning',
          title: 'Missing quiz ID',
          text: 'Please choose a quiz from the dashboard before starting.',
          confirmButtonText: 'Back to My Quizzes',
          confirmButtonColor: swalColors.confirmButtonColor
        }).then(() => {
          goBackToQuizzes();
        });
        return false;
      }

      /**
       * Hàm khởi tạo bài kiểm tra (initQuiz):
       * 1. Kiểm tra xem sinh viên đã làm bài này chưa (nếu rồi thì chặn không cho làm tiếp).
       * 2. Lấy thông tin bài Quiz (Tên, thời gian, ...) hiển thị lên Giao diện.
       * 3. Lấy danh sách câu hỏi của bài Quiz từ API Backend.
       * 4. Gọi các hàm vẽ câu hỏi (renderQuestions) và vẽ danh sách lưới điều hướng (renderNavGrid).
       */
      async function initQuiz() {
        if (!token || !userId) {
          window.location.href = '/login';
          return;
        }

        if (!requireQuizId()) return;
        setStudentName(localStorage.getItem('username') || localStorage.getItem('full_name'));

        try {
          // 1. Kiểm tra xem sinh viên đã làm bài quiz này chưa
          const attemptsRes = await fetch(`/api/quizzes/attempts/student/${userId}`, { headers: authHeaders() });
          if (attemptsRes.ok) {
            const attempts = await attemptsRes.json();
            const hasAttempt = attempts.some(attempt => String(attempt.quizId) === String(quizId));
            if (hasAttempt) {
              await Swal.fire({
                icon: 'warning',
                title: 'You already completed this quiz',
                text: 'This quiz was already submitted, so you cannot retake it.',
                confirmButtonText: 'Back to My Quizzes',
                confirmButtonColor: swalColors.confirmButtonColor
              });
              goBackToQuizzes();
              return;
            }
          }

          // 2. Lấy thông tin cơ bản của quiz (tên, thời gian, ...)
          const quizRes = await fetch(`/api/quizzes/${quizId}`, { headers: authHeaders() });
          if (!quizRes.ok) throw new Error('Could not load quiz information.');
          const quizData = await quizRes.json();

          const title = quizData.title || `Quiz #${quizId}`;
          const courseName = quizData.courseName || quizData.learningSpaceName || 'Chung';
          const duration = quizData.durationMinutes || 30;

          document.title = `${title} - FlippedClass`;
          document.getElementById('hero-course').textContent = courseName;
          document.getElementById('hero-duration').textContent = `${duration} min`;

          timeRemaining = duration * 60;
          renderTimer();
          startTimer();

          // 3. Lấy danh sách câu hỏi của quiz
          const questionsRes = await fetch(`/api/quizzes/${quizId}/questions`, { headers: authHeaders() });
          if (!questionsRes.ok) throw new Error('Could not load question list.');
          quizQuestions = await questionsRes.json();
          totalQuestions = quizQuestions.length;

          document.getElementById('hero-total').textContent = `${totalQuestions} questions`;
          document.getElementById('total-count').textContent = totalQuestions;

          renderQuestions();
          renderNavGrid();
          updateProgress();
        } catch (error) {
          questionsContainer.innerHTML = `
          <div class="quiz-card empty-state">
            <i class="ti ti-alert-circle"></i>
            ${escapeHtml(error.message)}
          </div>
        `;
        }
      }

      /**
       * Hàm renderTimer: Cập nhật hiển thị thời gian đếm ngược lên giao diện (mm:ss).
       * Chuyển sang màu cảnh báo đỏ nếu thời gian còn lại ít hơn 5 phút (300 giây).
       */
      function renderTimer() {
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;
        countdownEl.textContent = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        countdownEl.classList.toggle('is-warning', timeRemaining <= 300);
      }

      /**
       * Hàm startTimer: Kích hoạt đếm ngược thời gian làm bài mỗi giây.
       * Khi hết giờ, tự động khóa bài thi và thực hiện gửi kết quả lên hệ thống (submitQuiz(true)).
       */
      function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            Swal.fire({
              icon: 'info',
              title: 'Time is up',
              text: 'The system will automatically submit your quiz.',
              confirmButtonText: 'OK',
              confirmButtonColor: swalColors.confirmButtonColor
            }).then(() => submitQuiz(true)); // Tự động nộp bài
            return;
          }
          timeRemaining -= 1;
          renderTimer();
        }, 1000);
      }

      /**
       * Hàm renderQuestions: Duyệt danh sách các câu hỏi từ Backend và vẽ (render) cấu trúc HTML câu hỏi
       * lên khung làm bài, hỗ trợ các loại: SINGLE_CHOICE (radio), MULTIPLE_CHOICE (checkbox), TRUE_FALSE (radio), ESSAY (textarea).
       */
      function renderQuestions() {
        if (!quizQuestions.length) {
          questionsContainer.innerHTML = `
          <div class="quiz-card empty-state">
            <i class="ti ti-notes-off"></i>
            This quiz has no questions yet.
          </div>
        `;
          return;
        }

        questionsContainer.innerHTML = '';
        quizQuestions.forEach((question, index) => {
          const questionNumber = index + 1;
          const type = normalizeQuestionType(question.questionType);
          const options = optionsForQuestion(question);
          const inputType = type === 'MULTIPLE_CHOICE' ? 'checkbox' : 'radio';
          const optionsHtml = type === 'ESSAY'
            ? `<textarea class="answer-textarea" name="q${question.id}" data-question-id="${question.id}" rows="4" placeholder="Type your answer here..."></textarea>`
            : options.map(([optionKey, optionText], optionIndex) => {
              const labelKey = normalizeOptionKey(optionKey, optionIndex);
              return `
            <label class="answer-option">
              <input type="${inputType}" name="q${question.id}" value="${escapeHtml(optionKey)}" data-question-id="${question.id}">
              <span class="radio-mark"></span>
              <span class="answer-content">
                <span class="answer-key">${escapeHtml(labelKey)}.</span>
                <span>${escapeHtml(optionText)}</span>
              </span>
            </label>
          `;
            }).join('');

          const questionHtml = `
          <article class="question-card" id="q-card-${question.id}">
            <div class="q-header">
              <div class="q-number"><i class="ti ti-circle-number-${Math.min(questionNumber, 9)}"></i> Question ${questionNumber}</div>
              <div class="q-type">${escapeHtml(questionTypeLabel(question.questionType))} - ${escapeHtml(question.points || 0)} points</div>
            </div>
            <div class="q-text">${escapeHtml(question.content)}</div>
            <div class="q-options">${optionsHtml}</div>
          </article>
        `;
          questionsContainer.insertAdjacentHTML('beforeend', questionHtml);
        });
      }

      /**
       * Hàm renderNavGrid: Tạo danh sách các nút số thứ tự câu hỏi ở Sidebar bên phải.
       * Cho phép click vào số thứ tự để cuộn nhanh đến câu hỏi đó (scrollToQuestion).
       */
      function renderNavGrid() {
        navGrid.innerHTML = '';
        quizQuestions.forEach((question, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'nav-btn';
          button.id = `nav-btn-${question.id}`;
          button.textContent = index + 1;
          button.setAttribute('aria-label', `Go to question ${index + 1}`);
          button.addEventListener('click', () => scrollToQuestion(question.id));
          navGrid.appendChild(button);
        });
      }

      /**
       * Hàm markAnswered: Đánh dấu trạng thái câu hỏi đã được làm hay chưa (đổi màu nút điều hướng bên phải
       * và đổi màu viền của card câu hỏi) đồng thời cập nhật thanh tiến trình tổng quát.
       * @param {number|string} questionId - ID của câu hỏi
       */
      function markAnswered(questionId) {
        const answered = isQuestionAnswered(questionId);
        const navButton = document.getElementById(`nav-btn-${questionId}`);
        const questionCard = document.getElementById(`q-card-${questionId}`);
        navButton?.classList.toggle('answered', answered);
        questionCard?.classList.toggle('is-answered', answered);
        updateProgress();
      }

      /**
       * Hàm isQuestionAnswered: Kiểm tra thực tế một câu hỏi đã được chọn đáp án hoặc đã nhập text tự luận chưa.
       * @param {number|string} questionId - ID của câu hỏi
       * @returns {boolean} True nếu đã được trả lời, ngược lại trả về False
       */
      function isQuestionAnswered(questionId) {
        const checked = document.querySelectorAll(`input[name="q${questionId}"]:checked`);
        if (checked.length) return true;
        const textarea = document.querySelector(`textarea[name="q${questionId}"]`);
        return Boolean(textarea && textarea.value.trim());
      }

      /**
       * Hàm updateProgress: Cập nhật tỷ lệ hoàn thành làm bài kiểm tra (ví dụ: 1/5 câu - 20%).
       * Cập nhật thông số số lượng câu và tăng chiều rộng của thanh tiến trình (progress-bar).
       */
      function updateProgress() {
        quizQuestions.forEach((question) => {
          const answered = isQuestionAnswered(question.id);
          document.getElementById(`nav-btn-${question.id}`)?.classList.toggle('answered', answered);
          document.getElementById(`q-card-${question.id}`)?.classList.toggle('is-answered', answered);
        });
        const answeredCount = quizQuestions.filter((question) => isQuestionAnswered(question.id)).length;
        const percent = totalQuestions === 0 ? 0 : Math.round((answeredCount / totalQuestions) * 100);
        document.getElementById('answered-count').textContent = answeredCount;
        document.getElementById('total-count').textContent = totalQuestions;
        document.getElementById('progress-percent').textContent = `${percent}%`;
        document.getElementById('progress-bar').style.width = `${percent}%`;
      }

      /**
       * Hàm scrollToQuestion: Thực hiện hiệu ứng cuộn mượt mà (smooth scrolling) tới vị trí của câu hỏi.
       * @param {number|string} questionId - ID câu hỏi cần cuộn tới
       */
      function scrollToQuestion(questionId) {
        const questionEl = document.getElementById(`q-card-${questionId}`);
        if (!questionEl) return;
        const y = questionEl.getBoundingClientRect().top + window.scrollY - 96;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }

      /**
       * Hàm confirmSubmit: Hiển thị hộp thoại (Swal) xác nhận nộp bài thi.
       * Cảnh báo nếu sinh viên vẫn còn các câu hỏi chưa làm.
       * @param {boolean} autoSubmit - Nếu là tự động nộp bài khi hết giờ, bỏ qua xác nhận
       * @param {number} answeredCount - Số lượng câu hỏi đã trả lời
       * @returns {Promise<boolean>} Trả về True nếu đồng ý nộp bài
       */
      async function confirmSubmit(autoSubmit, answeredCount) {
        if (autoSubmit) return true;
        const isIncomplete = answeredCount < totalQuestions;
        const result = await Swal.fire({
          title: isIncomplete ? 'You have unanswered questions' : 'Ready to submit?',
          text: isIncomplete
            ? `You answered ${answeredCount}/${totalQuestions} questions. Do you still want to submit?`
            : 'You answered all questions. Submit now?',
          icon: isIncomplete ? 'warning' : 'question',
          showCancelButton: true,
          confirmButtonText: 'Submit',
          cancelButtonText: 'Keep Working',
          confirmButtonColor: swalColors.confirmButtonColor,
          cancelButtonColor: swalColors.cancelButtonColor
        });
        return result.isConfirmed;
      }

      /**
       * Hàm submitQuiz: Thu thập tất cả câu trả lời của sinh viên, định dạng dữ liệu
       * và gọi POST API `/api/quizzes/{quizId}/attempts` gửi lên máy chủ để chấm điểm.
       * Sau đó hiển thị kết quả điểm số (%) nhận được lên màn hình.
       * @param {boolean} autoSubmit - Khóa tự động nộp bài (khi hết giờ)
       */
      async function submitQuiz(autoSubmit = false) {
        if (isSubmitting) return;

        const answeredCount = quizQuestions.filter((question) => isQuestionAnswered(question.id)).length;
        const shouldSubmit = await confirmSubmit(autoSubmit, answeredCount);
        if (!shouldSubmit) return;

        const answers = {};
        quizQuestions.forEach(question => {
          const type = normalizeQuestionType(question.questionType);
          if (type === 'ESSAY') {
            const textarea = document.querySelector(`textarea[name="q${question.id}"]`);
            const value = textarea?.value.trim();
            if (value) answers[question.id] = value;
            return;
          }

          const selected = [...document.querySelectorAll(`input[name="q${question.id}"]:checked`)]
            .map((input) => input.value);
          if (selected.length) answers[question.id] = selected.join(',');
        });

        isSubmitting = true;
        try {
          const response = await fetch(`/api/quizzes/${quizId}/attempts`, {
            method: 'POST',
            headers: authHeaders(true),
            body: JSON.stringify({
              studentId: Number(userId),
              answers
            })
          });

          if (!response.ok) throw new Error(await readError(response));
          const result = await response.json();
          clearInterval(timerInterval);

          await Swal.fire({
            icon: 'success',
            title: 'Submitted Successfully',
            html: `
            <div style="text-align:center; margin-top: 1rem;">
              <div style="font-size: 3.4rem; font-weight: 900; color: #5b5ce2; line-height: 1;">${escapeHtml(result.score ?? 0)}%</div>
              <p style="color: #6b7280; margin-top: 0.75rem; font-weight: 700;">Correct Answers: <strong>${escapeHtml(result.correctAnswers ?? 0)} / ${escapeHtml(result.totalQuestions ?? totalQuestions)}</strong></p>
            </div>
          `,
            confirmButtonText: 'Back to My Quizzes',
            confirmButtonColor: swalColors.confirmButtonColor,
            allowOutsideClick: false
          });

          goBackToQuizzes();
        } catch (error) {
          isSubmitting = false;
          Swal.fire({
            icon: 'error',
            title: 'Could not submit quiz',
            text: error.message,
            confirmButtonText: 'Close',
            confirmButtonColor: swalColors.confirmButtonColor
          });
        }
      }

      /**
       * Hàm logout: Thực hiện xóa JWT token và thông tin người dùng khỏi localStorage rồi chuyển về trang chủ.
       */
      function logout() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_id');
        window.location.href = '/';
      }

      document.addEventListener('DOMContentLoaded', () => {
        setupLayoutControls();
        document.getElementById('submitQuizButton')?.addEventListener('click', () => submitQuiz());
        questionsContainer.addEventListener('change', (event) => {
          const questionId = event.target.dataset.questionId;
          if (questionId) markAnswered(questionId);
        });
        questionsContainer.addEventListener('input', (event) => {
          const questionId = event.target.dataset.questionId;
          if (questionId) markAnswered(questionId);
        });
        initQuiz();
      });

    </script>
  <script src="/js/active-time-tracker.js"></script>
</body>
