<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My quiz - FlippedClass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <script>
    if (!localStorage.getItem('jwt_token')) {
      window.location.href = '/login';
    }
  </script>

  <link rel="stylesheet" th:href="@{/assets/css/student-my-quizzes.css}">
</head>
<body>
<div id="overlay" class="overlay"></div>

<nav id="topbar" class="topbar">
  <button id="toggleBtn" class="icon-button" type="button" aria-label="Thu gá»n menu">
    <i class="ti ti-layout-sidebar-left-expand"></i>
  </button>

  <div class="topbar-spacer"></div>
  <div class="dropdown">
    <div class="student-chip" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">
      <img th:src="@{/assets/images/avatar-1.jpg}" alt="áº¢nh Ä‘áº¡i diá»‡n sinh viÃªn">
      <span id="studentName">Sinh viÃªn</span>
    </div>
    <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 mt-2">
      <li><a class="dropdown-item text-danger fw-bold py-2" href="javascript:void(0)" onclick="logout()"><i class="ti ti-logout me-2"></i>ÄÄƒng xuáº¥t</a></li>
    </ul>
  </div>
</nav>

<aside id="sidebar" class="sidebar">
  <div class="logo-area">
    <a th:href="@{/}" class="logo-link">
      <span class="logo-mark"><i class="ti ti-book-2 fs-3"></i></span>
      <span>Flipped<span>Class</span></span>
    </a>
  </div>
  <ul class="nav">
    <li><a class="nav-link" th:href="@{/student/dashboard}" data-nav-key="dashboard"><i class="ti ti-layout-dashboard fs-5"></i><span class="nav-text">Tá»•ng quan</span></a></li>
    <li><a class="nav-link" th:href="@{/student/learning-spaces}" data-nav-key="learning-spaces"><i class="ti ti-books fs-5"></i><span class="nav-text">Lá»›p cá»§a tÃ´i</span></a></li>
    <li><a class="nav-link active" th:href="@{/student/my-quizzes}" data-nav-key="my-quiz" aria-current="page"><i class="ti ti-list-check fs-5"></i><span class="nav-text">My quiz</span></a></li>
    <li><a class="nav-link" th:href="@{/}" data-nav-key="reports"><i class="ti ti-chart-pie fs-5"></i><span class="nav-text">BÃ¡o cÃ¡o</span></a></li>
  </ul>
</aside>

<main id="content" class="content">
  <div class="page-shell">
    <section class="hero">
      <div>
        <div class="eyebrow"><i class="ti ti-list-check"></i> My quiz</div>
      </div>
      <div class="hero-actions">
        <a class="hero-link" th:href="@{/student/dashboard}"><i class="ti ti-layout-dashboard"></i> Vá» tá»•ng quan</a>
        <a class="hero-link" th:href="@{/student/learning-spaces}"><i class="ti ti-books"></i> Lá»›p cá»§a tÃ´i</a>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <span>Tá»•ng quiz</span>
        <strong id="statTotal">0</strong>
      </div>
      <div class="stat-card">
        <span>Cáº§n lÃ m</span>
        <strong id="statPending">0</strong>
      </div>
      <div class="stat-card">
        <span>ÄÃ£ hoÃ n thÃ nh</span>
        <strong id="statCompleted">0</strong>
      </div>
      <div class="stat-card">
        <span>Learning space</span>
        <strong id="statSpaces">0</strong>
      </div>
    </section>

    <section class="filter-card">
      <input id="searchInput" class="search-box" type="search" placeholder="TÃ¬m quiz theo tÃªn, mÃ´n há»c hoáº·c learning space...">
      <select id="statusFilter" class="filter-select">
        <option value="all">Táº¥t cáº£ tráº¡ng thÃ¡i</option>
        <option value="pending">Cáº§n lÃ m</option>
        <option value="completed">ÄÃ£ hoÃ n thÃ nh</option>
      </select>
    </section>

    <section id="quizGrid" class="quiz-grid">
      <div class="empty-card">
        <i class="ti ti-loader-2"></i>
        Äang táº£i danh sÃ¡ch quiz...
      </div>
    </section>
  </div>
</main>

<script>
  const token = localStorage.getItem('jwt_token');
  const userId = localStorage.getItem('user_id');
  const state = {
    quizzes: [],
    search: '',
    status: 'all'
  };

  const quizGrid = document.getElementById('quizGrid');
  const searchInput = document.getElementById('searchInput');
  const statusFilter = document.getElementById('statusFilter');

  function authHeaders() {
    return { Authorization: `Bearer ${token}` };
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function setupLayoutControls() {
    const toggleBtn = document.getElementById('toggleBtn');
    const mobileBtn = document.getElementById('mobileBtn');
    const overlay = document.getElementById('overlay');

    toggleBtn?.addEventListener('click', () => {
      if (window.innerWidth >= 992) {
        document.body.classList.toggle('sidebar-collapsed');
      } else {
        document.body.classList.toggle('sidebar-open');
      }
    });

    mobileBtn?.addEventListener('click', () => document.body.classList.add('sidebar-open'));
    overlay?.addEventListener('click', () => document.body.classList.remove('sidebar-open'));
  }

  function setStudentName(user) {
    const name = user?.fullName || user?.username || localStorage.getItem('username') || 'Sinh viÃªn';
    document.getElementById('studentName').textContent = name;
  }

  function flattenQuizzes(data) {
    const spaces = data.learningSpaces || [];
    return spaces.flatMap(space => (space.quizzes || []).map(quiz => ({
      ...quiz,
      learningSpaceName: space.name || quiz.learningSpaceName || 'Learning space',
      courseName: quiz.courseName || space.courseName || space.name || 'Chung'
    })));
  }

  function updateStats(spacesCount) {
    const completed = state.quizzes.filter(quiz => quiz.isCompleted).length;
    const total = state.quizzes.length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPending').textContent = total - completed;
    document.getElementById('statCompleted').textContent = completed;
    document.getElementById('statSpaces').textContent = spacesCount;
  }

  function filteredQuizzes() {
    const keyword = state.search.trim().toLowerCase();
    return state.quizzes.filter(quiz => {
      const matchesStatus =
        state.status === 'all' ||
        (state.status === 'pending' && !quiz.isCompleted) ||
        (state.status === 'completed' && quiz.isCompleted);

      const haystack = [
        quiz.title,
        quiz.courseName,
        quiz.learningSpaceName
      ].join(' ').toLowerCase();

      return matchesStatus && (!keyword || haystack.includes(keyword));
    });
  }

  function renderQuizzes() {
    const quizzes = filteredQuizzes();
    if (!quizzes.length) {
      quizGrid.innerHTML = `
        <div class="empty-card" style="grid-column: 1 / -1;">
          <i class="ti ti-notes-off"></i>
          KhÃ´ng tÃ¬m tháº¥y quiz phÃ¹ há»£p.
        </div>
      `;
      return;
    }

    quizGrid.innerHTML = quizzes.map(quiz => {
      const isCompleted = Boolean(quiz.isCompleted);
      const statusText = isCompleted ? 'ÄÃ£ hoÃ n thÃ nh' : 'Cáº§n lÃ m';
      const statusIcon = isCompleted ? 'ti-circle-check' : 'ti-alert-circle';
      const duration = quiz.durationMinutes ? `${quiz.durationMinutes} phÃºt` : 'ChÆ°a Ä‘áº·t thá»i lÆ°á»£ng';
      const action = isCompleted
        ? `<span class="btn-quiz disabled"><i class="ti ti-lock-check"></i> ÄÃ£ ná»™p bÃ i</span>`
        : `<a class="btn-quiz" href="/student/take-quiz?quizId=${encodeURIComponent(quiz.id)}"><i class="ti ti-player-play"></i> LÃ m quiz</a>`;

      return `
        <article class="quiz-card ${isCompleted ? 'completed' : ''}">
          <div class="quiz-top">
            <div class="quiz-icon"><i class="ti ti-brain"></i></div>
            <span class="status-pill ${isCompleted ? '' : 'pending'}"><i class="ti ${statusIcon}"></i>${statusText}</span>
          </div>
          <h2>${escapeHtml(quiz.title || 'Quiz chÆ°a Ä‘áº·t tÃªn')}</h2>
          <div class="quiz-meta">
            <span><i class="ti ti-books"></i>${escapeHtml(quiz.learningSpaceName)}</span>
            <span><i class="ti ti-template"></i>${escapeHtml(quiz.courseName)}</span>
            <span><i class="ti ti-clock"></i>${escapeHtml(duration)}</span>
          </div>
          <div class="quiz-action">${action}</div>
        </article>
      `;
    }).join('');
  }

  async function loadMyQuizzes() {
    if (!token || !userId) {
      window.location.href = '/login';
      return;
    }

    try {
      const response = await fetch(`/api/students/${userId}/dashboard`, { headers: authHeaders() });
      if (!response.ok) throw new Error('KhÃ´ng táº£i Ä‘Æ°á»£c danh sÃ¡ch quiz.');
      const data = await response.json();
      setStudentName(data.user);
      state.quizzes = flattenQuizzes(data);
      updateStats((data.learningSpaces || []).length);
      renderQuizzes();
    } catch (error) {
      quizGrid.innerHTML = `
        <div class="empty-card" style="grid-column: 1 / -1;">
          <i class="ti ti-alert-circle"></i>
          ${escapeHtml(error.message)}
        </div>
      `;
    }
  }

  function logout() {
    localStorage.removeItem('jwt_token');
    localStorage.removeItem('user_id');
    window.location.href = '/';
  }

  searchInput.addEventListener('input', () => {
    state.search = searchInput.value;
    renderQuizzes();
  });

  statusFilter.addEventListener('change', () => {
    state.status = statusFilter.value;
    renderQuizzes();
  });

  document.addEventListener('DOMContentLoaded', () => {
    setupLayoutControls();
    loadMyQuizzes();
  });
</script>
</body>
</html>
