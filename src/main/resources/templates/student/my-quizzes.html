<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{student/layout}">

<head>
  <title>My Quizzes - FlippedClass</title>
  <th:block layout:fragment="head">
    <link rel="stylesheet" th:href="@{/assets/css/student-my-quizzes.css}">
  </th:block>
</head>

<body>

<span layout:fragment="topbar-title">Student Portal <span class="badge bg-primary-subtle text-primary rounded-pill">Learning</span></span>

<!-- MAIN CONTENT -->
<main id="content" class="content py-10" layout:fragment="content">
  <div class="container-fluid px-xl-5">
    <div class="d-flex align-items-center mb-4 mt-3">
      <div class="bg-primary text-white rounded p-2 me-3 d-flex align-items-center justify-content-center shadow-sm">
        <i class="ti ti-list-check fs-2"></i>
      </div>
      <h2 class="h3 fw-900 text-dark mb-0" style="letter-spacing: -0.5px;">My Quizzes</h2>
    </div>

    <section class="stats-grid">
      <div class="stat-card">
        <span>Total Quizzes</span>
        <strong id="statTotal">0</strong>
      </div>
      <div class="stat-card">
        <span>Pending</span>
        <strong id="statPending">0</strong>
      </div>
      <div class="stat-card">
        <span>Completed</span>
        <strong id="statCompleted">0</strong>
      </div>
      <div class="stat-card">
        <span>Learning Space</span>
        <strong id="statSpaces">0</strong>
      </div>
    </section>

    <section class="filter-card">
      <input id="searchInput" class="search-box" type="search" placeholder="Search quizzes by name, subject, or learning space...">
      <select id="statusFilter" class="filter-select">
        <option value="all">All statuses</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
    </section>

    <section id="quizGrid" class="quiz-grid">
      <div class="empty-card">
        <i class="ti ti-loader-2"></i>
        Loading quiz list...
      </div>
    </section>
  </div>
</main>

<th:block layout:fragment="scripts">
<script>
  const token = localStorage.getItem('jwt_token');
  const userId = localStorage.getItem('user_id');
  const state = {
    quizzes: [],
    search: '',
    status: 'all',
    currentPage: 1,
    itemsPerPage: 6
  };

  const quizGrid = document.getElementById('quizGrid');
  const searchInput = document.getElementById('searchInput');
  const statusFilter = document.getElementById('statusFilter');
  const questionLogoUrl = '/uploads/anh/quétionlogo.webp';

  function authHeaders() {
    return { Authorization: `Bearer ${token}` };
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function setStudentName(user) {
    const name = user?.fullName || user?.username || localStorage.getItem('username') || 'Student';
    const studentName = document.getElementById('studentName');
    if (studentName) studentName.textContent = name;
    window.setStudentMenuUser?.(user);
  }

  function flattenQuizzes(data) {
    const spaces = data.learningSpaces || [];
    return spaces.flatMap(space => (space.quizzes || []).map(quiz => ({
      ...quiz,
      learningSpaceName: space.name || quiz.learningSpaceName || 'Learning space',
      courseName: quiz.courseName || space.courseName || space.name || 'Chung'
    })));
  }

  function updateStats(spacesCount) {
    const completed = state.quizzes.filter(quiz => quiz.isCompleted).length;
    const total = state.quizzes.length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPending').textContent = total - completed;
    document.getElementById('statCompleted').textContent = completed;
    document.getElementById('statSpaces').textContent = spacesCount;
  }

  function filteredQuizzes() {
    const keyword = state.search.trim().toLowerCase();
    return state.quizzes.filter(quiz => {
      const matchesStatus =
        state.status === 'all' ||
        (state.status === 'pending' && !quiz.isCompleted) ||
        (state.status === 'completed' && quiz.isCompleted);

      const haystack = [
        quiz.title,
        quiz.courseName,
        quiz.learningSpaceName
      ].join(' ').toLowerCase();

      return matchesStatus && (!keyword || haystack.includes(keyword));
    });
  }

  function renderQuizzes() {
    const quizzes = filteredQuizzes();
    
    if (!quizzes.length) {
      quizGrid.innerHTML = `
        <div class="empty-card" style="grid-column: 1 / -1;">
          <i class="ti ti-notes-off"></i>
          No matching quizzes found.
        </div>
      `;
      renderPaginationControls(0, 0);
      return;
    }

    const totalItems = quizzes.length;
    const totalPages = Math.ceil(totalItems / state.itemsPerPage) || 1;
    if (state.currentPage > totalPages) state.currentPage = totalPages;
    if (state.currentPage < 1) state.currentPage = 1;
    
    const startIndex = (state.currentPage - 1) * state.itemsPerPage;
    const endIndex = startIndex + state.itemsPerPage;
    const paginated = quizzes.slice(startIndex, endIndex);

    quizGrid.innerHTML = paginated.map(quiz => {
      const isCompleted = Boolean(quiz.isCompleted);
      const statusText = isCompleted ? 'Completed' : 'To Do';
      const statusIcon = isCompleted ? 'ti-circle-check' : 'ti-alert-circle';
      const duration = quiz.durationMinutes ? `${quiz.durationMinutes} min` : 'Duration not set';
      const action = isCompleted
        ? `<span class="btn-quiz disabled"><i class="ti ti-lock-check"></i> Submitted</span>`
        : `<a class="btn-quiz" href="/student/take-quiz?quizId=${encodeURIComponent(quiz.id)}"><i class="ti ti-player-play"></i> Take Quiz</a>`;

      return `
        <article class="quiz-card ${isCompleted ? 'completed' : ''}">
          <div class="quiz-top">
            <div class="quiz-icon quiz-icon-image"><img src="${questionLogoUrl}" alt="Question logo" loading="lazy"></div>
            <span class="status-pill ${isCompleted ? '' : 'pending'}"><i class="ti ${statusIcon}"></i>${statusText}</span>
          </div>
          <h2>${escapeHtml(quiz.title || 'Untitled Quiz')}</h2>
          <div class="quiz-meta">
            <span><i class="ti ti-books"></i>${escapeHtml(quiz.learningSpaceName)}</span>
            ${quiz.courseName && quiz.courseName !== quiz.learningSpaceName ? `<span><i class="ti ti-template"></i>${escapeHtml(quiz.courseName)}</span>` : ''}
            <span><i class="ti ti-clock"></i>${escapeHtml(duration)}</span>
          </div>
          <div class="quiz-action">${action}</div>
        </article>
      `;
    }).join('');
    
    renderPaginationControls(totalItems, totalPages);
  }

  function goToPage(page) {
    state.currentPage = page;
    renderQuizzes();
    document.getElementById('quizGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  window.goToPage = goToPage;

  function renderPaginationControls(totalItems, totalPages) {
    let wrap = document.getElementById('paginationWrap');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.id = 'paginationWrap';
      wrap.className = 'd-flex justify-content-center mt-4 mb-5 w-100';
      wrap.style.gridColumn = '1 / -1';
      document.getElementById('quizGrid').after(wrap);
    }
    
    if (totalPages <= 1) {
      wrap.innerHTML = '';
      return;
    }
    
    let html = `<nav aria-label="Page navigation"><ul class="pagination pagination-lg m-0">`;
    html += `<li class="page-item ${state.currentPage === 1 ? 'disabled' : ''}"><a class="page-link fw-bold" href="javascript:void(0)" onclick="goToPage(${state.currentPage - 1})">Previous</a></li>`;
    for (let i = 1; i <= totalPages; i++) {
      html += `<li class="page-item ${state.currentPage === i ? 'active' : ''}"><a class="page-link fw-bold" href="javascript:void(0)" onclick="goToPage(${i})">${i}</a></li>`;
    }
    html += `<li class="page-item ${state.currentPage === totalPages ? 'disabled' : ''}"><a class="page-link fw-bold" href="javascript:void(0)" onclick="goToPage(${state.currentPage + 1})">Next</a></li>`;
    html += `</ul></nav>`;
    
    wrap.innerHTML = html;
  }

  async function loadMyQuizzes() {
    if (!token || !userId) {
      window.location.href = '/login';
      return;
    }

    try {
      const response = await fetch(`/api/students/${userId}/dashboard`, { headers: authHeaders() });
      if (!response.ok) {
        if (response.status === 401 || response.status === 403) {
          if (typeof window.logout === 'function') window.logout();
          else window.location.href = '/login';
          return;
        }
        throw new Error('Could not load quiz list.');
      }
      const data = await response.json();
      window.currentDashboardData = data;
      setStudentName(data.user);
      state.quizzes = flattenQuizzes(data);
      updateStats((data.learningSpaces || []).length);
      renderQuizzes();
    } catch (error) {
      quizGrid.innerHTML = `
        <div class="empty-card" style="grid-column: 1 / -1;">
          <i class="ti ti-alert-circle"></i>
          ${escapeHtml(error.message)}
        </div>
      `;
    }
  }

  searchInput.addEventListener('input', () => {
    state.search = searchInput.value;
    state.currentPage = 1;
    renderQuizzes();
  });

  statusFilter.addEventListener('change', () => {
    state.status = statusFilter.value;
    state.currentPage = 1;
    renderQuizzes();
  });

  document.addEventListener('DOMContentLoaded', () => {
    loadMyQuizzes();
  });

</script>
</th:block>
</body>
</html>
