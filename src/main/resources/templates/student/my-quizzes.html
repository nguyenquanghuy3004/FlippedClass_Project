<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My quiz - FlippedClass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <script th:src="@{/assets/js/student-auth.js}"></script>
  <link rel="stylesheet" th:href="@{/assets/css/student-my-quizzes.css}">
</head>
<body>
<div id="overlay" class="overlay"></div>

<nav id="topbar" class="topbar">
  <button id="toggleBtn" class="icon-button" type="button" aria-label="Thu gọn menu">
    <i class="ti ti-layout-sidebar-left-expand"></i>
  </button>

  <div class="topbar-spacer"></div>
  <div class="student-chip">
    <img th:src="@{/assets/images/avatar-1.jpg}" alt="Ảnh đại diện sinh viên">
    <span id="studentName">Sinh viên</span>
  </div>
</nav>

<aside id="sidebar" class="sidebar">
  <div class="logo-area">
    <a th:href="@{/}" class="logo-link">
      <span class="logo-mark"><i class="ti ti-book-2 fs-3"></i></span>
      <span>Flipped<span>Class</span></span>
    </a>
  </div>
  <ul class="nav">
    <li><a class="nav-link" th:href="@{/student/dashboard}" data-nav-key="dashboard"><i class="ti ti-layout-dashboard fs-5"></i><span class="nav-text">Tổng quan</span></a></li>
    <li><a class="nav-link" th:href="@{/student/learning-spaces}" data-nav-key="learning-spaces"><i class="ti ti-books fs-5"></i><span class="nav-text">Lớp của tôi</span></a></li>
    <li><a class="nav-link active" th:href="@{/student/my-quizzes}" data-nav-key="my-quiz" aria-current="page"><i class="ti ti-list-check fs-5"></i><span class="nav-text">My quiz</span></a></li>
    <li><a class="nav-link" th:href="@{/}" data-nav-key="reports"><i class="ti ti-chart-pie fs-5"></i><span class="nav-text">Báo cáo</span></a></li>
    <li class="logout-link"><a class="nav-link logout-link" href="javascript:void(0)" onclick="logout()"><i class="ti ti-logout fs-5"></i><span class="nav-text">Đăng xuất</span></a></li>
  </ul>
</aside>

<main id="content" class="content">
  <div class="page-shell">
    <section class="hero">
      <div>
        <div class="eyebrow"><i class="ti ti-list-check"></i> My quiz</div>
      </div>
      <div class="hero-actions">
        <a class="hero-link" th:href="@{/student/dashboard}"><i class="ti ti-layout-dashboard"></i> Về tổng quan</a>
        <a class="hero-link" th:href="@{/student/learning-spaces}"><i class="ti ti-books"></i> Lớp của tôi</a>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <span>Tổng quiz</span>
        <strong id="statTotal">0</strong>
      </div>
      <div class="stat-card">
        <span>Cần làm</span>
        <strong id="statPending">0</strong>
      </div>
      <div class="stat-card">
        <span>Đã hoàn thành</span>
        <strong id="statCompleted">0</strong>
      </div>
      <div class="stat-card">
        <span>Learning space</span>
        <strong id="statSpaces">0</strong>
      </div>
    </section>

    <section class="filter-card">
      <input id="searchInput" class="search-box" type="search" placeholder="Tìm quiz theo tên, môn học hoặc learning space...">
      <select id="statusFilter" class="filter-select">
        <option value="all">Tất cả trạng thái</option>
        <option value="pending">Cần làm</option>
        <option value="completed">Đã hoàn thành</option>
      </select>
    </section>

    <section id="quizGrid" class="quiz-grid">
      <div class="empty-card">
        <i class="ti ti-loader-2"></i>
        Đang tải danh sách quiz...
      </div>
    </section>
  </div>
</main>

<script th:src="@{/assets/js/student-my-quizzes.js}"></script>
</body>
</html>
