<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>My Quizzes - FlippedClass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>

  <script>
    if (!localStorage.getItem('jwt_token')) {
      window.location.href = '/login';
    }
  </script>


  <script>
    /* --- Inlined from student-user-menu.js --- */
    (function () {
      const defaultAvatarUrl = '/assets/images/avatar-1.jpg';

      function storedUser() {
        return {
          fullName: localStorage.getItem('full_name') || localStorage.getItem('fullName') || '',
          username: localStorage.getItem('username') || '',
          avatarUrl: localStorage.getItem('avatar_url') || localStorage.getItem('avatarUrl') || ''
        };
      }

      function normalizeUser(user = {}) {
        const stored = storedUser();
        return {
          name: user.fullName || user.name || user.username || stored.fullName || stored.username || 'Student',
          username: user.username || stored.username || '',
          avatarUrl: user.avatarUrl || user.avatar_url || stored.avatarUrl || defaultAvatarUrl
        };
      }

      function setStudentMenuUser(user = {}) {
        const normalized = normalizeUser(user);

        if (normalized.name && normalized.name !== 'Student') {
          localStorage.setItem('full_name', normalized.name);
        }
        if (normalized.username) {
          localStorage.setItem('username', normalized.username);
        }
        if (normalized.avatarUrl && normalized.avatarUrl !== defaultAvatarUrl) {
          localStorage.setItem('avatar_url', normalized.avatarUrl);
        }

        document.querySelectorAll('[data-user-name]').forEach((element) => {
          element.textContent = normalized.name;
        });
        document.querySelectorAll('[data-user-avatar]').forEach((image) => {
          image.src = normalized.avatarUrl;
          image.onerror = () => {
            image.onerror = null;
            image.src = defaultAvatarUrl;
          };
        });

        const topbarName = document.getElementById('studentName');
        if (topbarName) topbarName.textContent = normalized.name;
      }

      function studentLogout() {
        ['jwt_token', 'user_id', 'full_name', 'fullName', 'username', 'avatar_url', 'avatarUrl'].forEach((key) => {
          localStorage.removeItem(key);
        });
        window.location.href = '/';
      }

      async function refreshStudentMenuUser() {
        const token = localStorage.getItem('jwt_token');
        const userId = localStorage.getItem('user_id');
        if (!token || !userId) return;

        try {
          const response = await fetch(`/api/users/${encodeURIComponent(userId)}`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (!response.ok) return;
          const user = await response.json();
          setStudentMenuUser(user);
        } catch (error) {
          console.warn('Could not load user menu profile.', error);
        }
      }

      function closeAllMenus(exceptMenu = null) {
        document.querySelectorAll('[data-user-menu].is-open').forEach((menu) => {
          if (menu !== exceptMenu) {
            menu.classList.remove('is-open');
            menu.querySelector('[data-user-menu-toggle]')?.setAttribute('aria-expanded', 'false');
          }
        });
      }

      function initStudentUserMenus() {
        setStudentMenuUser();
        refreshStudentMenuUser();

        document.querySelectorAll('[data-user-menu]').forEach((menu) => {
          const toggle = menu.querySelector('[data-user-menu-toggle]');
          const logoutButton = menu.querySelector('[data-user-logout]');

          toggle?.addEventListener('click', (event) => {
            event.stopPropagation();
            const shouldOpen = !menu.classList.contains('is-open');
            closeAllMenus(menu);
            menu.classList.toggle('is-open', shouldOpen);
            toggle.setAttribute('aria-expanded', String(shouldOpen));
          });

          logoutButton?.addEventListener('click', studentLogout);
        });

        document.addEventListener('click', () => closeAllMenus());
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeAllMenus();
        });
      }

      window.setStudentMenuUser = setStudentMenuUser;
      window.studentLogout = studentLogout;
      if (!window.logout) window.logout = studentLogout;

      document.addEventListener('DOMContentLoaded', initStudentUserMenus);
    })();

  </script>
  <link rel="stylesheet" th:href="@{/assets/css/student-my-quizzes.css}">
  <link rel="stylesheet" th:href="@{/assets/css/student-user-menu.css}">
  <link rel="stylesheet" th:href="@{/assets/css/student-typography.css}">
</head>

<body>
  <div id="overlay" class="overlay"></div>

  <nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3 shadow-sm">
    <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>
    <button id="mobileBtn" class="btn btn-light btn-icon btn-sm d-lg-none me-2">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>

    <div class="topbar-main">
      <div class="topbar-title-wrap d-none d-md-block">
        <h5 class="topbar-title fw-bold text-dark ms-1">Student Portal <span
            class="badge bg-primary-subtle text-primary rounded-pill">Learning</span></h5>
      </div>
      <ul class="topbar-actions list-unstyled">
        <!-- Notification Bell -->
        <li class="dropdown">
          <button
                  class="notification-trigger position-relative text-secondary d-flex align-items-center justify-content-center border-0"
                  type="button" id="notificationDropdown" data-bs-toggle="dropdown" aria-expanded="false"
                  aria-label="Pending quiz notifications">
            <i class="ti ti-bell-ringing fs-5 text-dark"></i>
            <span id="notificationBadge"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm d-none">0</span>
          </button>
          <div class="dropdown-menu dropdown-menu-end notification-menu p-0 border-0"
               aria-labelledby="notificationDropdown">
            <div class="p-3 border-bottom bg-white">
              <div class="d-flex align-items-center justify-content-between">
                <div>
                  <h6 class="fw-900 text-dark mb-1">Notifications</h6>
                  <p class="small text-muted fw-semibold mb-0" id="notificationSummary">Loading notifications...</p>
                </div>
                <i class="ti ti-bell text-primary fs-4"></i>
              </div>
            </div>
            <div id="notificationList" class="notification-list">
              <div class="text-center text-muted py-4 px-3">
                <div class="spinner-border text-primary mb-2" role="status"></div>
                <p class="small fw-semibold mb-0">Loading pending quizzes...</p>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar bg-white border-end-0 shadow-sm">
    <div class="logo-area border-bottom border-light">
      <a th:href="@{/}" class="d-inline-flex align-items-center text-decoration-none">
        <div class="bg-primary text-white rounded p-1 d-flex align-items-center justify-content-center me-2">
          <i class="ti ti-book-2 fs-3"></i>
        </div>
        <span class="logo-text fw-bolder fs-4 text-dark" style="letter-spacing: -0.5px;">Flipped<span
            class="text-primary">Class</span></span>
      </a>
    </div>
    <ul class="nav flex-column mt-4">
      <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="@{/student/dashboard}"
          data-nav-key="dashboard"><i class="ti ti-layout-dashboard fs-5"></i><span
            class="nav-text">Dashboard</span></a></li>
      <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold"
          th:href="@{/student/learning-spaces}" data-nav-key="learning-spaces"><i class="ti ti-books fs-5"></i><span
            class="nav-text">My Classes</span></a></li>
      <li><a class="nav-link active rounded-pill mx-3 mb-2 px-4 fw-bold" th:href="@{/student/my-quizzes}" data-nav-key="my-quiz"
          aria-current="page"><i class="ti ti-list-check fs-5"></i><span class="nav-text">My Quizzes</span></a></li>
      <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="@{/}"
          data-nav-key="reports"><i class="ti ti-chart-pie fs-5"></i><span class="nav-text">Reports</span></a></li>

      <li class="sidebar-user-slot">
        <div class="student-user-menu" data-user-menu>
          <button class="student-menu-trigger" type="button" data-user-menu-toggle aria-expanded="false"
            aria-label="Account menu">
            <img class="student-menu-avatar" data-user-avatar th:src="@{/assets/images/avatar-1.jpg}"
              alt="Student avatar">
            <span class="student-menu-info">
              <span class="student-menu-name" data-user-name>Student</span>
              <span class="student-menu-role">Student</span>
            </span>
            <i class="ti ti-chevron-up student-menu-chevron"></i>
          </button>
          <div class="student-menu-panel" role="menu">
            <a class="student-menu-item" th:href="@{/docs}" role="menuitem"><i
                class="ti ti-help-circle"></i><span>Help</span></a>
            <button class="student-menu-item student-menu-item-danger" type="button" data-user-logout role="menuitem"><i
                class="ti ti-logout"></i><span>Logout</span></button>
          </div>
        </div>
      </li>
    </ul>
  </aside>

  <main id="content" class="content py-10">
    <div class="container-fluid px-xl-5">
      <div class="d-flex align-items-center mb-4 mt-3">
        <div class="bg-primary text-white rounded p-2 me-3 d-flex align-items-center justify-content-center shadow-sm">
          <i class="ti ti-list-check fs-2"></i>
        </div>
        <h2 class="h3 fw-900 text-dark mb-0" style="letter-spacing: -0.5px;">My Quizzes</h2>
      </div>

      <section class="stats-grid">
        <div class="stat-card">
          <span>Total Quizzes</span>
          <strong id="statTotal">0</strong>
        </div>
        <div class="stat-card">
          <span>Pending</span>
          <strong id="statPending">0</strong>
        </div>
        <div class="stat-card">
          <span>Completed</span>
          <strong id="statCompleted">0</strong>
        </div>
        <div class="stat-card">
          <span>Learning Space</span>
          <strong id="statSpaces">0</strong>
        </div>
      </section>

      <section class="filter-card">
        <input id="searchInput" class="search-box" type="search"
          placeholder="Search quizzes by name, subject, or learning space...">
        <select id="statusFilter" class="filter-select">
          <option value="all">All statuses</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </section>

      <section id="quizGrid" class="quiz-grid">
        <div class="empty-card">
          <i class="ti ti-loader-2"></i>
          Loading quiz list...
        </div>
      </section>
    </div>
  </main>

  <script>
    /* --- Inlined from student-my-quizzes.js --- */
    const token = localStorage.getItem('jwt_token');
    const userId = localStorage.getItem('user_id');
    const state = {
      quizzes: [],
      search: '',
      status: 'all'
    };

    const quizGrid = document.getElementById('quizGrid');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const questionLogoUrl = '/uploads/anh/quétionlogo.webp';

    function authHeaders() {
      return { Authorization: `Bearer ${token}` };
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setupLayoutControls() {
      const toggleBtn = document.getElementById('toggleBtn');
      const mobileBtn = document.getElementById('mobileBtn');
      const overlay = document.getElementById('overlay');

      toggleBtn?.addEventListener('click', () => {
        if (window.innerWidth >= 992) {
          document.body.classList.toggle('sidebar-collapsed');
        } else {
          document.body.classList.toggle('sidebar-open');
        }
      });

      mobileBtn?.addEventListener('click', () => document.body.classList.add('sidebar-open'));
      overlay?.addEventListener('click', () => document.body.classList.remove('sidebar-open'));
    }

    function setStudentName(user) {
      const name = user?.fullName || user?.username || localStorage.getItem('username') || 'Student';
      const studentName = document.getElementById('studentName');
      if (studentName) studentName.textContent = name;
      window.setStudentMenuUser?.(user);
    }

    function flattenQuizzes(data) {
      const spaces = data.learningSpaces || [];
      return spaces.flatMap(space => (space.quizzes || []).map(quiz => ({
        ...quiz,
        learningSpaceName: space.name || quiz.learningSpaceName || 'Learning space',
        courseName: quiz.courseName || space.courseName || space.name || 'Chung'
      })));
    }

    function updateStats(spacesCount) {
      const completed = state.quizzes.filter(quiz => quiz.isCompleted).length;
      const total = state.quizzes.length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPending').textContent = total - completed;
      document.getElementById('statCompleted').textContent = completed;
      document.getElementById('statSpaces').textContent = spacesCount;
    }

    // Hàm lọc danh sách quiz dựa trên từ khóa tìm kiếm và trạng thái lọc (Tất cả / Chưa làm / Đã làm)
    function filteredQuizzes() {
      const keyword = state.search.trim().toLowerCase();
      return state.quizzes.filter(quiz => {
        // Kiểm tra trạng thái làm bài
        const matchesStatus =
          state.status === 'all' ||
          (state.status === 'pending' && !quiz.isCompleted) ||
          (state.status === 'completed' && quiz.isCompleted);

        // Tìm kiếm từ khóa trong tên quiz, tên khóa học, tên không gian học tập
        const haystack = [
          quiz.title,
          quiz.courseName,
          quiz.learningSpaceName
        ].join(' ').toLowerCase();

        return matchesStatus && (!keyword || haystack.includes(keyword));
      });
    }

    // Hàm hiển thị danh sách quiz lên màn hình
    function renderQuizzes() {
      const quizzes = filteredQuizzes();
      if (!quizzes.length) {
        quizGrid.innerHTML = `
        <div class="empty-card" style="grid-column: 1 / -1;">
          <i class="ti ti-notes-off"></i>
          No matching quizzes found.
        </div>
      `;
        return;
      }

      quizGrid.innerHTML = quizzes.map(quiz => {
        const isCompleted = Boolean(quiz.isCompleted);
        const statusText = isCompleted ? 'Completed' : 'To Do';
        const statusIcon = isCompleted ? 'ti-circle-check' : 'ti-alert-circle';
        const duration = quiz.durationMinutes ? `${quiz.durationMinutes} min` : 'Duration not set';
        const action = isCompleted
          ? `<span class="btn-quiz disabled"><i class="ti ti-lock-check"></i> Submitted</span>`
          : `<a class="btn-quiz" href="/student/take-quiz?quizId=${encodeURIComponent(quiz.id)}"><i class="ti ti-player-play"></i> Take Quiz</a>`;

        return `
        <article class="quiz-card ${isCompleted ? 'completed' : ''}">
          <div class="quiz-top">
            <div class="quiz-icon quiz-icon-image"><img src="${questionLogoUrl}" alt="Question logo" loading="lazy"></div>
            <span class="status-pill ${isCompleted ? '' : 'pending'}"><i class="ti ${statusIcon}"></i>${statusText}</span>
          </div>
          <h2>${escapeHtml(quiz.title || 'Untitled Quiz')}</h2>
          <div class="quiz-meta">
            <span><i class="ti ti-books"></i>${escapeHtml(quiz.learningSpaceName)}</span>
            ${quiz.courseName && quiz.courseName !== quiz.learningSpaceName ? `<span><i class="ti ti-template"></i>${escapeHtml(quiz.courseName)}</span>` : ''}
            <span><i class="ti ti-clock"></i>${escapeHtml(duration)}</span>
          </div>
          <div class="quiz-action">${action}</div>
        </article>
      `;
      }).join('');
    }

    // Hàm chính: Gọi API lấy dữ liệu và hiển thị danh sách bài tập/quiz
    async function loadMyQuizzes() {
      // Kiểm tra đã đăng nhập chưa
      if (!token || !userId) {
        window.location.href = '/login';
        return;
      }

      try {
        // Gọi API dashboard để lấy toàn bộ dữ liệu, sau đó trích xuất các quiz
        const response = await fetch(`/api/students/${userId}/dashboard`, { headers: authHeaders() });
        if (!response.ok) throw new Error('Could not load quiz list.');
        const data = await response.json();

        setStudentName(data.user);
        state.quizzes = flattenQuizzes(data); // Gom tất cả quiz từ các lớp học lại thành 1 mảng
        updateStats((data.learningSpaces || []).length); // Cập nhật các con số thống kê ở trên cùng
        renderQuizzes(); // Hiển thị danh sách
      } catch (error) {
        quizGrid.innerHTML = `
        <div class="empty-card" style="grid-column: 1 / -1;">
          <i class="ti ti-alert-circle"></i>
          ${escapeHtml(error.message)}
        </div>
      `;
      }
    }

    function logout() {
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('user_id');
      window.location.href = '/';
    }

    function setActiveSidebarLink(activeKey) {
      document.querySelectorAll('.sidebar .nav-link[data-nav-key]').forEach(link => {
        const isActive = link.dataset.navKey === activeKey;
        link.classList.toggle('active', isActive);
        link.classList.toggle('fw-bold', isActive);
        link.classList.toggle('fw-semibold', !isActive);

        if (isActive) {
          link.setAttribute('aria-current', 'page');
        } else {
          link.removeAttribute('aria-current');
        }
      });
    }

    function initSidebarActiveState() {
      const path = window.location.pathname.replace(/\/+$/, '') || '/';
      let activeKey = null;

      if (path === '/student/dashboard' && window.location.hash === '#myQuizSection') {
        activeKey = 'my-quiz';
      } else if (path === '/student/dashboard') {
        activeKey = 'dashboard';
      } else if (path.startsWith('/student/learning-spaces')) {
        activeKey = 'learning-spaces';
      } else if (path.startsWith('/student/my-quizzes')) {
        activeKey = 'my-quiz';
      } else if (path.startsWith('/student/take-quiz')) {
        activeKey = 'my-quiz';
      } else if (path.startsWith('/student/reports')) {
        activeKey = 'reports';
      }

      if (activeKey) {
        setActiveSidebarLink(activeKey);
      }

      document.querySelectorAll('.sidebar .nav-link[data-nav-key]').forEach(link => {
        link.addEventListener('click', () => setActiveSidebarLink(link.dataset.navKey));
      });
    }

    searchInput.addEventListener('input', () => {
      state.search = searchInput.value;
      renderQuizzes();
    });

    statusFilter.addEventListener('change', () => {
      state.status = statusFilter.value;
      renderQuizzes();
    });

    document.addEventListener('DOMContentLoaded', () => {
      initSidebarActiveState();
      setupLayoutControls();
      loadMyQuizzes();
    });

  </script>
</body>

</html>
