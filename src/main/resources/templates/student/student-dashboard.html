<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{student/layout}">

<head>
  <title>Student Dashboard - FlippedClass</title>
  <th:block layout:fragment="head">
    <link rel="stylesheet" th:href="@{/assets/css/student-dashboard.css}">
  </th:block>
</head>

<body>

<span layout:fragment="topbar-title">Student Portal <span class="badge bg-primary-subtle text-primary rounded-pill">Learning</span></span>

<!-- MAIN CONTENT -->
<main id="content" class="content py-4" layout:fragment="content">
  <div class="container-fluid px-xl-4">
    <div class="row g-4">
      <!-- MY LEARNING SPACES (APPLE STYLE CARDS) -->
      <div class="col-xl-9">
        <div id="myQuizSection" class="d-flex justify-content-between align-items-end mb-3">
          <div>
            <h2 class="fc-section-title text-dark mb-0">My Learning Spaces</h2>
          </div>
          <a th:href="@{/student/learning-spaces(focus='join')}" class="join-space-plus" aria-label="Join class with invite code">
            <i class="ti ti-plus"></i>
          </a>
        </div>

        <ul class="nav nav-pills mb-3 mt-2" id="spaceTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active rounded-pill px-4 fw-bold shadow-sm" id="tab-student" data-bs-toggle="pill" type="button" role="tab" onclick="switchSpaceTab('student')">
              <i class="ti ti-school me-1"></i> As Student
            </button>
          </li>
          <li class="nav-item ms-2" role="presentation">
            <button class="nav-link rounded-pill px-4 fw-bold shadow-sm" id="tab-supporter" data-bs-toggle="pill" type="button" role="tab" onclick="switchSpaceTab('supporter')">
              <i class="ti ti-star me-1"></i> As Supporter
            </button>
          </li>
        </ul>

        <div class="row g-3" id="learningSpaceList">
          <div class="col-12">
            <div class="bento-card text-center text-muted py-4">
              <div class="spinner-border text-primary mb-3" role="status"></div>
              <p class="fc-body mb-0">Loading learning spaces...</p>
            </div>
          </div>
        </div>

        <!-- PUBLIC SPACES SECTION -->
        <hr class="my-4 opacity-10 border-secondary">

        <div class="d-flex justify-content-between align-items-end mb-3">
          <div>
            <h2 class="fc-section-title text-dark mb-0">Explore Public Classes</h2>
          </div>
        </div>

        <div class="row g-3" id="publicSpaceList">
          <div class="col-12">
            <div class="bento-card text-center text-muted py-4">
              <div class="spinner-border text-primary mb-3" role="status"></div>
              <p class="fc-body mb-0">Loading public classes...</p>
            </div>
          </div>
        </div>

        <!-- COURSE QUIZZES SECTION -->
        <hr class="my-4 opacity-10 border-secondary">

        <div class="d-flex justify-content-between align-items-end mb-3">
          <div>
            <h2 class="fc-section-title text-dark mb-0">Course Quizzes</h2>
          </div>
        </div>

        <div class="accordion accordion-flush quiz-accordion bento-card p-0" id="quizAccordion">
          <div class="text-center text-muted py-4" id="quiz-loading">
            <div class="spinner-border text-primary mb-2" role="status"></div>
            <p class="fc-body mb-0">Loading courses and quizzes...</p>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: RECENT DOCS -->
      <div class="col-xl-3">
        <h2 class="fc-section-title text-dark mb-3">New Documents</h2>
        <div class="bento-card p-3" id="recentDocuments">
          <div class="text-center text-muted py-4">
            <i class="ti ti-folder-off text-primary" style="font-size: 2.4rem;"></i>
            <h5 class="fc-card-title text-dark mt-3 mb-2">Loading documents</h5>
            <p class="fc-meta mb-0">Documents from your learning spaces will appear here.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<th:block layout:fragment="scripts">
<script>
  const token = localStorage.getItem('jwt_token');
  const userId = localStorage.getItem('user_id');
  const defaultAvatarUrl = '/assets/images/avatar-1.jpg';
  const documentLogoSources = {
    DOC: '/uploads/anh/1200x630wa.jpg',
    VIDEO: '/uploads/anh/R.jpg',
    YOUTUBE: '/uploads/anh/OIP.jpg',
    PDF: '/uploads/anh/pdf-file-download-symbols-format-for-texts-vector.jpg',
    GOOGLE_DRIVE: '/uploads/anh/Google-Drive-Logo-2020-present.jpg'
  };

  const iconThemes = [
    { icon: 'ti-template', color: 'primary' },
    { icon: 'ti-flame', color: 'orange' },
    { icon: 'ti-database', color: 'info' },
    { icon: 'ti-brand-aws', color: 'warning' }
  ];

  function escapeHtml(value) {
    return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
  }

  function setText(selector, value) {
    const el = document.querySelector(selector);
    if (el) el.textContent = value;
  }

  function authHeaders(json = false) {
    const headers = { Authorization: `Bearer ${token}` };
    if (json) headers['Content-Type'] = 'application/json';
    return headers;
  }

  async function readApiError(response) {
    const text = await response.text();
    if (!text) return `Request failed: ${response.status}`;
    try {
      const body = JSON.parse(text);
      return body.message || body.error || text;
    } catch (err) {
      return text;
    }
  }

  function statusLabel(status) {
    const labels = {
      ACTIVE: 'Active',
      DRAFT: 'Draft',
      LOCKED: 'Locked',
      UNLOCKED: 'Unlocked',
      ARCHIVED: 'Archived',
      DELETED: 'Deleted'
    };
    return labels[status] || status || 'Unknown';
  }

  function roleLabel(role) {
    const labels = {
      MEMBER: 'Student',
      OWNER: 'Owner',
      SUPPORTER: 'Teaching Assistant'
    };
    return labels[role] || role || 'Member';
  }

  function studyYear(enrollmentYear) {
    const year = Number(enrollmentYear);
    if (!year) return '';
    return Math.max(1, new Date().getFullYear() - year + 1);
  }

  function flattenQuizzes(learningSpaces) {
    return getJoinedSpaces(learningSpaces).flatMap((space) =>
            (space.quizzes || []).map((quiz) => ({ ...quiz, space }))
    );
  }

  window.currentSpaceTab = 'student';

  window.switchSpaceTab = function(tab) {
    window.currentSpaceTab = tab;
    currentLearningSpacePage = 1;
    if (window.currentDashboardData && window.currentDashboardData.learningSpaces) {
      renderLearningSpaces(window.currentDashboardData.learningSpaces);
    }
  };

  function getJoinedSpaces(learningSpaces) {
    return (learningSpaces || []).filter((space) => {
      let isJoined = typeof space.joined === 'boolean' ? space.joined : true;
      if (!isJoined) return false;
      
      let spaceRole = space.memberRole || 'MEMBER';
      if (window.currentSpaceTab === 'student') {
        // Sinh viên dù được thăng cấp làm SUPPORTER ở lớp chính thì vẫn là người đi học ở lớp đó
        return spaceRole === 'MEMBER' || spaceRole === 'SUPPORTER';
      } else {
        // Tab "As Supporter" (hoặc Mentoring) chỉ hiện những nhóm do TỰ TAY họ tạo ra (OWNER)
        return spaceRole === 'OWNER';
      }
    });
  }

  function getJoinedSpaceIds(learningSpaces) {
    return getJoinedSpaces(learningSpaces).map((space) => space.id);
  }

  function renderProfile(data) {
    const user = data.user || {};
    const profile = data.studentProfile || {};
    const displayName = user.fullName || user.username || 'Student';
    const major = profile.major || 'Major not updated';
    const yearText = profile.enrollmentYear ? `Year ${studyYear(profile.enrollmentYear)}` : 'Academic year not updated';

    setText('#profileName', displayName);
    setText('[data-greeting-name]', displayName);
    setText('#profileSummary', `${major} - ${yearText}`);
    setText('#profileStudentCode', profile.studentCode || '--');
    setText('#profileClassName', profile.className || '--');

    const avatar = document.querySelector('.massive-avatar');
    if (avatar) avatar.src = user.avatarUrl || defaultAvatarUrl;
    window.setStudentMenuUser?.(user);
  }

  function renderStats(learningSpaces, quizzes) {
    const joinedSpaces = getJoinedSpaces(learningSpaces);
    const completedCount = quizzes.filter((quiz) => quiz.isCompleted).length;
    const pendingCount = quizzes.length - completedCount;

    setText('#learningSpaceCount', joinedSpaces.length);
    setText('#completedQuizCount', completedCount);
    setText('#pendingQuizCount', pendingCount);
    setText('#dashboardSummary', `You are enrolled in ${joinedSpaces.length} classes and have completed ${completedCount}/${quizzes.length} quizzes.`);
  }

  function emptyState(icon, title, message) {
    return `
        <div class="bento-card text-center text-muted py-4">
          <i class="ti ${icon} text-primary" style="font-size: 2.6rem;"></i>
          <h5 class="fc-card-title text-dark mt-3 mb-2">${escapeHtml(title)}</h5>
          <p class="fc-body mb-0">${escapeHtml(message)}</p>
        </div>`;
  }

  let currentLearningSpacePage = 1;
  const SPACES_PER_PAGE = 4;

  function renderLearningSpaces(learningSpaces) {
    const list = document.getElementById('learningSpaceList');
    if (!list) return;

    const joinedSpaces = getJoinedSpaces(learningSpaces);
    if (!joinedSpaces.length) {
      list.innerHTML = `<div class="col-12">${emptyState('ti-school-off', 'No Classes Yet', 'Enter a class code on My Classes to join a learning space.')}</div>`;
      renderLearningSpacePagination(0);
      return;
    }

    const totalPages = Math.ceil(joinedSpaces.length / SPACES_PER_PAGE);
    if (currentLearningSpacePage > totalPages) currentLearningSpacePage = totalPages;
    if (currentLearningSpacePage < 1) currentLearningSpacePage = 1;

    const startIndex = (currentLearningSpacePage - 1) * SPACES_PER_PAGE;
    const paginatedSpaces = joinedSpaces.slice(startIndex, startIndex + SPACES_PER_PAGE);

    const banners = ['banner-green', 'banner-blue', 'banner-darkblue', 'banner-red', 'banner-gray'];
    const avatars = ['avatar-blue', 'avatar-orange', 'avatar-green', 'avatar-red'];

    list.innerHTML = paginatedSpaces.map((space, index) => {
      const globalIndex = startIndex + index;
      const bannerClass = banners[globalIndex % banners.length];
      const avatarClass = avatars[globalIndex % avatars.length];
      const firstLetter = space.name ? space.name.charAt(0).toUpperCase() : 'S';
      
      const roadmapUrl = space.id
              ? `/student/learning-spaces?spaceId=${encodeURIComponent(space.id)}&focus=roadmap`
              : '/student/learning-spaces';

      return `
          <div class="col-md-6 mb-4">
            <div class="classroom-card h-100">
                <div class="card-banner ${bannerClass}">
                    <div class="banner-pattern"></div>
                    <a href="${roadmapUrl}" class="card-title-link">
                        <h2 class="course-title">${escapeHtml(space.name || 'Untitled Learning Space')}</h2>
                        <div class="course-subtitle">${escapeHtml(space.description || 'Sample Space')}</div>
                    </a>
                    <div class="card-options-top">
                        <i class="ti ti-dots-vertical"></i>
                    </div>
                </div>

                <div class="card-avatar ${avatarClass}">
                    ${firstLetter}
                </div>

                <div class="card-body-content">
                    <!-- Student specific body content could go here, keeping it clean per design -->
                </div>

                <div class="card-footer">
                    <div class="d-flex align-items-center gap-1">
                        <span class="status-indicator status-${escapeHtml(space.status || 'ACTIVE')}" title="Status"></span>
                        <span class="visibility-text text-muted" style="font-size: 0.75rem; font-weight: 600;">${escapeHtml(space.visibility || 'PUBLIC')}</span>
                    </div>
                </div>
            </div>
          </div>`;
    }).join('');

    renderLearningSpacePagination(totalPages);
  }

  function renderLearningSpacePagination(totalPages) {
    let container = document.getElementById('learningSpacePagination');
    if (!container) {
       const list = document.getElementById('learningSpaceList');
       container = document.createElement('div');
       container.id = 'learningSpacePagination';
       container.className = 'd-flex justify-content-center mt-2 mb-4';
       list.parentNode.insertBefore(container, list.nextSibling);
    }
    
    if (totalPages <= 1) {
        container.innerHTML = '';
        return;
    }

    let html = '<ul class="pagination pagination-sm mb-0 shadow-sm">';
    
    html += `<li class="page-item ${currentLearningSpacePage === 1 ? 'disabled' : ''}">
               <a class="page-link" href="#" onclick="changeLearningSpacePage(event, ${currentLearningSpacePage - 1})"><i class="ti ti-chevron-left"></i></a>
             </li>`;

    for (let i = 1; i <= totalPages; i++) {
        html += `<li class="page-item ${i === currentLearningSpacePage ? 'active' : ''}">
                   <a class="page-link" href="#" onclick="changeLearningSpacePage(event, ${i})">${i}</a>
                 </li>`;
    }

    html += `<li class="page-item ${currentLearningSpacePage === totalPages ? 'disabled' : ''}">
               <a class="page-link" href="#" onclick="changeLearningSpacePage(event, ${currentLearningSpacePage + 1})"><i class="ti ti-chevron-right"></i></a>
             </li>`;
    
    html += '</ul>';
    container.innerHTML = html;
  }

  window.changeLearningSpacePage = function(event, page) {
      event.preventDefault();
      currentLearningSpacePage = page;
      if (window.currentDashboardData && window.currentDashboardData.learningSpaces) {
          renderLearningSpaces(window.currentDashboardData.learningSpaces);
      }
  };

  function quizAction(quiz) {
    return quiz.isCompleted
            ? `<span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill"><i class="ti ti-check me-1"></i>Completed</span>`
            : `<a href="/student/take-quiz?quizId=${encodeURIComponent(quiz.id)}" class="btn btn-sm btn-primary rounded-pill px-3 fw-bold shadow-sm">Take Quiz</a>`;
  }

  function renderQuizAccordion(learningSpaces) {
    const quizAccordion = document.getElementById('quizAccordion');
    if (!quizAccordion) return;

    quizAccordion.innerHTML = '';
    const joinedSpaces = getJoinedSpaces(learningSpaces);
    if (!joinedSpaces.length) {
      quizAccordion.innerHTML = `<div class="text-center text-muted py-4"><p class="mb-0 fw-semibold">You have not joined any learning spaces yet.</p></div>`;
      return;
    }

    joinedSpaces.forEach((space, index) => {
      const quizzes = space.quizzes || [];
      const pending = quizzes.filter((quiz) => !quiz.isCompleted).length;
      const collapseId = `collapseSpace${space.id || index}`;
      const bodyHtml = quizzes.length
              ? `<div class="accordion-body border-top border-light">${quizzes.map((quiz) => `
              <div class="quiz-card-item d-flex align-items-center justify-content-between gap-3 p-3 bg-white rounded-3 shadow-sm mb-2 ${quiz.isCompleted ? 'opacity-75' : ''}">
                <div>
                  <h5 class="fc-card-title mb-1">${escapeHtml(quiz.title || 'Untitled Quiz')}</h5>
                  <span class="fc-meta text-muted"><i class="ti ti-clock me-1"></i>${escapeHtml(quiz.durationMinutes || 0)} min</span>
                  <span class="fc-meta text-muted ms-2"><i class="ti ti-list-check me-1"></i>${escapeHtml(quiz.totalQuestions || 0)} questions</span>
                </div>
                <div class="text-end">${quizAction(quiz)}</div>
              </div>`).join('')}</div>`
              : `<div class="accordion-body border-top border-light text-center py-4">
              <div class="text-success mb-2"><i class="ti ti-circle-check" style="font-size: 3rem;"></i></div>
              <h5 class="fc-card-title">No quizzes in this class</h5>
              <p class="fc-body text-muted mb-0">When your instructor creates quizzes, they will appear here.</p>
            </div>`;

      quizAccordion.insertAdjacentHTML('beforeend', `
          <div class="accordion-item border-0">
            <h2 class="accordion-header">
              <button class="accordion-button ${index === 0 ? '' : 'collapsed'} bg-transparent fc-card-title border-0" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-expanded="${index === 0 ? 'true' : 'false'}">
                <i class="ti ti-book text-primary me-2 fs-4"></i>${escapeHtml(space.name || 'Learning space')}
                ${pending ? `<span class="fc-badge bg-danger text-white ms-auto me-3 px-2 py-1 rounded-pill">${pending} quizzes to do</span>` : `<span class="fc-badge bg-secondary text-white ms-auto me-3 px-2 py-1 rounded-pill">${quizzes.length ? 'Done' : 'No quizzes yet'}</span>`}
              </button>
            </h2>
            <div id="${collapseId}" class="accordion-collapse collapse ${index === 0 ? 'show' : ''}" data-bs-parent="#quizAccordion">
              ${bodyHtml}
            </div>
          </div>`);
    });
  }


  function documentTypeLabel(type) {
    const labels = {
      VIDEO: 'Video',
      YOUTUBE: 'YouTube',
      PDF: 'PDF',
      GOOGLE_DRIVE: 'Google Drive',
      GITHUB: 'GitHub',
      WEBSITE: 'Website',
      OTHER: 'Document'
    };
    return labels[type] || 'Document';
  }

  function documentIcon(type) {
    const icons = {
      VIDEO: 'ti-video',
      YOUTUBE: 'ti-brand-youtube',
      PDF: 'ti-file-type-pdf',
      GOOGLE_DRIVE: 'ti-brand-google-drive',
      GITHUB: 'ti-brand-github',
      WEBSITE: 'ti-world',
      OTHER: 'ti-file-description'
    };
    return icons[type] || 'ti-file-description';
  }

  function documentLogo(doc) {
    const type = String(doc?.documentType || 'OTHER').toUpperCase();
    const url = String(doc?.url || doc?.fullUrl || '').toLowerCase();
    const title = String(doc?.title || '').toLowerCase();
    const sourceText = `${url} ${title}`;

    if (type === 'YOUTUBE' || sourceText.includes('youtube') || sourceText.includes('youtu.be')) {
      return documentLogoSources.YOUTUBE;
    }
    if (type === 'GOOGLE_DRIVE' || sourceText.includes('drive.google')) {
      return documentLogoSources.GOOGLE_DRIVE;
    }
    if (type === 'PDF' || sourceText.includes('.pdf')) {
      return documentLogoSources.PDF;
    }
    if (type === 'VIDEO' || /\.(mp4|webm|mov|avi|mkv)(?:$|[?#])/.test(url) || sourceText.includes('video')) {
      return documentLogoSources.VIDEO;
    }
    if (type === 'OTHER' || sourceText.includes('.doc') || sourceText.includes('docx') || sourceText.includes('document')) {
      return documentLogoSources.DOC;
    }
    return '';
  }

  function documentIconTemplate(doc) {
    const type = doc?.documentType || 'OTHER';
    const logo = documentLogo(doc);
    if (logo) {
      return `
              <span class="document-logo-box flex-shrink-0">
                <img class="document-logo-img" src="${escapeHtml(logo)}" alt="${escapeHtml(documentTypeLabel(type))} logo" loading="lazy">
              </span>`;
    }
    return `
              <span class="document-logo-box document-logo-box-fallback flex-shrink-0">
                <i class="ti ${documentIcon(type)}"></i>
              </span>`;
  }

  function renderRecentDocuments(documents) {
    const container = document.getElementById('recentDocuments');
    if (!container) return;

    if (!documents.length) {
      container.innerHTML = `
          <div class="text-center text-muted py-4">
            <i class="ti ti-folder-off text-primary" style="font-size: 2.4rem;"></i>
            <h5 class="fw-bold text-dark mt-3 mb-2">No Documents Yet</h5>
            <p class="small fw-semibold mb-0">Your instructor has not added documents for your learning spaces yet.</p>
          </div>`;
      return;
    }

    container.innerHTML = documents.slice(0, 8).map((doc) => {
      const type = doc.documentType || 'OTHER';
      const meta = [doc.learningSpaceName, doc.learningPathTitle]
              .filter(Boolean)
              .join(' · ');
      const href = doc.url || '#';
      const disabledClass = doc.url ? '' : ' opacity-75 pe-none';
      const clickHandler = doc.nodeId ? ` onclick="openDocumentNode(event, ${doc.nodeId})"` : '';

      return `
          <a class="notification-item rounded-4 border mb-2${disabledClass}" href="javascript:void(0)"${clickHandler}>
            <div class="d-flex gap-3 align-items-start">
              ${documentIconTemplate(doc)}
              <div class="min-w-0">
                <h6 class="fw-bold mb-1">${escapeHtml(doc.title || 'Untitled Document')}</h6>
                <p class="small text-muted fw-semibold mb-1">${escapeHtml(meta || 'Learning space')}</p>
                <span class="small text-primary fw-bold">${escapeHtml(documentTypeLabel(type))}</span>
              </div>
            </div>
          </a>`;
    }).join('');
  }

  async function openDocumentNode(event, nodeId) {
    event.preventDefault();
    const newWindow = window.open('', '_blank');
    if (newWindow) {
      newWindow.document.write('<div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;">Opening document...</div>');
    }
    try {
      const res = await fetch(`/api/learning-nodes/${nodeId}/items`, { headers: authHeaders(false) });
      if (!res.ok) throw new Error('Cannot fetch items');
      const items = await res.json();
      const docItem = items.find(i => ['PDF', 'DOC', 'DOCUMENT'].includes(String(i.itemType || '').toUpperCase()) && (i.fullUrl || i.url));
      if (docItem) {
        const docUrl = docItem.fullUrl || docItem.url;
        if (newWindow) {
          newWindow.location.href = docUrl;
        } else {
          window.open(docUrl, '_blank');
        }
      } else {
        if (newWindow) newWindow.close();
        alert('No document URL found for this node.');
      }
    } catch (err) {
      if (newWindow) newWindow.close();
      alert('Failed to load document: ' + err.message);
    }
  }

  async function loadPublicSpaces() {
    try {
      const response = await fetch('/api/learning-spaces/public', { headers: authHeaders() });
      if (!response.ok) throw new Error("Failed to load public spaces");
      const spaces = await response.json();
      renderPublicSpaces(spaces);
    } catch (err) {
      console.error(err);
      const list = document.getElementById('publicSpaceList');
      if (list) list.innerHTML = `<div class="col-12"><div class="alert alert-danger m-0 text-center">Failed to load public classes.</div></div>`;
    }
  }

  function renderPublicSpaces(spaces) {
    const list = document.getElementById('publicSpaceList');
    if (!list) return;
    
    const joinedIds = getJoinedSpaceIds(window.currentDashboardData?.learningSpaces);
    const availableSpaces = (spaces || []).filter((space) => !joinedIds.includes(space.id));

    if (!availableSpaces.length) {
      list.innerHTML = `<div class="col-12">${emptyState('ti-world-search', 'No Public Classes', 'There are currently no new public classes available to join.')}</div>`;
      return;
    }

    list.innerHTML = availableSpaces.map((space, index) => {
      const theme = iconThemes[index % iconThemes.length];
      return `
          <div class="col-md-6">
            <div class="course-card border-0 d-block h-100 shadow-sm" style="transition: transform 0.2s;">
              <div class="course-card-header bg-${theme.color}">
                <div class="d-flex justify-content-between align-items-start">
                  <h3 class="course-title text-white pe-3">${escapeHtml(space.name || 'Untitled')}</h3>
                  <span class="badge bg-white text-dark shadow-sm px-2 py-1 rounded-pill flex-shrink-0"><i class="ti ti-world me-1 text-primary"></i>Public</span>
                </div>
                <p class="small fw-semibold mb-0 text-white-50">Instructor: ${escapeHtml(space.ownerUsername || 'Unknown')}</p>
              </div>
              <div class="course-card-body d-flex justify-content-between align-items-center">
                <p class="text-muted small mb-0 text-truncate me-3" style="max-width: 70%;">${escapeHtml(space.description || 'No description')}</p>
                <button class="btn btn-sm btn-primary rounded-pill fw-bold px-3 join-public-btn" data-space-id="${space.id}">Join</button>
              </div>
            </div>
          </div>`;
    }).join('');

    document.querySelectorAll('.join-public-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        const spaceId = e.target.getAttribute('data-space-id');
        await joinPublicSpace(spaceId, e.target);
      });
    });
  }

  async function joinPublicSpace(spaceId, btnElement) {
    const originalText = btnElement.innerHTML;
    btnElement.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
    btnElement.disabled = true;

    try {
      const response = await fetch('/api/learning-spaces/join', {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify({ spaceId: parseInt(spaceId) })
      });
      
      if (!response.ok) {
        const errText = await response.text();
        throw new Error(errText || `Failed to join: ${response.status}`);
      }
      
      btnElement.innerHTML = '<i class="ti ti-check"></i> Joined';
      btnElement.classList.replace('btn-primary', 'btn-success');
      
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    } catch (err) {
      alert(err.message || 'Failed to join class');
      btnElement.innerHTML = originalText;
      btnElement.disabled = false;
    }
  }

  function renderDashboard(data) {
    const dashboard = data || {};
    window.currentDashboardData = dashboard;
    const learningSpaces = dashboard.learningSpaces || [];
    const quizzes = flattenQuizzes(learningSpaces);
    const allDocuments = dashboard.recentDocuments || [];
    const documents = allDocuments.filter(doc => doc.documentType === 'PDF');

    renderProfile(dashboard);
    renderStats(learningSpaces, quizzes);
    renderLearningSpaces(learningSpaces);
    renderQuizAccordion(learningSpaces);

    renderRecentDocuments(documents);
    
    loadPublicSpaces();
  }

  async function loadDashboard() {
    if (!token || !userId) {
      window.location.href = '/login';
      return;
    }

    try {
      const res = await fetch(`/api/students/${encodeURIComponent(userId)}/dashboard`, {
        headers: authHeaders()
      });
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
          if (typeof window.logout === 'function') window.logout();
          else window.location.href = '/login';
          return;
        }
        const errText = await res.text();
        throw new Error(`Could not load dashboard data: ${res.status} ${errText}`);
      }
      renderDashboard(await res.json());
    } catch (err) {
      console.error(err);
      const message = escapeHtml(err.message || 'Could not load dashboard data.');
      const quizAccordion = document.getElementById('quizAccordion');
      const learningSpaceList = document.getElementById('learningSpaceList');
      const notificationBadge = document.getElementById('notificationBadge');
      const notificationSummary = document.getElementById('notificationSummary');
      const notificationList = document.getElementById('notificationList');
      const recentDocuments = document.getElementById('recentDocuments');
      if (quizAccordion) quizAccordion.innerHTML = `<div class="alert alert-danger m-3">${message}</div>`;
      if (learningSpaceList) learningSpaceList.innerHTML = `<div class="col-12"><div class="alert alert-danger">${message}</div></div>`;
      if (notificationBadge) {
        notificationBadge.textContent = '!';
        notificationBadge.classList.remove('d-none');
      }
      if (notificationSummary) notificationSummary.textContent = 'Could not load notifications.';
      if (notificationList) notificationList.innerHTML = `<div class="alert alert-danger m-3">${message}</div>`;
      if (recentDocuments) recentDocuments.innerHTML = `<div class="alert alert-danger m-0">${message}</div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadDashboard();
  });
</script>
</th:block>
</body>
</html>
