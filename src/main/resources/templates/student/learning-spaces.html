<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Learning Spaces - FlippedClass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">

  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">

  <script>
    /* --- Inlined from student-auth.js --- */
    if (!localStorage.getItem('jwt_token')) {
      window.location.href = '/login';
    }

  </script>
  <script>
    /* --- Inlined from student-user-menu.js --- */
    (function () {
      const defaultAvatarUrl = '/assets/images/avatar-1.jpg';

      function storedUser() {
        return {
          fullName: localStorage.getItem('full_name') || localStorage.getItem('fullName') || '',
          username: localStorage.getItem('username') || '',
          avatarUrl: localStorage.getItem('avatar_url') || localStorage.getItem('avatarUrl') || ''
        };
      }

      function normalizeUser(user = {}) {
        const stored = storedUser();
        return {
          name: user.fullName || user.name || user.username || stored.fullName || stored.username || 'Student',
          username: user.username || stored.username || '',
          avatarUrl: user.avatarUrl || user.avatar_url || stored.avatarUrl || defaultAvatarUrl
        };
      }

      function setStudentMenuUser(user = {}) {
        const normalized = normalizeUser(user);

        if (normalized.name && normalized.name !== 'Student') {
          localStorage.setItem('full_name', normalized.name);
        }
        if (normalized.username) {
          localStorage.setItem('username', normalized.username);
        }
        if (normalized.avatarUrl && normalized.avatarUrl !== defaultAvatarUrl) {
          localStorage.setItem('avatar_url', normalized.avatarUrl);
        }

        document.querySelectorAll('[data-user-name]').forEach((element) => {
          element.textContent = normalized.name;
        });
        document.querySelectorAll('[data-user-avatar]').forEach((image) => {
          image.src = normalized.avatarUrl;
          image.onerror = () => {
            image.onerror = null;
            image.src = defaultAvatarUrl;
          };
        });

        const topbarName = document.getElementById('studentName');
        if (topbarName) topbarName.textContent = normalized.name;
      }

      function studentLogout() {
        ['jwt_token', 'user_id', 'full_name', 'fullName', 'username', 'avatar_url', 'avatarUrl'].forEach((key) => {
          localStorage.removeItem(key);
        });
        window.location.href = '/';
      }

      async function refreshStudentMenuUser() {
        const token = localStorage.getItem('jwt_token');
        const userId = localStorage.getItem('user_id');
        if (!token || !userId) return;

        try {
          const response = await fetch(`/api/users/${encodeURIComponent(userId)}`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (!response.ok) return;
          const user = await response.json();
          setStudentMenuUser(user);
        } catch (error) {
          console.warn('Could not load user menu profile.', error);
        }
      }

      function closeAllMenus(exceptMenu = null) {
        document.querySelectorAll('[data-user-menu].is-open').forEach((menu) => {
          if (menu !== exceptMenu) {
            menu.classList.remove('is-open');
            menu.querySelector('[data-user-menu-toggle]')?.setAttribute('aria-expanded', 'false');
          }
        });
      }

      function initStudentUserMenus() {
        setStudentMenuUser();
        refreshStudentMenuUser();

        document.querySelectorAll('[data-user-menu]').forEach((menu) => {
          const toggle = menu.querySelector('[data-user-menu-toggle]');
          const logoutButton = menu.querySelector('[data-user-logout]');

          toggle?.addEventListener('click', (event) => {
            event.stopPropagation();
            const shouldOpen = !menu.classList.contains('is-open');
            closeAllMenus(menu);
            menu.classList.toggle('is-open', shouldOpen);
            toggle.setAttribute('aria-expanded', String(shouldOpen));
          });

          logoutButton?.addEventListener('click', studentLogout);
        });

        document.addEventListener('click', () => closeAllMenus());
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeAllMenus();
        });
      }

      window.setStudentMenuUser = setStudentMenuUser;
      window.studentLogout = studentLogout;
      if (!window.logout) window.logout = studentLogout;

      document.addEventListener('DOMContentLoaded', initStudentUserMenus);
    })();

  </script>
  <link rel="stylesheet" th:href="@{/assets/css/student-learning-spaces.css}">
  <link rel="stylesheet" th:href="@{/assets/css/student-user-menu.css}">
  <link rel="stylesheet" th:href="@{/assets/css/student-typography.css}">
</head>

<body>
<div id="overlay" class="overlay"></div>

<nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3 shadow-sm">
  <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm">
    <i class="ti ti-layout-sidebar-left-expand"></i>
  </button>
  <button id="mobileBtn" class="btn btn-light btn-icon btn-sm d-lg-none me-2">
    <i class="ti ti-layout-sidebar-left-expand"></i>
  </button>

  <div class="topbar-main">
    <div class="topbar-title-wrap d-none d-md-block">
      <h5 class="topbar-title fw-bold text-dark ms-1">Learning Spaces <span class="badge bg-primary-subtle text-primary rounded-pill">Roadmap</span></h5>
    </div>
    <ul class="topbar-actions list-unstyled">
      <li class="dropdown">
        <button class="notification-trigger position-relative text-secondary d-flex align-items-center justify-content-center border-0"
                type="button"
                id="notificationDropdown"
                data-bs-toggle="dropdown"
                aria-expanded="false"
                aria-label="Pending quiz notifications">
          <i class="ti ti-bell-ringing fs-5 text-dark"></i>
          <span id="notificationBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm d-none">0</span>
        </button>
        <div class="dropdown-menu dropdown-menu-end notification-menu p-0 border-0" aria-labelledby="notificationDropdown">
          <div class="p-3 border-bottom bg-white">
            <div class="d-flex align-items-center justify-content-between">
              <div>
                <h6 class="fw-900 text-dark mb-1">Notifications</h6>
                <p class="small text-muted fw-semibold mb-0" id="notificationSummary">Loading notifications...</p>
              </div>
              <i class="ti ti-bell text-primary fs-4"></i>
            </div>
          </div>
          <div id="notificationList" class="notification-list">
            <div class="text-center text-muted py-4 px-3">
              <div class="spinner-border text-primary mb-2" role="status"></div>
              <p class="small fw-semibold mb-0">Loading pending quizzes...</p>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</nav>

<aside id="sidebar" class="sidebar bg-white border-end-0 shadow-sm">
  <div class="logo-area border-bottom border-light">
    <a th:href="@{/}" class="d-inline-flex align-items-center text-decoration-none">
      <div class="bg-primary text-white rounded p-1 d-flex align-items-center justify-content-center me-2">
        <i class="ti ti-book-2 fs-3"></i>
      </div>
      <span class="logo-text fw-bolder fs-4 text-dark" style="letter-spacing: -0.5px;">Flipped<span class="text-primary">Class</span></span>
    </a>
  </div>
  <ul class="nav flex-column mt-4">
    <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="@{/student/dashboard}" data-nav-key="dashboard"><i class="ti ti-layout-dashboard fs-5"></i><span class="nav-text">Dashboard</span></a></li>
    <li><a class="nav-link active rounded-pill mx-3 mb-2 px-4 fw-bold" th:href="@{/student/learning-spaces}" data-nav-key="learning-spaces" aria-current="page"><i class="ti ti-books fs-5"></i><span class="nav-text">My Classes</span></a></li>
    <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="@{/student/my-quizzes}" data-nav-key="my-quiz"><i class="ti ti-list-check fs-5"></i><span class="nav-text">My Quizzes</span></a></li>
    <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="@{/}" data-nav-key="reports"><i class="ti ti-chart-pie fs-5"></i><span class="nav-text">Reports</span></a></li>

    <li class="sidebar-user-slot">
      <div class="student-user-menu" data-user-menu>
        <button class="student-menu-trigger" type="button" data-user-menu-toggle aria-expanded="false" aria-label="Account menu">
          <img class="student-menu-avatar" data-user-avatar th:src="@{/assets/images/avatar-1.jpg}" alt="Student avatar">
          <span class="student-menu-info">
        <span class="student-menu-name" data-user-name>Student</span>
        <span class="student-menu-role">Student</span>
      </span>
          <i class="ti ti-chevron-up student-menu-chevron"></i>
        </button>
        <div class="student-menu-panel" role="menu">
          <a class="student-menu-item" th:href="@{/docs}" role="menuitem"><i class="ti ti-help-circle"></i><span>Help</span></a>
          <button class="student-menu-item student-menu-item-danger" type="button" data-user-logout role="menuitem"><i class="ti ti-logout"></i><span>Logout</span></button>
        </div>
      </div>
    </li>
  </ul>
</aside>

<main id="content" class="content py-10">
  <div class="container-fluid px-xl-5 page-shell">
    <section id="joinInviteSection" class="join-hero">
      <div>
        <span class="eyebrow"><i class="ti ti-door-enter"></i> Join learning space</span>
      </div>

      <form id="joinSpaceForm" class="join-form-card">
        <label for="inviteCode" class="form-label fw-bold text-dark">Class invite code</label>
        <div class="d-flex flex-column gap-3">
          <input id="inviteCode" class="form-control invite-input" type="text" placeholder="" autocomplete="off" maxlength="24" required>
          <button id="joinSpaceButton" class="btn btn-primary rounded-pill fw-bold" type="submit">
            <i class="ti ti-door-enter me-2"></i>Join class
          </button>
        </div>
        <div id="joinMessage" class="message-box"></div>
      </form>
    </section>

    <section class="learning-layout">
      <aside class="panel-card">
        <div class="d-flex align-items-start justify-content-between gap-3">
          <div>
            <h2 class="section-title">LEARNING SPACES</h2>
          </div>
          <span id="spaceCount" class="soft-chip">classes</span>
        </div>

        <div class="mt-3">
          <input id="spaceSearch" class="form-control rounded-pill" type="search" placeholder="Search classes...">
        </div>

        <div id="spacesList" class="space-list">
          <div class="loading-state">Loading classes...</div>
        </div>
      </aside>

      <section class="panel-card detail-shell">
        <div id="spaceDetail">
          <div class="empty-state">
            <div>
              <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-route"></i></div>
            </div>
          </div>
        </div>
      </section>
    </section>

</main>

<script>
  /* --- Inlined from student-learning-spaces.js --- */
  const token = localStorage.getItem('jwt_token');
  const userId = localStorage.getItem('user_id');

  const state = {
    spaces: [],
    selectedSpaceId: null,
    searchTerm: '',
    focusRoadmapOnce: false,
    focusJoinOnce: false
  };

  const spacesList = document.getElementById('spacesList');
  const spaceDetail = document.getElementById('spaceDetail');
  const spaceCount = document.getElementById('spaceCount');
  const spaceSearch = document.getElementById('spaceSearch');
  const joinForm = document.getElementById('joinSpaceForm');
  const inviteCodeInput = document.getElementById('inviteCode');
  const joinButton = document.getElementById('joinSpaceButton');
  const joinMessage = document.getElementById('joinMessage');

  function authHeaders(includeJson = true) {
    const headers = { Authorization: `Bearer ${token}` };
    if (includeJson) headers['Content-Type'] = 'application/json';
    return headers;
  }

  function escapeHtml(value) {
    return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
  }

  function truncate(value, maxLength = 110) {
    const text = String(value || '').trim();
    if (!text) return '';
    return text.length > maxLength ? `${text.slice(0, maxLength - 1)}...` : text;
  }

  function statusLabel(status) {
    const labels = {
      ACTIVE: 'Active',
      DRAFT: 'Draft',
      LOCKED: 'Locked',
      UNLOCKED: 'Unlocked',
      ARCHIVED: 'Archived',
      DELETED: 'Deleted'
    };
    return labels[status] || status || 'Unknown';
  }

  function nodeTypeLabel(type) {
    const labels = {
      LESSON: 'Lesson',
      VIDEO: 'Video',
      PRACTICE: 'Practice',
      QUIZ: 'Quiz',
      REVIEW: 'Review'
    };
    return labels[type] || type || 'Node';
  }

  function roleLabel(role) {
    const labels = {
      MEMBER: 'Student',
      OWNER: 'Owner',
      SUPPORTER: 'Teaching Assistant'
    };
    return labels[role] || role || 'Member';
  }

  function setJoinMessage(message, type) {
    joinMessage.textContent = message;
    joinMessage.className = `message-box show ${type}`;
  }

  function clearJoinMessage() {
    joinMessage.textContent = '';
    joinMessage.className = 'message-box';
  }

  async function readError(response) {
    const text = await response.text();
    if (!text) return 'Something went wrong. Please try again.';
    try {
      const json = JSON.parse(text);
      return json.message || json.error || text;
    } catch {
      return text;
    }
  }

  function flattenQuizzes(learningSpaces) {
    return (learningSpaces || []).flatMap((space) =>
            (space.quizzes || []).map((quiz) => ({ ...quiz, space }))
    );
  }

  function renderNotifications(learningSpaces) {
    const badge = document.getElementById('notificationBadge');
    const summary = document.getElementById('notificationSummary');
    const list = document.getElementById('notificationList');
    const pending = flattenQuizzes(learningSpaces).filter((quiz) => !quiz.isCompleted);

    if (badge) {
      badge.textContent = pending.length;
      badge.classList.toggle('d-none', pending.length === 0);
    }

    if (summary) {
      summary.textContent = pending.length
              ? `You have ${pending.length} quizzes to do.`
              : 'No new notifications.';
    }

    if (!list) return;

    if (!pending.length) {
      list.innerHTML = `
        <div class="text-center text-muted py-4 px-3">
          <i class="ti ti-circle-check text-success" style="font-size: 2.5rem;"></i>
          <h6 class="fw-bold text-dark mt-3 mb-1">No pending quizzes</h6>
          <p class="small fw-semibold mb-0">All open quizzes are complete or no new quizzes are available.</p>
        </div>`;
      return;
    }

    const items = pending.slice(0, 5).map((quiz) => `
      <a class="notification-item" href="/student/take-quiz?quizId=${encodeURIComponent(quiz.id)}">
        <div class="d-flex gap-3 align-items-start">
          <span class="notification-icon flex-shrink-0">
            <i class="ti ti-file-pencil"></i>
          </span>
          <div class="min-w-0">
            <h6 class="fw-bold mb-1">${escapeHtml(quiz.title || 'Untitled Quiz')}</h6>
            <p class="small text-muted fw-semibold mb-1">${escapeHtml(quiz.space?.name || 'Learning space')}</p>
            <span class="small text-primary fw-bold">Start Quiz</span>
          </div>
        </div>
      </a>`).join('');

    const more = pending.length > 5
            ? `<a class="notification-item text-center fw-bold text-primary" href="/student/my-quizzes">View ${pending.length - 5} more quizzes</a>`
            : '';

    list.innerHTML = items + more;
  }

  function renderNotificationError(message) {
    const badge = document.getElementById('notificationBadge');
    const summary = document.getElementById('notificationSummary');
    const list = document.getElementById('notificationList');

    if (badge) {
      badge.textContent = '!';
      badge.classList.remove('d-none');
    }
    if (summary) summary.textContent = 'Could not load notifications.';
    if (list) list.innerHTML = `<div class="alert alert-danger m-3">${escapeHtml(message || 'Could not load notifications.')}</div>`;
  }

  function readInitialSpaceId() {
    const value = new URLSearchParams(window.location.search).get('spaceId');
    const id = Number(value);
    return Number.isFinite(id) && id > 0 ? id : null;
  }

  function shouldFocusRoadmap() {
    const params = new URLSearchParams(window.location.search);
    return params.get('focus') === 'roadmap' || window.location.hash === '#roadmap';
  }

  function shouldFocusJoinInvite() {
    const params = new URLSearchParams(window.location.search);
    return params.get('focus') === 'join' || ['#join', '#joinSpaceForm'].includes(window.location.hash);
  }

  function focusRoadmapIfNeeded() {
    if (!state.focusRoadmapOnce) return;
    state.focusRoadmapOnce = false;
    requestAnimationFrame(() => {
      spaceDetail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function focusJoinInviteIfNeeded() {
    if (!state.focusJoinOnce) return;
    state.focusJoinOnce = false;
    requestAnimationFrame(() => {
      const section = document.getElementById('joinInviteSection') || joinForm;
      section?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      inviteCodeInput?.focus({ preventScroll: true });
    });
  }

  async function loadSpaces(preferredSpaceId = null) {
    if (!token || !userId) {
      window.location.href = '/login';
      return;
    }

    spacesList.innerHTML = '<div class="loading-state">Loading class list...</div>';

    try {
      const response = await fetch(`/api/students/${userId}/dashboard`, {
        headers: authHeaders(false)
      });

      if (!response.ok) {
        throw new Error(await readError(response));
      }

      const data = await response.json();
      window.setStudentMenuUser?.(data.user);
      state.spaces = data.learningSpaces || [];
      renderNotifications(state.spaces);
      renderSpaces();

      const preferred = Number(preferredSpaceId);
      const hasPreferred = Number.isFinite(preferred) && state.spaces.some((space) => space.id === preferred);
      const nextSpaceId = hasPreferred ? preferred : state.selectedSpaceId || (state.spaces[0] && state.spaces[0].id);
      if (nextSpaceId) {
        await selectSpace(nextSpaceId);
      } else {
        renderEmptyDetail();
      }
    } catch (error) {
      renderNotificationError(error.message);
      spacesList.innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`;
      renderEmptyDetail('Could not load learning space', 'Please check your login or try again later.');
    }
  }

  function renderSpaces() {
    const keyword = state.searchTerm.trim().toLowerCase();
    const filtered = state.spaces.filter((space) => {
      const haystack = `${space.name || ''} ${space.description || ''} ${space.inviteCode || ''}`.toLowerCase();
      return haystack.includes(keyword);
    });

    spaceCount.textContent = `${state.spaces.length} classes`;

    if (filtered.length === 0) {
      spacesList.innerHTML = `
        <div class="empty-state">
          <div>
            <div class="mb-2 text-primary" style="font-size: 2rem;"><i class="ti ti-school-off"></i></div>
            <p class="mb-0">No matching classes. Enter an invite code to join a learning space.</p>
          </div>
        </div>`;
      return;
    }

    const iconThemes = [
      { icon: 'ti-template', color: 'primary' },
      { icon: 'ti-flame', color: 'orange' },
      { icon: 'ti-database', color: 'info' },
      { icon: 'ti-brand-aws', color: 'warning' }
    ];

    spacesList.innerHTML = filtered.map((space, index) => {
      const theme = iconThemes[index % iconThemes.length];
      return `
      <button type="button" class="space-card theme-${theme.color} ${space.id === state.selectedSpaceId ? 'active' : ''}" data-space-id="${space.id}">
        <div class="d-flex align-items-start gap-2 mb-1">
          <i class="ti ${theme.icon} text-${theme.color}" style="font-size: 1.35rem; line-height: 1;"></i>
          <h3 class="space-card-title">${escapeHtml(space.name || 'Untitled Learning Space')}</h3>
        </div>
        <div class="space-meta">
          <span class="soft-chip border"><i class="ti ti-user"></i>${escapeHtml(roleLabel(space.memberRole))}</span>
          <span class="soft-chip border"><i class="ti ti-circle-check"></i>${escapeHtml(statusLabel(space.status))}</span>
        </div>
      </button>
    `}).join('');

    document.querySelectorAll('[data-space-id]').forEach((button) => {
      button.addEventListener('click', () => selectSpace(Number(button.dataset.spaceId)));
    });
  }

  function renderEmptyDetail(title = 'Select a learning space', message = 'Course roadmaps and nodes will appear here.') {
    spaceDetail.innerHTML = `
      <div class="empty-state">
        <div>
          <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-route"></i></div>
          <h2 class="section-title">${escapeHtml(title)}</h2>
          <p class="section-note">${escapeHtml(message)}</p>
        </div>
      </div>`;
  }

  async function selectSpace(spaceId) {
    const selected = state.spaces.find((space) => space.id === Number(spaceId));
    if (!selected) return;

    state.selectedSpaceId = selected.id;
    renderSpaces();
    renderDetailLoading(selected);

    try {
      const response = await fetch(`/api/learning-spaces/${selected.id}/learning-paths`, {
        headers: authHeaders(false)
      });

      if (!response.ok) {
        throw new Error(await readError(response));
      }

      const paths = await response.json();
      renderDetail(selected, paths || []);
    } catch (error) {
      renderDetail(selected, [], error.message);
    } finally {
      focusRoadmapIfNeeded();
    }
  }

  function renderDetailLoading(space) {
    spaceDetail.innerHTML = `
      ${detailHeaderTemplate(space)}
      <div class="loading-state">Loading class roadmap...</div>`;
  }

  function detailHeaderTemplate(space) {
  }

  function renderDetail(space, paths, errorMessage = '') {
    if (errorMessage) {
      spaceDetail.innerHTML = `
        ${detailHeaderTemplate(space)}
        <div class="empty-state">
          <div>
            <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-alert-circle"></i></div>
            <h2 class="section-title">Could not load roadmap</h2>
            <p class="section-note">${escapeHtml(errorMessage)}</p>
          </div>
        </div>`;
      return;
    }

    if (!paths.length) {
      spaceDetail.innerHTML = `
        ${detailHeaderTemplate(space)}
        <div class="empty-state">
          <div>
            <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-map-off"></i></div>
            <h2 class="section-title">No Roadmap Yet</h2>
            <p class="section-note">Your instructor has not created courses or nodes for this learning space yet.</p>
          </div>
        </div>`;
      return;
    }

    const sortedPaths = [...paths].sort((a, b) => (a.position || 0) - (b.position || 0));
    spaceDetail.innerHTML = `
      ${detailHeaderTemplate(space)}
      <div class="roadmap-grid">
        ${sortedPaths.map((path, index) => pathTemplate(path, index)).join('')}
      </div>`;
  }

  function pathTemplate(path, index) {
    const nodes = [...(path.nodes || [])].sort((a, b) => (a.id || 0) - (b.id || 0));
    const openNodes = nodes.filter((node) => ['UNLOCKED', 'ACTIVE'].includes(node.status)).length;
    const percent = nodes.length ? Math.round((openNodes / nodes.length) * 100) : 0;

    return `
      <article class="path-card">
        <header class="path-header">
          <div>
            <span class="path-kicker">Course ${index + 1}</span>
            <h3 class="path-title">${escapeHtml(path.title || 'Untitled Course')}</h3>
          </div>
          <div class="path-progress">
            <div class="fw-bold text-primary mb-2">${percent}% unlocked</div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${percent}%;"></div>
            </div>
            <div class="small text-muted fw-semibold mt-2">${nodes.length} node</div>
          </div>
        </header>
        <div class="node-timeline">
          ${nodes.length ? nodes.map((node, nodeIndex) => nodeTemplate(node, nodeIndex)).join('') : emptyNodesTemplate()}
        </div>
      </article>`;
  }

  function nodeTemplate(node, index) {
    const params = new URLSearchParams({
      nodeId: node.id,
      spaceId: state.selectedSpaceId || ''
    });

    return `
      <a class="node-card" href="/student/learning-node?${params.toString()}">
        <div class="node-index">${index + 1}</div>
        <div>
          <h4 class="node-title">${escapeHtml(node.title || `Node ${index + 1}`)}</h4>
          <p class="node-content">${escapeHtml(node.content || 'Click to open this node learning page.')}</p>
        </div>
        <div class="node-badges">
          <span class="soft-chip"><i class="ti ti-layers-subtract"></i>${escapeHtml(nodeTypeLabel(node.nodeType))}</span>
          <span class="soft-chip"><i class="ti ti-lock-open"></i>${escapeHtml(statusLabel(node.status))}</span>
        </div>
        <span class="node-open" aria-hidden="true"><i class="ti ti-arrow-up-right"></i></span>
      </a>`;
  }

  function emptyNodesTemplate() {
    return `
      <div class="empty-state" style="min-height: 160px;">
        <div>
          <div class="mb-2 text-primary" style="font-size: 2rem;"><i class="ti ti-node-off"></i></div>
          <p class="mb-0">This course has no nodes yet.</p>
        </div>
      </div>`;
  }

  async function copyInviteCode(code) {
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code);
      setJoinMessage(`Copied code ${code}.`, 'success');
    } catch {
      setJoinMessage(`Class code: ${code}`, 'success');
    }
  }

  joinForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearJoinMessage();

    const inviteCode = inviteCodeInput.value.trim().toUpperCase();
    if (!inviteCode) {
      setJoinMessage('Please enter an invite code.', 'error');
      return;
    }

    joinButton.disabled = true;
    joinButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Joining...';

    try {
      const response = await fetch('/api/learning-spaces/join', {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify({ inviteCode })
      });

      if (!response.ok) {
        throw new Error(await readError(response));
      }

      const data = await response.json();
      setJoinMessage(data.message || 'Joined class successfully.', 'success');
      inviteCodeInput.value = '';
      await loadSpaces(data.learningSpaceId);
    } catch (error) {
      setJoinMessage(error.message, 'error');
    } finally {
      joinButton.disabled = false;
      joinButton.innerHTML = '<i class="ti ti-door-enter me-2"></i>Join Class';
    }
  });

  spaceSearch.addEventListener('input', () => {
    state.searchTerm = spaceSearch.value;
    renderSpaces();
  });

  function setActiveSidebarLink(activeKey) {
    document.querySelectorAll('.sidebar .nav-link[data-nav-key]').forEach(link => {
      const isActive = link.dataset.navKey === activeKey;
      link.classList.toggle('active', isActive);
      link.classList.toggle('fw-bold', isActive);
      link.classList.toggle('fw-semibold', !isActive);

      if (isActive) {
        link.setAttribute('aria-current', 'page');
      } else {
        link.removeAttribute('aria-current');
      }
    });
  }

  function initSidebarActiveState() {
    const path = window.location.pathname.replace(/\/+$/, '') || '/';
    let activeKey = null;

    if (path === '/student/dashboard' && window.location.hash === '#myQuizSection') {
      activeKey = 'my-quiz';
    } else if (path === '/student/dashboard') {
      activeKey = 'dashboard';
    } else if (path.startsWith('/student/learning-spaces')) {
      activeKey = 'learning-spaces';
    } else if (path.startsWith('/student/my-quizzes')) {
      activeKey = 'my-quiz';
    } else if (path.startsWith('/student/take-quiz')) {
      activeKey = 'my-quiz';
    } else if (path.startsWith('/student/reports')) {
      activeKey = 'reports';
    }

    if (activeKey) {
      setActiveSidebarLink(activeKey);
    }

    document.querySelectorAll('.sidebar .nav-link[data-nav-key]').forEach(link => {
      link.addEventListener('click', () => setActiveSidebarLink(link.dataset.navKey));
    });
  }

  function logout() {
    localStorage.removeItem('jwt_token');
    localStorage.removeItem('user_id');
    window.location.href = '/';
  }

  document.addEventListener('DOMContentLoaded', () => {
    initSidebarActiveState();
    state.focusRoadmapOnce = shouldFocusRoadmap();
    state.focusJoinOnce = shouldFocusJoinInvite();
    loadSpaces(readInitialSpaceId()).finally(() => focusJoinInviteIfNeeded());
  });

</script>
</body>
</html>
