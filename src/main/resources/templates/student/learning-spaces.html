<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Không gian học - FlippedClass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">

  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">

  <script>
    if (!localStorage.getItem('jwt_token')) {
      window.location.href = '/login';
    }
  </script>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap");

    :root {
      --fc-primary: #5bc760;
      --fc-primary-dark: #2f855a;
      --fc-primary-soft: #e8f8ea;
      --fc-text: #1f2937;
      --fc-muted: #6b7280;
      --fc-background: #f7faf8;
      --fc-card: #ffffff;
      --fc-border: #e5e7eb;
      --fc-shadow-sm: 0 10px 24px rgba(31, 41, 55, 0.08);
      --fc-shadow-md: 0 22px 55px rgba(31, 41, 55, 0.12);
      --bs-primary: #2f855a;
      --bs-primary-rgb: 47, 133, 90;
      --bs-success: #5bc760;
      --bs-success-rgb: 91, 199, 96;
    }

    body {
      color: var(--fc-text);
      background:
        radial-gradient(circle at top left, rgba(91, 199, 96, 0.18), transparent 32rem),
        linear-gradient(180deg, #ffffff 0%, var(--fc-background) 48%, #ffffff 100%);
      font-family: "Lexend", "Trebuchet MS", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      border-color: rgba(229, 231, 235, 0.85) !important;
      background: rgba(255, 255, 255, 0.92) !important;
      backdrop-filter: blur(18px);
      box-shadow: var(--fc-shadow-sm) !important;
      min-height: 64px;
      height: 64px;
      flex-wrap: nowrap !important;
      align-items: center !important;
      gap: 0.75rem;
      padding-top: 0.55rem !important;
      padding-bottom: 0.55rem !important;
    }

    .topbar-main {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .topbar-title {
      display: flex;
      align-items: center;
      min-width: 0;
      margin: 0;
      line-height: 1;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .topbar-title-wrap {
      min-width: 0;
      overflow: hidden;
    }

    .topbar-title .badge {
      display: inline-flex;
      align-items: center;
      height: 28px;
      margin-left: 0.7rem !important;
      padding: 0 0.78rem;
      line-height: 1;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
      margin: 0;
    }

    .topbar .btn-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .notification-trigger {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: var(--fc-primary-soft);
      box-shadow: inset 0 0 0 1px rgba(47, 133, 90, 0.08);
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .notification-trigger .badge {
      top: 4px !important;
      left: auto !important;
      right: 4px !important;
      min-width: 1.28rem;
      height: 1.28rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 0.35rem;
      transform: none !important;
      font-size: 0.72rem;
      line-height: 1;
    }

    @media (max-width: 767.98px) {
      .topbar {
        min-height: 60px;
        height: 60px;
        gap: 0.5rem;
      }

      .topbar-main {
        justify-content: flex-end;
      }

      .topbar .btn-icon,
      .notification-trigger {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
        border-radius: 14px;
      }

      .topbar-actions {
        gap: 0.5rem;
      }

      .notification-trigger .badge {
        top: 2px !important;
        right: 2px !important;
      }
    }

    .notification-trigger:hover,
    .notification-trigger.show {
      background: #d9f4dc;
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(47, 133, 90, 0.14);
    }

    .notification-menu {
      width: min(360px, calc(100vw - 2rem));
      overflow: hidden;
      border-radius: 22px;
      box-shadow: var(--fc-shadow-md) !important;
    }

    .notification-list {
      max-height: 360px;
      overflow-y: auto;
    }

    .notification-item {
      display: block;
      padding: 1rem 1.15rem;
      color: var(--fc-text);
      text-decoration: none;
      border-bottom: 1px solid rgba(229, 231, 235, 0.72);
      transition: background 180ms ease, color 180ms ease;
    }

    .notification-item:last-child {
      border-bottom: 0;
    }

    .notification-item:hover {
      color: var(--fc-primary-dark);
      background: var(--fc-primary-soft);
    }

    .notification-icon {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      color: var(--fc-primary-dark);
      background: var(--fc-primary-soft);
      font-size: 1.25rem;
    }

    .sidebar {
      border-right: 1px solid var(--fc-border);
      background: rgba(255, 255, 255, 0.96) !important;
    }

    .sidebar .logo-area {
      border-color: var(--fc-border) !important;
    }

    .sidebar .nav {
      min-height: calc(100vh - 72px - 1.5rem);
      display: flex;
      flex-direction: column;
    }

    .sidebar .nav > li.mt-auto {
      margin-top: auto !important;
    }

    .sidebar .logo-area .bg-primary {
      background: linear-gradient(135deg, var(--fc-primary-dark), var(--fc-primary)) !important;
      box-shadow: 0 12px 24px rgba(47, 133, 90, 0.18);
    }

    .sidebar .logo-text .text-primary,
    .text-primary,
    .text-success,
    .text-info,
    .text-warning {
      color: var(--fc-primary-dark) !important;
    }

    .sidebar .nav-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--fc-muted) !important;
      font-weight: 700 !important;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .sidebar .nav-link i,
    .sidebar .nav-link .nav-text {
      color: inherit;
      font-weight: inherit;
    }

    .sidebar .nav-link:hover {
      color: var(--fc-primary-dark) !important;
      background: var(--fc-primary-soft) !important;
      transform: translateX(2px);
    }

    .sidebar .nav-link.active {
      color: var(--fc-primary-dark) !important;
      background: var(--fc-primary-soft) !important;
      font-weight: 900 !important;
      transform: translateX(2px);
      box-shadow: inset 0 0 0 1px rgba(47, 133, 90, 0.12);
    }

    .sidebar .nav-link.active i,
    .sidebar .nav-link.active .nav-text {
      color: var(--fc-primary-dark) !important;
      font-weight: 900 !important;
    }

    .sidebar .nav-link.active::before {
      content: "";
      position: absolute;
      left: 0.75rem;
      top: 50%;
      width: 4px;
      height: 46%;
      border-radius: 999px;
      background: var(--fc-primary-dark);
      transform: translateY(-50%);
    }

    .sidebar .logout-link {
      color: var(--fc-muted) !important;
      background: transparent !important;
      font-weight: 700 !important;
      box-shadow: none !important;
    }

    .sidebar .logout-link:hover {
      color: #b42318 !important;
      background: #fef3f2 !important;
    }

    .bg-primary-subtle,
    .bg-success-subtle,
    .bg-info-subtle,
    .bg-warning-subtle,
    .bg-danger-subtle {
      background: var(--fc-primary-soft) !important;
    }

    .bg-primary,
    .bg-success,
    .bg-danger,
    .badge.bg-danger {
      background-color: var(--fc-primary-dark) !important;
    }

    .btn-primary,
    .btn-success,
    .btn-dark {
      color: #ffffff !important;
      border-color: var(--fc-primary-dark) !important;
      background: var(--fc-primary-dark) !important;
      box-shadow: 0 12px 24px rgba(47, 133, 90, 0.22);
    }

    .btn-primary:hover,
    .btn-success:hover,
    .btn-dark:hover {
      border-color: #256c49 !important;
      background: #256c49 !important;
    }

    .btn-outline-primary,
    .btn-outline-dark {
      color: var(--fc-primary-dark) !important;
      border-color: rgba(47, 133, 90, 0.36) !important;
    }

    .btn-outline-primary:hover,
    .btn-outline-dark:hover {
      color: #ffffff !important;
      background: var(--fc-primary-dark) !important;
    }

    .page-shell {
      display: grid;
      gap: 1.5rem;
    }

    .join-hero,
    .panel-card,
    .space-card,
    .path-card {
      border: 1px solid rgba(229, 231, 235, 0.9);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--fc-shadow-sm);
    }

    .join-hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(360px, 520px);
      gap: 0.85rem;
      align-items: center;
      border-radius: 20px;
      padding: 0.65rem 0.85rem;
    }

    .join-hero::before {
      content: "";
      position: absolute;
      inset: auto -4rem -5rem auto;
      width: 12rem;
      height: 12rem;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(91, 199, 96, 0.22), transparent 68%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      color: var(--fc-primary-dark);
      background: var(--fc-primary-soft);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      max-width: 720px;
      font-size: clamp(2rem, 4vw, 3.6rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .page-copy {
      max-width: 720px;
      margin: 1rem 0 0;
      color: var(--fc-muted);
      font-size: 1.05rem;
      font-weight: 500;
    }

    .join-form-card {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      justify-self: end;
      padding: 0.65rem 0.75rem;
      border: 1px solid rgba(91, 199, 96, 0.22);
      border-radius: 18px;
      background: linear-gradient(135deg, #ffffff, var(--fc-primary-soft));
    }

    .join-form-card .form-label {
      margin-bottom: 0.35rem;
      font-size: 0.9rem;
    }

    .join-form-card .d-flex {
      flex-direction: row !important;
      align-items: center;
      gap: 0.55rem !important;
    }

    .invite-input {
      height: 40px;
      border: 1px solid rgba(47, 133, 90, 0.24);
      border-radius: 13px;
      color: var(--fc-text);
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    #joinSpaceButton {
      min-height: 40px;
      padding: 0.55rem 1rem;
      white-space: nowrap;
    }

    .invite-input:focus {
      border-color: var(--fc-primary-dark);
      box-shadow: 0 0 0 0.25rem rgba(91, 199, 96, 0.18);
    }

    .learning-layout {
      display: grid;
      grid-template-columns: minmax(300px, 0.38fr) minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
    }

    .panel-card {
      border-radius: 28px;
      padding: 1.25rem;
    }

    .section-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .section-note {
      margin: 0.25rem 0 0;
      color: var(--fc-muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .space-list {
      display: grid;
      gap: 0.9rem;
      margin-top: 1rem;
    }

    .space-card {
      width: 100%;
      display: block;
      text-align: left;
      border-radius: 22px;
      padding: 1rem;
      color: var(--fc-text);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .space-card:hover,
    .space-card.active {
      transform: translateY(-2px);
      border-color: rgba(91, 199, 96, 0.32);
      background: var(--fc-primary-soft);
      box-shadow: var(--fc-shadow-sm);
    }

    .space-card-title {
      margin: 0;
      color: var(--fc-text);
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: -0.03em;
    }



    .space-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.85rem;
    }

    .soft-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      color: var(--fc-primary-dark);
      background: #ffffff;
      border: 1px solid rgba(47, 133, 90, 0.14);
      font-size: 0.74rem;
      font-weight: 900;
    }

    .detail-shell {
      min-height: 540px;
    }

    .detail-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: start;
      margin-bottom: 1.25rem;
      padding: 1.5rem;
      border-radius: 26px;
      background:
        radial-gradient(circle at right top, rgba(91, 199, 96, 0.18), transparent 18rem),
        linear-gradient(135deg, #ffffff, #f2fbf3);
      border: 1px solid rgba(91, 199, 96, 0.2);
    }

    .detail-title {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.4rem);
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .detail-desc {
      max-width: 760px;
      margin: 0.6rem 0 0;
      color: var(--fc-muted);
      font-weight: 600;
      line-height: 1.6;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: flex-end;
    }

    #spaceDetail {
      scroll-margin-top: 96px;
    }

    .roadmap-grid {
      display: grid;
      gap: 1rem;
    }

    .path-card {
      overflow: hidden;
      border-radius: 28px;
    }

    .path-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: center;
      padding: 1.2rem 1.25rem;
      background: #ffffff;
      border-bottom: 1px solid var(--fc-border);
    }

    .path-kicker {
      color: var(--fc-primary-dark);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .path-title {
      margin: 0.25rem 0 0;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .path-description {
      margin: 0.45rem 0 0;
      color: var(--fc-muted);
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.55;
    }

    .path-progress {
      min-width: 150px;
      text-align: right;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf5ef;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--fc-primary-dark), var(--fc-primary));
    }

    .node-timeline {
      display: grid;
      gap: 0.75rem;
      padding: 1rem 1.25rem 1.25rem;
      background: rgba(247, 250, 248, 0.75);
    }

    .node-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: 1rem;
      align-items: center;
      padding: 1rem;
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 24px;
      color: inherit;
      background: #ffffff;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .node-card:hover {
      transform: translateY(-2px);
      border-color: rgba(91, 199, 96, 0.28);
      box-shadow: var(--fc-shadow-sm);
    }

    .node-card:focus-visible {
      outline: 4px solid rgba(91, 199, 96, 0.22);
      outline-offset: 3px;
    }

    .node-card-header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 0.85rem;
      align-items: center;
    }

    .node-index {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--fc-primary-dark), var(--fc-primary));
      font-weight: 900;
    }

    .node-title {
      margin: 0;
      color: var(--fc-text);
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .node-content {
      margin: 0.3rem 0 0;
      color: var(--fc-muted);
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.45;
    }

    .node-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: flex-end;
    }

    .node-open {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      color: var(--fc-primary-dark);
      background: var(--fc-primary-soft);
      font-size: 1rem;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .node-card:hover .node-open {
      color: #ffffff;
      background: var(--fc-primary-dark);
      transform: translateX(2px);
    }

    .node-learning-grid {
      display: grid;
      grid-template-columns: minmax(280px, 1.25fr) minmax(220px, 0.9fr) minmax(220px, 0.9fr);
      gap: 0.85rem;
    }

    .node-panel {
      min-width: 0;
      padding: 0.85rem;
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 20px;
      background: linear-gradient(180deg, #ffffff 0%, rgba(247, 250, 248, 0.82) 100%);
    }

    .node-panel-title {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.7rem;
      color: var(--fc-primary-dark);
      font-size: 0.84rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .node-video-frame {
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      background:
        radial-gradient(circle at top left, rgba(91, 199, 96, 0.22), transparent 12rem),
        linear-gradient(135deg, #10241b, #2f855a);
    }

    .node-video-frame video,
    .node-video-frame iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      object-fit: cover;
    }

    .node-video-empty,
    .resource-empty,
    .comment-empty {
      min-height: 120px;
      display: grid;
      place-items: center;
      padding: 1rem;
      border: 1px dashed rgba(47, 133, 90, 0.24);
      border-radius: 18px;
      color: var(--fc-muted);
      background: rgba(232, 248, 234, 0.48);
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .node-video-empty i,
    .resource-empty i,
    .comment-empty i {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--fc-primary-dark);
      font-size: 1.5rem;
    }

    .resource-list,
    .comment-list {
      display: grid;
      gap: 0.55rem;
    }

    .resource-item {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 0.55rem;
      align-items: center;
      padding: 0.62rem;
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 16px;
      background: #ffffff;
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .resource-item:hover {
      transform: translateX(2px);
      border-color: rgba(91, 199, 96, 0.3);
      background: var(--fc-primary-soft);
    }

    .resource-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: var(--fc-primary-dark);
      background: var(--fc-primary-soft);
      font-size: 1.1rem;
    }

    .resource-title,
    .comment-author {
      margin: 0;
      color: var(--fc-text);
      font-size: 0.84rem;
      font-weight: 900;
      line-height: 1.35;
    }

    .resource-meta,
    .comment-text {
      margin: 0.12rem 0 0;
      color: var(--fc-muted);
      font-size: 0.76rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .comment-item {
      padding: 0.68rem;
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 16px;
      background: #ffffff;
    }

    .comment-compose {
      display: grid;
      gap: 0.5rem;
      margin-top: 0.65rem;
    }

    .comment-compose textarea {
      width: 100%;
      min-height: 74px;
      resize: vertical;
      padding: 0.7rem;
      border: 1px solid rgba(229, 231, 235, 0.95);
      border-radius: 16px;
      color: var(--fc-text);
      font-size: 0.82rem;
      font-weight: 700;
      outline: none;
    }

    .comment-compose textarea:focus {
      border-color: rgba(91, 199, 96, 0.45);
      box-shadow: 0 0 0 4px rgba(91, 199, 96, 0.12);
    }

    .comment-compose button {
      justify-self: end;
      border: 0;
      border-radius: 999px;
      padding: 0.55rem 0.9rem;
      color: #ffffff;
      background: var(--fc-primary-dark);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .comment-compose button:disabled {
      opacity: 0.72;
      cursor: not-allowed;
    }

    .empty-state,
    .loading-state {
      display: grid;
      place-items: center;
      min-height: 260px;
      padding: 2rem;
      border: 1px dashed rgba(47, 133, 90, 0.28);
      border-radius: 24px;
      color: var(--fc-muted);
      background: rgba(232, 248, 234, 0.46);
      text-align: center;
      font-weight: 700;
    }

    .message-box {
      display: none;
      margin-top: 0.75rem;
      padding: 0.75rem 0.9rem;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .message-box.show {
      display: block;
    }

    .message-box.success {
      color: var(--fc-primary-dark);
      background: var(--fc-primary-soft);
    }

    .message-box.error {
      color: #b42318;
      background: #fef3f2;
    }

    @media (max-width: 1180px) {
      .join-hero,
      .learning-layout {
        grid-template-columns: 1fr;
      }

      .join-form-card {
        justify-self: stretch;
        width: 100%;
      }

      .path-progress {
        text-align: left;
      }
    }

    @media (max-width: 640px) {
      .join-hero,
      .panel-card {
        border-radius: 24px;
        padding: 1rem;
      }

      .detail-header,
      .path-header,
      .node-card {
        grid-template-columns: 1fr;
      }

      .join-form-card .d-flex {
        flex-direction: column !important;
        align-items: stretch;
      }

      .detail-actions,
      .node-badges {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>
<div id="overlay" class="overlay"></div>

<nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3 shadow-sm">
  <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm">

  </button>

  <div class="topbar-main">
    <div class="topbar-title-wrap d-none d-md-block">
      <h5 class="topbar-title fw-bold text-dark ms-1">Không gian học <span class="badge bg-primary-subtle text-primary rounded-pill">Roadmap</span></h5>
    </div>
    <ul class="topbar-actions list-unstyled">
      <li class="dropdown">
        <button class="notification-trigger position-relative text-secondary d-flex align-items-center justify-content-center border-0"
                type="button"
                id="notificationDropdown"
                data-bs-toggle="dropdown"
                aria-expanded="false"
                aria-label="Thông báo quiz cần làm">
          <i class="ti ti-bell-ringing fs-5 text-dark"></i>
          <span id="notificationBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm d-none">0</span>
        </button>
        <div class="dropdown-menu dropdown-menu-end notification-menu p-0 border-0" aria-labelledby="notificationDropdown">
          <div class="p-3 border-bottom bg-white">
            <div class="d-flex align-items-center justify-content-between">
              <div>
                <h6 class="fw-900 text-dark mb-1">Thông báo</h6>
                <p class="small text-muted fw-semibold mb-0" id="notificationSummary">Đang tải thông báo...</p>
              </div>
              <i class="ti ti-bell text-primary fs-4"></i>
            </div>
          </div>
          <div id="notificationList" class="notification-list">
            <div class="text-center text-muted py-4 px-3">
              <div class="spinner-border text-primary mb-2" role="status"></div>
              <p class="small fw-semibold mb-0">Đang tải quiz cần làm...</p>

</nav>

<aside id="sidebar" class="sidebar bg-white border-end-0 shadow-sm">
  <div class="logo-area border-bottom border-light">

      <div class="bg-primary text-white rounded p-1 d-flex align-items-center justify-content-center me-2">
        <i class="ti ti-book-2 fs-3"></i>
      </div>
      <span class="logo-text fw-bolder fs-4 text-dark" style="letter-spacing: -0.5px;">Flipped<span class="text-primary">Class</span></span>
    </a>
  </div>
  <ul class="nav flex-column mt-4">
    <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="@{/student/dashboard}" data-nav-key="dashboard"><i class="ti ti-layout-dashboard fs-5"></i><span class="nav-text">Tổng quan</span></a></li>
    <li><a class="nav-link active rounded-pill mx-3 mb-2 px-4 fw-bold" th:href="@{/student/learning-spaces}" data-nav-key="learning-spaces" aria-current="page"><i class="ti ti-books fs-5"></i><span class="nav-text">Lớp của tôi</span></a></li>
    <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="@{/student/my-quizzes}" data-nav-key="my-quiz"><i class="ti ti-list-check fs-5"></i><span class="nav-text">My quiz</span></a></li>
    <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="@{/}" data-nav-key="reports"><i class="ti ti-chart-pie fs-5"></i><span class="nav-text">Báo cáo</span></a></li>

<main id="content" class="content py-10">
  <div class="container-fluid px-xl-5 page-shell">
    <section class="join-hero">

      <form id="joinSpaceForm" class="join-form-card">

        <div class="d-flex flex-column gap-3">
          <input id="inviteCode" class="form-control invite-input" type="text" placeholder="" autocomplete="off" maxlength="24" required>
          <button id="joinSpaceButton" class="btn btn-primary rounded-pill fw-bold" type="submit">
            <i class="ti ti-door-enter me-2"></i>Tham gia lớp

</main>

<script>
  const token = localStorage.getItem('jwt_token');
  const userId = localStorage.getItem('user_id');

  const state = {
    spaces: [],
    selectedSpaceId: null,
    searchTerm: '',
    focusRoadmapOnce: false
  };

  const spacesList = document.getElementById('spacesList');
  const spaceDetail = document.getElementById('spaceDetail');
  const spaceCount = document.getElementById('spaceCount');
  const spaceSearch = document.getElementById('spaceSearch');
  const joinForm = document.getElementById('joinSpaceForm');
  const inviteCodeInput = document.getElementById('inviteCode');
  const joinButton = document.getElementById('joinSpaceButton');
  const joinMessage = document.getElementById('joinMessage');

  function authHeaders(includeJson = true) {
    const headers = { Authorization: `Bearer ${token}` };
    if (includeJson) headers['Content-Type'] = 'application/json';
    return headers;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function truncate(value, maxLength = 110) {
    const text = String(value || '').trim();
    if (!text) return '';
    return text.length > maxLength ? `${text.slice(0, maxLength - 1)}...` : text;
  }

  function statusLabel(status) {
    const labels = {
      ACTIVE: 'Đang học',
      DRAFT: 'Bản nháp',
      LOCKED: 'Chưa mở',
      UNLOCKED: 'Đã mở',
      ARCHIVED: 'Lưu trữ',
      DELETED: 'Đã xóa'
    };
    return labels[status] || status || 'Chưa rõ';
  }

  function nodeTypeLabel(type) {
    const labels = {
      LESSON: 'Bài học',
      VIDEO: 'Video',
      PRACTICE: 'Thực hành',
      QUIZ: 'Quiz',
      REVIEW: 'Ôn tập'
    };
    return labels[type] || type || 'Node';
  }

  function roleLabel(role) {
    const labels = {
      MEMBER: 'Sinh viên',
      OWNER: 'Chủ lớp',
      SUPPORTER: 'Trợ giảng'
    };
    return labels[role] || role || 'Thành viên';
  }

  function setJoinMessage(message, type) {
    joinMessage.textContent = message;
    joinMessage.className = `message-box show ${type}`;
  }

  function clearJoinMessage() {
    joinMessage.textContent = '';
    joinMessage.className = 'message-box';
  }

  async function readError(response) {
    const text = await response.text();
    if (!text) return 'Có lỗi xảy ra. Vui lòng thử lại.';
    try {
      const json = JSON.parse(text);
      return json.message || json.error || text;
    } catch {
      return text;
    }
  }

  function flattenQuizzes(learningSpaces) {
    return (learningSpaces || []).flatMap((space) =>
      (space.quizzes || []).map((quiz) => ({ ...quiz, space }))
    );
  }

  function renderNotifications(learningSpaces) {
    const badge = document.getElementById('notificationBadge');
    const summary = document.getElementById('notificationSummary');
    const list = document.getElementById('notificationList');
    const pending = flattenQuizzes(learningSpaces).filter((quiz) => !quiz.isCompleted);

    if (badge) {
      badge.textContent = pending.length;
      badge.classList.toggle('d-none', pending.length === 0);
    }

    if (summary) {
      summary.textContent = pending.length
        ? `Bạn có ${pending.length} quiz cần làm.`
        : 'Không có thông báo mới.';
    }

    if (!list) return;

    if (!pending.length) {
      list.innerHTML = `
        <div class="text-center text-muted py-4 px-3">
          <i class="ti ti-circle-check text-success" style="font-size: 2.5rem;"></i>
          <h6 class="fw-bold text-dark mt-3 mb-1">Không còn quiz cần làm</h6>
          <p class="small fw-semibold mb-0">Các quiz đang mở đã hoàn thành hoặc chưa có quiz mới.</p>
        </div>`;
      return;
    }

    const items = pending.slice(0, 5).map((quiz) => `
      <a class="notification-item" href="/student/take-quiz?quizId=${encodeURIComponent(quiz.id)}">
        <div class="d-flex gap-3 align-items-start">
          <span class="notification-icon flex-shrink-0">
            <i class="ti ti-file-pencil"></i>
          </span>
          <div class="min-w-0">
            <h6 class="fw-bold mb-1">${escapeHtml(quiz.title || 'Quiz chưa đặt tên')}</h6>
            <p class="small text-muted fw-semibold mb-1">${escapeHtml(quiz.space?.name || 'Learning space')}</p>
            <span class="small text-primary fw-bold">Làm quiz ngay</span>
          </div>
        </div>
      </a>`).join('');

    const more = pending.length > 5
      ? `<a class="notification-item text-center fw-bold text-primary" href="/student/my-quizzes">Xem thêm ${pending.length - 5} quiz</a>`
      : '';

    list.innerHTML = items + more;
  }

  function renderNotificationError(message) {
    const badge = document.getElementById('notificationBadge');
    const summary = document.getElementById('notificationSummary');
    const list = document.getElementById('notificationList');

    if (badge) {
      badge.textContent = '!';
      badge.classList.remove('d-none');
    }
    if (summary) summary.textContent = 'Không tải được thông báo.';
    if (list) list.innerHTML = `<div class="alert alert-danger m-3">${escapeHtml(message || 'Không tải được thông báo.')}</div>`;
  }

  function readInitialSpaceId() {
    const value = new URLSearchParams(window.location.search).get('spaceId');
    const id = Number(value);
    return Number.isFinite(id) && id > 0 ? id : null;
  }

  function shouldFocusRoadmap() {
    const params = new URLSearchParams(window.location.search);
    return params.get('focus') === 'roadmap' || window.location.hash === '#roadmap';
  }

  function focusRoadmapIfNeeded() {
    if (!state.focusRoadmapOnce) return;
    state.focusRoadmapOnce = false;
    requestAnimationFrame(() => {
      spaceDetail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  async function loadSpaces(preferredSpaceId = null) {
    if (!token || !userId) {
      window.location.href = '/login';
      return;
    }

    spacesList.innerHTML = '<div class="loading-state">Đang tải danh sách lớp...</div>';

    try {
      const response = await fetch(`/api/students/${userId}/dashboard`, {
        headers: authHeaders(false)
      });

      if (!response.ok) {
        throw new Error(await readError(response));
      }

      const data = await response.json();
      state.spaces = data.learningSpaces || [];
      renderNotifications(state.spaces);
      renderSpaces();

      const preferred = Number(preferredSpaceId);
      const hasPreferred = Number.isFinite(preferred) && state.spaces.some((space) => space.id === preferred);
      const nextSpaceId = hasPreferred ? preferred : state.selectedSpaceId || (state.spaces[0] && state.spaces[0].id);
      if (nextSpaceId) {
        await selectSpace(nextSpaceId);
      } else {
        renderEmptyDetail();
      }
    } catch (error) {
      renderNotificationError(error.message);
      spacesList.innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`;
      renderEmptyDetail('Không tải được learning space', 'Vui lòng kiểm tra đăng nhập hoặc thử lại sau.');
    }
  }

  function renderSpaces() {
    const keyword = state.searchTerm.trim().toLowerCase();
    const filtered = state.spaces.filter((space) => {
      const haystack = `${space.name || ''} ${space.description || ''} ${space.inviteCode || ''}`.toLowerCase();
      return haystack.includes(keyword);
    });

    spaceCount.textContent = `${state.spaces.length} lớp`;

    if (filtered.length === 0) {
      spacesList.innerHTML = `
        <div class="empty-state">
          <div>
            <div class="mb-2 text-primary" style="font-size: 2rem;"><i class="ti ti-school-off"></i></div>
            <p class="mb-0">Chưa có lớp phù hợp. Hãy nhập mã mời để tham gia learning space.</p>
          </div>
        </div>`;
      return;
    }

    spacesList.innerHTML = filtered.map((space) => `
      <button type="button" class="space-card ${space.id === state.selectedSpaceId ? 'active' : ''}" data-space-id="${space.id}">
        <h3 class="space-card-title">${escapeHtml(space.name || 'Learning space chưa đặt tên')}</h3>
        <div class="space-meta">
          <span class="soft-chip"><i class="ti ti-user"></i>${escapeHtml(roleLabel(space.memberRole))}</span>
          <span class="soft-chip"><i class="ti ti-circle-check"></i>${escapeHtml(statusLabel(space.status))}</span>
        </div>
      </button>
    `).join('');

    document.querySelectorAll('[data-space-id]').forEach((button) => {
      button.addEventListener('click', () => selectSpace(Number(button.dataset.spaceId)));
    });
  }

  function renderEmptyDetail(title = 'Chọn một learning space', message = 'Roadmap môn học và các node sẽ hiển thị ở đây.') {
    spaceDetail.innerHTML = `
      <div class="empty-state">
        <div>
          <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-route"></i></div>
          <h2 class="section-title">${escapeHtml(title)}</h2>
          <p class="section-note">${escapeHtml(message)}</p>
        </div>
      </div>`;
  }

  async function selectSpace(spaceId) {
    const selected = state.spaces.find((space) => space.id === Number(spaceId));
    if (!selected) return;

    state.selectedSpaceId = selected.id;
    renderSpaces();
    renderDetailLoading(selected);

    try {
      const response = await fetch(`/api/learning-spaces/${selected.id}/learning-paths`, {
        headers: authHeaders(false)
      });

      if (!response.ok) {
        throw new Error(await readError(response));
      }

      const paths = await response.json();
      renderDetail(selected, paths || []);
    } catch (error) {
      renderDetail(selected, [], error.message);
    } finally {
      focusRoadmapIfNeeded();
    }
  }

  function renderDetailLoading(space) {
    spaceDetail.innerHTML = `
      ${detailHeaderTemplate(space)}
      <div class="loading-state">Đang tải roadmap của lớp...</div>`;
  }

    function detailHeaderTemplate(space) {
    }

  function renderDetail(space, paths, errorMessage = '') {
    if (errorMessage) {
      spaceDetail.innerHTML = `
        ${detailHeaderTemplate(space)}
        <div class="empty-state">
          <div>
            <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-alert-circle"></i></div>
            <h2 class="section-title">Không tải được roadmap</h2>
            <p class="section-note">${escapeHtml(errorMessage)}</p>
          </div>
        </div>`;
      return;
    }

    if (!paths.length) {
      spaceDetail.innerHTML = `
        ${detailHeaderTemplate(space)}
        <div class="empty-state">
          <div>
            <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-map-off"></i></div>
            <h2 class="section-title">Chưa có roadmap</h2>
            <p class="section-note">Giảng viên chưa tạo môn học hoặc node cho learning space này.</p>
          </div>
        </div>`;
      return;
    }

    const sortedPaths = [...paths].sort((a, b) => (a.position || 0) - (b.position || 0));
    spaceDetail.innerHTML = `
      ${detailHeaderTemplate(space)}
      <div class="roadmap-grid">
        ${sortedPaths.map((path, index) => pathTemplate(path, index)).join('')}
      </div>`;
  }

  function pathTemplate(path, index) {
    const nodes = [...(path.nodes || [])].sort((a, b) => (a.id || 0) - (b.id || 0));
    const openNodes = nodes.filter((node) => ['UNLOCKED', 'ACTIVE'].includes(node.status)).length;
    const percent = nodes.length ? Math.round((openNodes / nodes.length) * 100) : 0;

    return `
      <article class="path-card">
        <header class="path-header">
          <div>
            <span class="path-kicker">Môn học ${index + 1}</span>
            <h3 class="path-title">${escapeHtml(path.title || 'Môn học chưa đặt tên')}</h3>
          </div>
          <div class="path-progress">
            <div class="fw-bold text-primary mb-2">${percent}% đã mở</div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${percent}%;"></div>
            </div>
            <div class="small text-muted fw-semibold mt-2">${nodes.length} node</div>
          </div>
        </header>
        <div class="node-timeline">
          ${nodes.length ? nodes.map((node, nodeIndex) => nodeTemplate(node, nodeIndex)).join('') : emptyNodesTemplate()}
        </div>
      </article>`;
  }

  function nodeTemplate(node, index) {
    const params = new URLSearchParams({
      nodeId: node.id,
      spaceId: state.selectedSpaceId || ''
    });

    return `
      <a class="node-card" href="/student/learning-node?${params.toString()}">
        <div class="node-index">${index + 1}</div>
        <div>
          <h4 class="node-title">${escapeHtml(node.title || `Node ${index + 1}`)}</h4>
          <p class="node-content">${escapeHtml(node.content || 'Bấm để mở trang học riêng của node này.')}</p>
        </div>
        <div class="node-badges">
          <span class="soft-chip"><i class="ti ti-layers-subtract"></i>${escapeHtml(nodeTypeLabel(node.nodeType))}</span>
          <span class="soft-chip"><i class="ti ti-lock-open"></i>${escapeHtml(statusLabel(node.status))}</span>
        </div>
        <span class="node-open" aria-hidden="true"><i class="ti ti-arrow-up-right"></i></span>
      </a>`;
  }

  function emptyNodesTemplate() {
    return `
      <div class="empty-state" style="min-height: 160px;">
        <div>
          <div class="mb-2 text-primary" style="font-size: 2rem;"><i class="ti ti-node-off"></i></div>
          <p class="mb-0">Môn học này chưa có node.</p>
        </div>
      </div>`;
  }

  async function copyInviteCode(code) {
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code);
      setJoinMessage(`Đã sao chép mã ${code}.`, 'success');
    } catch {
      setJoinMessage(`Mã lớp: ${code}`, 'success');
    }
  }

  joinForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearJoinMessage();

    const inviteCode = inviteCodeInput.value.trim().toUpperCase();
    if (!inviteCode) {
      setJoinMessage('Vui lòng nhập mã mời.', 'error');
      return;
    }

    joinButton.disabled = true;
    joinButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Đang tham gia...';

    try {
      const response = await fetch('/api/learning-spaces/join', {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify({ inviteCode })
      });

      if (!response.ok) {
        throw new Error(await readError(response));
      }

      const data = await response.json();
      setJoinMessage(data.message || 'Tham gia lớp học thành công.', 'success');
      inviteCodeInput.value = '';
      await loadSpaces(data.learningSpaceId);
    } catch (error) {
      setJoinMessage(error.message, 'error');
    } finally {
      joinButton.disabled = false;
      joinButton.innerHTML = '<i class="ti ti-door-enter me-2"></i>Tham gia lớp';
    }
  });

  spaceSearch.addEventListener('input', () => {
    state.searchTerm = spaceSearch.value;
    renderSpaces();
  });

  function setActiveSidebarLink(activeKey) {
    document.querySelectorAll('.sidebar .nav-link[data-nav-key]').forEach(link => {
      const isActive = link.dataset.navKey === activeKey;
      link.classList.toggle('active', isActive);
      link.classList.toggle('fw-bold', isActive);
      link.classList.toggle('fw-semibold', !isActive);

      if (isActive) {
        link.setAttribute('aria-current', 'page');
      } else {
        link.removeAttribute('aria-current');
      }
    });
  }

  function initSidebarActiveState() {
    const path = window.location.pathname.replace(/\/+$/, '') || '/';
    let activeKey = null;

    if (path === '/student/dashboard' && window.location.hash === '#myQuizSection') {
      activeKey = 'my-quiz';
    } else if (path === '/student/dashboard') {
      activeKey = 'dashboard';
    } else if (path.startsWith('/student/learning-spaces')) {
      activeKey = 'learning-spaces';
    } else if (path.startsWith('/student/my-quizzes')) {
      activeKey = 'my-quiz';
    } else if (path.startsWith('/student/take-quiz')) {
      activeKey = 'my-quiz';
    } else if (path.startsWith('/student/reports')) {
      activeKey = 'reports';
    }

    if (activeKey) {
      setActiveSidebarLink(activeKey);
    }

    document.querySelectorAll('.sidebar .nav-link[data-nav-key]').forEach(link => {
      link.addEventListener('click', () => setActiveSidebarLink(link.dataset.navKey));
    });
  }

  function logout() {
    localStorage.removeItem('jwt_token');
    localStorage.removeItem('user_id');
    window.location.href = '/';
  }

  document.addEventListener('DOMContentLoaded', () => {
    initSidebarActiveState();
    state.focusRoadmapOnce = shouldFocusRoadmap();
    loadSpaces(readInitialSpaceId());
  });
</script>
</body>
</html>
