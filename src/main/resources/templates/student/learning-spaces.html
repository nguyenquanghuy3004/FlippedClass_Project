<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Không gian học - FlippedClass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">

  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">

  <script th:src="@{/assets/js/student-auth.js}"></script>
  <link rel="stylesheet" th:href="@{/assets/css/student-learning-spaces.css}">
</head>

<body>
<div id="overlay" class="overlay"></div>

<nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3 shadow-sm">
  <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm">
    <i class="ti ti-layout-sidebar-left-expand"></i>
  </button>
  <button id="mobileBtn" class="btn btn-light btn-icon btn-sm d-lg-none me-2">
    <i class="ti ti-layout-sidebar-left-expand"></i>
  </button>

  <div class="topbar-main">
    <div class="topbar-title-wrap d-none d-md-block">
      <h5 class="topbar-title fw-bold text-dark ms-1">Không gian học <span class="badge bg-primary-subtle text-primary rounded-pill">Roadmap</span></h5>
    </div>
    <ul class="topbar-actions list-unstyled">
      <li class="dropdown">
        <button class="notification-trigger position-relative text-secondary d-flex align-items-center justify-content-center border-0"
                type="button"
                id="notificationDropdown"
                data-bs-toggle="dropdown"
                aria-expanded="false"
                aria-label="Thông báo quiz cần làm">
          <i class="ti ti-bell-ringing fs-5 text-dark"></i>
          <span id="notificationBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm d-none">0</span>
        </button>
        <div class="dropdown-menu dropdown-menu-end notification-menu p-0 border-0" aria-labelledby="notificationDropdown">
          <div class="p-3 border-bottom bg-white">
            <div class="d-flex align-items-center justify-content-between">
              <div>
                <h6 class="fw-900 text-dark mb-1">Thông báo</h6>
                <p class="small text-muted fw-semibold mb-0" id="notificationSummary">Đang tải thông báo...</p>
              </div>
              <i class="ti ti-bell text-primary fs-4"></i>
            </div>
          </div>
          <div id="notificationList" class="notification-list">
            <div class="text-center text-muted py-4 px-3">
              <div class="spinner-border text-primary mb-2" role="status"></div>
              <p class="small fw-semibold mb-0">Đang tải quiz cần làm...</p>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</nav>

<aside id="sidebar" class="sidebar bg-white border-end-0 shadow-sm">
  <div class="logo-area border-bottom border-light">
    <a th:href="@{/}" class="d-inline-flex align-items-center text-decoration-none">
      <div class="bg-primary text-white rounded p-1 d-flex align-items-center justify-content-center me-2">
        <i class="ti ti-book-2 fs-3"></i>
      </div>
      <span class="logo-text fw-bolder fs-4 text-dark" style="letter-spacing: -0.5px;">Flipped<span class="text-primary">Class</span></span>
    </a>
  </div>
  <ul class="nav flex-column mt-4">
    <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="@{/student/dashboard}" data-nav-key="dashboard"><i class="ti ti-layout-dashboard fs-5"></i><span class="nav-text">Tổng quan</span></a></li>
    <li><a class="nav-link active rounded-pill mx-3 mb-2 px-4 fw-bold" th:href="@{/student/learning-spaces}" data-nav-key="learning-spaces" aria-current="page"><i class="ti ti-books fs-5"></i><span class="nav-text">Lớp của tôi</span></a></li>
    <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="@{/student/my-quizzes}" data-nav-key="my-quiz"><i class="ti ti-list-check fs-5"></i><span class="nav-text">My quiz</span></a></li>
    <li><a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="@{/}" data-nav-key="reports"><i class="ti ti-chart-pie fs-5"></i><span class="nav-text">Báo cáo</span></a></li>

    <li class="mt-auto pb-4">
      <a class="nav-link logout-link rounded-pill mx-3 px-4" href="javascript:void(0)" onclick="logout()"><i class="ti ti-logout fs-5"></i><span class="nav-text">Đăng xuất</span></a>
    </li>
  </ul>
</aside>

<main id="content" class="content py-10">
  <div class="container-fluid px-xl-5 page-shell">
    <section class="join-hero">
      <div>
        <span class="eyebrow"><i class="ti ti-door-enter"></i> Tham gia learning space</span>
      </div>

      <form id="joinSpaceForm" class="join-form-card">
        <label for="inviteCode" class="form-label fw-bold text-dark">Mã mời lớp học</label>
        <div class="d-flex flex-column gap-3">
          <input id="inviteCode" class="form-control invite-input" type="text" placeholder="" autocomplete="off" maxlength="24" required>
          <button id="joinSpaceButton" class="btn btn-primary rounded-pill fw-bold" type="submit">
            <i class="ti ti-door-enter me-2"></i>Tham gia lớp
          </button>
        </div>
        <div id="joinMessage" class="message-box"></div>
      </form>
    </section>

    <section class="learning-layout">
      <aside class="panel-card">
        <div class="d-flex align-items-start justify-content-between gap-3">
          <div>
            <h2 class="section-title">LEARNING SPACES</h2>
          </div>
          <span id="spaceCount" class="soft-chip">lớp</span>
        </div>

        <div class="mt-3">
          <input id="spaceSearch" class="form-control rounded-pill" type="search" placeholder="Tìm lớp học...">
        </div>

        <div id="spacesList" class="space-list">
          <div class="loading-state">Đang tải danh sách lớp...</div>
        </div>
      </aside>

      <section class="panel-card detail-shell">
        <div id="spaceDetail">
          <div class="empty-state">
            <div>
              <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-route"></i></div>
            </div>
          </div>
        </div>
      </section>
    </section>
  </div>
</main>

<script th:src="@{/assets/js/student-learning-spaces.js}"></script>
</body>
</html>
