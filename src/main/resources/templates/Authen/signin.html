<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Sign In - FlippedClass</title>


  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="manifest" th:href="@{/assets/site.webmanifest}">
  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/auth.css}">


  <script src="https://accounts.google.com/gsi/client" async defer></script>


</head>
<body class="auth-fullbg">
<div class="auth-fullbg-overlay"></div>
<div class="auth-center-wrap">
  <div class="auth-glass-card">
    <div class="text-center mb-4">
      <a href="/" class="mb-2 d-inline-flex align-items-center text-decoration-none">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="#fff" class="bi bi-mortarboard-fill me-2" viewBox="0 0 16 16">
          <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v2h3v-2a1 1 0 0 0-1-1V6.739l.686-.275a.5.5 0 0 0 .025-.917l-7.5-3.5Z"/>
          <path d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466 4.176 9.032Z"/>
        </svg>
        <span class="auth-glass-logo">FlippedClass</span>
      </a>
      <h1 class="auth-glass-title">Sign In</h1>
      <p class="auth-glass-sub">Welcome back!</p>
    </div>

    <form id="loginForm" class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="username" class="auth-glass-label">Email or Username <span class="text-danger">*</span></label>
        <input id="username" type="text" class="auth-glass-input" placeholder="Enter username or email" required autofocus>
        <div class="invalid-feedback">Please enter your account.</div>
      </div>

      <div class="mb-4">
        <label for="password" class="auth-glass-label">Password <span class="text-danger">*</span></label>
        <div class="position-relative">
          <input id="password" type="password" class="auth-glass-input" placeholder="Enter your password" required minlength="6" style="padding-right: 45px;">
          <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none text-muted" tabindex="-1" onclick="togglePassword('password', this)" style="padding: 0 12px; z-index: 5;">
            <i class="ti ti-eye fs-5" style="color: rgba(255,255,255,0.7);"></i>
          </button>
        </div>
        <div class="invalid-feedback">Password must be at least 6 characters.</div>
      </div>

      <div id="errorMsg" class="auth-msg auth-msg-error" style="display: none;"></div>

      <button class="auth-glass-btn" type="submit">Sign In</button>

      <div class="auth-glass-divider">Or sign in with</div>

      <div id="g_id_onload"
           data-client_id="790885197434-tj8p3el3prc6n6fakj3udbuoqml6dpq1.apps.googleusercontent.com"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleGoogleLogin"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin d-flex justify-content-center w-100 mb-3"
           data-type="standard" data-shape="rectangular" data-theme="outline"
           data-text="signin_with" data-size="large" data-logo_alignment="left">
      </div>
    </form>

    <div class="text-center mt-3 auth-glass-footer">
      Don't have an account? <a href="/register">Register here.</a>
    </div>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn = this.querySelector('button[type="submit"]');
      
      const form = this;
      
      if (!form.checkValidity()) {
          e.stopPropagation();
          form.classList.add('was-validated');
          return;
      }
      form.classList.add('was-validated');
      
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Processing...';
      btn.disabled = true;
      
      fetch('/api/auth/signin', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
          },
          body: JSON.stringify({
              username: username,
              password: password
          })
      })
      .then(response => {
          if (!response.ok) {
              throw new Error('Sign in failed. Incorrect username or password.');
          }
          return response.json();
      })
      .then(data => {
          const token = data.token;
          localStorage.setItem('jwt_token', token);
          localStorage.setItem('user_id', data.id);
          
          try {
              const payload = JSON.parse(atob(token.split('.')[1]));
              if (payload.roles && (payload.roles.includes('ADMIN') || payload.roles.includes('ROLE_ADMIN'))) {
                  window.location.href = '/admin/dashboard';
              } else if (payload.roles && (payload.roles.includes('MENTOR') || payload.roles.includes('ROLE_MENTOR'))) {
                  window.location.href = '/lecturer/dashboard';
              } else if (payload.roles && (payload.roles.includes('STUDENT') || payload.roles.includes('ROLE_STUDENT'))) {
                  window.location.href = '/student/dashboard';
              } else {
                  window.location.href = '/';
              }
          } catch(e) {
              window.location.href = '/';
          }
      })
      .catch(error => {
          errorMsg.textContent = error.message;
          errorMsg.style.display = 'block';
          btn.innerHTML = 'Sign In';
          btn.disabled = false;
      });
  });

  function handleGoogleLogin(response) {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      fetch('/api/auth/google', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
          },
          body: JSON.stringify({
              idToken: response.credential
          })
      })
      .then(res => {
          if (!res.ok) {
              throw new Error('Google sign in failed.');
          }
          return res.json();
      })
      .then(data => {
          const token = data.token;
          localStorage.setItem('jwt_token', token);
          localStorage.setItem('user_id', data.id);
          
          try {
              const payload = JSON.parse(atob(token.split('.')[1]));
              if (payload.roles && payload.roles.includes('ADMIN')) {
                  window.location.href = '/admin/dashboard';
              } else if (payload.roles && payload.roles.includes('MENTOR')) {
                  window.location.href = '/lecturer/dashboard';
              } else if (payload.roles && payload.roles.includes('STUDENT')) {
                  window.location.href = '/student/dashboard';
              } else {
                  window.location.href = '/';
              }
          } catch(e) {
              window.location.href = '/';
          }
      })
      .catch(error => {
          errorMsg.textContent = error.message;
          errorMsg.style.display = 'block';
      });
  }

  function togglePassword(inputId, btnElement) {
      const input = document.getElementById(inputId);
      const icon = btnElement.querySelector('i');
      if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('ti-eye');
          icon.classList.add('ti-eye-off');
      } else {
          input.type = 'password';
          icon.classList.remove('ti-eye-off');
          icon.classList.add('ti-eye');
      }
  }
</script>

</body>
</html>
