(function() {
    function handleUnauthorized() {
        console.warn('Phiên đăng nhập đã hết hạn hoặc không hợp lệ. Đang chuyển hướng về trang đăng nhập...');
        localStorage.removeItem('jwt_token');
        sessionStorage.removeItem('jwt_token');
        window.location.href = '/signin';
    }
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        try {
            const response = await originalFetch.apply(this, args);
            if (response.status === 401) {
                handleUnauthorized();
            }
            return response;
        } catch (error) {
            throw error;
        }
    };
    const originalXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function() {
        this.addEventListener('load', function() {
            if (this.status === 401) {
                handleUnauthorized();
            }
        });
        originalXhrOpen.apply(this, arguments);
    };
})();
</script>

<script>
  document.getElementById('confirmPassword').addEventListener('input', function () {

  document.getElementById('signupForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const fullName = document.getElementById('fullName').value;

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    errorMsg.style.display = 'none';

    if (!fullName || !username || !email || !password || (password !== confirmPassword)) {
      // Trigger browser default validation UI if needed, or simply return
      if (password !== confirmPassword) {
        errorMsg.textContent = 'Máº­t kháº©u xÃ¡c nháº­n khÃ´ng khá»›p.';

    btn.disabled = true;

              }
              return response.json();

              successMsg.style.display = 'block';

  function handleGoogleLogin(response) {
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    fetch('/api/auth/google', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        idToken: response.credential
      })
    })
            .then(res => {
              if (!res.ok) {
                throw new Error('ÄÄƒng nháº­p Google tháº¥t báº¡i.');
              }
              return res.json();
            })
            .then(data => {
              const token = data.token;
              localStorage.setItem('jwt_token', token);

              try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                if (payload.roles && (payload.roles.includes('ADMIN') || payload.roles.includes('ROLE_ADMIN'))) {
                  window.location.href = '/admin/dashboard';
                } else if (payload.roles && (payload.roles.includes('MENTOR') || payload.roles.includes('ROLE_MENTOR'))) {
                  window.location.href = '/lecturer/dashboard';
                } else if (payload.roles && (payload.roles.includes('STUDENT') || payload.roles.includes('ROLE_STUDENT'))) {
                  window.location.href = '/student/dashboard';
                } else {
                  window.location.href = '/';
                }
              } catch(e) {
                window.location.href = '/';
              }
            })
            .catch(error => {
              errorMsg.textContent = error.message;
              errorMsg.style.display = 'block';
            });
