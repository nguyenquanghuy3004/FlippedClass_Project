<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Sign Up - FlippedClass</title>



  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="manifest" th:href="@{/assets/site.webmanifest}">

  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <link rel="stylesheet" th:href="@{/assets/css/auth.css}">
  <!-- Google Sign-In/Sign-Up -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
  <div class="card shadow-sm border-0" style="max-width:480px; width:100%;">
    <div class="card-body p-4 p-sm-5">
      <div class="text-center mb-4">
        <a href="/" class="mb-2 d-inline-flex align-items-center text-decoration-none">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#198754"
               class="bi bi-mortarboard-fill me-2" viewBox="0 0 16 16">
            <path
                    d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v2h3v-2a1 1 0 0 0-1-1V6.739l.686-.275a.5.5 0 0 0 .025-.917l-7.5-3.5Z" />
            <path
                    d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466 4.176 9.032Z" />
          </svg>
          <span class="h4 mb-0 fw-bold text-success">FlippedClass</span>
        </a>
        <h1 class="card-title h4 fw-bold mt-3">Create a new account</h1>
      </div>

      <form id="signupForm" class="needs-validation mt-3" novalidate>

        <div class="mb-3">
          <label for="fullName" class="form-label small fw-bold">Full name <span class="text-danger">*</span></label>
          <input id="fullName" type="text" class="form-control" placeholder="John Doe" required>
          <div class="invalid-feedback">Please enter your full name.</div>
        </div>

        <div class="mb-3">
          <label for="username" class="form-label small fw-bold">Username <span
                  class="text-danger">*</span></label>
          <input id="username" type="text" class="form-control" placeholder="Use letters or numbers without spaces"
                 required minlength="3">
          <div class="invalid-feedback">Username must be at least 3 characters.</div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label small fw-bold">Email address <span class="text-danger">*</span></label>
          <input id="email" type="email" class="form-control" placeholder="name@example.com" required>
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label small fw-bold">Password <span class="text-danger">*</span></label>
          <input id="password" type="password" class="form-control" placeholder="Create a password" required minlength="6">
          <div class="invalid-feedback">At least 6 characters.</div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label small fw-bold">Confirm password <span
                  class="text-danger">*</span></label>
          <input id="confirmPassword" type="password" class="form-control" placeholder="Re-enter your password" required>
          <div class="invalid-feedback">Passwords do not match.</div>
        </div>

        <div id="errorMsg" class="text-danger small mb-3 text-center fw-bold" style="display: none;"></div>
        <div id="successMsg" class="text-success small mb-3 text-center fw-bold" style="display: none;"></div>

        <button class="btn btn-success w-100 mb-3 fw-bold" type="submit">Sign up</button>

        <div class="text-center text-muted small mb-3">Or sign up with</div>

        <div id="g_id_onload"
             data-client_id="790885197434-tj8p3el3prc6n6fakj3udbuoqml6dpq1.apps.googleusercontent.com"
             data-context="signup" data-ux_mode="popup" data-callback="handleGoogleLogin" data-auto_prompt="false">
        </div>

        <div class="g_id_signin d-flex justify-content-center w-100 mb-3" data-type="standard"
             data-shape="rectangular" data-theme="outline" data-text="signup_with" data-size="large"
             data-logo_alignment="left" data-locale="en">
        </div>

      </form>

      <div class="text-center mt-3 small text-muted">
        Already have an account? <a href="/login" class="text-success fw-bold text-decoration-none">Sign in</a>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('confirmPassword').addEventListener('input', function () {
    const password = document.getElementById('password').value;
    if (this.value !== password) {
      this.setCustomValidity('Passwords do not match.');
    } else {
      this.setCustomValidity('');
    }
  });

  document.getElementById('signupForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const fullName = document.getElementById('fullName').value;
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const btn = this.querySelector('button[type="submit"]');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!fullName || !username || !email || !password || (password !== confirmPassword)) {
      // Trigger browser default validation UI if needed, or simply return.
      if (password !== confirmPassword) {
        errorMsg.textContent = 'Password confirmation does not match.';
        errorMsg.style.display = 'block';
      }
      return;
    }

    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Processing...';
    btn.disabled = true;

    fetch('/api/auth/signup', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        username: username,
        email: email,
        password: password,
        fullName: fullName
      })
    })
            .then(response => {
              if (!response.ok) {
                return response.json().then(err => { throw new Error(err.message || 'Sign-up failed.'); });
              }
              return response.json();
            })
            .then(data => {
              successMsg.textContent = 'Sign-up successful! Redirecting to the sign-in page...';
              successMsg.style.display = 'block';
              setTimeout(() => {
                window.location.href = '/login';
              }, 2000);
            })
            .catch(error => {
              errorMsg.textContent = error.message;
              errorMsg.style.display = 'block';
              btn.innerHTML = 'Sign up';
              btn.disabled = false;
            });
  });

  function handleGoogleLogin(response) {
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    fetch('/api/auth/google', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        idToken: response.credential
      })
    })
            .then(res => {
              if (!res.ok) {
                throw new Error('Google sign-in failed.');
              }
              return res.json();
            })
            .then(data => {
              localStorage.setItem('jwt_token', data.token);
              window.location.href = '/';
            })
            .catch(error => {
              errorMsg.textContent = error.message;
              errorMsg.style.display = 'block';
            });
  }
</script>

</body>

</html>
