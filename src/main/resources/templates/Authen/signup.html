<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Sign Up - FlippedClass</title>



  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="manifest" th:href="@{/assets/site.webmanifest}">

  <script th:src="@{/assets/js/auth-interceptor.js}"></script>
  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <link rel="stylesheet" th:href="@{/assets/css/auth.css}">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
(function() {
    function handleUnauthorized() {
        console.warn('Session expired or invalid. Redirecting to sign in page...');
        localStorage.removeItem('jwt_token');
        sessionStorage.removeItem('jwt_token');
        window.location.href = '/signin';
    }
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        try {
            const response = await originalFetch.apply(this, args);
            if (response.status === 401) {
                handleUnauthorized();
            }
            return response;
        } catch (error) {
            throw error;
        }
    };
    const originalXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function() {
        this.addEventListener('load', function() {
            if (this.status === 401) {
                handleUnauthorized();
            }
        });
        originalXhrOpen.apply(this, arguments);
    };
})();
</script>
</head>

<body class="auth-fullbg">
<div class="auth-fullbg-overlay"></div>
<div class="auth-center-wrap">
  <div class="auth-glass-card">
    <div class="text-center mb-4">
      <a href="/" class="mb-2 d-inline-flex align-items-center text-decoration-none">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-mortarboard-fill me-2" viewBox="0 0 16 16">
          <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v2h3v-2a1 1 0 0 0-1-1V6.739l.686-.275a.5.5 0 0 0 .025-.917l-7.5-3.5Z"/>
          <path d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466 4.176 9.032Z"/>
        </svg>
        <span class="auth-glass-logo">FlippedClass</span>
      </a>
      <p class="auth-glass-sub text-center mb-4">Create a new account</p>
    </div>

    <form id="signupForm" class="needs-validation" novalidate>

      <div class="mb-3">
        <label for="fullName" class="auth-glass-label">Full Name <span class="text-danger">*</span></label>
        <input id="fullName" type="text" class="auth-glass-input" placeholder="John Doe" required autofocus>
        <div class="invalid-feedback">Please enter your full name.</div>
      </div>

      <div class="mb-3">
        <label for="username" class="auth-glass-label">Username <span class="text-danger">*</span></label>
        <input id="username" type="text" class="auth-glass-input" placeholder="e.g., johndoe" required minlength="3">
        <div class="invalid-feedback">Username must be at least 3 characters.</div>
      </div>

      <div class="mb-3">
        <label for="email" class="auth-glass-label">Email Address <span class="text-danger">*</span></label>
        <input id="email" type="email" class="auth-glass-input" placeholder="name@gmail.com" required>
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <div class="mb-3">
        <label for="password" class="auth-glass-label">Password <span class="text-danger">*</span></label>
        <div class="position-relative">
          <input id="password" type="password" class="auth-glass-input" placeholder="Create a password" required minlength="6" style="padding-right: 45px;">
          <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none text-muted" tabindex="-1" onclick="togglePassword('password', this)" style="padding: 0 12px; z-index: 5;">
            <i class="ti ti-eye fs-5" style="color: rgba(100,100,100,0.5);"></i>
          </button>
        </div>
        <div class="invalid-feedback">Must be at least 6 characters.</div>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="auth-glass-label">Confirm Password <span class="text-danger">*</span></label>
        <div class="position-relative">
          <input id="confirmPassword" type="password" class="auth-glass-input" placeholder="Confirm your password" required style="padding-right: 45px;">
          <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none text-muted" tabindex="-1" onclick="togglePassword('confirmPassword', this)" style="padding: 0 12px; z-index: 5;">
            <i class="ti ti-eye fs-5" style="color: rgba(100,100,100,0.5);"></i>
          </button>
        </div>
        <div class="invalid-feedback">Passwords do not match.</div>
      </div>

      <div id="errorMsg" class="auth-msg auth-msg-error" style="display: none;"></div>
      <div id="successMsg" class="auth-msg auth-msg-success" style="display: none; color: #198754; background: rgba(25, 135, 84, 0.1); border: 1px solid rgba(25, 135, 84, 0.2); padding: 10px; border-radius: 8px; margin-bottom: 1rem; text-align: center; font-weight: 500; font-size: 0.85rem;"></div>

      <button class="auth-glass-btn" type="submit">Sign Up</button>

      <div class="auth-glass-divider">Or sign up with</div>

      <div id="g_id_onload"
           data-client_id="790885197434-tj8p3el3prc6n6fakj3udbuoqml6dpq1.apps.googleusercontent.com"
           data-context="signup" data-ux_mode="popup" data-callback="handleGoogleLogin" data-auto_prompt="false">
      </div>

      <div class="g_id_signin d-flex justify-content-center w-100 mb-3" data-type="standard"
           data-shape="rectangular" data-theme="outline" data-text="signup_with" data-size="large"
           data-logo_alignment="left">
      </div>

    </form>

    <div class="text-center mt-3 auth-glass-footer">
      Already have an account? <a href="/signin">Sign In</a>
    </div>
  </div>
</div>

<script>
  document.getElementById('confirmPassword').addEventListener('input', function () {
    const password = document.getElementById('password').value;
    if (this.value !== password) {
      this.setCustomValidity('Passwords do not match.');
    } else {
      this.setCustomValidity('');
    }
  });

  document.getElementById('signupForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const fullName = document.getElementById('fullName').value;
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const btn = this.querySelector('button[type="submit"]');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!this.checkValidity()) {
      this.classList.add('was-validated');
      return;
    }

    if (password !== confirmPassword) {
      errorMsg.textContent = 'Passwords do not match.';
      errorMsg.style.display = 'block';
      return;
    }

    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Processing...';
    btn.disabled = true;

    fetch('/api/auth/signup', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        username: username,
        email: email,
        password: password,
        fullName: fullName
      })
    })
            .then(response => {
              if (!response.ok) {
                return response.json().then(err => { throw new Error(err.message || 'Sign up failed.'); });
              }
              return response.json();
            })
            .then(data => {
              successMsg.textContent = 'Sign up successful! Redirecting to sign in...';
              successMsg.style.display = 'block';
              setTimeout(() => {
                window.location.href = '/signin';
              }, 2000);
            })
            .catch(error => {
              errorMsg.textContent = error.message;
              errorMsg.style.display = 'block';
              btn.innerHTML = 'Sign Up';
              btn.disabled = false;
            });
  });

  function handleGoogleLogin(response) {
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    fetch('/api/auth/google', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        idToken: response.credential
      })
    })
            .then(res => {
              if (!res.ok) {
                throw new Error('Google sign in failed.');
              }
              return res.json();
            })
            .then(data => {
              const token = data.token;
              localStorage.setItem('jwt_token', token);

              try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                if (payload.roles && (payload.roles.includes('ADMIN') || payload.roles.includes('ROLE_ADMIN'))) {
                  window.location.href = '/admin/dashboard';
                } else if (payload.roles && (payload.roles.includes('MENTOR') || payload.roles.includes('ROLE_MENTOR'))) {
                  window.location.href = '/lecturer/dashboard';
                } else if (payload.roles && (payload.roles.includes('STUDENT') || payload.roles.includes('ROLE_STUDENT'))) {
                  window.location.href = '/student/dashboard';
                } else {
                  window.location.href = '/';
                }
              } catch(e) {
                window.location.href = '/';
              }
            })
            .catch(error => {
              errorMsg.textContent = error.message;
              errorMsg.style.display = 'block';
            });
  }

  function togglePassword(inputId, btnElement) {
    const input = document.getElementById(inputId);
    const icon = btnElement.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('ti-eye');
      icon.classList.add('ti-eye-off');
    } else {
      input.type = 'password';
      icon.classList.remove('ti-eye-off');
      icon.classList.add('ti-eye');
    }
  }
</script>

</body>

</html>
