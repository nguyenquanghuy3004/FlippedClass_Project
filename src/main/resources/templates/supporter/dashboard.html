<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{supporter/layout}">
<head>
    <meta charset="UTF-8">
    <title>Supporter Dashboard - FlippedClass</title>
    <th:block layout:fragment="head">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
            <div>
                <h2 class="fw-bold mb-0 text-primary"><i class="ti ti-heart-handshake"></i> Supporter Dashboard</h2>
                <p class="text-muted mb-0">Manage your mentees and track their progress.</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-success rounded-pill shadow-sm" data-bs-toggle="modal" data-bs-target="#createSpaceModal" style="background-color: #10b981; border-color: #10b981;">
                    <i class="ti ti-plus"></i> Create New Space
                </button>
                <button class="btn btn-primary rounded-pill shadow-sm" onclick="notifyMentees()">
                    <i class="ti ti-bell-ringing"></i> Notify Mentees
                </button>
            </div>
        </div>

        <div id="loader" class="text-center py-5 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="row" id="dashboardContent">
            <div class="col-12 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-bottom py-3">
                        <h5 class="mb-0 fw-bold">My Mentoring Spaces</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3" id="mySpacesGrid">
                            <div class="col-12 text-center text-muted py-4">Loading your spaces...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-bottom py-3">
                        <h5 class="mb-0 fw-bold">My Assigned Mentees</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                <tr>
                                    <th>Student</th>
                                    <th>Email</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody id="menteesTableBody">
                                <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Popup Tạo mới Không gian học tập (Create Space Modal) -->
        <div class="modal fade" id="createSpaceModal" tabindex="-1" aria-labelledby="createSpaceModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header border-bottom-0">
                        <h5 class="modal-title fw-bold" id="createSpaceModalLabel">Create Mentoring Space</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="createSpaceForm">
                            <div class="mb-3">
                                <label for="spaceName" class="form-label fw-bold">Name</label>
                                <input type="text" class="form-control bg-light border-0" id="spaceName" required minlength="3" maxlength="100">
                                <div class="invalid-feedback">Name is required</div>
                            </div>
                            <div class="mb-3">
                                <label for="spaceDescription" class="form-label fw-bold">Description</label>
                                <textarea class="form-control bg-light border-0" id="spaceDescription" rows="3" maxlength="500"></textarea>
                                <div class="invalid-feedback">Description is required</div>
                            </div>
                            <div class="mb-3">
                                <label for="spaceVisibility" class="form-label fw-bold">Visibility</label>
                                <select class="form-select bg-light border-0" id="spaceVisibility" required>
                                    <option value="PUBLIC">Public</option>
                                    <option value="PRIVATE">Private</option>
                                </select>
                            </div>
                            <div id="createSpaceError" class="text-danger mb-3" style="display:none;"></div>
                        </form>
                    </div>
                    <div class="modal-footer border-top-0">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary rounded-pill px-4" id="btnCreateSpace" style="background-color: #6366f1; border-color: #6366f1;">Create Space</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notify Modal -->
        <div class="modal fade" id="notifyModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header border-bottom-0">
                        <h5 class="modal-title fw-bold">Notify Mentees</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>Select a space to invite your mentees to:</p>
                        <select class="form-select mb-3" id="notifySpaceSelect">
                            <option value="">-- Loading your spaces --</option>
                        </select>
                    </div>
                    <div class="modal-footer border-top-0">
                        <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-success rounded-pill px-4" onclick="sendNotification()">Send Notification</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const spaceId = urlParams.get('spaceId') || 1; // Defaulting to 1 for demo
        const MENTOR_ID = localStorage.getItem('user_id') || 1;

        let mySpacesList = [];

        document.addEventListener("DOMContentLoaded", async () => {
            await loadMySpaces();
            await loadMentees();

            document.getElementById('btnCreateSpace').addEventListener('click', createSpace);
        });

        async function loadMySpaces() {
            const grid = document.getElementById('mySpacesGrid');
            const token = localStorage.getItem('jwt_token');
            try {
                const res = await fetch('/api/learning-spaces/my-spaces', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to load spaces');
                
                const currentUserId = localStorage.getItem('user_id');
                mySpacesList = await res.json();
                mySpacesList = mySpacesList.filter(s => s.status !== 'DELETE' && s.status !== 'ARCHIVE' && String(s.ownerId) === String(currentUserId));
                
                if (mySpacesList.length === 0) {
                    grid.innerHTML = '<div class="col-12 text-center text-muted py-4">You have not created any mentoring spaces yet.</div>';
                    return;
                }

                grid.innerHTML = '';
                mySpacesList.forEach(space => {
                    grid.innerHTML += `
                        <div class="col-md-4">
                            <div class="card h-100 shadow-sm border-0" style="border-radius: 12px; overflow:hidden;">
                                <div class="card-body bg-light" style="border-left: 4px solid #6366f1;">
                                    <h5 class="fw-bold text-dark mb-1">${space.name}</h5>
                                    <p class="text-muted small mb-3 text-truncate">${space.description || 'No description'}</p>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="badge bg-primary-subtle text-primary">${space.inviteCode}</span>
                                        <div class="d-flex gap-2">
                                            <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="deleteSpace(${space.id})" title="Delete Space"><i class="ti ti-trash"></i></button>
                                            <a href="/supporter/space/${space.id}" class="btn btn-sm btn-primary rounded-pill px-3">Go to Space <i class="ti ti-arrow-right"></i></a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="col-12 text-center text-danger py-4">Failed to load spaces.</div>';
            }
        }

        async function deleteSpace(spaceId) {
            Swal.fire({
                title: 'Delete Space?',
                text: "Are you sure you want to delete this space? This action cannot be undone.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Yes, delete it!'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const token = localStorage.getItem('jwt_token');
                        const res = await fetch(`/api/learning-spaces/${spaceId}/delete`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (res.ok) {
                            Swal.fire('Deleted!', 'The space has been deleted.', 'success');
                            loadMySpaces();
                        } else {
                            Swal.fire('Error', 'Failed to delete space', 'error');
                        }
                    } catch (err) {
                        console.error(err);
                        Swal.fire('Error', 'Connection error', 'error');
                    }
                }
            });
        }

        async function createSpace() {
            const name = document.getElementById('spaceName').value.trim();
            const desc = document.getElementById('spaceDescription').value.trim();
            const vis = document.getElementById('spaceVisibility').value;
            const btn = document.getElementById('btnCreateSpace');

            if (!name) return;

            btn.disabled = true;
            btn.textContent = "Creating...";

            try {
                const token = localStorage.getItem('jwt_token');
                const res = await fetch('/api/learning-spaces', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: name, description: desc, visibility: vis })
                });

                if (res.ok) {
                    $('#createSpaceModal').modal('hide');
                    document.getElementById('createSpaceForm').reset();
                    Swal.fire('Success', 'Space created successfully!', 'success');
                    loadMySpaces();
                } else {
                    const errorData = await res.json();
                    alert(errorData.message || 'Error creating space');
                }
            } catch(e) {
                console.error(e);
                alert("Connection error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Create Space";
            }
        }

        async function loadMentees() {
            const loader = document.getElementById('loader');
            const tbody = document.getElementById('menteesTableBody');
            
            loader.classList.remove('d-none');
            tbody.innerHTML = '';

            try {
                const token = localStorage.getItem('jwt_token');
                let allMentees = [];

                // Fetch all spaces the user is part of to get mentees from ANY space
                const spacesRes = await fetch('/api/learning-spaces/my-spaces', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (spacesRes.ok) {
                    const allSpaces = await spacesRes.json();
                    const activeSpaces = allSpaces.filter(s => s.status !== 'DELETE' && s.status !== 'ARCHIVE');
                    
                    for (const space of activeSpaces) {
                        const response = await fetch(`/api/learning-spaces/${space.id}/mentoring/mentees/${MENTOR_ID}`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        
                        if (response.ok) {
                            const mentees = await response.json();
                            mentees.forEach(m => {
                                m.spaceName = space.name;
                                allMentees.push(m);
                            });
                        }
                    }
                }
                
                if (allMentees.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">No mentees assigned yet.</td></tr>';
                    return;
                }

                allMentees.forEach(m => {
                    const name = m.fullName || (m.firstName + ' ' + m.lastName);
                    tbody.innerHTML += `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="avatar bg-primary-subtle text-primary fw-bold rounded-circle me-3" style="width: 40px; height: 40px; display:flex; align-items:center; justify-content:center;">
                                        ${name.charAt(0)}
                                    </div>
                                    <div>
                                        <div class="fw-bold">${name}</div>
                                        <small class="text-muted">@${m.username} &bull; ${m.spaceName}</small>
                                    </div>
                                </div>
                            </td>
                            <td>${m.email || 'N/A'}</td>
                            <td><span class="badge bg-warning-subtle text-warning">Needs Support</span></td>
                            <td>
                                <a href="/lecturer/student/${m.id}/profile" class="btn btn-sm btn-outline-info rounded-pill">
                                    <i class="ti ti-id"></i> Profile
                                </a>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Error loading mentees. Please try again.</td></tr>';
            } finally {
                loader.classList.add('d-none');
            }
        }

        function notifyMentees() {
            if (mySpacesList.length === 0) {
                Swal.fire('No Spaces Found', 'You need to create a Mentoring Space first before inviting mentees!', 'warning');
                return;
            }

            const select = document.getElementById('notifySpaceSelect');
            select.innerHTML = '';
            mySpacesList.forEach(s => {
                select.innerHTML += `<option value="${s.inviteCode}">${s.name} (Code: ${s.inviteCode})</option>`;
            });

            $('#notifyModal').modal('show');
        }

        function sendNotification() {
            const select = document.getElementById('notifySpaceSelect');
            const inviteCode = select.value;
            const spaceName = select.options[select.selectedIndex].text;

            $('#notifyModal').modal('hide');

            Swal.fire({
                icon: 'success',
                title: 'Notifications Sent!',
                html: `Sent invite code <b>${inviteCode}</b> for <b>${spaceName}</b> to all your assigned mentees. They will be able to join your space using this code!`,
                showConfirmButton: true,
                confirmButtonColor: '#3085d6',
                backdrop: `rgba(0,0,123,0.4)`
            });
        }
    </script>
</th:block>
</body>
</html>
