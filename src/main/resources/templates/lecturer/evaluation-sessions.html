<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{lecturer/layout}">

<head>
  <meta charset="UTF-8" />
  <title>Evaluation Sessions - FlippedClass</title>
  <th:block layout:fragment="head">
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/assets/css/lecturer-evaluation-sessions.css}">
  </th:block>
  <script>
(function() {
    function handleUnauthorized() {
        console.warn('Phiên đăng nhập đã hết hạn hoặc không hợp lệ. Đang chuyển hướng về trang đăng nhập...');
        localStorage.removeItem('jwt_token');
        sessionStorage.removeItem('jwt_token');
        window.location.href = '/signin';
    }
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        try {
            const response = await originalFetch.apply(this, args);
            if (response.status === 401) {
                handleUnauthorized();
            }
            return response;
        } catch (error) {
            throw error;
        }
    };
    const originalXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function() {
        this.addEventListener('load', function() {
            if (this.status === 401) {
                handleUnauthorized();
            }
        });
        originalXhrOpen.apply(this, arguments);
    };
})();
</script>
</head>

<body>
<div layout:fragment="content">
  <div class="container-fluid">

    <!-- BLUE BANNER -->
    <div class="page-header-blue">
      <div>
        <h1>Evaluation Sessions</h1>
        <p>Manage grading sessions and configure assessment criteria.</p>
      </div>
      <div>
        <button class="btn-create-white" onclick="toggleForm(true)">
          <i class="ti ti-plus"></i> Create Session
        </button>
      </div>
    </div>

    <div id="alertMessage" class="alert d-none mb-4 shadow-sm border-0 fw-bold rounded-3" role="alert"></div>

    <!-- CREATE FORM -->
    <div class="row" id="formContainer" style="display: none;">
      <div class="col-12 mb-5">
        <div class="card form-card">
          <div class="card-body p-5">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
              <h3 class="mb-0 fw-bold text-dark"><i class="ti ti-clipboard-plus me-2 text-primary"></i>Create
                Evaluation Session</h3>
              <button type="button" class="btn-close" aria-label="Close" onclick="toggleForm(false)"></button>
            </div>

            <form id="sessionForm" onsubmit="saveSession(event)">
              <div class="row g-4">
                <div class="col-md-12">
                  <label class="form-label fw-bold">Session Title <span class="text-danger">*</span></label>
                  <input type="text" class="form-control form-control-lg bg-light border-0" id="title"
                         placeholder="e.g. Midterm Presentation" required>
                </div>
                <div class="col-md-12">
                  <label class="form-label fw-bold">Select Learning Path (Module) <span class="text-danger">*</span></label>
                  <select class="form-select form-select-lg bg-light border-0" id="learningPathId" required>
                    <option value="" disabled selected>Loading modules...</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Grading Start Date <span class="text-danger">*</span></label>
                  <input type="datetime-local" class="form-control" id="gradingStartAt" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Grading Deadline <span class="text-danger">*</span></label>
                  <input type="datetime-local" class="form-control" id="gradingDeadlineAt" required>
                </div>

                <div class="col-12 mt-5">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0"><i class="ti ti-list-check text-primary"></i> Grading Criteria</h5>
                    <button type="button" class="btn btn-sm btn-outline-primary rounded-pill"
                            onclick="addCriterionRow()">
                      <i class="ti ti-plus"></i> Add Criterion
                    </button>
                  </div>

                  <div id="criteriaList">
                    <!-- Criteria rows injected via JS -->
                  </div>
                </div>
              </div>

              <div class="d-flex gap-3 mt-5 pt-3 border-top">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm"
                        id="saveBtn">Create Session</button>
                <button type="button" class="btn btn-light btn-lg rounded-pill px-4 fw-bold"
                        onclick="toggleForm(false)">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- SESSIONS GRID -->
    <div id="loader" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="row g-4" id="sessionsGrid">
      <!-- JS populated -->
    </div>

  </div>
</div>
</div>

<th:block layout:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Fetch from auth context, fallback to 1 for demo purposes
    const LECTURER_ID = localStorage.getItem('user_id') || 1;
    let criteriaCount = 0;
    
    let allSessions = [];
    let currentPage = 1;
    const itemsPerPage = 6;

    document.addEventListener("DOMContentLoaded", () => {
      fetchLearningPaths();
      fetchSessions();
      addCriterionRow(); // Add first row by default

      // Add instant date validation
      const startInput = document.getElementById('gradingStartAt');
      const deadlineInput = document.getElementById('gradingDeadlineAt');

      function validateDates() {
        if (startInput.value && deadlineInput.value) {
          if (new Date(deadlineInput.value) <= new Date(startInput.value)) {
            deadlineInput.setCustomValidity('Deadline must be after Start Date.');
            deadlineInput.reportValidity();
          } else {
            deadlineInput.setCustomValidity('');
          }
        }
      }

      startInput.addEventListener('change', validateDates);
      deadlineInput.addEventListener('change', validateDates);
    });

    function showAlert(message, type = 'success') {
      const alertEl = document.getElementById('alertMessage');
      alertEl.innerText = message;
      alertEl.className = `alert alert-${type} mb-4 fw-bold shadow-sm border-0 rounded-3`;
      alertEl.classList.remove('d-none');
      setTimeout(() => alertEl.classList.add('d-none'), 4000);
    }

    function toggleForm(show = true) {
      const container = document.getElementById('formContainer');
      if (show) {
        container.style.display = 'flex';
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        container.style.display = 'none';
        document.getElementById('sessionForm').reset();
      }
    }

    function addCriterionRow() {
      criteriaCount++;
      const id = criteriaCount;
      const list = document.getElementById('criteriaList');

      const rowHtml = `
        <div class="criteria-row" id="row-${id}">
          ${id > 1 ? `<button type="button" class="btn-remove-row" onclick="removeCriterionRow(${id})"><i class="ti ti-x"></i></button>` : ''}
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label fs-7 fw-bold text-muted">Criterion Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control crit-name" placeholder="e.g. Code Quality" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fs-7 fw-bold text-muted">Max Score <span class="text-danger">*</span></label>
              <input type="number" step="0.1" min="0.1" class="form-control crit-score" placeholder="10" required>
            </div>
            <div class="col-12">
              <label class="form-label fs-7 fw-bold text-muted">Description (Optional)</label>
              <input type="text" class="form-control crit-desc" placeholder="Details about this criterion...">
            </div>
          </div>
        </div>
      `;
      list.insertAdjacentHTML('beforeend', rowHtml);
    }

    function removeCriterionRow(id) {
      const row = document.getElementById(`row-${id}`);
      if (row) row.remove();
    }

    async function fetchLearningPaths() {
      try {
        const token = localStorage.getItem('jwt_token');
        if (!token) return;

        const response = await fetch(`/api/evaluations/learning-paths?lecturerId=${LECTURER_ID}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        if (!response.ok) throw new Error('Failed to fetch learning paths');

        const data = await response.json();
        const select = document.getElementById('learningPathId');
        select.innerHTML = '<option value="" disabled selected>Select a module to evaluate...</option>';

        // Group learning paths by learning space
        const groups = {};
        data.forEach(lp => {
          const spaceName = lp.learningSpaceTitle || 'Other';
          if (!groups[spaceName]) {
            groups[spaceName] = [];
          }
          groups[spaceName].push(lp);
        });

        // Create optgroups
        for (const [spaceName, paths] of Object.entries(groups)) {
          const optgroup = document.createElement('optgroup');
          optgroup.label = `Space: ${spaceName}`;
          paths.forEach(lp => {
            const option = document.createElement('option');
            option.value = lp.id;
            option.textContent = lp.title;
            optgroup.appendChild(option);
          });
          select.appendChild(optgroup);
        }
      } catch (error) {
        console.error('Error fetching learning paths:', error);
      }
    }

    async function fetchSessions() {
      const loader = document.getElementById('loader');
      const grid = document.getElementById('sessionsGrid');
      loader.classList.remove('d-none');
      grid.innerHTML = '';

      try {
        const token = localStorage.getItem('jwt_token');
        if (!token) {
          showAlert('No authentication token found! Please login again.', 'danger');
          return;
        }
        const response = await fetch(`/api/evaluations/sessions?lecturerId=${LECTURER_ID}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        if (!response.ok) throw new Error('Failed to fetch');
        allSessions = await response.json();
        currentPage = 1;
        renderPaginatedSessions();
      } catch (error) {
        console.error(error);
        showAlert('Error loading sessions. Make sure backend is running and data is seeded.', 'danger');
      } finally {
        loader.classList.add('d-none');
      }
    }

    function renderPaginatedSessions() {
      const grid = document.getElementById('sessionsGrid');
      grid.innerHTML = '';
      
      if (allSessions.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="ti ti-inbox fs-1 mb-3"></i><h4>No sessions found. Create one above!</h4></div>';
        renderPaginationControls(0, 0);
        return;
      }

      const totalItems = allSessions.length;
      const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
      
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginated = allSessions.slice(startIndex, endIndex);

      paginated.forEach(session => {
        const startStr = new Date(session.gradingStartAt).toLocaleDateString();
        const endStr = new Date(session.gradingDeadlineAt).toLocaleDateString();
        const criteriaCount = session.criteria ? session.criteria.length : 0;
        const totalMaxScore = session.criteria ? session.criteria.reduce((sum, c) => sum + c.maxScore, 0) : 0;

        const cardHtml = `
          <div class="col-12 col-md-6 col-xl-4">
            <div class="session-card">
              <h4 class="session-title">${session.title}</h4>
              <div class="session-meta">
                <div class="mb-1"><i class="ti ti-calendar-event"></i> ${startStr} - ${endStr}</div>
              </div>
              <div class="session-criteria-count">
                <i class="ti ti-list-check text-primary"></i> ${criteriaCount} Criteria (Max ${totalMaxScore} pts)
              </div>

              <div class="mt-auto d-flex justify-content-between align-items-center pt-3 border-top">
                <span class="text-muted fs-7"><i class="ti ti-book me-1"></i> ${session.learningPathTitle}</span>
                <a href="/lecturer/evaluation-sessions/${session.id}/students" class="btn btn-primary btn-sm rounded-pill px-3 fw-bold">
                  <i class="ti ti-users"></i> Grade Students
                </a>
              </div>
            </div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', cardHtml);
      });
      
      renderPaginationControls(totalItems, totalPages);
    }

    function goToPage(page) {
      currentPage = page;
      renderPaginatedSessions();
      document.getElementById('sessionsGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderPaginationControls(totalItems, totalPages) {
      let wrap = document.getElementById('paginationWrap');
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.id = 'paginationWrap';
        wrap.className = 'd-flex justify-content-center mt-5 mb-3';
        document.getElementById('sessionsGrid').after(wrap);
      }
      
      if (totalPages <= 1) {
        wrap.innerHTML = '';
        return;
      }
      
      let html = `<nav aria-label="Page navigation"><ul class="pagination pagination-lg">`;
      html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link fw-bold" href="javascript:void(0)" onclick="goToPage(${currentPage - 1})">Previous</a></li>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<li class="page-item ${currentPage === i ? 'active' : ''}"><a class="page-link fw-bold" href="javascript:void(0)" onclick="goToPage(${i})">${i}</a></li>`;
      }
      html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link fw-bold" href="javascript:void(0)" onclick="goToPage(${currentPage + 1})">Next</a></li>`;
      html += `</ul></nav>`;
      
      wrap.innerHTML = html;
    }

    async function saveSession(e) {
      e.preventDefault();

      const title = document.getElementById('title').value;
      const gradingStartAt = document.getElementById('gradingStartAt').value;
      const gradingDeadlineAt = document.getElementById('gradingDeadlineAt').value;

      const criteriaNodes = document.querySelectorAll('.criteria-row');
      const criteria = [];

      let sortOrder = 1;
      criteriaNodes.forEach(node => {
        criteria.push({
          name: node.querySelector('.crit-name').value,
          maxScore: parseFloat(node.querySelector('.crit-score').value),
          description: node.querySelector('.crit-desc').value,
          sortOrder: sortOrder++
        });
      });

      if (new Date(gradingDeadlineAt) <= new Date(gradingStartAt)) {
        showAlert('Deadline must be after Start Date.', 'danger');
        return;
      }

      const selectedPathId = document.getElementById('learningPathId').value;
      if (!selectedPathId) {
        showAlert('Please select a Learning Path.', 'danger');
        return;
      }

      const payload = {
        learningPathId: parseInt(selectedPathId),
        lecturerId: LECTURER_ID,
        title: title,
        gradingStartAt: gradingStartAt + ":00", // Ensure valid ISO localdatetime
        gradingDeadlineAt: gradingDeadlineAt + ":00",
        criteria: criteria
      };

      const btn = document.getElementById('saveBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creating...';
      btn.disabled = true;

      try {
        const token = localStorage.getItem('jwt_token');
        if (!token) {
          showAlert('No authentication token found! Please login again.', 'danger');
          btn.innerHTML = originalText;
          btn.disabled = false;
          return;
        }
        const response = await fetch('/api/evaluations/sessions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.message || 'Validation Failed');
        }

        showAlert('Evaluation Session created successfully!', 'success');
        toggleForm(false);
        fetchSessions();
      } catch (error) {
        showAlert('Error: ' + error.message, 'danger');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }
  </script>
</th:block>
</body>

</html>
