<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{lecturer/layout}">
<head>
    <title>Activity Detail</title>
    <th:block layout:fragment="head">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
        <!-- BẮT ĐẦU: PHẦN CSS (STYLE) -->

<!-- KHU VỰC CSS (STYLE) -->
<style>
            .info-card {
                border-radius: 12px;
                border: 1px solid rgba(0,0,0,0.05);
                box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            }
            .status-badge {
                padding: 6px 12px;
                border-radius: 50rem;
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.5px;
            }
            .section-title {
                font-size: 1.1rem;
                font-weight: 700;
                color: #2b3440;
                margin-bottom: 1rem;
                padding-bottom: 0.5rem;
                border-bottom: 2px solid #f1f5f9;
            }
        </style>
    </th:block>
</head>
<body>
    <div layout:fragment="content">
        <input type="hidden" id="activityId" th:value="${activityId}" />
        
        <div class="container-fluid py-4">
            <!-- Breadcrumb / Header -->
            <div class="d-flex align-items-center mb-4">
                <button class="btn btn-light me-3 shadow-sm rounded-circle d-flex align-items-center justify-content-center p-0" 
                        style="width: 40px; height: 40px;" onclick="history.back()">
                    <i class="ti ti-arrow-left fs-4"></i>
                </button>
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-1">
                            <li class="breadcrumb-item"><a href="/lecturer/dashboard" class="text-decoration-none">Spaces</a></li>
                            <li class="breadcrumb-item"><a href="#" onclick="history.back()" class="text-decoration-none">Group Activities</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Activity Detail</li>
                        </ol>
                    </nav>
                    <h3 class="fw-bold mb-0" id="activityTitle">Loading...</h3>
                </div>
                <div class="ms-auto" id="activityStatusContainer">
                    <!-- Status Badge -->
                </div>
            </div>

            <!-- Loading Indicator -->
            <div id="loadingIndicator" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <!-- BẮT ĐẦU: NỘI DUNG CHÍNH (MAIN CONTENT) -->
            <div id="mainContent" class="row g-4 d-none">
                <!-- Left Column: Activity Info -->
                <div class="col-lg-8">
                    <div class="card info-card h-100">
                        <div class="card-body p-4">
                            <h5 class="section-title"><i class="ti ti-info-circle text-primary me-2"></i>Activity Information</h5>
                            
                            <div class="mb-4">
                                <h6 class="text-muted small fw-bold text-uppercase mb-2">Description</h6>
                                <p class="mb-0" id="activityDescription">--</p>
                            </div>

                            <div class="row g-4">
                                <div class="col-sm-6">
                                    <div class="d-flex align-items-center p-3 bg-light rounded-3">
                                        <div class="bg-white rounded-circle p-2 shadow-sm me-3">
                                            <i class="ti ti-calendar-event text-warning fs-4"></i>
                                        </div>
                                        <div>
                                            <p class="text-muted small mb-0 fw-bold">Created Date</p>
                                            <p class="mb-0 fw-bold" id="activityCreated">--</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="d-flex align-items-center p-3 bg-light rounded-3">
                                        <div class="bg-white rounded-circle p-2 shadow-sm me-3">
                                            <i class="ti ti-clock text-danger fs-4"></i>
                                        </div>
                                        <div>
                                            <p class="text-muted small mb-0 fw-bold">Deadline</p>
                                            <p class="mb-0 fw-bold text-danger" id="activityDeadline">--</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Statistics -->
                <div class="col-lg-4">
                    <div class="card info-card h-100">
                        <div class="card-body p-4">
                            <h5 class="section-title"><i class="ti ti-chart-pie text-success me-2"></i>Submission Stats</h5>
                            
                            <div class="text-center py-4">
                                <div class="position-relative d-inline-block mb-3">
                                    <svg width="120" height="120" viewBox="0 0 120 120">
                                        <circle cx="60" cy="60" r="54" fill="none" stroke="#f1f5f9" stroke-width="12" />
                                        <circle id="progressCircle" cx="60" cy="60" r="54" fill="none" stroke="#10b981" stroke-width="12" 
                                                stroke-dasharray="339.292" stroke-dashoffset="339.292" stroke-linecap="round" 
                                                style="transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1s ease-in-out;" />
                                    </svg>
                                    <div class="position-absolute top-50 start-50 translate-middle text-center">
                                        <h3 class="fw-bold mb-0" id="progressText">0%</h3>
                                    </div>
                                </div>
                                
                                <div class="d-flex justify-content-center gap-4 mt-2">
                                    <div>
                                        <h4 class="fw-bold text-dark mb-0" id="statTotalGroups">0</h4>
                                        <span class="text-muted small">Total Groups</span>
                                    </div>
                                    <div>
                                        <h4 class="fw-bold text-success mb-0" id="statSubmitted">0</h4>
                                        <span class="text-muted small">Submitted</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Groups Section -->
                <div class="col-12 mt-4">
                    <div class="card info-card">
                        <div class="card-header bg-white p-4 border-bottom-0 pb-0 d-flex justify-content-between align-items-center">
                            <h5 class="fw-bold mb-0"><i class="ti ti-users-group text-primary me-2"></i>Groups Management</h5>
                            <span class="badge bg-light text-dark border px-3 py-2" id="groupCountBadge">0 Groups</span>
                        </div>
                        <div class="card-body p-4">
                            <!-- Controls -->
                            <div class="row g-3 mb-4">
                                <div class="col-md-6 col-lg-4">
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0"><i class="ti ti-search text-muted"></i></span>
                                        <input type="text" class="form-control border-start-0 ps-0" id="searchGroupInput" placeholder="Search group or leader...">
                                    </div>
                                </div>
                                <div class="col-md-6 col-lg-8">
                                    <div class="d-flex gap-2 justify-content-md-end">
                                        <input type="radio" class="btn-check filter-radio" name="statusFilter" id="filterAll" value="ALL" checked>
                                        <label class="btn btn-outline-secondary rounded-pill px-4" for="filterAll">All</label>

                                        <input type="radio" class="btn-check filter-radio" name="statusFilter" id="filterSubmitted" value="SUBMITTED">
                                        <label class="btn btn-outline-success rounded-pill px-4" for="filterSubmitted">Submitted</label>

                                        <input type="radio" class="btn-check filter-radio" name="statusFilter" id="filterPending" value="PENDING">
                                        <label class="btn btn-outline-warning rounded-pill px-4" for="filterPending">Pending</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Groups Table -->
                            <div class="table-responsive">
                                
<!-- KHU VỰC BẢNG DỮ LIỆU (TABLE) -->
<table class="table align-middle text-nowrap mb-0 border">
                                    <thead class="bg-light text-muted fw-bold" style="font-size: 0.85rem; text-transform: uppercase;">
                                        <tr>
                                            <th class="ps-4 py-3 border-0">Group Info</th>
                                            <th class="py-3 border-0">Leader</th>
                                            <th class="py-3 border-0">Members</th>
                                            <th class="py-3 text-center border-0">Status</th>
                                            <th class="py-3 pe-4 text-end border-0">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="groupsTableBody">
                                        <tr>
                                            <td colspan="5" class="text-center py-4 text-muted">
                                                <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                                Loading groups...
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BẮT ĐẦU: PHẦN JAVASCRIPT (SCRIPT) -->

<!-- KHU VỰC JAVASCRIPT -->
<script>
            document.addEventListener('DOMContentLoaded', function() {
                loadActivityDetails();
            });

            async function loadActivityDetails() {
                const activityId = document.getElementById('activityId').value;
                const loading = document.getElementById('loadingIndicator');
                const mainContent = document.getElementById('mainContent');

                try {
                    const token = localStorage.getItem('jwt_token');
                    const headers = token ? { 'Authorization': 'Bearer ' + token } : {};

                    const response = await fetch(`/api/lecturer/group-activities/${activityId}`, { headers });
                    if (!response.ok) throw new Error('Failed to load activity details');
                    
                    const activity = await response.json();
                    
                    // Format dates
                    const formatDate = (dateString) => {
                        if (!dateString) return '--';
                        return new Date(dateString).toLocaleDateString('vi-VN', {
                            day: '2-digit', month: '2-digit', year: 'numeric', 
                            hour: '2-digit', minute: '2-digit'
                        });
                    };

                    // Update UI
                    document.getElementById('activityTitle').textContent = activity.title;
                    document.getElementById('activityDescription').innerHTML = activity.description || '<i class="text-muted">No description provided</i>';
                    document.getElementById('activityCreated').textContent = formatDate(activity.createdAt);
                    document.getElementById('activityDeadline').textContent = formatDate(activity.deadline);
                    
                    // Status Badge
                    let statusClass = 'bg-secondary text-white';
                    if (activity.status === 'OPEN') statusClass = 'bg-success text-white';
                    else if (activity.status === 'IN_PROGRESS') statusClass = 'bg-primary text-white';
                    else if (activity.status === 'LOCKED') statusClass = 'bg-danger text-white';
                    else if (activity.status === 'GRADED') statusClass = 'bg-info text-white';
                    
                    document.getElementById('activityStatusContainer').innerHTML = 
                        `<span class="status-badge ${statusClass} fs-6 px-4 py-2 shadow-sm"><i class="ti ti-circle-filled me-1" style="font-size: 8px; vertical-align: middle;"></i>${activity.status}</span>`;

                    // Stats
                    document.getElementById('statTotalGroups').textContent = activity.totalGroups;
                    document.getElementById('statSubmitted').textContent = activity.submittedGroups;
                    document.getElementById('groupCountBadge').textContent = `${activity.totalGroups} Groups`;
                    
                    // Progress Circle
                    const ratio = activity.totalGroups > 0 ? (activity.submittedGroups / activity.totalGroups) : 0;
                    const percentage = Math.round(ratio * 100);
                    document.getElementById('progressText').textContent = `${percentage}%`;
                    
                    // Circumference is 2 * Math.PI * r (r=54) ≈ 339.292
                    const offset = 339.292 - (ratio * 339.292);
                    setTimeout(() => {
                        document.getElementById('progressCircle').style.strokeDashoffset = offset;
                    }, 100);

                    // Show content
                    loading.classList.add('d-none');
                    mainContent.classList.remove('d-none');
                    
                    // Trigger load groups
                    loadGroups();
                } catch (error) {
                    console.error('Error:', error);
                    loading.innerHTML = `<div class="alert alert-danger">Error loading activity details. Please try again.</div>`;
                }
            }

            // Group Management Logic
            let searchTimeout = null;

            document.getElementById('searchGroupInput').addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    loadGroups();
                }, 500);
            });

            document.querySelectorAll('.filter-radio').forEach(radio => {
                radio.addEventListener('change', loadGroups);
            });

            async function loadGroups() {
                const activityId = document.getElementById('activityId').value;
                const search = document.getElementById('searchGroupInput').value.trim();
                const filter = document.querySelector('input[name="statusFilter"]:checked').value;
                const tbody = document.getElementById('groupsTableBody');

                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading groups...</td></tr>`;

                try {
                    // Build query params
                    const params = new URLSearchParams();
                    if (search) params.append('search', search);
                    if (filter && filter !== 'ALL') params.append('filter', filter);

                    const url = `/api/lecturer/group-activities/${activityId}/groups?${params.toString()}`;
                    
                    const token = localStorage.getItem('jwt_token');
                    const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
                    
                    const response = await fetch(url, { headers });
                    if (!response.ok) throw new Error('Failed to load groups');

                    const groups = await response.json();
                    
                    if (groups.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted"><i class="ti ti-users-group fs-1 mb-2 d-block"></i>No groups found matching your criteria.</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = '';
                    groups.forEach(group => {
                        let statusHtml = '';
                        if (group.status === 'GRADED') {
                            statusHtml = `<span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-3 py-2 rounded-pill"><i class="ti ti-check me-1"></i>Graded</span>`;
                        } else if (group.status === 'SUBMITTED') {
                            statusHtml = `<span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 px-3 py-2 rounded-pill"><i class="ti ti-file-check me-1"></i>Submitted</span>`;
                        } else if (group.status === 'NOT_SUBMITTED' || group.status === 'PENDING') {
                            statusHtml = `<span class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25 px-3 py-2 rounded-pill"><i class="ti ti-clock me-1"></i>Pending</span>`;
                        } else {
                            statusHtml = `<span class="badge bg-secondary px-3 py-2 rounded-pill">${group.status}</span>`;
                        }

                        let githubHtml = '';
                        if (group.githubUrl) {
                            githubHtml = `<a href="${group.githubUrl}" target="_blank" class="text-decoration-none small text-muted"><i class="ti ti-brand-github me-1"></i>Repository</a>`;
                        }

                        const membersList = `${group.currentMembers || 0} / ${group.maxMembers || 0} members`;

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="ps-4 py-3">
                                <h6 class="fw-bold mb-1">${group.groupName}</h6>
                                ${githubHtml}
                            </td>
                            <td class="py-3">
                                <div class="d-flex align-items-center">
                                    <div class="bg-light rounded-circle d-flex align-items-center justify-content-center text-primary fw-bold me-2" style="width: 32px; height: 32px; font-size: 0.8rem;">
                                        ${group.leaderName ? group.leaderName.charAt(0).toUpperCase() : '?'}
                                    </div>
                                    <span class="fw-medium">${group.leaderName || 'N/A'}</span>
                                </div>
                            </td>
                            <td class="py-3">
                                <span class="d-inline-block text-truncate text-muted small" style="max-width: 200px;" title="${membersList}">
                                    ${membersList || 'No members'}
                                </span>
                            </td>
                            <td class="py-3 text-center">
                                ${statusHtml}
                            </td>
                            <td class="py-3 pe-4 text-end">
                                <button class="btn btn-sm btn-primary rounded-3 fw-bold" onclick="reviewGroup(${group.groupId})">
                                    <i class="ti ti-edit-circle me-1"></i> Review & Grade
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } catch (error) {
                    console.error('Error loading groups:', error);
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger"><i class="ti ti-alert-triangle me-2"></i>Failed to load groups.</td></tr>`;
                }
            }

            function reviewGroup(groupId) {
                // Navigate to Task 4 UI
                window.location.href = `/lecturer/groups/${groupId}/review`;
            }
        </script>
    </div>
</body>
</html>
