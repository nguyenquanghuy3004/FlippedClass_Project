<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Quizzes - FlippedClass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <style>
    /* =========================================
       PREMIUM AESTHETICS FOR QUIZZES CONTENT
       (Does not interfere with template JS/Header)
       ========================================= */

    /* 1. Page Header Styling */
    .page-header-premium {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      border-radius: 20px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(30, 60, 114, 0.15);
      position: relative;
      overflow: hidden;
    }
    .page-header-premium::before {
      content: '';
      position: absolute;
      top: -50px; right: -50px;
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
    }
    .page-title {
      font-weight: 800;
      letter-spacing: -0.5px;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .btn-premium {
      background: white;
      color: #1e3c72;
      font-weight: 700;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 50rem;
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
      transition: all 0.3s;
    }
    .btn-premium:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.15);
      color: #2a5298;
    }

    /* 2. Premium Quiz Card Styling */
    .quiz-card {
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid rgba(0,0,0,0.04);
      box-shadow: 0 8px 24px rgba(0,0,0,0.03);
      padding: 1.5rem;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .quiz-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      border-color: rgba(0,0,0,0.08);
    }
    
    .quiz-badge {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      padding: 0.4rem 0.8rem;
      border-radius: 50rem;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .quiz-icon-wrapper {
      width: 56px; height: 56px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, rgba(30,60,114,0.1), rgba(42,82,152,0.1));
      color: #1e3c72;
    }

    .quiz-title-text {
      font-size: 1.3rem;
      font-weight: 800;
      color: #2c3e50;
      margin-bottom: 0.5rem;
      line-height: 1.3;
      padding-right: 4rem; /* keep space for badge */
    }

    .quiz-stats {
      background: #f8f9fa;
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-size: 1.1rem;
      font-weight: 800;
      color: #2c3e50;
    }
    .stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #95a5a6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* 3. Form Card Premium */
    .form-card {
      border: none;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .form-control, .form-select {
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      border: 1px solid #e9ecef;
      background-color: #f8f9fa;
      font-weight: 500;
      transition: all 0.2s;
    }
    .form-control:focus, .form-select:focus {
      background-color: #fff;
      border-color: #1e3c72;
      box-shadow: 0 0 0 4px rgba(30, 60, 114, 0.1);
    }
    .form-label {
      font-weight: 700;
      color: #495057;
      margin-bottom: 0.5rem;
    }
  </style>
</head>

<body>
  <div id="overlay" class="overlay"></div>
  
  <!-- EXACT TOPBAR TO KEEP JS WORKING -->
  <nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3">
    <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm ">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>
    <button id="mobileBtn" class="btn btn-light btn-icon btn-sm d-lg-none me-2">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>
    <div>
      <ul class="list-unstyled d-flex align-items-center mb-0 gap-1">
        <li>
          <a class="position-relative btn-icon btn-sm btn-light btn rounded-circle" data-bs-toggle="dropdown" aria-expanded="false" href="#" role="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-bell">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" />
              <path d="M9 17v1a3 3 0 0 0 6 0v-1" />
            </svg>
          </a>
        </li>
        <li class="ms-3 dropdown">
          <a href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <img th:src="@{/assets/images/avatar-1.jpg}" alt="" class="avatar avatar-sm rounded-circle" />
          </a>
          <div class="dropdown-menu dropdown-menu-end p-0" style="min-width: 200px;">
            <div>
              <div class="d-flex gap-3 align-items-center border-dashed border-bottom px-3 py-3">
                <img th:src="@{/assets/images/avatar-1.jpg}" alt="" class="avatar avatar-md rounded-circle" />
                <div>
                  <h4 class="mb-0 small">Lecturer</h4>
                  <p class="mb-0 small">@lecturer</p>
                </div>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </nav>

  <!-- EXACT SIDEBAR TO KEEP JS WORKING -->
  <aside id="sidebar" class="sidebar">
    <div class="logo-area">
      <a th:href="@{/}" class="d-inline-flex"><img src="data:image/svg+xml,%3csvg%20width='62'%20height='67'%20viewBox='0%200%2062%2067'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M30.604%2066.378L0.00805664%2048.1582V35.7825L30.604%2054.0023V66.378Z'%20fill='%23302C4D'/%3e%3cpath%20d='M61.1996%2048.1582L30.604%2066.378V54.0023L61.1996%2035.7825V48.1582Z'%20fill='%23E66239'/%3e%3cpath%20d='M30.5955%200L0%2018.2198V30.5955L30.5955%2012.3757V0Z'%20fill='%23657E92'/%3e%3cpath%20d='M61.191%2018.2198L30.5955%200V12.3757L61.191%2030.5955V18.2198Z'%20fill='%23A3B2BE'/%3e%3cpath%20d='M30.604%2048.8457L0.00805664%2030.6259V18.2498L30.604%2036.47V48.8457Z'%20fill='%23302C4D'/%3e%3cpath%20d='M61.1996%2030.6259L30.604%2048.8457V36.47L61.1996%2018.2498V30.6259Z'%20fill='%23E66239'/%3e%3c/svg%3e" alt="" width="24">
        <span class="logo-text ms-2"> <img th:src="@{/assets/images/logo.svg}" alt=""></span>
      </a>
    </div>
    <ul class="nav flex-column">
      <li class="px-4 py-2"><small class="nav-text">Main</small></li>
      <li><a class="nav-link active" th:href="@{/lecturer/quizzes}"><i class="ti ti-brain"></i><span class="nav-text">Quizzes</span></a></li>
      <li class="px-4 pt-4 pb-2"><small class="nav-text">Account</small></li>
      <li><a class="nav-link" th:href="@{/signin}"><i class="ti ti-logout"></i><span class="nav-text">Log in</span></a></li>
    </ul>
  </aside>

  <!-- MAIN CONTENT WITH PREMIUM STYLING INSIDE -->
  <main id="content" class="content py-10">
    <div class="container-fluid">
      
      <!-- HEADER ROW (Premium) -->
      <div class="row">
        <div class="col-12">
          <div class="page-header-premium d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div style="z-index: 2;">
              <h1 class="page-title">Quizzes Management</h1>
              <p class="mb-0 fs-6" style="opacity: 0.85;">Design, publish and monitor your course assessments beautifully.</p>
            </div>
            <div style="z-index: 2;">
              <button class="btn btn-premium d-flex align-items-center gap-2" onclick="toggleQuizForm()">
                <i class="ti ti-plus fs-5"></i> Create New Quiz
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ALERT MESSAGE -->
      <div id="alertMessage" class="alert alert-success d-none mb-4 shadow-sm border-0 fw-bold rounded-3" role="alert" style="transition: 0.3s;">
        Action completed successfully!
      </div>

      <!-- ADD/EDIT FORM CARD (Premium) -->
      <div class="row" id="quizFormContainer" style="display: none;">
        <div class="col-12 mb-5">
          <div class="card form-card">
            <div class="card-body p-5">
              <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <h3 class="mb-0 fw-bold text-dark" id="formTitle"><i class="ti ti-pencil me-2 text-primary"></i>Create New Quiz</h3>
                <button type="button" class="btn-close" aria-label="Close" onclick="toggleQuizForm(false)"></button>
              </div>
              
              <form id="quizForm">
                <input type="hidden" id="quizId">
                <div class="row g-4">
                  <div class="col-md-12">
                    <label for="title" class="form-label">Quiz Title <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-lg" id="title" placeholder="e.g. Midterm Assessment" required>
                  </div>
                  
                  <div class="col-md-4">
                    <label for="durationMinutes" class="form-label">Duration (Minutes) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="durationMinutes" placeholder="30" required>
                  </div>
                  <div class="col-md-4">
                    <label for="passScore" class="form-label">Pass Score (%) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="passScore" placeholder="50" max="100" required>
                  </div>
                  <div class="col-md-4">
                    <label for="difficulty" class="form-label">Difficulty</label>
                    <select class="form-select" id="difficulty">
                      <option value="EASY">Easy</option>
                      <option value="MEDIUM" selected>Medium</option>
                      <option value="HARD">Hard</option>
                    </select>
                  </div>

                  <div class="col-md-12">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" rows="3" placeholder="Brief description of the quiz..."></textarea>
                  </div>

                  <div class="col-md-12">
                    <div class="form-check form-switch fs-5 mt-2">
                      <input type="checkbox" class="form-check-input" id="active" checked>
                      <label class="form-check-label fw-bold text-dark ms-2" for="active">Publish immediately (Active)</label>
                    </div>
                  </div>
                </div>

                <div class="d-flex gap-3 mt-5 pt-3 border-top">
                  <button type="button" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm" onclick="saveQuiz()" id="saveBtn">Save Quiz</button>
                  <button type="button" class="btn btn-light btn-lg rounded-pill px-4 fw-bold" onclick="toggleQuizForm(false)">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- QUIZZES LIST CARD -->
      <div class="row">
        <div class="col-12">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0 text-dark">All Quizzes</h3>
          </div>
          
          <div id="loader" class="text-center py-5">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <!-- Grid -->
          <div class="row g-4" id="quizzes-grid">
            <!-- JS Populated -->
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- JAVASCRIPT FOR CRUD -->
  <script>
    const API_URL = '/api/quizzes';
    let currentQuizzes = [];

    document.addEventListener("DOMContentLoaded", () => {
      fetchQuizzes();
    });

    function showAlert(message, isError = false) {
      const alertEl = document.getElementById('alertMessage');
      alertEl.innerText = message;
      alertEl.classList.remove('d-none', 'alert-success', 'alert-danger');
      alertEl.classList.add(isError ? 'alert-danger' : 'alert-success');
      
      setTimeout(() => {
        alertEl.classList.add('d-none');
      }, 3000);
    }

    function toggleQuizForm(show = true, quiz = null) {
      const container = document.getElementById('quizFormContainer');
      const formTitle = document.getElementById('formTitle');
      
      if (show) {
        container.style.display = 'flex';
        document.getElementById('quizForm').reset();
        
        if (quiz) {
          formTitle.innerHTML = '<i class="ti ti-pencil me-2 text-primary"></i>Edit Quiz';
          document.getElementById('quizId').value = quiz.id;
          document.getElementById('title').value = quiz.title;
          document.getElementById('description').value = quiz.description;
          document.getElementById('durationMinutes').value = quiz.durationMinutes;
          document.getElementById('passScore').value = quiz.passScore;
          document.getElementById('difficulty').value = quiz.difficulty || 'MEDIUM';
          document.getElementById('active').checked = quiz.active;
        } else {
          formTitle.innerHTML = '<i class="ti ti-plus me-2 text-primary"></i>Create New Quiz';
          document.getElementById('quizId').value = '';
          document.getElementById('durationMinutes').value = 30;
          document.getElementById('passScore').value = 50;
        }
        
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        container.style.display = 'none';
      }
    }

    async function fetchQuizzes() {
      const grid = document.getElementById('quizzes-grid');
      const loader = document.getElementById('loader');
      grid.innerHTML = '';
      loader.classList.remove('d-none');

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Failed to load');
        currentQuizzes = await response.json();
        renderQuizzes(currentQuizzes);
      } catch (error) {
        console.error(error);
        showAlert('Failed to load quizzes', true);
      } finally {
        loader.classList.add('d-none');
      }
    }

    function renderQuizzes(quizzes) {
      const grid = document.getElementById('quizzes-grid');
      grid.innerHTML = '';

      if (quizzes.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="ti ti-inbox fs-1 mb-3 text-secondary"></i><h4>No quizzes found</h4><p>Click "Create New Quiz" above to get started.</p></div>';
        return;
      }

      quizzes.forEach(quiz => {
        const badgeClass = quiz.active ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary';
        const badgeText = quiz.active ? '<i class="ti ti-circle-filled fs-9 me-1"></i> Active' : '<i class="ti ti-circle-dashed fs-9 me-1"></i> Draft';
          
        const cardHtml = `
          <div class="col-12 col-md-6 col-xl-4">
            <div class="quiz-card">
              <span class="quiz-badge ${badgeClass}">${badgeText}</span>
              
              <div class="quiz-icon-wrapper">
                <i class="ti ti-brain"></i>
              </div>
              
              <h4 class="quiz-title-text text-truncate">${quiz.title}</h4>
              <p class="text-muted small flex-grow-1 mb-4" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${quiz.description || 'No description provided.'}</p>
              
              <div class="quiz-stats">
                <div class="stat-item">
                  <div class="stat-value">${quiz.durationMinutes}m</div>
                  <div class="stat-label">Duration</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value text-primary">${quiz.passScore}%</div>
                  <div class="stat-label">Pass Score</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value text-warning">${quiz.difficulty || 'N/A'}</div>
                  <div class="stat-label">Level</div>
                </div>
              </div>
              
              <div class="d-flex gap-2 border-top pt-3 mt-auto border-light">
                <button class="btn btn-light text-primary flex-grow-1 fw-bold rounded-pill" onclick='editQuiz(${quiz.id})'>Edit</button>
                <button class="btn btn-light text-danger rounded-pill px-3" onclick="deleteQuiz(${quiz.id})"><i class="ti ti-trash"></i></button>
              </div>
            </div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', cardHtml);
      });
    }

    function editQuiz(id) {
      const quiz = currentQuizzes.find(q => q.id === id);
      if (quiz) toggleQuizForm(true, quiz);
    }

    async function saveQuiz() {
      const id = document.getElementById('quizId').value;
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const durationMinutes = document.getElementById('durationMinutes').value;
      const passScore = document.getElementById('passScore').value;
      const difficulty = document.getElementById('difficulty').value;
      const active = document.getElementById('active').checked;
      
      if (!title || !durationMinutes || !passScore) {
        showAlert('Please fill all required fields!', true);
        return;
      }

      const payload = {
        learningNodeId: 1, 
        lecturerId: 1,     
        title,
        description,
        durationMinutes: parseInt(durationMinutes),
        passScore: parseInt(passScore),
        difficulty,
        active
      };

      const method = id ? 'PUT' : 'POST';
      const url = id ? \`\${API_URL}/\${id}\` : API_URL;
      const btn = document.getElementById('saveBtn');
      const originalText = btn.innerHTML;
      
      btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Saving...';
      btn.disabled = true;

      try {
        const response = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('Failed to save');
        
        showAlert(id ? 'Quiz updated successfully' : 'Quiz created successfully');
        toggleQuizForm(false);
        fetchQuizzes();
      } catch (error) {
        console.error(error);
        showAlert('Error saving quiz', true);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function deleteQuiz(id) {
      if (!confirm('Are you sure you want to delete this quiz?')) return;

      try {
        const response = await fetch(\`\${API_URL}/\${id}\`, { method: 'DELETE' });
        if (!response.ok) throw new Error('Failed to delete');
        
        showAlert('Quiz deleted successfully');
        fetchQuizzes();
      } catch (error) {
        console.error(error);
        showAlert('Error deleting quiz', true);
      }
    }
  </script>
</body>
</html>
