<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Quiz Management - FlippedClass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #fcfcfc;
      font-family: 'Inter', sans-serif;
    }

    /* 1. Purple Page Header Banner (Like Mockup) */
    .page-header-purple {
      background: #6b46c1; /* Modern purple */
      background: linear-gradient(135deg, #7b5eea 0%, #5a3ba8 100%);
      color: white;
      border-radius: 12px;
      padding: 2rem 2.5rem;
      margin-top: 1rem;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .page-header-purple h1 {
      font-weight: 800;
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
      color: #fff;
    }
    .page-header-purple p {
      margin-bottom: 0;
      opacity: 0.85;
      font-size: 0.95rem;
    }
    .btn-create-white {
      background: #ffffff;
      color: #5a3ba8;
      font-weight: 700;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 50rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-create-white:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    /* 2. Filter Bar */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
    }
    .search-input-wrapper {
      position: relative;
      flex: 1;
      max-width: 400px;
    }
    .search-input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
    }
    .search-input-wrapper input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border-radius: 50rem;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      font-size: 0.9rem;
      outline: none;
      transition: 0.2s;
    }
    .search-input-wrapper input:focus {
      background: #fff;
      border-color: #7b5eea;
      box-shadow: 0 0 0 3px rgba(123, 94, 234, 0.1);
    }
    .filter-dropdowns {
      display: flex;
      gap: 1rem;
    }
    .filter-select {
      border: none;
      background: transparent;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      outline: none;
    }

    /* 3. Learning Space Section */
    .space-section {
      margin-bottom: 3rem;
    }
    .space-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid #f1f5f9;
    }
    .space-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #1e293b;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .space-stats-pill {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 0.4rem 1rem;
      border-radius: 50rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      display: flex;
      gap: 1rem;
    }
    .space-stats-pill span {
      display: flex; align-items: center; gap: 0.25rem;
    }

    /* 4. Quiz Card (Clean Design) */
    .quiz-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #f1f5f9;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
      padding: 1.5rem;
      transition: all 0.2s;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .quiz-card:hover {
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border-color: #e2e8f0;
      transform: translateY(-3px);
    }
    .card-top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .course-label {
      font-size: 0.65rem;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .quiz-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 50rem;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .badge-active { background: #dcfce7; color: #166534; }
    .badge-inactive { background: #f1f5f9; color: #475569; }

    .quiz-title-text {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }
    .quiz-desc {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 1.5rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    
    .quiz-metrics {
      display: flex;
      justify-content: space-between;
      padding: 1rem 0;
      border-top: 1px dashed #e2e8f0;
      border-bottom: 1px dashed #e2e8f0;
      margin-bottom: 1rem;
    }
    .metric-item {
      text-align: center;
    }
    .metric-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: #1e293b;
      display: flex; align-items: center; justify-content: center; gap: 0.25rem;
    }
    .metric-val i { font-size: 1.2rem; }
    .metric-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }
    .student-avatars {
      display: flex;
      align-items: center;
    }
    .student-avatars img {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      margin-left: -10px;
    }
    .student-avatars img:first-child { margin-left: 0; }
    .attempts-count {
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
      margin-left: 0.5rem;
    }

    .action-btns button {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
      background: #fff;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .action-btns button:hover {
      background: #f8fafc;
      color: #1e293b;
    }
    .action-btns .btn-build {
      color: #7b5eea; border-color: #ede9fe; background: #f5f3ff; width: auto; padding: 0 0.75rem; font-weight: 600; font-size: 0.85rem;
    }
    .action-btns .btn-build:hover { background: #ede9fe; }

    /* Forms */
    .form-card { border: none; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
  </style>
</head>

<body>
  <div id="overlay" class="overlay"></div>
  
  <nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3">
    <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm ">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>
    <button id="mobileBtn" class="btn btn-light btn-icon btn-sm d-lg-none me-2">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>
    <div>
      <ul class="list-unstyled d-flex align-items-center mb-0 gap-1">
        <li class="ms-3 dropdown">
          <a href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <img th:src="@{/assets/images/avatar-1.jpg}" alt="" class="avatar avatar-sm rounded-circle" />
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <aside id="sidebar" class="sidebar">
    <div class="logo-area">
      <a th:href="@{/}" class="d-inline-flex"><img src="data:image/svg+xml,%3csvg%20width='62'%20height='67'%20viewBox='0%200%2062%2067'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M30.604%2066.378L0.00805664%2048.1582V35.7825L30.604%2054.0023V66.378Z'%20fill='%23302C4D'/%3e%3cpath%20d='M61.1996%2048.1582L30.604%2066.378V54.0023L61.1996%2035.7825V48.1582Z'%20fill='%23E66239'/%3e%3cpath%20d='M30.5955%200L0%2018.2198V30.5955L30.5955%2012.3757V0Z'%20fill='%23657E92'/%3e%3cpath%20d='M61.191%2018.2198L30.5955%200V12.3757L61.191%2030.5955V18.2198Z'%20fill='%23A3B2BE'/%3e%3cpath%20d='M30.604%2048.8457L0.00805664%2030.6259V18.2498L30.604%2036.47V48.8457Z'%20fill='%23302C4D'/%3e%3cpath%20d='M61.1996%2030.6259L30.604%2048.8457V36.47L61.1996%2018.2498V30.6259Z'%20fill='%23E66239'/%3e%3c/svg%3e" alt="" width="24">
        <span class="logo-text ms-2"> <img th:src="@{/assets/images/logo.svg}" alt=""></span>
      </a>
    </div>
    <ul class="nav flex-column">
      <li class="px-4 py-2"><small class="nav-text">Main</small></li>
      <li><a class="nav-link active" th:href="@{/lecturer/quizzes}"><i class="ti ti-brain"></i><span class="nav-text">Quizzes</span></a></li>
    </ul>
  </aside>

  <main id="content" class="content py-10">
    <div class="container-fluid">
      
      <!-- PURPLE BANNER -->
      <div class="page-header-purple">
        <div style="z-index: 2;">
          <h1>Quiz Management</h1>
          <p>Design, publish and monitor your course assessments beautifully.</p>
        </div>
        <div style="z-index: 2;">
          <button class="btn-create-white" onclick="toggleQuizForm()">
            <i class="ti ti-plus"></i> Create New Quiz
          </button>
        </div>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar">
        <div class="search-input-wrapper">
          <i class="ti ti-search"></i>
          <input type="text" id="searchInput" placeholder="Search quizzes by title or course..." oninput="filterQuizzes()">
        </div>
        <div class="filter-dropdowns">
          <select class="filter-select" id="spaceFilter" onchange="filterQuizzes()">
            <option value="ALL">All Spaces</option>
            <!-- JS populated -->
          </select>
          <select class="filter-select" id="statusFilter" onchange="filterQuizzes()">
            <option value="ALL">All Status</option>
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
          </select>
        </div>
      </div>

      <!-- ALERT MESSAGE -->
      <div id="alertMessage" class="alert alert-success d-none mb-4 shadow-sm border-0 fw-bold rounded-3" role="alert"></div>

      <!-- ADD/EDIT FORM CARD -->
      <div class="row" id="quizFormContainer" style="display: none;">
        <div class="col-12 mb-5">
          <div class="card form-card">
            <div class="card-body p-5">
              <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <h3 class="mb-0 fw-bold text-dark" id="formTitle"><i class="ti ti-pencil me-2 text-primary"></i>Create New Quiz</h3>
                <button type="button" class="btn-close" aria-label="Close" onclick="toggleQuizForm(false)"></button>
              </div>
              
              <form id="quizForm">
                <input type="hidden" id="quizId">
                <div class="row g-4">
                  <div class="col-md-12">
                    <label for="title" class="form-label">Quiz Title <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-lg" id="title" placeholder="e.g. Midterm Assessment" required>
                  </div>
                  <div class="col-md-4">
                    <label for="durationMinutes" class="form-label">Duration (Minutes) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="durationMinutes" placeholder="30" required>
                  </div>
                  <div class="col-md-4">
                    <label for="passScore" class="form-label">Pass Score (%) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="passScore" placeholder="50" max="100" required>
                  </div>
                  <div class="col-md-4">
                    <label for="difficulty" class="form-label">Difficulty</label>
                    <select class="form-select" id="difficulty">
                      <option value="EASY">Easy</option>
                      <option value="MEDIUM" selected>Medium</option>
                      <option value="HARD">Hard</option>
                    </select>
                  </div>
                  <div class="col-md-12">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" rows="3" placeholder="Brief description of the quiz..."></textarea>
                  </div>
                  <div class="col-md-12">
                    <div class="form-check form-switch fs-5 mt-2">
                      <input type="checkbox" class="form-check-input" id="active" checked>
                      <label class="form-check-label fw-bold text-dark ms-2" for="active">Publish immediately (Active)</label>
                    </div>
                  </div>
                </div>
                <div class="d-flex gap-3 mt-5 pt-3 border-top">
                  <button type="button" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm" onclick="saveQuiz()" id="saveBtn">Save Quiz</button>
                  <button type="button" class="btn btn-light btn-lg rounded-pill px-4 fw-bold" onclick="toggleQuizForm(false)">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- MAIN QUIZZES CONTAINER -->
      <div id="loader" class="text-center py-5 d-none">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div id="learningSpacesContainer">
        <!-- JS generated Sections grouped by Space -->
      </div>

    </div>
  </main>

  <script>
    const API_URL = '/api/quizzes';
    let currentQuizzes = [];

    document.addEventListener("DOMContentLoaded", () => {
      fetchQuizzes();
    });

    function showAlert(message, isError = false) {
      const alertEl = document.getElementById('alertMessage');
      alertEl.innerText = message;
      alertEl.classList.remove('d-none', 'alert-success', 'alert-danger');
      alertEl.classList.add(isError ? 'alert-danger' : 'alert-success');
      setTimeout(() => alertEl.classList.add('d-none'), 3000);
    }

    function toggleQuizForm(show = true, quiz = null) {
      const container = document.getElementById('quizFormContainer');
      const formTitle = document.getElementById('formTitle');
      if (show) {
        container.style.display = 'flex';
        document.getElementById('quizForm').reset();
        if (quiz) {
          formTitle.innerHTML = '<i class="ti ti-pencil me-2 text-primary"></i>Edit Quiz';
          document.getElementById('quizId').value = quiz.id;
          document.getElementById('title').value = quiz.title;
          document.getElementById('description').value = quiz.description;
          document.getElementById('durationMinutes').value = quiz.durationMinutes;
          document.getElementById('passScore').value = quiz.passScore;
          document.getElementById('difficulty').value = quiz.difficulty || 'MEDIUM';
          document.getElementById('active').checked = quiz.active;
        } else {
          formTitle.innerHTML = '<i class="ti ti-plus me-2 text-primary"></i>Create New Quiz';
          document.getElementById('quizId').value = '';
          document.getElementById('durationMinutes').value = 30;
          document.getElementById('passScore').value = 50;
        }
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        container.style.display = 'none';
      }
    }

    async function fetchQuizzes() {
      const loader = document.getElementById('loader');
      loader.classList.remove('d-none');
      document.getElementById('learningSpacesContainer').innerHTML = '';

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Failed to load');
        currentQuizzes = await response.json();
        
        populateSpaceFilter(currentQuizzes);
        renderGroupedQuizzes(currentQuizzes);
      } catch (error) {
        console.error(error);
        showAlert('Failed to load quizzes', true);
      } finally {
        loader.classList.add('d-none');
      }
    }

    function populateSpaceFilter(quizzes) {
      const select = document.getElementById('spaceFilter');
      const spaces = [...new Set(quizzes.map(q => q.learningSpaceName || 'Uncategorized'))];
      
      select.innerHTML = '<option value="ALL">All Spaces</option>';
      spaces.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.innerText = s;
        select.appendChild(opt);
      });
    }

    function filterQuizzes() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const spaceVal = document.getElementById('spaceFilter').value;
      const statusVal = document.getElementById('statusFilter').value;

      const filtered = currentQuizzes.filter(q => {
        const matchTitle = q.title.toLowerCase().includes(term) || (q.courseName && q.courseName.toLowerCase().includes(term));
        const matchSpace = spaceVal === 'ALL' || (q.learningSpaceName || 'Uncategorized') === spaceVal;
        const matchStatus = statusVal === 'ALL' || (statusVal === 'ACTIVE' ? q.active : !q.active);
        return matchTitle && matchSpace && matchStatus;
      });

      renderGroupedQuizzes(filtered);
    }

    function renderGroupedQuizzes(quizzes) {
      const container = document.getElementById('learningSpacesContainer');
      container.innerHTML = '';

      if (quizzes.length === 0) {
        container.innerHTML = '<div class="text-center text-muted py-5"><i class="ti ti-inbox fs-1 mb-3"></i><h4>No quizzes found</h4></div>';
        return;
      }

      // Group by Learning Space
      const groups = {};
      quizzes.forEach(q => {
        const spaceName = q.learningSpaceName || 'Uncategorized';
        if (!groups[spaceName]) groups[spaceName] = [];
        groups[spaceName].push(q);
      });

      // Render each group
      for (const [spaceName, spaceQuizzes] of Object.entries(groups)) {
        
        // Calculate group stats
        const activeCount = spaceQuizzes.filter(q => q.active).length;
        const totalAttempts = spaceQuizzes.reduce((sum, q) => sum + (q.totalAttempts || 0), 0);
        const passRateSum = spaceQuizzes.reduce((sum, q) => sum + (q.passRate || 0), 0);
        const avgPassRate = spaceQuizzes.length > 0 ? (passRateSum / spaceQuizzes.length).toFixed(0) : 0;

        const section = document.createElement('div');
        section.className = 'space-section';
        
        // Header with Space Name and Stats
        section.innerHTML = `
          <div class="space-header">
            <h2 class="space-title"><i class="ti ti-folder text-primary"></i> ${spaceName}</h2>
            <div class="space-stats-pill">
              <span title="Total Quizzes"><i class="ti ti-files"></i> ${spaceQuizzes.length}</span>
              <span title="Active"><i class="ti ti-check text-success"></i> ${activeCount}</span>
              <span title="Student Attempts"><i class="ti ti-users text-warning"></i> ${totalAttempts}</span>
              <span title="Avg Pass Rate"><i class="ti ti-target text-info"></i> ${avgPassRate}%</span>
            </div>
          </div>
          <div class="row g-4" id="grid-${spaceName.replace(/\s+/g, '-')}"></div>
        `;
        
        container.appendChild(section);
        const grid = section.querySelector('.row');

        // Render Cards
        spaceQuizzes.forEach(quiz => {
          const badgeClass = quiz.active ? 'badge-active' : 'badge-inactive';
          const badgeText = quiz.active ? 'Active' : 'Inactive';
          
          const cardHtml = `
            <div class="col-12 col-md-6 col-xl-4">
              <div class="quiz-card">
                <div class="card-top-info">
                  <div class="course-label">${quiz.courseName || 'General'}</div>
                  <div class="quiz-badge ${badgeClass}">
                    <i class="${quiz.active ? 'ti ti-circle-filled' : 'ti ti-circle-dashed'} fs-9"></i> ${badgeText}
                  </div>
                </div>
                
                <h4 class="quiz-title-text">${quiz.title}</h4>
                <p class="quiz-desc">${quiz.description || 'A comprehensive assessment.'}</p>
                
                <div class="quiz-metrics">
                  <div class="metric-item">
                    <div class="metric-val text-warning"><i class="ti ti-help-circle"></i> ${quiz.questionCount || 0}</div>
                    <div class="metric-label">Questions</div>
                  </div>
                  <div class="metric-item">
                    <div class="metric-val text-primary"><i class="ti ti-clock"></i> ${quiz.durationMinutes}m</div>
                    <div class="metric-label">Duration</div>
                  </div>
                  <div class="metric-item">
                    <div class="metric-val text-success"><i class="ti ti-target"></i> ${quiz.passScore}</div>
                    <div class="metric-label">Pass Score</div>
                  </div>
                </div>
                
                <div class="card-bottom">
                  <div class="student-avatars">
                    <img src="/assets/images/avatar-1.jpg" alt="s">
                    <img src="/assets/images/avatar-2.jpg" alt="s">
                    <span class="attempts-count">+${quiz.totalAttempts || 0}</span>
                  </div>
                  <div class="action-btns d-flex gap-2">
                    <button class="btn-build" onclick="window.location.href='/lecturer/quizzes/${quiz.id}/builder'" title="Build Questions">
                      <i class="ti ti-tools"></i> Build
                    </button>
                    <button onclick='editQuiz(${quiz.id})' title="Edit Settings"><i class="ti ti-pencil"></i></button>
                    <button class="text-danger" onclick="deleteQuiz(${quiz.id})" title="Delete"><i class="ti ti-trash"></i></button>
                  </div>
                </div>
              </div>
            </div>
          `;
          grid.insertAdjacentHTML('beforeend', cardHtml);
        });
      }
    }

    function editQuiz(id) {
      const quiz = currentQuizzes.find(q => q.id === id);
      if (quiz) toggleQuizForm(true, quiz);
    }

    async function saveQuiz() {
      const id = document.getElementById('quizId').value;
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const durationMinutes = document.getElementById('durationMinutes').value;
      const passScore = document.getElementById('passScore').value;
      const difficulty = document.getElementById('difficulty').value;
      const active = document.getElementById('active').checked;
      
      if (!title || !durationMinutes || !passScore) {
        showAlert('Please fill all required fields!', true);
        return;
      }

      let validNodeId = 1;
      let validLecturerId = 1;
      if (currentQuizzes && currentQuizzes.length > 0) {
        validNodeId = currentQuizzes[0].learningNodeId || 1;
        validLecturerId = currentQuizzes[0].lecturerId || 1;
      }

      const payload = {
        learningNodeId: validNodeId, 
        lecturerId: validLecturerId,     
        title,
        description,
        durationMinutes: parseInt(durationMinutes),
        passScore: parseInt(passScore),
        difficulty,
        active
      };

      const method = id ? 'PUT' : 'POST';
      const url = id ? `${API_URL}/${id}` : API_URL;
      const btn = document.getElementById('saveBtn');
      const originalText = btn.innerHTML;
      
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';
      btn.disabled = true;

      try {
        const response = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let errorMsg = 'Failed to save';
          try {
            const errData = await response.json();
            errorMsg = errData.message || errorMsg;
          } catch(e) {}
          throw new Error(errorMsg);
        }
        
        showAlert(id ? 'Quiz updated successfully' : 'Quiz created successfully');
        toggleQuizForm(false);
        fetchQuizzes();
      } catch (error) {
        showAlert('Error: ' + error.message, true);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function deleteQuiz(id) {
      const quiz = currentQuizzes.find(q => q.id === id);
      if (!quiz) return;

      if (quiz.totalAttempts > 0) {
        if (confirm('LƯU Ý: Bài Quiz này đã có sinh viên làm bài nên KHÔNG THỂ xóa vĩnh viễn (để bảo lưu điểm số).\\n\\nBạn có muốn XÓA MỀM bằng cách chuyển sang trạng thái Ngừng Hoạt Động (Draft/Inactive) không?')) {
          try {
            const payload = {
              learningNodeId: quiz.learningNodeId || 1,
              lecturerId: quiz.lecturerId || 1,
              title: quiz.title,
              description: quiz.description,
              durationMinutes: quiz.durationMinutes,
              passScore: quiz.passScore,
              difficulty: quiz.difficulty,
              active: false // Soft delete
            };
            
            const response = await fetch(`${API_URL}/${id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            
            if (!response.ok) throw new Error('Failed to soft delete');
            showAlert('Đã vô hiệu hóa (Xóa mềm) bài Quiz thành công!');
            fetchQuizzes();
          } catch (error) {
            showAlert('Lỗi khi vô hiệu hóa bài Quiz', true);
          }
        }
      } else {
        if (confirm('Bạn có chắc chắn muốn xóa vĩnh viễn bài Quiz này không? Hành động này không thể hoàn tác.')) {
          try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (!response.ok) throw new Error('Failed to delete');
            
            showAlert('Đã xóa vĩnh viễn bài Quiz thành công!');
            fetchQuizzes();
          } catch (error) {
            showAlert('Lỗi khi xóa bài Quiz', true);
          }
        }
      }
    }
  </script>
</body>
