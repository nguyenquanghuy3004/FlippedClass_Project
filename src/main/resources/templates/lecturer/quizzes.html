<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{lecturer/layout}">
<head>
  <title>Quizzes - FlippedClass</title>
  <style>
    /* =========================================
       PREMIUM AESTHETICS FOR QUIZZES CONTENT
       ========================================= */
    .page-header-premium { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; border-radius: 20px; padding: 2.5rem; margin-bottom: 2rem; box-shadow: 0 10px 30px rgba(30, 60, 114, 0.15); position: relative; overflow: hidden; }
    .page-header-premium::before { content: ''; position: absolute; top: -50px; right: -50px; width: 250px; height: 250px; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%); border-radius: 50%; }
    .page-title { font-weight: 800; letter-spacing: -0.5px; font-size: 2rem; margin-bottom: 0.5rem; }
    .btn-premium { background: white; color: #1e3c72; font-weight: 700; border: none; padding: 0.75rem 1.5rem; border-radius: 50rem; box-shadow: 0 8px 15px rgba(0,0,0,0.1); transition: all 0.3s; }
    .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 12px 20px rgba(0,0,0,0.15); color: #2a5298; }
    .quiz-card { background: #ffffff; border-radius: 24px; border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 8px 24px rgba(0,0,0,0.03); padding: 1.5rem; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); height: 100%; display: flex; flex-direction: column; position: relative; }
    .quiz-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.08); }
    .quiz-badge { position: absolute; top: 1.5rem; right: 1.5rem; padding: 0.4rem 0.8rem; border-radius: 50rem; font-weight: 700; font-size: 0.75rem; }
    .quiz-icon-wrapper { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 1.5rem; background: linear-gradient(135deg, rgba(30,60,114,0.1), rgba(42,82,152,0.1)); color: #1e3c72; }
    .quiz-title-text { font-size: 1.3rem; font-weight: 800; color: #2c3e50; margin-bottom: 0.5rem; line-height: 1.3; padding-right: 4rem; }
    .quiz-stats { background: #f8f9fa; border-radius: 16px; padding: 1rem; display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
    .stat-item { text-align: center; }
    .stat-value { font-size: 1.1rem; font-weight: 800; color: #2c3e50; }
    .stat-label { font-size: 0.7rem; font-weight: 700; color: #95a5a6; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-card { border: none; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); overflow: hidden; }
    .form-control, .form-select { border-radius: 12px; padding: 0.8rem 1.2rem; border: 1px solid #e9ecef; background-color: #f8f9fa; font-weight: 500; transition: all 0.2s; }
    .form-control:focus, .form-select:focus { background-color: #fff; border-color: #1e3c72; box-shadow: 0 0 0 4px rgba(30, 60, 114, 0.1); }
    .form-label { font-weight: 700; color: #495057; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div layout:fragment="content">
    <div class="row">
      <div class="col-12">
        <div class="page-header-premium d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
          <div style="z-index: 2;">
            <h1 class="page-title">Quizzes Management</h1>
            <p class="mb-0 fs-6" style="opacity: 0.85;">Design, publish and monitor your course assessments beautifully.</p>
          </div>
          <div style="z-index: 2;">
            <button class="btn btn-premium d-flex align-items-center gap-2" onclick="toggleQuizForm()">
              <i class="ti ti-plus fs-5"></i> Create New Quiz
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="alertMessage" class="alert alert-success d-none mb-4 shadow-sm border-0 fw-bold rounded-3" role="alert" style="transition: 0.3s;">
      Action completed successfully!
    </div>

    <div class="row" id="quizFormContainer" style="display: none;">
      <div class="col-12 mb-5">
        <div class="card form-card">
          <div class="card-body p-5">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
              <h3 class="mb-0 fw-bold text-dark" id="formTitle"><i class="ti ti-pencil me-2 text-primary"></i>Create New Quiz</h3>
              <button type="button" class="btn-close" aria-label="Close" onclick="toggleQuizForm(false)"></button>
            </div>
            
            <form id="quizForm">
              <input type="hidden" id="quizId">
              <div class="row g-4">
                <div class="col-md-12">
                  <label for="title" class="form-label">Quiz Title <span class="text-danger">*</span></label>
                  <input type="text" class="form-control form-control-lg" id="title" placeholder="e.g. Midterm Assessment" required>
                </div>
                
                <div class="col-md-4">
                  <label for="durationMinutes" class="form-label">Duration (Minutes) <span class="text-danger">*</span></label>
                  <input type="number" class="form-control" id="durationMinutes" placeholder="30" required>
                </div>
                <div class="col-md-4">
                  <label for="passScore" class="form-label">Pass Score (%) <span class="text-danger">*</span></label>
                  <input type="number" class="form-control" id="passScore" placeholder="50" max="100" required>
                </div>
                <div class="col-md-4">
                  <label for="difficulty" class="form-label">Difficulty</label>
                  <select class="form-select" id="difficulty">
                    <option value="EASY">Easy</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="HARD">Hard</option>
                  </select>
                </div>

                <div class="col-md-12">
                  <label for="description" class="form-label">Description</label>
                  <textarea class="form-control" id="description" rows="3" placeholder="Brief description of the quiz..."></textarea>
                </div>

                <div class="col-md-12">
                  <div class="form-check form-switch fs-5 mt-2">
                    <input type="checkbox" class="form-check-input" id="active" checked>
                    <label class="form-check-label fw-bold text-dark ms-2" for="active">Publish immediately (Active)</label>
                  </div>
                </div>
              </div>

              <div class="d-flex gap-3 mt-5 pt-3 border-top">
                <button type="button" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm" onclick="saveQuiz()" id="saveBtn">Save Quiz</button>
                <button type="button" class="btn btn-light btn-lg rounded-pill px-4 fw-bold" onclick="toggleQuizForm(false)">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="fw-bold mb-0 text-dark">All Quizzes</h3>
        </div>
        
        <div id="loader" class="text-center py-5">
          <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div class="row g-4" id="quizzes-grid"></div>
      </div>
    </div>
  </div>

  <th:block layout:fragment="scripts">
    <script th:src="@{/assets/js/lecturer/quizzes.js}"></script>
  </th:block>
</body>
</html>
