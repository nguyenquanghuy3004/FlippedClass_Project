<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Quiz Management - FlippedClass</title>
  <meta name="description" content="Create, edit and monitor your course quizzes">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <link rel="stylesheet" th:href="@{/assets/css/quizzes.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
  <div id="overlay" class="overlay"></div>

  <div class="toast-wrap" id="toastWrap"></div>

  <nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3">
    <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>
    <button id="mobileBtn" class="btn btn-light btn-icon btn-sm d-lg-none me-2">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>
    <div>
      <ul class="list-unstyled d-flex align-items-center mb-0 gap-2">
        <li id="userInfoDisplay" class="d-flex align-items-center gap-2"
          style="font-size:0.85rem;font-weight:600;color:#374151;"></li>

        <li class="ms-1 dropdown">
          <a href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <img th:src="@{/assets/images/avatar-1.jpg}" alt="" class="avatar avatar-sm rounded-circle" id="userAvatar"
              style="display:none;" />
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <aside id="sidebar" class="sidebar d-flex flex-column">
    <div class="logo-area">
      <a href="/lecturer/dashboard" class="d-inline-flex">
        <i class="fa-solid fa-chalkboard-user text-success fs-3"></i>
        <span class="logo-text ms-2 fw-bold text-success fs-4"> FCMS Lecture</span>
      </a>
    </div>
    <ul class="nav flex-column mb-auto">
      <li class="px-4 py-2"><small class="nav-text">Workspace</small></li>
      <li>
        <a class="nav-link" href="/lecturer/dashboard">
          <i class="ti ti-box-seam"></i><span class="nav-text">My Spaces</span>
        </a>
      </li>
      <li>
        <a class="nav-link active" href="/lecturer/quizzes">
          <i class="ti ti-checklist"></i><span class="nav-text">My Quizzes</span>
        </a>
      </li>
    </ul>
  </aside>

  <main id="content" class="content py-10">
    <div class="container-fluid">

      <div class="auth-required d-none" id="authRequired">
        <i class="ti ti-lock"></i>
        <h3 class="fw-bold">Login Required</h3>
        <p class="text-muted mb-3">You need to sign in as a lecturer to manage quizzes.</p>
        <a href="/signin" class="btn btn-primary rounded-pill px-4 fw-bold">
          <i class="ti ti-login me-1"></i>Sign In
        </a>
      </div>

      <div id="mainUI" class="d-none">

        <div class="page-banner">
          <div style="z-index:2;">
            <h1 class="banner-title"><i class="ti ti-brain me-2"></i>Quiz Management</h1>
            <p class="banner-sub">Design, publish and monitor your course assessments.</p>
          </div>
          <div style="z-index:2;">
            <button class="btn-banner" onclick="openCreateModal()">
              <i class="ti ti-plus"></i> Create New Quiz
            </button>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-icon purple"><i class="ti ti-files"></i></div>
            <div>
              <div class="stat-val" id="statTotal">—</div>
              <div class="stat-label">Total Quizzes</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green"><i class="ti ti-circle-check"></i></div>
            <div>
              <div class="stat-val" id="statActive">—</div>
              <div class="stat-label">Active</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon orange"><i class="ti ti-users"></i></div>
            <div>
              <div class="stat-val" id="statAttempts">—</div>
              <div class="stat-label">Total Attempts</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon blue"><i class="ti ti-help-circle"></i></div>
            <div>
              <div class="stat-val" id="statQuestions">—</div>
              <div class="stat-label">Total Questions</div>
            </div>
          </div>
        </div>

        <div class="filter-bar">
          <div class="search-wrap">
            <i class="ti ti-search"></i>
            <input type="text" id="searchInput" placeholder="Search quizzes by title or course..."
              oninput="filterQuizzes()">
          </div>
          <select class="filter-pill" id="statusFilter" onchange="filterQuizzes()">
            <option value="ALL">All Status</option>
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
          </select>
          <select class="filter-pill" id="diffFilter" onchange="filterQuizzes()">
            <option value="ALL">All Difficulty</option>
            <option value="EASY">Easy</option>
            <option value="MEDIUM">Medium</option>
            <option value="HARD">Hard</option>
          </select>
          <select class="filter-pill" id="spaceFilter" onchange="filterQuizzes()">
            <option value="ALL">All Spaces</option>
          </select>
        </div>

        <div id="quizContainer">
          <div id="skeletonLoader" class="row g-4">
            <div class="col-md-6 col-xl-4">
              <div class="quiz-card">
                <div class="skeleton" style="height:180px;"></div>
              </div>
            </div>
            <div class="col-md-6 col-xl-4">
              <div class="quiz-card">
                <div class="skeleton" style="height:180px;"></div>
              </div>
            </div>
            <div class="col-md-6 col-xl-4">
              <div class="quiz-card">
                <div class="skeleton" style="height:180px;"></div>
              </div>
            </div>
          </div>
          <div id="quizContent"></div>
        </div>

      </div>
    </div>
  </main>

  <div class="modal-overlay" id="quizModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle"><i class="ti ti-plus me-2 text-primary"></i>Create New Quiz</h3>
        <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editQuizId">

        <div id="nodePickerSection" class="mb-4">
          <label class="form-label fw-semibold">Learning Node <span class="text-danger">*</span></label>
          <select class="form-select" id="nodePicker">
            <option value="">Loading nodes...</option>
          </select>
          <div class="invalid-feedback d-block d-none" id="err-learningNodeId"></div>
        </div>

        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Quiz Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="mTitle" placeholder="e.g. Midterm Assessment — Chapter 1"
              maxlength="255">
            <div class="invalid-feedback d-block d-none" id="err-title"></div>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Description</label>
            <textarea class="form-control" id="mDescription" rows="3" placeholder="Brief description of this quiz..."
              maxlength="500"></textarea>
            <div class="invalid-feedback d-block d-none" id="err-description"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Duration (minutes) <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="mDuration" value="30" min="1" max="480">
            <div class="invalid-feedback d-block d-none" id="err-durationMinutes"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Pass Score (/100) <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="mPassScore" value="50" min="1" max="100">
            <div class="invalid-feedback d-block d-none" id="err-passScore"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Difficulty</label>
            <select class="form-select" id="mDifficulty">
              <option value="EASY">Easy</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HARD">Hard</option>
            </select>
            <div class="invalid-feedback d-block d-none" id="err-difficulty"></div>
          </div>
          <div class="col-12">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="mActive" checked>
              <label class="form-check-label fw-semibold" for="mActive">Publish immediately (Active)</label>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4 pt-3" style="border-top:1px solid #f3f4f6;">
          <button class="btn btn-primary rounded-pill px-4 fw-bold" onclick="saveQuiz()" id="btnSaveQuiz">
            <i class="ti ti-check me-1"></i>Save Quiz
          </button>
          <button class="btn btn-light rounded-pill px-4 fw-bold" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal-box" style="max-width:420px;">
      <div class="modal-header">
        <h3 style="color:#dc2626;"><i class="ti ti-alert-triangle me-2"></i>Confirm Delete</h3>
        <button class="modal-close" onclick="document.getElementById('deleteModal').classList.remove('show')"><i
            class="ti ti-x"></i></button>
      </div>
      <div class="modal-body">
        <p id="deleteMessage" class="text-muted mb-4"></p>
        <div class="d-flex gap-2">
          <button class="btn btn-danger rounded-pill px-4 fw-bold" id="btnConfirmDelete" onclick="confirmDelete()">
            <i class="ti ti-trash me-1"></i>Confirm
          </button>
          <button class="btn btn-light rounded-pill px-4 fw-bold"
            onclick="document.getElementById('deleteModal').classList.remove('show')">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = 'jwt_token';
    const USER_KEY = 'currentUser';

    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function getUser() { try { return JSON.parse(localStorage.getItem(USER_KEY)); } catch (e) { return null; } }
    function authHeaders() {
      const t = getToken();
      return t
        ? { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t }
        : { 'Content-Type': 'application/json' };
    }
    function logout() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      localStorage.removeItem('user_id');
      window.location.href = '/signin';
    }

    let allQuizzes = [];
    let pendingDeleteId = null;
    let pendingDeleteHasAttempts = false;
    let availableNodes = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const token = getToken();
      if (!token) {
        document.getElementById('authRequired').classList.remove('d-none');
        return;
      }
      const user = getUser();
      document.getElementById('mainUI').classList.remove('d-none');
      if (user) {
        document.getElementById('userAvatar').style.display = 'inline-block';
        document.getElementById('userInfoDisplay').innerHTML =
          `<i class="ti ti-user-circle" style="color:#7c3aed;font-size:1.2rem;"></i><span>${user.fullName || user.email || 'Lecturer'}</span>`;
      }
      await loadNodes();
      await fetchMyQuizzes();
    });

    function toast(msg, isError = false) {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast-item' + (isError ? ' error' : '');
      el.innerHTML = `
        <span class="toast-icon" style="color:${isError ? '#dc2626' : '#059669'};">
          <i class="ti ti-${isError ? 'alert-circle' : 'circle-check'}"></i>
        </span>
        <span class="toast-msg">${msg}</span>`;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    async function loadNodes() {
      try {
        const res = await fetch('/api/learning-nodes', { headers: authHeaders() });
        if (res.ok) availableNodes = await res.json();
      } catch (e) { }
    }

    async function fetchMyQuizzes() {
      document.getElementById('skeletonLoader').style.display = 'flex';
      document.getElementById('quizContent').innerHTML = '';
      try {
        const res = await fetch('/api/quizzes/my', { headers: authHeaders() });
        if (res.status === 401 || res.status === 403) {
          document.getElementById('mainUI').classList.add('d-none');
          document.getElementById('authRequired').classList.remove('d-none');
          return;
        }
        if (!res.ok) throw new Error();
        allQuizzes = await res.json();
        updateStats(allQuizzes);
        populateSpaceFilter(allQuizzes);
        renderQuizzes(allQuizzes);
      } catch (e) {
        toast('Failed to load quizzes', true);
      } finally {
        document.getElementById('skeletonLoader').style.display = 'none';
      }
    }

    function updateStats(quizzes) {
      document.getElementById('statTotal').textContent = quizzes.length;
      document.getElementById('statActive').textContent = quizzes.filter(q => q.active).length;
      document.getElementById('statAttempts').textContent = quizzes.reduce((s, q) => s + (q.totalAttempts || 0), 0);
      document.getElementById('statQuestions').textContent = quizzes.reduce((s, q) => s + (q.questionCount || 0), 0);
    }

    function populateSpaceFilter(quizzes) {
      const sel = document.getElementById('spaceFilter');
      const spaces = [...new Set(quizzes.map(q => q.learningSpaceName || 'Uncategorized'))];
      sel.innerHTML = '<option value="ALL">All Spaces</option>';
      spaces.forEach(s => {
        const o = document.createElement('option');
        o.value = o.textContent = s;
        sel.appendChild(o);
      });
    }

    function filterQuizzes() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const diff = document.getElementById('diffFilter').value;
      const space = document.getElementById('spaceFilter').value;
      const filtered = allQuizzes.filter(q => {
        const matchText = q.title.toLowerCase().includes(term) || (q.courseName || '').toLowerCase().includes(term);
        const matchStatus = status === 'ALL' || (status === 'ACTIVE' ? q.active : !q.active);
        const matchDiff = diff === 'ALL' || q.difficulty === diff;
        const matchSpace = space === 'ALL' || (q.learningSpaceName || 'Uncategorized') === space;
        return matchText && matchStatus && matchDiff && matchSpace;
      });
      renderQuizzes(filtered);
    }

    function diffChip(d) {
      const cls = { EASY: 'diff-easy', MEDIUM: 'diff-medium', HARD: 'diff-hard' };
      const label = { EASY: 'Easy', MEDIUM: 'Medium', HARD: 'Hard' };
      return `<span class="difficulty-chip ${cls[d] || 'diff-medium'}">${label[d] || d || '—'}</span>`;
    }

    function renderQuizzes(quizzes) {
      const container = document.getElementById('quizContent');
      container.innerHTML = '';
      if (!quizzes.length) {
        container.innerHTML = `
          <div class="empty-box">
            <i class="ti ti-mood-empty"></i>
            <h4 class="fw-bold">No quizzes found</h4>
            <p>Click <strong>Create New Quiz</strong> to get started.</p>
          </div>`;
        return;
      }
      const groups = {};
      quizzes.forEach(q => {
        const key = q.learningSpaceName || 'Uncategorized';
        if (!groups[key]) groups[key] = [];
        groups[key].push(q);
      });
      for (const [spaceName, list] of Object.entries(groups)) {
        const activeCount = list.filter(q => q.active).length;
        const section = document.createElement('div');
        section.className = 'mb-5';
        section.innerHTML = `
          <div class="section-header">
            <div class="section-title">
              <i class="ti ti-folder" style="color:#7c3aed;"></i>
              ${spaceName}
              <span class="section-badge">${list.length} quiz${list.length !== 1 ? 'zes' : ''}</span>
            </div>
            <small class="text-muted">${activeCount} active</small>
          </div>
          <div class="row g-4"></div>`;
        container.appendChild(section);
        const grid = section.querySelector('.row');
        list.forEach(quiz => {
          const passRate = (quiz.passRate || 0).toFixed(0);
          const col = document.createElement('div');
          col.className = 'col-12 col-md-6 col-xl-4';
          col.innerHTML = `
            <div class="quiz-card" style="cursor: pointer;" onclick="window.location.href='/lecturer/quizzes/${quiz.id}/statistics'">
              <div class="card-top">
                <span class="course-tag">${quiz.courseName || 'General'}</span>
                <span class="status-badge ${quiz.active ? 'active' : 'inactive'}">
                  ${quiz.active ? '● Active' : '○ Inactive'}
                </span>
              </div>
              <h4 class="quiz-title-text">${quiz.title}</h4>
              <p class="quiz-desc">${quiz.description || 'No description provided.'}</p>
              <div class="quiz-metrics">
                <div class="metric">
                  <div class="metric-val" style="color:#d97706;">${quiz.questionCount || 0}</div>
                  <div class="metric-lbl">Questions</div>
                </div>
                <div class="metric">
                  <div class="metric-val" style="color:#2563eb;">${quiz.durationMinutes}m</div>
                  <div class="metric-lbl">Duration</div>
                </div>
                <div class="metric">
                  <div class="metric-val" style="color:#059669;">${quiz.totalAttempts || 0}</div>
                  <div class="metric-lbl">Attempts</div>
                </div>
              </div>
              <div class="d-flex align-items-center justify-content-between mb-2">
                ${diffChip(quiz.difficulty)}
                <small class="text-muted fw-semibold">Pass: ${quiz.passScore}% &nbsp;|&nbsp; Rate: ${passRate}%</small>
              </div>
              <div class="pass-bar">
                <div class="pass-fill" style="width:${passRate}%;"></div>
              </div>
              <div class="card-actions mt-3">
                <button class="btn-build" onclick="event.stopPropagation(); window.location.href='/lecturer/quizzes/${quiz.id}/builder'">
                  <i class="ti ti-tools"></i> Build Questions
                </button>
                <div class="d-flex gap-1">
                  <button class="btn-icon-sm" onclick="event.stopPropagation(); openEditModal(${quiz.id})" title="Edit">
                    <i class="ti ti-pencil"></i>
                  </button>
                  <button class="btn-icon-sm danger" onclick="event.stopPropagation(); openDeleteConfirm(${quiz.id})" title="Delete">
                    <i class="ti ti-trash"></i>
                  </button>
                </div>
              </div>
            </div>`;
          grid.appendChild(col);
        });
      }
    }

    function openCreateModal() {
      document.getElementById('modalTitle').innerHTML = '<i class="ti ti-plus me-2 text-primary"></i>Create New Quiz';
      document.getElementById('editQuizId').value = '';
      document.getElementById('mTitle').value = '';
      document.getElementById('mDescription').value = '';
      document.getElementById('mDuration').value = 30;
      document.getElementById('mPassScore').value = 50;
      document.getElementById('mDifficulty').value = 'MEDIUM';
      document.getElementById('mActive').checked = true;
      document.getElementById('nodePickerSection').style.display = 'block';
      renderNodePicker();
      document.getElementById('nodePicker').value = '';
      clearErrors();
      document.getElementById('quizModal').classList.add('show');
    }

    function openEditModal(id) {
      const quiz = allQuizzes.find(q => q.id === id);
      if (!quiz) return;
      document.getElementById('modalTitle').innerHTML = '<i class="ti ti-pencil me-2 text-primary"></i>Edit Quiz';
      document.getElementById('editQuizId').value = quiz.id;
      document.getElementById('mTitle').value = quiz.title || '';
      document.getElementById('mDescription').value = quiz.description || '';
      document.getElementById('mDuration').value = quiz.durationMinutes || 30;
      document.getElementById('mPassScore').value = quiz.passScore || 50;
      document.getElementById('mDifficulty').value = quiz.difficulty || 'MEDIUM';
      document.getElementById('mActive').checked = quiz.active;
      document.getElementById('nodePickerSection').style.display = 'none';
      clearErrors();
      document.getElementById('quizModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('quizModal').classList.remove('show');
    }

    function renderNodePicker() {
      const picker = document.getElementById('nodePicker');
      picker.innerHTML = '';
      if (!availableNodes.length) {
        picker.innerHTML = '<option value="">No learning nodes found. Create a learning space first.</option>';
        picker.disabled = true;
        return;
      }
      picker.disabled = false;
      picker.innerHTML = '<option value="">-- Select a Learning Node --</option>';
      availableNodes.forEach(node => {
        const opt = document.createElement('option');
        opt.value = node.id;
        const spacePart = node.spaceName && node.spaceName !== 'Uncategorized' ? `[${node.spaceName}] - ` : '';
        const nodeTitle = node.title || node.name || `Node #${node.id}`;
        opt.textContent = spacePart + nodeTitle;
        picker.appendChild(opt);
      });
    }

    function clearErrors() {
      document.querySelectorAll('.invalid-feedback').forEach(el => {
        el.classList.add('d-none');
        el.textContent = '';
      });
      document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
    }

    function showError(fieldId, message) {
      const errEl = document.getElementById('err-' + fieldId);
      if (errEl) {
        errEl.textContent = message;
        errEl.classList.remove('d-none');
        const inputIdMap = {
          'title': 'mTitle',
          'description': 'mDescription',
          'durationMinutes': 'mDuration',
          'passScore': 'mPassScore',
          'difficulty': 'mDifficulty',
          'learningNodeId': 'nodePicker'
        };
        const inputEl = document.getElementById(inputIdMap[fieldId]);
        if (inputEl) inputEl.classList.add('is-invalid');
      }
    }

    async function saveQuiz() {
      const id = document.getElementById('editQuizId').value;
      const title = document.getElementById('mTitle').value.trim();
      const description = document.getElementById('mDescription').value.trim();
      const durationStr = document.getElementById('mDuration').value;
      const duration = parseInt(durationStr);
      const passScoreStr = document.getElementById('mPassScore').value;
      const passScore = parseInt(passScoreStr);
      const difficulty = document.getElementById('mDifficulty').value;
      const active = document.getElementById('mActive').checked;
      const nodeId = document.getElementById('nodePicker').value;

      clearErrors();
      let hasError = false;

      if (!title) { showError('title', 'Title is required'); hasError = true; }
      else if (title.length < 3 || title.length > 255) { showError('title', 'Title must be between 3 and 255 characters'); hasError = true; }

      if (description && description.length > 500) { showError('description', 'Description must not exceed 500 characters'); hasError = true; }
      
      if (!durationStr || duration < 1 || duration > 480) { showError('durationMinutes', 'Duration must be between 1 and 480 minutes'); hasError = true; }
      
      if (!passScoreStr || passScore < 1 || passScore > 100) { showError('passScore', 'Pass score must be between 1 and 100'); hasError = true; }

      if (!id && !nodeId) { showError('learningNodeId', 'Please select a Learning Node'); hasError = true; }

      if (hasError) return;

      const btn = document.getElementById('btnSaveQuiz');
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';
      btn.disabled = true;

      try {
        let res;
        if (id) {
          res = await fetch(`/api/quizzes/${id}`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ title, description, durationMinutes: duration, passScore, difficulty, active })
          });
        } else {
          res = await fetch('/api/quizzes', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ learningNodeId: parseInt(nodeId), title, description, durationMinutes: duration, passScore, difficulty, active })
          });
        }
        
        if (res.status === 401) { toast('Session expired!', true); logout(); return; }
        
        if (!res.ok) {
          let msg = id ? 'Update failed' : 'Create failed';
          try { 
            const e = await res.json(); 
            msg = e.message || msg; 
            if (res.status === 400 && e.error === 'VALIDATION_FAILED' && e.fieldErrors) {
               e.fieldErrors.forEach(err => showError(err.field, err.message));
               throw new Error('Please fix the validation errors.');
            }
          } catch (e) { throw e; }
        } else {
          toast(id ? 'Quiz updated successfully!' : 'Quiz created successfully!');
          closeModal();
          await fetchMyQuizzes();
        }
      } catch (e) {
        if (e.message !== 'Please fix the validation errors.') {
          toast(e.message, true);
        }
      } finally {
        btn.innerHTML = '<i class="ti ti-check me-1"></i>Save Quiz';
        btn.disabled = false;
      }
    }

    function openDeleteConfirm(id) {
      const quiz = allQuizzes.find(q => q.id === id);
      if (!quiz) return;
      pendingDeleteId = id;
      pendingDeleteHasAttempts = (quiz.totalAttempts || 0) > 0;
      const msg = document.getElementById('deleteMessage');
      const btn = document.getElementById('btnConfirmDelete');
      if (pendingDeleteHasAttempts) {
        msg.innerHTML = `<div class="alert alert-warning rounded-3 mb-3"><i class="ti ti-alert-triangle me-2"></i>
          Quiz <strong>"${quiz.title}"</strong> has <strong>${quiz.totalAttempts} student attempt(s)</strong> and cannot be permanently deleted.
          </div>Do you want to <strong>deactivate</strong> (soft-delete) this quiz instead?`;
        btn.innerHTML = '<i class="ti ti-eye-off me-1"></i>Deactivate';
        btn.className = 'btn btn-warning rounded-pill px-4 fw-bold';
      } else {
        msg.innerHTML = `Are you sure you want to permanently delete <strong>"${quiz.title}"</strong>? This action cannot be undone.`;
        btn.innerHTML = '<i class="ti ti-trash me-1"></i>Delete Permanently';
        btn.className = 'btn btn-danger rounded-pill px-4 fw-bold';
      }
      document.getElementById('deleteModal').classList.add('show');
    }

    async function confirmDelete() {
      if (!pendingDeleteId) return;
      const btn = document.getElementById('btnConfirmDelete');
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
      btn.disabled = true;
      try {
        let res;
        if (pendingDeleteHasAttempts) {
          const quiz = allQuizzes.find(q => q.id === pendingDeleteId);
          res = await fetch(`/api/quizzes/${pendingDeleteId}`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ title: quiz.title, active: false })
          });
          if (!res.ok) throw new Error('Deactivation failed');
          toast('Quiz deactivated successfully!');
        } else {
          res = await fetch(`/api/quizzes/${pendingDeleteId}`, {
            method: 'DELETE',
            headers: authHeaders()
          });
          if (!res.ok && res.status !== 204) throw new Error('Delete failed');
          toast('Quiz deleted successfully!');
        }
        document.getElementById('deleteModal').classList.remove('show');
        await fetchMyQuizzes();
      } catch (e) {
        toast(e.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('quizModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
    document.getElementById('deleteModal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('show'); });
  </script>
</body>

</html>
