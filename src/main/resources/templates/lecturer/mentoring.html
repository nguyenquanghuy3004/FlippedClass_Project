<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{lecturer/layout}">
<head>
    <meta charset="UTF-8">
    <title>Peer Mentoring Management - FlippedClass</title>
    <th:block layout:fragment="head">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
            <div>
                <h2 class="fw-bold mb-0">Peer Mentoring Management</h2>
                <p class="text-muted mb-0">Manage supporters and assign mentoring pairs.</p>
            </div>
            <div>
                <button class="btn btn-primary rounded-pill shadow-sm" onclick="autoMatchPairs()" id="autoMatchBtn" style="display:none;">
                    <i class="ti ti-wand"></i> Auto Match Pairs
                </button>
            </div>
        </div>

        <!-- Space Selection Tabs -->
        <ul class="nav nav-pills mb-4 border-bottom pb-3" id="spaceTabs">
            <!-- Tabs will be loaded here via JS -->
        </ul>

        <div id="loader" class="text-center py-5 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="row" id="mentoringContent">
            <!-- STRONG Students -->
            <div class="col-md-4">
                <div class="card border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0 text-white"><i class="ti ti-arrow-up"></i> Top 25% (STRONG)</h5>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="strongList">
                        </ul>
                    </div>
                </div>
            </div>

            <!-- AVERAGE Students -->
            <div class="col-md-4">
                <div class="card border-warning">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0"><i class="ti ti-minus"></i> Average 50%</h5>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="averageList">
                        </ul>
                    </div>
                </div>
            </div>

            <!-- WEAK Students -->
            <div class="col-md-4">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0 text-white"><i class="ti ti-arrow-down"></i> Bottom 25% (WEAK)</h5>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="weakList">
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let currentSpaceId = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadMySpaces();
        });

        async function loadMySpaces() {
            try {
                const token = localStorage.getItem('jwt_token');
                const response = await fetch(`/api/learning-spaces/my-spaces`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Failed to load spaces');
                const spaces = await response.json();
                
                const tabsContainer = document.getElementById('spaceTabs');
                tabsContainer.innerHTML = '';
                
                if (spaces.length === 0) {
                    tabsContainer.innerHTML = '<li class="nav-item"><span class="nav-link disabled">Chưa có lớp học nào</span></li>';
                    document.getElementById('mentoringContent').innerHTML = '<div class="col-12 text-center text-muted py-5">Vui lòng tạo lớp học trước.</div>';
                    return;
                }

                spaces.forEach((space, index) => {
                    const li = document.createElement('li');
                    li.className = 'nav-item me-2 mb-2';
                    const a = document.createElement('a');
                    a.className = `nav-link px-4 rounded-pill ${index === 0 ? 'active shadow-sm' : 'bg-light text-dark border'}`;
                    a.href = 'javascript:void(0)';
                    a.innerText = space.name || `Class ${space.id}`;
                    a.onclick = () => selectSpace(space.id, a);
                    li.appendChild(a);
                    tabsContainer.appendChild(li);
                });

                document.getElementById('autoMatchBtn').style.display = 'block';
                currentSpaceId = spaces[0].id;
                loadStudents();
            } catch (error) {
                console.error(error);
                alert("Lỗi khi tải danh sách lớp học.");
            }
        }

        function selectSpace(spaceId, element) {
            currentSpaceId = spaceId;
            document.querySelectorAll('#spaceTabs .nav-link').forEach(el => {
                el.classList.remove('active', 'shadow-sm');
                el.classList.add('bg-light', 'text-dark', 'border');
            });
            element.classList.remove('bg-light', 'text-dark', 'border');
            element.classList.add('active', 'shadow-sm');
            loadStudents();
        }

        async function loadStudents() {
            if (!currentSpaceId) return;
            const loader = document.getElementById('loader');
            const content = document.getElementById('mentoringContent');
            
            loader.classList.remove('d-none');
            content.classList.add('d-none');

            try {
                const token = localStorage.getItem('jwt_token');
                const response = await fetch(`/api/learning-spaces/${currentSpaceId}/mentoring/students`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to load students');
                const data = await response.json();
                
                renderList('strongList', data.STRONG || [], true);
                renderList('averageList', data.AVERAGE || [], false);
                renderList('weakList', data.WEAK || [], false);
            } catch (error) {
                console.error(error);
                alert("Error loading student classification.");
            } finally {
                loader.classList.add('d-none');
                content.classList.remove('d-none');
            }
        }

        function renderList(listId, studentEntries, isStrong) {
            const list = document.getElementById(listId);
            list.innerHTML = '';
            
            if (!studentEntries || studentEntries.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted text-center py-4">No students in this category.</li>';
                return;
            }

            studentEntries.forEach(entry => {
                const s = entry.user;
                const isSupporter = entry.isSupporter;
                const mentees = entry.mentees || [];
                
                const name = s.fullName || (s.firstName + ' ' + s.lastName);
                let btnHtml = '';
                
                if (isStrong && !isSupporter) {
                    btnHtml = `<button class="btn btn-sm btn-outline-success rounded-pill mt-2" onclick="promoteToSupporter(${s.id})"><i class="ti ti-arrow-up"></i> Promote to Supporter</button>`;
                } else if (isSupporter) {
                    btnHtml = `<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill mt-2 px-2 py-1"><i class="ti ti-check me-1"></i>Supporter</span>`;
                }
                
                let menteesHtml = '';
                if (isSupporter && mentees.length > 0) {
                    menteesHtml = `<div class="mt-2 small text-muted"><strong>Mentees:</strong><ul class="mb-0 ps-3">`;
                    mentees.forEach(m => {
                        const mName = m.fullName || m.username;
                        menteesHtml += `<li>${mName}</li>`;
                    });
                    menteesHtml += `</ul></div>`;
                } else if (isSupporter && mentees.length === 0) {
                    menteesHtml = `<div class="mt-2 small text-muted fst-italic">Waiting for mentees...</div>`;
                }

                list.innerHTML += `
                    <li class="list-group-item d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <div class="fw-bold">${name}</div>
                                <small class="text-muted">@${s.username}</small>
                            </div>
                        </div>
                        <div>
                            ${btnHtml}
                            ${menteesHtml}
                        </div>
                    </li>
                `;
            });
        }

        async function promoteToSupporter(studentId) {
            const result = await Swal.fire({
                title: 'Are you sure?',
                text: 'Do you want to promote this student to Supporter?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#28a745',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, promote!'
            });
            
            if(!result.isConfirmed) return;
            
            try {
                const token = localStorage.getItem('jwt_token');
                const response = await fetch(`/api/learning-spaces/${currentSpaceId}/mentoring/promote/${studentId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Promotion failed');
                Swal.fire('Promoted!', 'Student promoted to Supporter successfully!', 'success');
                loadStudents();
            } catch (error) {
                console.error(error);
                Swal.fire('Error', 'Error promoting student.', 'error');
            }
        }

        async function autoMatchPairs() {
            const result = await Swal.fire({
                title: 'Proceed with Auto-Match?',
                text: 'Auto-matching will assign weak students to active supporters.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#007bff',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, proceed!'
            });
            
            if(!result.isConfirmed) return;
            
            try {
                const token = localStorage.getItem('jwt_token');
                const response = await fetch(`/api/learning-spaces/${currentSpaceId}/mentoring/auto-match`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Auto match failed');
                Swal.fire('Success!', 'Auto-matching completed successfully!', 'success');
            } catch (error) {
                console.error(error);
                Swal.fire('Error', 'Error during auto-matching.', 'error');
            }
        }
    </script>
</th:block>
</body>
</html>
