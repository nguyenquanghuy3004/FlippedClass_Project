<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{lecturer/layout}">
<head>
  <meta charset="UTF-8">
  <title>Student List for Grading - Flipped Class</title>
  <th:block layout:fragment="head">
    <style>
      .page-header-premium {
        background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        color: white;
        border-radius: 16px;
        padding: 2.5rem 2.5rem;
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
        position: relative;
        overflow: hidden;
      }
      .page-header-premium h4 {

        color: white !important;
        font-weight: 800;
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
      }
      .page-header-premium .breadcrumb-item a,
      .page-header-premium .breadcrumb-item.active {
        color: rgba(255, 255, 255, 0.8) !important;
      }
      .page-header-premium .breadcrumb-item + .breadcrumb-item::before {
        color: rgba(255, 255, 255, 0.6) !important;
      }
      .student-card {
        transition: all 0.3s ease-in-out;
        border: none;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        background: #ffffff;
      }
      .student-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 35px rgba(37, 99, 235, 0.1);
      }
      .student-avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
        color: #1d4ed8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 800;
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.1), inset 0 2px 4px rgba(255, 255, 255, 0.8);
        border: 4px solid #ffffff;
      }
      .btn-premium-blue {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: white;
        font-weight: 700;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 50rem;
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        transition: all 0.2s ease;
      }
      .btn-premium-blue:hover {
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
      }
    </style>
  </th:block>
  <script>
(function() {
    function handleUnauthorized() {
        console.warn('Phiên đăng nhập đã hết hạn hoặc không hợp lệ. Đang chuyển hướng về trang đăng nhập...');
        localStorage.removeItem('jwt_token');
        sessionStorage.removeItem('jwt_token');
        window.location.href = '/signin';
    }
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        try {
            const response = await originalFetch.apply(this, args);
            if (response.status === 401) {
                handleUnauthorized();
            }
            return response;
        } catch (error) {
            throw error;
        }
    };
    const originalXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function() {
        this.addEventListener('load', function() {
            if (this.status === 401) {
                handleUnauthorized();
            }
        });
        originalXhrOpen.apply(this, arguments);
    };
})();
</script>
</head>
<body>
  <div layout:fragment="content">
    <div class="container-fluid">
        <!-- Premium Header -->
        <div class="page-header-premium mb-5">
          <div class="row align-items-center">
            <div class="col-9">
              <h4 class="mb-2">Select Student to Grade</h4>
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                  <li class="breadcrumb-item"><a class="text-decoration-none" href="/lecturer/dashboard">Dashboard</a></li>
                  <li class="breadcrumb-item"><a class="text-decoration-none" href="/lecturer/evaluation-sessions">Evaluation Sessions</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Students</li>
                </ol>
              </nav>
            </div>
            <div class="col-3">
              <div class="text-center position-absolute top-0 end-0 h-100 pe-4 d-flex align-items-center" style="opacity: 0.15; transform: scale(1.5);">
                <i class="ti ti-users-group" style="font-size: 100px; color: white;"></i>
              </div>
            </div>
          </div>
        </div>

        <div id="loader" class="text-center my-5 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <!-- Student List -->
        <div class="row" id="studentGrid">
          <!-- Students injected via JS -->
        </div>

      </div>
  </div>

  <th:block layout:fragment="scripts">
    <!-- Pass sessionId from Thymeleaf model -->
    <script th:inline="javascript">
      const SESSION_ID = [[${sessionId}]];
    </script>

    <script>
      let allStudents = [];
      let currentPage = 1;
      const itemsPerPage = 6;

      document.addEventListener("DOMContentLoaded", () => {
        loadStudents();
      });

      async function loadStudents() {
        const loader = document.getElementById('loader');
        const grid = document.getElementById('studentGrid');
        
        loader.classList.remove('d-none');
        grid.innerHTML = '';

        try {
          const token = localStorage.getItem('jwt_token');
          const response = await fetch(`/api/evaluations/sessions/${SESSION_ID}/students`, {
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          if (!response.ok) throw new Error('Failed to fetch students');
          
          allStudents = await response.json();
          currentPage = 1;
          renderPaginatedStudents();
        } catch (error) {
          console.error(error);
          grid.innerHTML = '<div class="col-12"><div class="alert alert-danger">Error loading students. Please try again.</div></div>';
        } finally {
          loader.classList.add('d-none');
        }
      }

      function renderPaginatedStudents() {
        const grid = document.getElementById('studentGrid');
        grid.innerHTML = '';
        
        if (allStudents.length === 0) {
          grid.innerHTML = '<div class="col-12"><div class="alert alert-info">No students enrolled in this session\'s learning path.</div></div>';
          renderPaginationControls(0, 0);
          return;
        }

        const totalItems = allStudents.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
        
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const paginated = allStudents.slice(startIndex, endIndex);

        paginated.forEach(student => {
          const avatarInitial = student.firstName ? student.firstName.charAt(0).toUpperCase() : (student.fullName ? student.fullName.charAt(0).toUpperCase() : 'S');
          const name = student.fullName || (student.firstName + ' ' + student.lastName);
          
          const cardHtml = `
            <div class="col-12 col-md-6 col-lg-4 mb-4">
              <div class="card student-card h-100">
                <div class="card-body text-center p-4 d-flex flex-column">
                  <div class="student-avatar mx-auto mb-3">
                    ${avatarInitial}
                  </div>
                  <h5 class="fw-bolder fs-5 mb-1 text-dark">${name}</h5>
                  <p class="text-muted fs-6 mb-4"><i class="ti ti-mail fs-5 me-1 text-secondary"></i>${student.email || 'No email provided'}</p>
                  
                  <div class="mt-auto">
                    <a href="/lecturer/grading?sessionId=${SESSION_ID}&studentId=${student.id}" class="btn btn-premium-blue w-100">
                      <i class="ti ti-pencil me-1"></i> Grade Now
                    </a>
                  </div>
                </div>
              </div>
            </div>
          `;
          grid.insertAdjacentHTML('beforeend', cardHtml);
        });
        
        renderPaginationControls(totalItems, totalPages);
      }

      function goToPage(page) {
        currentPage = page;
        renderPaginatedStudents();
        document.getElementById('studentGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function renderPaginationControls(totalItems, totalPages) {
        let wrap = document.getElementById('paginationWrap');
        if (!wrap) {
          wrap = document.createElement('div');
          wrap.id = 'paginationWrap';
          wrap.className = 'd-flex justify-content-center mt-4 mb-3';
          document.getElementById('studentGrid').after(wrap);
        }
        
        if (totalPages <= 1) {
          wrap.innerHTML = '';
          return;
        }
        
        let html = `<nav aria-label="Page navigation"><ul class="pagination pagination-lg">`;
        html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link fw-bold" href="javascript:void(0)" onclick="goToPage(${currentPage - 1})">Previous</a></li>`;
        for (let i = 1; i <= totalPages; i++) {
          html += `<li class="page-item ${currentPage === i ? 'active' : ''}"><a class="page-link fw-bold" href="javascript:void(0)" onclick="goToPage(${i})">${i}</a></li>`;
        }
        html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link fw-bold" href="javascript:void(0)" onclick="goToPage(${currentPage + 1})">Next</a></li>`;
        html += `</ul></nav>`;
        
        wrap.innerHTML = html;
      }
    </script>
  </th:block>
</body>
</html>
