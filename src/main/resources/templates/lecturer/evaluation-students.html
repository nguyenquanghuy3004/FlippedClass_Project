<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{lecturer/layout}">
<head>
  <meta charset="UTF-8">
  <title>Student List for Grading - Flipped Class</title>
  <th:block layout:fragment="head">
    <style>
      .student-card {
        transition: all 0.2s ease-in-out;
        border: 1px solid #e5eaef;
      }
      .student-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        border-color: #5d87ff;
      }
      .student-avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background-color: #e8f7ff;
        color: #5d87ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </th:block>
</head>
<body>
  <div layout:fragment="content">
    <div class="container-fluid">
        <!-- Header -->
        <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
          <div class="card-body px-4 py-3">
            <div class="row align-items-center">
              <div class="col-9">
                <h4 class="fw-semibold mb-8">Select Student to Grade</h4>
                <nav aria-label="breadcrumb">
                  <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a class="text-muted text-decoration-none" href="/lecturer/dashboard">Dashboard</a></li>
                    <li class="breadcrumb-item"><a class="text-muted text-decoration-none" href="/lecturer/evaluation-sessions">Evaluation Sessions</a></li>
                    <li class="breadcrumb-item" aria-current="page">Students</li>
                  </ol>
                </nav>
              </div>
              <div class="col-3">
                <div class="text-center mb-n5">
                  <img src="/assets/images/breadcrumb/ChatBc.png" alt="" class="img-fluid mb-n4">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="loader" class="text-center my-5 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <!-- Student List -->
        <div class="row" id="studentGrid">
          <!-- Students injected via JS -->
        </div>

      </div>
  </div>

  <th:block layout:fragment="scripts">
    <!-- Pass sessionId from Thymeleaf model -->
    <script th:inline="javascript">
      const SESSION_ID = [[${sessionId}]];
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        loadStudents();
      });

      async function loadStudents() {
        const loader = document.getElementById('loader');
        const grid = document.getElementById('studentGrid');
        
        loader.classList.remove('d-none');
        grid.innerHTML = '';

        try {
          const token = localStorage.getItem('jwt_token');
          const response = await fetch(`/api/evaluations/sessions/${SESSION_ID}/students`, {
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          if (!response.ok) throw new Error('Failed to fetch students');
          
          const students = await response.json();
          
          if (students.length === 0) {
            grid.innerHTML = '<div class="col-12"><div class="alert alert-info">No students enrolled in this session\'s learning path.</div></div>';
          } else {
            students.forEach(student => {
              const avatarInitial = student.firstName ? student.firstName.charAt(0).toUpperCase() : (student.fullName ? student.fullName.charAt(0).toUpperCase() : 'S');
              const name = student.fullName || (student.firstName + ' ' + student.lastName);
              
              const cardHtml = `
                <div class="col-12 col-md-6 col-lg-4">
                  <div class="card student-card">
                    <div class="card-body text-center p-4">
                      <div class="student-avatar mx-auto mb-3">
                        ${avatarInitial}
                      </div>
                      <h5 class="fw-semibold fs-5 mb-1">${name}</h5>
                      <p class="text-muted fs-6 mb-3"><i class="ti ti-mail fs-5 me-1 text-secondary"></i>${student.email || 'No email provided'}</p>
                      
                      <a href="/lecturer/grading?sessionId=${SESSION_ID}&studentId=${student.id}" class="btn btn-primary rounded-pill w-100 fw-bold">
                        <i class="ti ti-pencil me-1"></i> Grade Now
                      </a>
                    </div>
                  </div>
                </div>
              `;
              grid.insertAdjacentHTML('beforeend', cardHtml);
            });
          }
        } catch (error) {
          console.error(error);
          grid.innerHTML = '<div class="col-12"><div class="alert alert-danger">Error loading students. Please try again.</div></div>';
        } finally {
          loader.classList.add('d-none');
        }
      }
    </script>
  </th:block>
</body>
</html>
