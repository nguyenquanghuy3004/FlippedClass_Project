<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <th:block th:fragment="learningSpaceContent">
        <!-- Grid container for Learning Spaces (Grid) will be populated via JS -->
        <!-- Grid of Cards -->
        <div class="row g-4 mb-5" id="spaceGrid">
            <!-- Dynamic content will be loaded here via JS -->
        </div>
    </th:block>

    <th:block th:fragment="learningSpaceScripts">
        <!-- ============================================== -->
        <!-- UI MODALS AND TEMPLATES -->
        <!-- ============================================== -->

        <!-- Create New Learning Space Modal -->
        <div class="modal fade" id="createSpaceModal" tabindex="-1" aria-labelledby="createSpaceModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header border-bottom-0">
                        <h5 class="modal-title fw-bold" id="createSpaceModalLabel">Create New Learning Space</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="createSpaceForm">
                            <div class="mb-3">
                                <label for="spaceName" class="form-label fw-bold">Name</label>
                                <input type="text" class="form-control bg-light border-0" id="spaceName" required
                                    minlength="3" maxlength="100">
                                <div class="invalid-feedback">Name is required</div>
                            </div>
                            <div class="mb-3">
                                <label for="spaceDescription" class="form-label fw-bold">Description</label>
                                <textarea class="form-control bg-light border-0" id="spaceDescription" rows="3"
                                    maxlength="500"></textarea>
                                <div class="invalid-feedback">Description is required</div>
                            </div>
                            <div class="mb-3">
                                <label for="spaceVisibility" class="form-label fw-bold">Visibility</label>
                                <select class="form-select bg-light border-0" id="spaceVisibility" required>
                                    <option value="PUBLIC">Public</option>
                                    <option value="PRIVATE">Private</option>
                                </select>
                            </div>
                            <div id="createSpaceError" class="text-danger mb-3" style="display:none;"></div>
                        </form>
                    </div>
                    <div class="modal-footer border-top-0">
                        <button type="button" class="btn btn-light rounded-pill px-4"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary rounded-pill px-4" id="btnCreateSpace"
                            style="background-color: #6366f1; border-color: #6366f1;">Create Space</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Learning Space Modal -->
        <div class="modal fade" id="editSpaceModal" tabindex="-1" aria-labelledby="editSpaceModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg rounded-4">
                    <div class="modal-header border-bottom-0">
                        <h5 class="modal-title fw-bold" id="editSpaceModalLabel">Edit Learning Space</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editSpaceForm">
                            <input type="hidden" id="editSpaceId">
                            <div class="mb-3">
                                <label for="editSpaceName" class="form-label fw-bold">Name</label>
                                <input type="text" class="form-control bg-light border-0" id="editSpaceName" required
                                    minlength="3" maxlength="100">
                                <div class="invalid-feedback">Name is required</div>
                            </div>
                            <div class="mb-3">
                                <label for="editSpaceDescription" class="form-label fw-bold">Description</label>
                                <textarea class="form-control bg-light border-0" id="editSpaceDescription" rows="3"
                                    maxlength="500"></textarea>
                                <div class="invalid-feedback">Description is required</div>
                            </div>
                            <div class="mb-3">
                                <label for="editSpaceVisibility" class="form-label fw-bold">Visibility</label>
                                <select class="form-select bg-light border-0" id="editSpaceVisibility" required>
                                    <option value="PUBLIC">Public</option>
                                    <option value="PRIVATE">Private</option>
                                </select>
                            </div>
                            <div id="editSpaceError" class="text-danger mb-3" style="display:none;"></div>
                        </form>
                    </div>
                    <div class="modal-footer border-top-0">
                        <button type="button" class="btn btn-light rounded-pill px-4"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary rounded-pill px-4" id="btnUpdateSpace"
                            style="background-color: #6366f1; border-color: #6366f1;">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Display and Copy Invite Code Modal -->
        <div class="modal fade" id="inviteModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
                <div class="modal-content border-0 shadow-lg rounded-4">
                    <div class="modal-header border-bottom-0 pb-0 position-relative pt-4">
                        <h4 class="modal-title fw-bold text-dark w-100 text-center" style="font-size: 1.25rem;">
                            Invite Students
                        </h4>
                        <button type="button" class="btn-close position-absolute"
                            style="top: 16px; right: 16px; font-size: 0.8rem;" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center pt-4 pb-4 px-4">
                        <div class="rounded-4 py-4 px-3 mb-4 d-flex justify-content-center align-items-center"
                            style="background-color: #f8f9fa; border: 1px solid #f1f3f5;">
                            <h2 id="displayInviteCode" class="fw-bold mb-0 text-dark"
                                style="letter-spacing: 0.6em; margin-right: -0.6em; font-family: 'Inter', sans-serif; font-size: 1.75rem; white-space: nowrap;">
                            </h2>
                        </div>

                        <button id="copyInviteCodeBtn"
                            class="btn btn-primary w-100 rounded-pill py-2 fw-bold d-flex align-items-center justify-content-center gap-2 shadow-sm border-0"
                            style="background-color: #5a67d8; font-size: 1rem;">
                            <i class="ti ti-copy fs-5"></i> Copy Code
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trash Bin Modal containing deleted Learning Spaces -->
        <div class="modal fade" id="trashModal" tabindex="-1" aria-labelledby="trashModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header border-bottom-0 bg-light">
                        <h5 class="modal-title fw-bold text-danger" id="trashModalLabel"><i class="ti ti-trash"></i>
                            Trash Bin</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-0">
                        <div class="list-group list-group-flush" id="trashList">
                            <!-- Trashed spaces will be injected here -->
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 bg-light">
                        <button type="button" class="btn btn-secondary rounded-pill px-4"
                            data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- HTML Template for each Learning Space Card -->
        <template id="spaceCardTemplate">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="classroom-card">
                    <div class="card-banner">
                        <div class="banner-pattern"></div>
                        <a href="#" class="card-title-link">
                            <h2 class="course-title"></h2>
                            <div class="course-subtitle"></div>
                        </a>

                        <div class="dropdown position-absolute" style="top: 12px; right: 8px; z-index: 10;">
                            <button type="button"
                                class="btn btn-link text-white p-0 border-0 shadow-none card-options-top"
                                data-bs-toggle="dropdown" aria-expanded="false" style="width: 32px; height: 32px;">
                                <i class="ti ti-dots-vertical"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-3">
                                <li><a class="dropdown-item d-flex align-items-center gap-2 edit-space-btn" href="#"><i
                                            class="ti ti-pencil"></i> Edit Space</a></li>
                                <li><a class="dropdown-item d-flex align-items-center gap-2 clone-space-btn" href="#"><i
                                            class="ti ti-copy"></i> Clone Space</a></li>
                                <li><a class="dropdown-item d-flex align-items-center gap-2 archive-space-btn"
                                        href="#"><i class="ti ti-archive"></i> <span class="archive-text">Archive
                                            Space</span></a>
                                </li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item d-flex align-items-center gap-2 text-danger delete-space-btn"
                                        href="#"><i class="ti ti-trash"></i> Delete Space</a></li>
                            </ul>
                        </div>
                    </div>

                    <div class="card-avatar"></div>

                    <div class="card-body-content">
                        <!-- Content -->
                    </div>

                    <div class="card-footer">
                        <div class="d-flex align-items-center gap-1">
                            <span class="status-indicator" title="Status"></span>
                            <span class="visibility-text text-muted"
                                style="font-size: 0.75rem; font-weight: 600;"></span>
                        </div>
                        <div class="d-flex gap-1">
                            <div class="footer-icon share-btn" title="Share Invite Code"><i class="ti ti-share"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <script>
            // ==============================================================
            // LEARNING SPACE JS (Learning Space Management Logic)
            // ==============================================================
            // --- Initialization and event handling when page is loaded ---
            $(document).ready(function () {
                // Toggle active state for filter pills
                $('.filter-pill').click(function () {
                    $('.filter-pill').removeClass('active');
                    $(this).addClass('active');
                });

                const token = localStorage.getItem('jwt_token');
                if (!token) {
                    window.location.href = '/signin';
                }

                const banners = ['banner-green', 'banner-blue', 'banner-darkblue', 'banner-red', 'banner-gray'];
                const avatars = ['avatar-blue', 'avatar-orange', 'avatar-green', 'avatar-red'];

                // Function to fetch lecturer's Learning Spaces from API
                function fetchSpaces() {
                    fetch('/api/learning-spaces/my-spaces', {
                        headers: {
                            'Authorization': 'Bearer ' + token
                        }
                    })
                        .then(res => {
                            if (res.status === 401) {
                                alert("Session expired. Please log in again.");
                                localStorage.removeItem('jwt_token');
                                window.location.href = '/signin';
                                throw new Error("Unauthorized");
                            }
                            if (!res.ok) throw new Error("Failed to fetch");
                            return res.json();
                        })
                        .then(data => {
                            const activeSpaces = data.filter(space => space.status !== 'DELETE');
                            const trashedSpaces = data.filter(space => space.status === 'DELETE');

                            const grid = document.getElementById('spaceGrid');
                            grid.innerHTML = '';

                            $('#statActiveSpaces').text(activeSpaces.length);

                            // Display Active Spaces
                            activeSpaces.forEach((space, index) => {
                                const bannerClass = banners[index % banners.length];
                                const avatarClass = avatars[index % avatars.length];
                                const firstLetter = space.name ? space.name.charAt(0).toUpperCase() : 'S';
                                const subtitle = space.description ? space.description : 'No description provided';

                                // Check visibility
                                const visText = space.visibility || 'PRIVATE';

                                const template = document.getElementById('spaceCardTemplate');
                                const clone = template.content.cloneNode(true);

                                // Bind data to template elements
                                const banner = clone.querySelector('.card-banner');
                                banner.classList.add(bannerClass);

                                clone.querySelector('.card-title-link').href = '/lecturer/space/' + space.id;
                                clone.querySelector('.course-title').textContent = space.name;
                                clone.querySelector('.course-subtitle').textContent = subtitle;
                                clone.querySelector('.visibility-text').textContent = visText;

                                const status = space.status || 'ACTIVE';
                                const statusIndicator = clone.querySelector('.status-indicator');
                                statusIndicator.classList.add('status-' + status);
                                statusIndicator.title = 'Status: ' + status;

                                const avatar = clone.querySelector('.card-avatar');
                                avatar.classList.add(avatarClass);
                                avatar.textContent = firstLetter;

                                clone.querySelector('.share-btn').dataset.code = space.inviteCode;

                                const editBtn = clone.querySelector('.edit-space-btn');
                                editBtn.dataset.id = space.id;
                                editBtn.dataset.name = space.name;
                                editBtn.dataset.description = space.description || '';
                                editBtn.dataset.visibility = space.visibility || 'PRIVATE';

                                // Nếu ARCHIVE mà kh cho EDIT
                                if (space.status === 'ARCHIVE') {
                                    editBtn.classList.add('disabled');
                                    editBtn.style.pointerEvents = 'none';
                                    editBtn.style.opacity = '0.5';
                                    editBtn.title = "Class is archived";
                                }

                                const cloneBtn = clone.querySelector('.clone-space-btn');
                                cloneBtn.dataset.id = space.id;
                                cloneBtn.dataset.name = space.name;

                                const archiveBtn = clone.querySelector('.archive-space-btn');
                                archiveBtn.dataset.id = space.id;
                                archiveBtn.dataset.status = status;

                                if (status === 'ARCHIVE') {
                                    archiveBtn.querySelector('i').className = 'ti ti-archive-off';
                                    archiveBtn.querySelector('.archive-text').textContent = 'Unarchive Space';
                                } else {
                                    archiveBtn.querySelector('i').className = 'ti ti-archive';
                                    archiveBtn.querySelector('.archive-text').textContent = 'Archive Space';
                                }

                                clone.querySelector('.delete-space-btn').dataset.id = space.id;

                                grid.appendChild(clone);
                            });

                            // Display Trashed Spaces
                            const trashList = document.getElementById('trashList');
                            trashList.innerHTML = '';
                            if (trashedSpaces.length === 0) {
                                trashList.innerHTML = '<div class="text-center py-5 text-muted"><i class="ti ti-ghost fs-1 d-block mb-2"></i>Trash is empty.</div>';
                            } else {
                                trashedSpaces.forEach(space => {
                                    const item = document.createElement('div');
                                    item.className = 'list-group-item d-flex justify-content-between align-items-center py-3';
                                    item.innerHTML = `
                                    <div>
                                        <h6 class="mb-1 fw-bold">${space.name}</h6>
                                        <small class="text-muted">Deleted on: ${new Date(space.createdAt).toLocaleDateString()}</small>
                                    </div>
                                    <button class="btn btn-sm btn-outline-success rounded-pill fw-bold px-3 restore-space-btn" data-id="${space.id}">
                                        <i class="ti ti-refresh"></i> Restore
                                    </button>
                                `;
                                    trashList.appendChild(item);
                                });

                                // Bind Restore event
                                document.querySelectorAll('.restore-space-btn').forEach(btn => {
                                    btn.addEventListener('click', function () {
                                        const spaceId = this.dataset.id;
                                        Swal.fire({
                                            title: 'Restore Space?',
                                            text: "Are you sure you want to restore this learning space?",
                                            icon: 'question',
                                            showCancelButton: true,
                                            confirmButtonColor: '#3085d6',
                                            cancelButtonColor: '#d33',
                                            confirmButtonText: 'Yes, restore it!'
                                        }).then((result) => {
                                            if (result.isConfirmed) {
                                                fetch(`/api/learning-spaces/${spaceId}/restore`, {
                                                    method: 'PUT',
                                                    headers: {
                                                        'Authorization': 'Bearer ' + token
                                                    }
                                                })
                                                    .then(response => {
                                                        if (response.ok) {
                                                            Swal.fire('Restored!', 'Your learning space has been restored.', 'success');
                                                            fetchSpaces(); // reload both grid and trash
                                                        } else {
                                                            Swal.fire('Error!', 'Failed to restore space.', 'error');
                                                        }
                                                    })
                                                    .catch(err => {
                                                        console.error('Error:', err);
                                                        Swal.fire('Error!', 'An error occurred while restoring.', 'error');
                                                    });
                                            }
                                        });
                                    });
                                });
                            }
                        })
                        .catch(err => console.error('Error fetching spaces', err));
                }

                if (token) {
                    fetchSpaces();
                } else {
                    window.location.href = '/signin';
                }

                // Function to check for empty inputs
                const checkValid = (selectors) => {
                    let valid = true;
                    $(selectors.join(',')).removeClass('is-invalid').each(function () {
                        if (!$(this).val().trim()) { $(this).addClass('is-invalid'); valid = false; }
                    });
                    return valid;
                };

                // Clear invalid state on input
                $('#spaceName, #spaceDescription, #editSpaceName, #editSpaceDescription').on('input', function () {
                    $(this).removeClass('is-invalid');
                });

                // Handle Create Learning Space
                $('#btnCreateSpace').click(function () {
                    $('#createSpaceError').hide();
                    if (!checkValid(['#spaceName'])) return;

                    const btn = $(this);
                    const requestBody = {
                        name: $('#spaceName').val().trim(),
                        description: $('#spaceDescription').val().trim(),
                        visibility: $('#spaceVisibility').val()
                    };

                    btn.prop('disabled', true).text('Creating...');

                    fetch('/api/learning-spaces', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify(requestBody)
                    })
                        .then(res => {
                            if (!res.ok) {
                                return res.text().then(text => { throw new Error(text) });
                            }
                            return res.json();
                        })
                        .then(data => {
                            $('#createSpaceModal').modal('hide');
                            $('#createSpaceForm')[0].reset();
                            $('#spaceName, #spaceDescription').removeClass('is-invalid');
                            fetchSpaces();
                        })
                        .catch(err => {
                            $('#createSpaceError').text("Error: " + err.message).show();
                        })
                        .finally(() => {
                            btn.prop('disabled', false).text('Create Space');
                        });
                });

                // Open Invite Code Modal
                $(document).on('click', '.share-btn', function (e) {
                    e.preventDefault();
                    let code = $(this).data('code') || 'N/A';

                    // Format code using CSS letter-spacing instead of physical spaces to prevent overflow
                    let displayCode = code;

                    $('#displayInviteCode').text(displayCode);
                    $('#copyInviteCodeBtn').data('code', code).html('<i class="ti ti-copy fs-5"></i> Copy Code').removeClass('btn-success').addClass('btn-primary').css({ 'background-color': '#5a67d8', 'border-color': '#5a67d8' });
                    $('#inviteModal').modal('show');
                });

                // Handle Copy Invite Code
                $('#copyInviteCodeBtn').click(function () {
                    const code = $(this).data('code');
                    const btn = $(this);
                    if (code && code !== 'N/A') {
                        navigator.clipboard.writeText(code).then(() => {
                            btn.html('<i class="ti ti-check fs-5"></i> Copied!')
                                .removeClass('btn-primary')
                                .addClass('btn-success')
                                .css({ 'background-color': '#10b981', 'border-color': '#10b981' });

                            setTimeout(() => {
                                btn.html('<i class="ti ti-copy fs-5"></i> Copy Code')
                                    .removeClass('btn-success')
                                    .addClass('btn-primary')
                                    .css({ 'background-color': '#5a67d8', 'border-color': '#5a67d8' });
                            }, 2000);
                        }).catch(err => {
                            console.error('Failed to copy text: ', err);
                            alert('Failed to copy. Please manually select the code.');
                        });
                    }
                });

                // Open Edit Space Modal
                $(document).on('click', '.edit-space-btn', function (e) {
                    e.preventDefault();
                    $('#editSpaceId').val($(this).data('id'));
                    $('#editSpaceName').val($(this).data('name'));
                    $('#editSpaceDescription').val($(this).data('description'));
                    $('#editSpaceVisibility').val($(this).data('visibility'));
                    $('#editSpaceName, #editSpaceDescription').removeClass('is-invalid');
                    $('#editSpaceError').hide();
                    $('#editSpaceModal').modal('show');
                });

                // Save Edit Space info
                $('#btnUpdateSpace').click(function () {
                    $('#editSpaceError').hide();
                    if (!checkValid(['#editSpaceName'])) return;

                    const btn = $(this);
                    const id = $('#editSpaceId').val();
                    const requestBody = {
                        name: $('#editSpaceName').val().trim(),
                        description: $('#editSpaceDescription').val().trim(),
                        visibility: $('#editSpaceVisibility').val()
                    };

                    btn.prop('disabled', true).text('Saving...');

                    fetch(`/api/learning-spaces/${id}/update`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify(requestBody)
                    })
                        .then(res => {
                            if (!res.ok) throw new Error("Update failed");
                            return res.json();
                        })
                        .then(data => {
                            $('#editSpaceModal').modal('hide');
                            fetchSpaces();
                        })
                        .catch(err => {
                            $('#editSpaceError').text("Error: " + err.message).show();
                        })
                        .finally(() => {
                            btn.prop('disabled', false).text('Save Changes');
                        });
                });

                // Clone Space
                $(document).on('click', '.clone-space-btn', function (e) {
                    e.preventDefault();
                    const id = $(this).data('id');
                    const originalName = $(this).data('name');

                    Swal.fire({
                        title: 'Clone Space',
                        input: 'text',
                        inputLabel: 'New Space Name',
                        inputValue: originalName + ' - Copy',
                        showCancelButton: true,
                        confirmButtonText: 'Clone',
                        confirmButtonColor: '#6366f1',
                        inputValidator: (value) => {
                            if (!value || value.trim().length === 0) {
                                return 'You need to write something!'
                            }
                        }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            const newName = result.value.trim();
                            Swal.fire({
                                title: 'Cloning...',
                                text: 'Please wait while we clone the space and all its contents.',
                                allowOutsideClick: false,
                                didOpen: () => {
                                    Swal.showLoading()
                                }
                            });

                            fetch(`/api/learning-spaces/${id}/clone?newName=${encodeURIComponent(newName)}`, {
                                method: 'POST',
                                headers: { 'Authorization': 'Bearer ' + token }
                            }).then(res => {
                                if (res.ok) {
                                    Swal.fire('Success!', 'The space has been cloned successfully.', 'success');
                                    fetchSpaces();
                                } else {
                                    return res.text().then(text => { throw new Error(text) });
                                }
                            }).catch(err => {
                                Swal.fire('Error', 'Failed to clone space. ' + err.message, 'error');
                            });
                        }
                    });
                });

                // Archive / Unarchive Space
                $(document).on('click', '.archive-space-btn', function (e) {
                    e.preventDefault();
                    const id = $(this).data('id');
                    const status = $(this).data('status');

                    if (status === 'ARCHIVE') {
                        // Unarchive -> Restore to ACTIVE
                        fetch(`/api/learning-spaces/${id}/restore`, {
                            method: 'PUT',
                            headers: { 'Authorization': 'Bearer ' + token }
                        }).then(res => { if (res.ok) fetchSpaces(); });
                    } else {
                        // Archive
                        fetch(`/api/learning-spaces/${id}/archive`, {
                            method: 'PUT',
                            headers: { 'Authorization': 'Bearer ' + token }
                        }).then(res => { if (res.ok) fetchSpaces(); });
                    }
                });

                // Delete Space (Move to trash)
                $(document).on('click', '.delete-space-btn', function (e) {
                    e.preventDefault();
                    Swal.fire({
                        title: 'Delete Space?',
                        text: "Are you sure you want to delete this space?",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#d33',
                        cancelButtonColor: '#3085d6',
                        confirmButtonText: 'Yes, delete it!'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            const id = $(this).data('id');
                            fetch(`/api/learning-spaces/${id}/delete`, {
                                method: 'DELETE',
                                headers: { 'Authorization': 'Bearer ' + token }
                            }).then(res => {
                                if (res.ok) {
                                    Swal.fire('Deleted!', 'The space has been moved to trash.', 'success');
                                    fetchSpaces();
                                } else {
                                    return res.json().then(data => { throw new Error(data.message || 'Failed to delete space.') });
                                }
                            }).catch(err => {
                                Swal.fire('Error', err.message, 'error');
                            });
                        }
                    });
                });
            });
        </script>
    </th:block>
</body>

</html>
