<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- ── Node Card Fragment ── -->
    <div th:fragment="nodeCard(node, path)">
        <div class="node-card" th:style="${node.nodeType == 'PRACTICE'} ? 'background: linear-gradient(to right, #0f172a, #1e293b); border: 1px solid #334155; border-left: 4px solid #4f46e5; box-shadow: 0 4px 15px rgba(0,0,0,0.2);' : ''">
            <div class="p-3 px-4">
                <div class="d-flex justify-content-between align-items-center">

                    <!-- Left: icon + title -->
                    <a class="d-flex align-items-center gap-3 text-decoration-none" 
                       th:href="${(isSupporter != null and isSupporter and node.nodeType != 'VIDEO' and node.nodeType != 'PRACTICE') ? null : (isSupporter != null and isSupporter ? '/lecturer/learning-nodes/' + node.id + '/preview?role=supporter' : '/lecturer/learning-nodes/' + node.id + '/preview')}"
                       th:style="${(isSupporter != null and isSupporter and node.nodeType != 'VIDEO' and node.nodeType != 'PRACTICE') ? 'cursor: default; pointer-events: none;' : ''}">
                        <!-- Icon: shape depends on type -->
                        <div class="node-icon" th:style="${node.nodeType == 'PRACTICE'} ? 'background: #1e293b; border: 1px solid #334155; box-shadow: 0 0 10px rgba(16,185,129,0.2);' : ''">
                            <i th:class="'ti fs-5 '
                                + (${node.nodeType == 'VIDEO'}    ? 'ti-player-play'
                                : (${node.nodeType == 'DOCUMENT'} ? 'ti-file-text'
                                : (${node.nodeType == 'QUIZ'}     ? 'ti-help-circle'
                                : (${node.nodeType == 'PRACTICE'} ? 'ti-code'
                                : 'ti-book-2'))))"
                               th:style="${node.nodeType == 'PRACTICE'} ? 'color: #10b981;' : ''"></i>
                        </div>
                        <div>
                            <span class="fw-semibold" th:text="${node.title}"
                                  style="font-size:0.92rem;color:#334155;letter-spacing:0.1px;transition:color 0.2s;"
                                  onmouseover="this.style.color='#4f46e5'" onmouseout="this.style.color='#334155'">Node Title</span>
                            <!-- Type tag -->
                            <span class="ms-2 badge rounded-pill"
                                  th:text="${node.nodeType}"
                                  style="font-size:0.65rem;font-weight:600;letter-spacing:0.5px;
                                         background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0;"></span>
                        </div>
                    </a>

                    <!-- Right: options menu -->
                    <div class="dropdown">
                        <button class="node-options-btn" data-bs-toggle="dropdown" th:style="${node.nodeType == 'PRACTICE'} ? 'color: #94a3b8;' : ''">
                            <i class="ti ti-dots-vertical"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4 p-2"
                            style="min-width:200px;">
                            <li>
                                <a class="dropdown-item rounded-3 d-flex align-items-center gap-2 edit-node-btn"
                                   href="#"
                                   th:data-pathid="${path.id}"
                                   th:data-nodeid="${node.id}"
                                   th:data-title="${node.title}"
                                   th:data-description="${node.description}"
                                   th:data-type="${node.nodeType}">
                                    <i class="ti ti-pencil" style="color:#4f46e5;"></i> Edit Lesson
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item rounded-3 d-flex align-items-center gap-2 text-danger delete-node-btn"
                                   href="#" th:data-pathid="${path.id}" th:data-nodeid="${node.id}">
                                    <i class="ti ti-trash"></i> Delete Lesson
                                </a>
                            </li>

                            <li th:if="${node.nodeType == 'VIDEO'}">
                                <a class="dropdown-item rounded-3 d-flex align-items-center gap-2 upload-video-btn"
                                   href="#" th:data-nodeid="${node.id}">
                                    <i class="ti ti-upload" style="color:#4f46e5;"></i> Upload Video (MP4)
                                </a>
                            </li>
                            <li th:if="${node.nodeType == 'VIDEO'}">
                                <a class="dropdown-item rounded-3 d-flex align-items-center gap-2 add-youtube-btn"
                                   href="#" th:data-nodeid="${node.id}" style="color:#ef4444;">
                                    <i class="ti ti-brand-youtube"></i> Add Youtube Link
                                </a>
                            </li>
                            <li th:if="${node.nodeType == 'DOCUMENT'}">
                                <a class="dropdown-item rounded-3 d-flex align-items-center gap-2 upload-document-btn"
                                   href="#" th:data-nodeid="${node.id}" style="color:#059669;">
                                    <i class="ti ti-file-upload"></i> Upload Document (PDF)
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Content area -->
                <div class="node-items-container" th:if="${node.nodeType != 'PRACTICE'}" th:data-nodeid="${node.id}" th:data-nodetype="${node.nodeType}">
                    <!-- Placeholder shown until JS renders items -->
                    <div class="node-placeholder" th:style="${node.nodeType == 'PRACTICE'} ? 'color: #94a3b8; opacity: 0.8;' : ''">
                        <i th:class="'ti '
                            + (${node.nodeType == 'VIDEO'}    ? 'ti-player-play'
                            : (${node.nodeType == 'QUIZ'}     ? 'ti-help-circle'
                            : 'ti-file-text'))"></i>
                        <span>No content added yet</span>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- ── Modals Fragment ── -->
    <div th:fragment="nodeModals">

        <!-- Create Quiz Modal -->
        <div class="modal fade" id="createQuizModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 rounded-4 shadow-lg">
                    <div class="modal-header border-0 pb-0">
                        <div class="d-flex align-items-center gap-2">
                            <div style="width:36px;height:36px;border-radius:10px;
                                        background:linear-gradient(135deg,#8b5cf6,#6d28d9);
                                        display:flex;align-items:center;justify-content:center;color:#fff;">
                                <i class="ti ti-brain fs-5"></i>
                            </div>
                            <h5 class="modal-title fw-bold mb-0" style="color:#1e1b4b;">Create Quick Quiz</h5>
                        </div>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body pt-3">
                        <form id="createQuizForm">
                            <input type="hidden" id="quizNodeId">
                            <div class="mb-3">
                                <label class="form-label fw-semibold small" style="color:#312e81;">Quiz Title</label>
                                <input type="text" class="form-control border-0 rounded-3" style="background:#f4f5fb;" id="quizTitle" required value="Practice Quiz">
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label fw-semibold small" style="color:#312e81;">Duration (min)</label>
                                    <input type="number" class="form-control border-0 rounded-3" style="background:#f4f5fb;" id="quizDuration" value="30">
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label fw-semibold small" style="color:#312e81;">Pass Score</label>
                                    <input type="number" class="form-control border-0 rounded-3" style="background:#f4f5fb;" id="quizPassScore" value="50">
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn rounded-pill px-4 fw-semibold text-white" id="btnSaveQuiz" style="background:linear-gradient(135deg,#8b5cf6,#6d28d9);">Continue to Builder</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Create Node Modal -->
        <div class="modal fade" id="createNodeModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 rounded-4 shadow-lg">
                    <div class="modal-header border-0 pb-0">
                        <div class="d-flex align-items-center gap-2">
                            <div style="width:36px;height:36px;border-radius:10px;
                                        background:linear-gradient(135deg,#4f46e5,#7c3aed);
                                        display:flex;align-items:center;justify-content:center;color:#fff;">
                                <i class="ti ti-plus fs-5"></i>
                            </div>
                            <h5 class="modal-title fw-bold mb-0" style="color:#1e1b4b;">Add Lesson</h5>
                        </div>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body pt-3">
                        <form id="createNodeForm">
                            <input type="hidden" id="nodePathId">
                            <div class="mb-3">
                                <label for="nodeTitle" class="form-label fw-semibold small" style="color:#312e81;">Lesson Title</label>
                                <input type="text" class="form-control border-0 rounded-3"
                                       style="background:#f4f5fb;" id="nodeTitle" required maxlength="255">
                                <div class="invalid-feedback">Title is required</div>
                            </div>
                            <div class="mb-3">
                                <label for="nodeDescription" class="form-label fw-semibold small" style="color:#312e81;">Description</label>
                                <textarea class="form-control border-0 rounded-3"
                                          style="background:#f4f5fb;" id="nodeDescription" rows="3" maxlength="1000"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="nodeType" class="form-label fw-semibold small" style="color:#312e81;">Lesson Type</label>
                                <select class="form-select border-0 rounded-3" style="background:#f4f5fb;" id="nodeType">
                                    <option value="LESSON" th:unless="${isSupporter != null and isSupporter}">📖 Theory Lesson</option>
                                    <option value="PRACTICE" th:if="${isSupporter != null and isSupporter}">💻 Practice Module</option>
                                    <option value="VIDEO">▶️ Video Lesson</option>
                                    <option value="DOCUMENT">📄 Document</option>
                                    <option value="REVIEW" th:unless="${isSupporter != null and isSupporter}">🔁 Review Session</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="nodePrerequisite" class="form-label fw-semibold small" style="color:#312e81;">Prerequisite Lesson (Optional)</label>
                                <select class="form-select border-0 rounded-3" style="background:#f4f5fb;" id="nodePrerequisite">
                                    <option value="">None (Unlocked by default)</option>
                                    <th:block th:each="p : ${paths}">
                                        <th:block th:each="n : ${p.nodes}">
                                            <option th:value="${n.id}" th:text="${p.title + ' - ' + n.title}"></option>
                                        </th:block>
                                    </th:block>
                                </select>
                            </div>
                            <div id="createNodeError" class="text-danger small" style="display:none;"></div>
                        </form>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn rounded-pill px-4 fw-semibold" id="btnSaveNode"
                                style="background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;
                                       box-shadow:0 4px 12px rgba(79,70,229,0.3);">
                            Add Lesson
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Node Modal -->
        <div class="modal fade" id="editNodeModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 rounded-4 shadow-lg">
                    <div class="modal-header border-0 pb-0">
                        <div class="d-flex align-items-center gap-2">
                            <div style="width:36px;height:36px;border-radius:10px;
                                        background:linear-gradient(135deg,#4f46e5,#7c3aed);
                                        display:flex;align-items:center;justify-content:center;color:#fff;">
                                <i class="ti ti-pencil fs-5"></i>
                            </div>
                            <h5 class="modal-title fw-bold mb-0" style="color:#1e1b4b;">Edit Lesson</h5>
                        </div>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body pt-3">
                        <form id="editNodeForm">
                            <input type="hidden" id="editNodePathId">
                            <input type="hidden" id="editNodeId">
                            <div class="mb-3">
                                <label for="editNodeTitle" class="form-label fw-semibold small" style="color:#312e81;">Lesson Title</label>
                                <input type="text" class="form-control border-0 rounded-3"
                                       style="background:#f4f5fb;" id="editNodeTitle" required maxlength="255">
                                <div class="invalid-feedback">Title is required</div>
                            </div>
                            <div class="mb-3">
                                <label for="editNodeDescription" class="form-label fw-semibold small" style="color:#312e81;">Description</label>
                                <textarea class="form-control border-0 rounded-3"
                                          style="background:#f4f5fb;" id="editNodeDescription" rows="3" maxlength="1000"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="editNodeType" class="form-label fw-semibold small" style="color:#312e81;">Lesson Type</label>
                                <select class="form-select border-0 rounded-3" style="background:#f4f5fb;" id="editNodeType">
                                    <option value="LESSON" th:unless="${isSupporter != null and isSupporter}">📖 Theory Lesson</option>
                                    <option value="PRACTICE" th:if="${isSupporter != null and isSupporter}">💻 Practice Module</option>
                                    <option value="VIDEO">▶️ Video Lesson</option>
                                    <option value="DOCUMENT">📄 Document</option>
                                    <option value="REVIEW" th:unless="${isSupporter != null and isSupporter}">🔁 Review Session</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="editNodePrerequisite" class="form-label fw-semibold small" style="color:#312e81;">Prerequisite Lesson (Optional)</label>
                                <select class="form-select border-0 rounded-3" style="background:#f4f5fb;" id="editNodePrerequisite">
                                    <option value="">None (Unlocked by default)</option>
                                    <th:block th:each="p : ${paths}">
                                        <th:block th:each="n : ${p.nodes}">
                                            <option th:value="${n.id}" th:text="${p.title + ' - ' + n.title}"></option>
                                        </th:block>
                                    </th:block>
                                </select>
                            </div>
                            <div id="editNodeError" class="text-danger small" style="display:none;"></div>
                        </form>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn rounded-pill px-4 fw-semibold" id="btnUpdateNode"
                                style="background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;
                                       box-shadow:0 4px 12px rgba(79,70,229,0.3);">
                            Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Youtube Modal -->
        <div class="modal fade" id="addYoutubeModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 rounded-4 shadow-lg">
                    <div class="modal-header border-0 pb-0">
                        <div class="d-flex align-items-center gap-2">
                            <div style="width:36px;height:36px;border-radius:10px;
                                        background:rgba(239,68,68,0.1);
                                        display:flex;align-items:center;justify-content:center;color:#ef4444;">
                                <i class="ti ti-brand-youtube fs-5"></i>
                            </div>
                            <h5 class="modal-title fw-bold mb-0" style="color:#1e1b4b;">Add Youtube Link</h5>
                        </div>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body pt-3">
                        <form id="addYoutubeForm">
                            <input type="hidden" id="youtubeNodeId">
                            <div class="mb-3">
                                <label for="youtubeUrl" class="form-label fw-semibold small" style="color:#312e81;">Youtube URL</label>
                                <input type="url" class="form-control border-0 rounded-3"
                                       style="background:#f4f5fb;" id="youtubeUrl"
                                       placeholder="https://www.youtube.com/watch?v=..." required>
                                <div class="invalid-feedback">Valid Youtube URL is required</div>
                                <div class="form-text">Paste the full Youtube video link here.</div>
                            </div>
                            <div id="addYoutubeError" class="text-danger small" style="display:none;"></div>
                        </form>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger rounded-pill px-4 fw-semibold" id="btnSaveYoutube">
                            Add Video
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hidden file inputs -->
        <input type="file" id="hiddenVideoInput" accept="video/mp4,video/x-m4v,video/*" style="display:none;">
        <input type="file" id="hiddenDocumentInput" accept=".pdf" style="display:none;">
    </div>

</body>
</html>
