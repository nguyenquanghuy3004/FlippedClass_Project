<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
  <meta charset="UTF-8" />
  <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">FCMS Lecturer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="manifest" th:href="@{/assets/site.webmanifest}">

  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <!-- FontAwesome for fallback -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <link rel="stylesheet" th:href="@{/assets/css/lecturer-layout.css}">
  <link rel="stylesheet" th:href="@{/assets/css/student-user-menu.css}">
  <link rel="stylesheet" th:href="@{/assets/css/student-typography.css}">

  <th:block layout:fragment="head"></th:block>
</head>

<body>
  <div id="overlay" class="overlay"></div>

  <!-- TOPBAR -->
  <nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3 shadow-sm">
    <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>
    <button id="mobileBtn" class="btn btn-light btn-icon btn-sm d-lg-none me-2">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>

    <div class="topbar-main">
      <div class="topbar-title-wrap d-none d-md-block">
        <h5 class="topbar-title fw-bold text-dark ms-1">Lecturer <span class="badge bg-primary-subtle text-primary rounded-pill">Workspace</span></h5>
      </div>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar bg-white border-end-0 shadow-sm d-flex flex-column">
    <div class="logo-area border-bottom border-light">
      <a th:href="@{/}" class="d-inline-flex align-items-center text-decoration-none">
        <div class="bg-primary text-white rounded p-1 d-flex align-items-center justify-content-center me-2">
          <i class="fa-solid fa-chalkboard-user fs-5" style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;"></i>
        </div>
        <span class="logo-text fw-bolder fs-4 text-dark" style="letter-spacing: -0.5px;">FCMS<span class="text-primary">Lecture</span></span>
      </a>
    </div>
    
    <ul class="nav flex-column mt-4 mb-auto">
      <li>
        <a class="nav-link rounded-pill mx-3 mb-2 px-4 active fw-bold" href="/lecturer/dashboard" data-nav-path="/lecturer/dashboard">
          <i class="ti ti-box-seam fs-5"></i><span class="nav-text">My Spaces</span>
        </a>
      </li>
      <li>
        <a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" href="/lecturer/quizzes" data-nav-path="/lecturer/quizzes">
          <i class="ti ti-checklist fs-5"></i><span class="nav-text">My Quizzes</span>
        </a>
      </li>
      <li>
        <a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" href="/lecturer/evaluation-sessions" data-nav-path="/lecturer/evaluation-sessions">
          <i class="ti ti-clipboard-list fs-5"></i><span class="nav-text">Eval Sessions</span>
        </a>
      </li>
      <li>
        <a class="nav-link rounded-pill mx-3 mb-2 px-4 text-secondary fw-semibold" th:href="${spaceId != null ? '/lecturer/mentoring?spaceId=' + spaceId : '/lecturer/mentoring?spaceId=900'}" data-nav-path="/lecturer/mentoring">
          <i class="ti ti-users fs-5"></i><span class="nav-text">Peer Mentoring</span>
        </a>
      </li>

      <li layout:fragment="sidebar-bottom" class="p-3 mt-4">
          <!-- Button placeholder if a specific page wants to add something below menu -->
      </li>

      <li class="sidebar-user-slot mt-auto">
        <div class="student-user-menu" data-user-menu>
          <button class="student-menu-trigger" type="button" data-user-menu-toggle aria-expanded="false" onclick="logout()">
            <span class="student-menu-info ms-0">
              <span class="student-menu-name text-danger"><i class="ti ti-logout"></i> Logout</span>
            </span>
          </button>
        </div>
      </li>
    </ul>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="content" class="content py-10">
    <div class="container-fluid">

      <div layout:fragment="content">
        <!-- Dynamic Content goes here -->
      </div>

      <div class="row">
        <div class="col-12">
          <footer class="text-center py-2 mt-6 text-secondary ">
            <p class="mb-0">FCMS Lecturer Workspace. Powered by InApp Theme</p>
          </footer>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // Setup AJAX to include JWT token if stored in localStorage
    $.ajaxSetup({
      beforeSend: function (xhr) {
        const token = localStorage.getItem('jwt_token');
        if (token) {
          xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        }
      }
    });

    function checkAuth() {
      const token = localStorage.getItem('jwt_token');
      if (!token) {
        window.location.href = '/signin';
        return;
      }
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        const path = window.location.pathname;
        const isSupporterAllowed = path.startsWith('/supporter') || 
                                   path.startsWith('/lecturer/space') || 
                                   path.startsWith('/lecturer/quizzes') || 
                                   path.startsWith('/lecturer/learning-nodes');
        if (!payload.roles || (!isSupporterAllowed && !payload.roles.includes('MENTOR') && !payload.roles.includes('ROLE_MENTOR') && !payload.roles.includes('ADMIN') && !payload.roles.includes('ROLE_ADMIN'))) {
          window.location.href = '/signin';
        }
      } catch (e) {
        window.location.href = '/signin';
      }
    }
    checkAuth();

    function logout() {
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('user_id');
      window.location.href = '/signin';
    }

    // Auto-highlight active sidebar menu item
    $(document).ready(function() {
      const path = window.location.pathname;
      $('.sidebar .nav-link').removeClass('active fw-bold').addClass('text-secondary fw-semibold');
      
      let matched = false;
      $('.sidebar .nav-link').each(function() {
        const navPath = $(this).attr('data-nav-path');
        if (navPath && path.startsWith(navPath)) {
          $(this).removeClass('text-secondary fw-semibold').addClass('active fw-bold');
          matched = true;
        }
      });
      // Special case for Evaluate Student
      if (path.startsWith('/lecturer/grading') || path.startsWith('/lecturer/evaluation-sessions')) {
         $('.sidebar .nav-link').removeClass('active fw-bold').addClass('text-secondary fw-semibold');
         $('.sidebar .nav-link[data-nav-path="/lecturer/evaluation-sessions"]').removeClass('text-secondary fw-semibold').addClass('active fw-bold');
         matched = true;
      }
      // Fallback
      if (!matched) {
        $('.sidebar .nav-link[data-nav-path="/lecturer/dashboard"]').removeClass('text-secondary fw-semibold').addClass('active fw-bold');
      }
    });
  </script>
  <th:block layout:fragment="scripts"></th:block>
</body>

</html>
