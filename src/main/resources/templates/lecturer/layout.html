<head>

  <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">FCMS Mentor</title>

  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="manifest" th:href="@{/assets/site.webmanifest}">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- SockJS & STOMP for Notifications -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <link rel="stylesheet" th:href="@{/assets/css/lecturer-layout.css}">
  <th:block layout:fragment="head"></th:block>
  <script>
(function() {
    function handleUnauthorized() {
        console.warn('Phiên đăng nhập đã hết hạn hoặc không hợp lệ. Đang chuyển hướng về trang đăng nhập...');
        localStorage.removeItem('jwt_token');
        sessionStorage.removeItem('jwt_token');
        window.location.href = '/signin';
    }
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        try {
            const response = await originalFetch.apply(this, args);
            if (response.status === 401) {
                handleUnauthorized();
            }
            return response;
        } catch (error) {
            throw error;
        }
    };
    const originalXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function() {
        this.addEventListener('load', function() {
            if (this.status === 401) {
                handleUnauthorized();
            }
        });
        originalXhrOpen.apply(this, arguments);
    };
})();
</script>
<style>
.premium-toast {
    border-left: 4px solid #4f46e5 !important;
    border-radius: 12px !important;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1) !important;
    padding: 12px 16px !important;
    background: #ffffff !important;
}
.premium-toast .swal2-title {
    font-size: 0.95rem !important;
    font-weight: 600 !important;
    color: #1e293b !important;
}
.premium-toast .swal2-timer-progress-bar {
    background-color: #4f46e5 !important;
}
</style>
</head>

<body>
  <div id="overlay" class="overlay"></div>
  <!-- TOPBAR -->
  <nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3">
    <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm ">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>

    <!-- MOBILE -->
    <button id="mobileBtn" class="btn btn-light btn-icon btn-sm d-lg-none me-2">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>
    <div>
      <ul class="list-unstyled d-flex align-items-center mb-0 gap-1">
        <!-- Notification Bell -->
        <li class="nav-item position-relative pt-1 dropdown">
            <a href="#" id="bellIcon" class="nav-link text-dark position-relative" data-bs-toggle="dropdown" aria-expanded="false" onclick="markAsReadOnOpen()">

                <span id="notifBadge" class="badge bg-danger position-absolute top-0 start-100 translate-middle" style="display:none; font-size: 0.6rem;">!</span>
            </a>
            <div class="dropdown-menu dropdown-menu-end p-0 shadow-lg border-0" style="width: 350px; border-radius: 12px; overflow: hidden;">
                <div class="p-3 border-bottom d-flex justify-content-between align-items-center text-white" style="background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%);">
                    <h6 class="mb-0 fw-bold"><i class="ti ti-bell-ringing me-2"></i>Thông báo mới</h6>
                </div>
                <div id="notifList" class="list-group list-group-flush" style="max-height: 350px; overflow-y: auto;">
                    <div class="text-center p-4 text-muted small">
                        <i class="ti ti-inbox fs-1 mb-2 d-block text-light"></i>
                        Không có thông báo nào
                    </div>
                </div>
            </div>
        </li>
        <!-- Dropdown -->
        <li class="ms-3 dropdown">
          <a href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <img th:src="@{/assets/images/avatar-2.jpg}" alt="User" class="avatar avatar-sm rounded-circle" />
          </a>
          FCMS Mentor
          <div class="dropdown-menu dropdown-menu-end p-0" style="min-width: 200px;">
            <div>
              <div class="d-flex gap-3 align-items-center border-dashed border-bottom px-3 py-3">
                <img th:src="@{/assets/images/avatar-2.jpg}" alt="User" class="avatar avatar-md rounded-circle" />
                <div>
                  <h4 class="mb-0 small">Mentor User</h4>

        </div>

        </span>

    </div>
    <ul class="nav flex-column mb-auto">
      <li class="px-4 py-2"><small class="nav-text">Workspace</small></li>
      <li>
        <a class="nav-link" href="/lecturer/dashboard" data-nav-path="/lecturer/dashboard">
          <i class="ti ti-box-seam"></i><span class="nav-text">My Spaces</span>
        </a>
      </li>
      <li>
        <a class="nav-link" href="/lecturer/quizzes" data-nav-path="/lecturer/quizzes">
          <i class="ti ti-checklist"></i><span class="nav-text">My Quizzes</span>
        </a>
      </li>
      <li>
        <a class="nav-link" href="/lecturer/evaluation-sessions" data-nav-path="/lecturer/evaluation-sessions">

        </a>
      </li>
    </ul>
    
    <div class="p-3 mt-auto w-100">
      <button class="btn btn-primary w-100 rounded d-flex align-items-center justify-content-center gap-2 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#createSpaceModal" style="background-color: #6366f1; border-color: #6366f1; padding: 0.6rem;">
        <i class="ti ti-plus fs-5"></i> New Space

    </div>

  <!-- MAIN CONTENT -->
  <main id="content" class="content py-10">
    <div class="container-fluid">

      <div layout:fragment="content">
        <!-- Dynamic Content goes here -->
      </div>

      <div class="row">
        <div class="col-12">
          <footer class="text-center py-2 mt-6 text-secondary ">
            <p class="mb-0">FCMS Mentor Workspace. Powered by InApp Theme</p>
          </footer>
        </div>
      </div>
    </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // Setup AJAX to include JWT token if stored in localStorage
    $.ajaxSetup({
      beforeSend: function (xhr) {
        const token = localStorage.getItem('jwt_token');
        if (token) {
          xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        }
      }
    });

    function checkAuth() {
      const token = localStorage.getItem('jwt_token');
      if (!token) {
        window.location.href = '/signin';
        return;
      }
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        if (!payload.roles || (!payload.roles.includes('MENTOR') && !payload.roles.includes('ROLE_MENTOR') && !payload.roles.includes('ADMIN') && !payload.roles.includes('ROLE_ADMIN'))) {
          window.location.href = '/signin';
        }
      } catch (e) {
        window.location.href = '/signin';
      }
    }
    checkAuth();

    function logout() {
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('user_id');
      window.location.href = '/signin';
    }

    // Auto-highlight active sidebar menu item
    $(document).ready(function() {
      const path = window.location.pathname;
      $('.sidebar .nav-link').removeClass('active');
      
      let matched = false;
      $('.sidebar .nav-link').each(function() {
        const navPath = $(this).attr('data-nav-path');
        if (navPath && path.startsWith(navPath)) {
          $(this).addClass('active');
          matched = true;
        }
      });
      // Special case for Evaluate Student
      if (path.startsWith('/lecturer/grading') || path.startsWith('/lecturer/evaluation-sessions')) {
         $('.sidebar .nav-link').removeClass('active');
         $('.sidebar .nav-link[data-nav-path="/lecturer/evaluation-sessions"]').addClass('active');
         matched = true;
      }
      // Fallback
      if (!matched) {
        $('.sidebar .nav-link[data-nav-path="/lecturer/dashboard"]').addClass('active');
      }
    });
  </script>
  <script>
    const notifUserId = localStorage.getItem('user_id');

    // Cập nhật giao diện list thông báo
    function renderNotifItem(notif) {
        const timeStr = new Date(notif.createdAt).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
        return `
            <a href="${notif.link || '#'}" class="list-group-item list-group-item-action p-3 border-bottom-0 border-bottom">
                <div class="d-flex w-100 justify-content-between align-items-center mb-1">
                    <span class="badge bg-primary rounded-pill" style="font-size: 0.65rem;">Mới</span>
                    <small class="text-muted" style="font-size: 0.75rem;"><i class="ti ti-clock me-1"></i>${timeStr}</small>
                </div>
                <p class="mb-0 text-dark small" style="font-weight: 500; line-height: 1.4;">${notif.message}</p>
            </a>
        `;
    }

    function markAsReadOnOpen() {
        const badge = document.getElementById('notifBadge');
        if (badge) badge.style.display = 'none';
        badge.innerText = '0';
    }

    if (notifUserId) {
        // Fetch notifications on load
        fetch('/api/notifications', {
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + localStorage.getItem('jwt_token')
            }
        })
        .then(res => res.json())
        .then(data => {
            const listEl = document.getElementById('notifList');
            if (data && data.length > 0) {
                listEl.innerHTML = data.map(n => renderNotifItem(n)).join('');
            }
            
            const unreadCount = data.filter(n => !n.read).length;
            if (unreadCount > 0) {
                const badge = document.getElementById('notifBadge');
                if (badge) {
                    badge.innerText = unreadCount;
                    badge.style.display = 'inline-block';
                }
            }
        })
        .catch(err => console.error("Error fetching notifications", err));

        // Setup WebSocket for real-time notifications
        const socket = new SockJS('/ws');
        const stompClient = Stomp.over(socket);
        stompClient.debug = null; 

        stompClient.connect({}, function() {
            stompClient.subscribe('/topic/notifications/' + notifUserId, function(res) {
                const notif = JSON.parse(res.body);
                
                // Cập nhật danh sách
                const listEl = document.getElementById('notifList');
                // Xóa dòng "Không có thông báo" nếu đang hiển thị
                if (listEl.innerHTML.includes('Không có thông báo')) {
                    listEl.innerHTML = '';
                }
                listEl.insertAdjacentHTML('afterbegin', renderNotifItem(notif));

                // Cập nhật số đếm
                const badge = document.getElementById('notifBadge');
                if (badge) {
                    let currentCount = parseInt(badge.innerText) || 0;
                    badge.innerText = currentCount + 1;
                    badge.style.display = 'inline-block';
                }
                
                // Hiện popup đẹp hơn
                if (typeof Swal !== 'undefined') {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: 'info',
                        iconColor: '#4f46e5',
                        title: notif.message,
                        showConfirmButton: false,
                        timer: 5000,
                        timerProgressBar: true,
                        showCloseButton: true,
                        customClass: {
                            popup: 'premium-toast'
                        },
                        didOpen: (toast) => {
                            toast.addEventListener('mouseenter', Swal.stopTimer)
                            toast.addEventListener('mouseleave', Swal.resumeTimer)
                        }
                    });
                }
            });
        });
    }
  </script>
  <th:block layout:fragment="scripts"></th:block>
</body>

</html>
