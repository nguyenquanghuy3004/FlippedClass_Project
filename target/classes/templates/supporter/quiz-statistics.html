<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{supporter/layout}">

<head>
  <meta charset="UTF-8" />
  <title>Quiz Statistics - FlippedClass</title>
  <th:block layout:fragment="head">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <!-- ApexCharts for modern graphs -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" th:href="@{/assets/css/lecturer-quiz-statistics.css}">
  </th:block>
</head>

<body>
  <div layout:fragment="content">

    <div class="container-xl max-w-7xl">
      
      <div class="page-header">
        <div>
          <h1 class="fw-bold mb-1 text-dark" id="pageTitle">Quiz Statistics</h1>
          <p class="text-muted mb-0"><i class="ti ti-chart-bar me-1"></i> Real-time performance insights</p>
        </div>
        <a href="/lecturer/quizzes" class="back-btn">
          <i class="ti ti-arrow-left me-1"></i> Back to Quizzes
        </a>
      </div>

      <!-- Stats Row -->
      <div class="row g-4 mb-4">
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon blue"><i class="ti ti-users"></i></div>
            <div>
              <div class="stat-val" id="statAttempts">0</div>
              <div class="stat-lbl">Total Attempts</div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon purple"><i class="ti ti-math-avg"></i></div>
            <div>
              <div class="stat-val" id="statAvg">0</div>
              <div class="stat-lbl">Average Score</div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon green"><i class="ti ti-arrow-up-circle"></i></div>
            <div>
              <div class="stat-val" id="statHigh">0</div>
              <div class="stat-lbl">Highest Score</div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon orange"><i class="ti ti-arrow-down-circle"></i></div>
            <div>
              <div class="stat-val" id="statLow">0</div>
              <div class="stat-lbl">Lowest Score</div>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="chart-box h-100">
            <h4 class="fw-bold mb-4" style="color:#1e293b;"><i class="ti ti-chart-histogram text-primary me-2"></i>Score Distribution</h4>
            <div id="scoreChart" style="min-height: 350px;"></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="table-box h-100">
            <h4 class="fw-bold mb-4" style="color:#1e293b;"><i class="ti ti-list text-success me-2"></i>Recent Attempts</h4>
            <div class="table-responsive" style="max-height: 350px; overflow-y: auto;">
              <table class="table table-borderless mb-0">
                <thead>
                  <tr>
                    <th>Student</th>
                    <th>Date</th>
                    <th class="text-end">Score</th>
                  </tr>
                </thead>
                <tbody id="attemptsTableBody">
                  <!-- JS populated -->
                </tbody>
              </table>
            </div>
            <div id="noAttemptsMsg" class="text-center text-muted py-4 d-none">
              No attempts recorded yet.
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <th:block layout:fragment="scripts">
    <script>
      const TOKEN_KEY = 'jwt_token';
      function getToken() { return localStorage.getItem(TOKEN_KEY); }
      function authHeaders() {
        const t = getToken();
        return t ? { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t } : { 'Content-Type': 'application/json' };
      }

      // Extract quiz ID from URL: /lecturer/quizzes/{id}/statistics
      const pathParts = window.location.pathname.split('/');
      const quizId = pathParts[pathParts.length - 2];

      document.addEventListener('DOMContentLoaded', async () => {
        if (!getToken()) {
          window.location.href = '/signin';
          return;
        }
        await loadStatistics();
        await loadAttempts();
      });

      async function loadStatistics() {
        try {
          const res = await fetch(`/api/quizzes/${quizId}/statistics`, { headers: authHeaders() });
          if (!res.ok) throw new Error();
          const data = await res.json();
          
          document.getElementById('pageTitle').innerHTML = `${data.quizTitle} <span class="text-muted fs-4 ms-2 fw-normal">Statistics</span>`;
          document.getElementById('statAttempts').textContent = data.totalAttempts;
          document.getElementById('statAvg').textContent = data.averageScore != null ? parseFloat(data.averageScore).toFixed(1) : 0;
          document.getElementById('statHigh').textContent = data.highestScore != null ? parseFloat(data.highestScore).toFixed(1) : 0;
          document.getElementById('statLow').textContent = data.lowestScore != null ? parseFloat(data.lowestScore).toFixed(1) : 0;
        } catch (e) {
          console.error("Failed to load summary stats.");
        }
      }

      async function loadAttempts() {
        try {
          const res = await fetch(`/api/quizzes/${quizId}/attempts`, { headers: authHeaders() });
          if (!res.ok) throw new Error();
          const attempts = await res.json();
          
          if (!attempts || attempts.length === 0) {
             document.getElementById('noAttemptsMsg').classList.remove('d-none');
             renderChart([]);
             return;
          }

          // Render Table
          const tbody = document.getElementById('attemptsTableBody');
          // Sort newest first
          const sorted = [...attempts].sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
          
          sorted.forEach((att, index) => {
            const dateStr = new Date(att.submittedAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit' });
            const score = att.score;
            let badgeCls = 'score-low';
            if (score >= 80) badgeCls = 'score-high';
            else if (score >= 50) badgeCls = 'score-med';
            
            tbody.innerHTML += `
              <tr>
                <td>
                  <div class="d-flex align-items-center gap-2">
                    <div class="avatar avatar-sm bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width:32px;height:32px;">
                      ${att.studentName ? att.studentName.charAt(0).toUpperCase() : 'S'}
                    </div>
                    <div>
                      <div class="fw-bold text-dark">${att.studentName || 'Student'}</div>
                      <div class="text-muted" style="font-size:0.75rem;">Time: ${Math.round((new Date(att.submittedAt) - new Date(att.startedAt)) / 60000)} mins</div>
                    </div>
                  </div>
                </td>
                <td>${dateStr}</td>
                <td class="text-end">
                  <span class="score-badge ${badgeCls}">${score.toFixed(1)}</span>
                </td>
              </tr>
            `;
          });

          // Prepare data for Chart (Distribution)
          renderChart(attempts);

        } catch (e) {
          console.error("Failed to load attempts.");
        }
      }

      function renderChart(attempts) {
          // Bins: 0-20, 21-40, 41-60, 61-80, 81-100
          const bins = [0, 0, 0, 0, 0];
          const categories = ['0-20', '21-40', '41-60', '61-80', '81-100'];
          
          attempts.forEach(att => {
              const s = att.score;
              if (s <= 20) bins[0]++;
              else if (s <= 40) bins[1]++;
              else if (s <= 60) bins[2]++;
              else if (s <= 80) bins[3]++;
              else bins[4]++;
          });

          const options = {
            series: [{
              name: 'Number of Students',
              data: bins
            }],
            chart: {
              type: 'bar',
              height: 350,
              toolbar: { show: false },
              fontFamily: 'Inter, sans-serif'
            },
            plotOptions: {
              bar: {
                borderRadius: 6,
                columnWidth: '50%',
                distributed: true
              }
            },
            colors: ['#ef4444', '#f97316', '#eab308', '#3b82f6', '#10b981'],
            dataLabels: {
              enabled: true,
              style: { fontSize: '14px', fontWeight: 'bold' }
            },
            legend: { show: false },
            xaxis: {
              categories: categories,
              labels: { style: { colors: '#64748b', fontSize: '13px', fontWeight: 600 } },
              axisBorder: { show: false },
              axisTicks: { show: false }
            },
            yaxis: {
              labels: { style: { colors: '#64748b' } }
            },
            grid: {
              borderColor: '#f1f5f9',
              strokeDashArray: 4,
            },
            tooltip: {
              theme: 'light',
              y: { formatter: function (val) { return val + " students" } }
            }
          };

          const chart = new ApexCharts(document.querySelector("#scoreChart"), options);
          chart.render();
      }
    </script>
  </th:block>
</body>
</html>
