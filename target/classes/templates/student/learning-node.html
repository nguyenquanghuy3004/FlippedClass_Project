<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Learning Node - FlippedClass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <script type="text/javascript">
    if (!localStorage.getItem('jwt_token')) {
      window.location.href = '/login';
    }
  </script>
  <link rel="stylesheet" th:href="@{/assets/css/student-learning-node.css}">
  <link rel="stylesheet" th:href="@{/assets/css/student-user-menu.css}">
  <script>
/* --- Inlined from student-user-menu.js --- */
(function () {
  const defaultAvatarUrl = '/assets/images/avatar-1.jpg';

  function storedUser() {
    return {
      fullName: localStorage.getItem('full_name') || localStorage.getItem('fullName') || '',
      username: localStorage.getItem('username') || '',
      avatarUrl: localStorage.getItem('avatar_url') || localStorage.getItem('avatarUrl') || ''
    };
  }

  function normalizeUser(user = {}) {
    const stored = storedUser();
    return {
      name: user.fullName || user.name || user.username || stored.fullName || stored.username || 'Student',
      username: user.username || stored.username || '',
      avatarUrl: user.avatarUrl || user.avatar_url || stored.avatarUrl || defaultAvatarUrl
    };
  }

  function setStudentMenuUser(user = {}) {
    const normalized = normalizeUser(user);

    if (normalized.name && normalized.name !== 'Student') {
      localStorage.setItem('full_name', normalized.name);
    }
    if (normalized.username) {
      localStorage.setItem('username', normalized.username);
    }
    if (normalized.avatarUrl && normalized.avatarUrl !== defaultAvatarUrl) {
      localStorage.setItem('avatar_url', normalized.avatarUrl);
    }

    document.querySelectorAll('[data-user-name]').forEach((element) => {
      element.textContent = normalized.name;
    });
    document.querySelectorAll('[data-user-avatar]').forEach((image) => {
      image.src = normalized.avatarUrl;
      image.onerror = () => {
        image.onerror = null;
        image.src = defaultAvatarUrl;
      };
    });

    const topbarName = document.getElementById('studentName');
    if (topbarName) topbarName.textContent = normalized.name;
  }

  function studentLogout() {
    ['jwt_token', 'user_id', 'full_name', 'fullName', 'username', 'avatar_url', 'avatarUrl'].forEach((key) => {
      localStorage.removeItem(key);
    });
    window.location.href = '/';
  }

  async function refreshStudentMenuUser() {
    const token = localStorage.getItem('jwt_token');
    const userId = localStorage.getItem('user_id');
    if (!token || !userId) return;

    try {
      const response = await fetch(`/api/users/${encodeURIComponent(userId)}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!response.ok) return;
      const user = await response.json();
      setStudentMenuUser(user);
    } catch (error) {
      console.warn('Could not load user menu profile.', error);
    }
  }

  function closeAllMenus(exceptMenu = null) {
    document.querySelectorAll('[data-user-menu].is-open').forEach((menu) => {
      if (menu !== exceptMenu) {
        menu.classList.remove('is-open');
        menu.querySelector('[data-user-menu-toggle]')?.setAttribute('aria-expanded', 'false');
      }
    });
  }

  function initStudentUserMenus() {
    setStudentMenuUser();
    refreshStudentMenuUser();

    document.querySelectorAll('[data-user-menu]').forEach((menu) => {
      const toggle = menu.querySelector('[data-user-menu-toggle]');
      const logoutButton = menu.querySelector('[data-user-logout]');

      toggle?.addEventListener('click', (event) => {
        event.stopPropagation();
        const shouldOpen = !menu.classList.contains('is-open');
        closeAllMenus(menu);
        menu.classList.toggle('is-open', shouldOpen);
        toggle.setAttribute('aria-expanded', String(shouldOpen));
      });

      logoutButton?.addEventListener('click', studentLogout);
    });

    document.addEventListener('click', () => closeAllMenus());
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeAllMenus();
    });
  }

  window.setStudentMenuUser = setStudentMenuUser;
  window.studentLogout = studentLogout;
  if (!window.logout) window.logout = studentLogout;

  document.addEventListener('DOMContentLoaded', initStudentUserMenus);
})();

</script>
  <link rel="stylesheet" th:href="@{/assets/css/student-typography.css}">
</head>

<body>
<header class="lesson-topbar">
  <a class="brand-link" th:href="@{/}">
    <span class="brand-mark"><i class="ti ti-school"></i></span>
    <span>Flipped<span>Class</span></span>
  </a>
  <a id="backLink" class="back-link" th:href="@{/student/learning-spaces}">
    <i class="ti ti-arrow-left"></i>
    Back to roadmap
  </a>
  <div class="topbar-spacer"></div>
  <a class="back-link" th:href="@{/student/my-quizzes}">
    <i class="ti ti-brain"></i>
    My Quizzes
  </a>
  <div class="student-user-menu topbar-user-menu" data-user-menu>
  <button class="student-menu-trigger" type="button" data-user-menu-toggle aria-expanded="false" aria-label="Account menu">
    <img class="student-menu-avatar" data-user-avatar th:src="@{/assets/images/avatar-1.jpg}" alt="Student avatar">
    <span class="student-menu-info">
      <span id="studentName" class="student-menu-name" data-user-name>Student</span>
      <span class="student-menu-role">Student</span>
    </span>
    <i class="ti ti-chevron-down student-menu-chevron"></i>
  </button>
  <div class="student-menu-panel" role="menu">
    <a class="student-menu-item" th:href="@{/docs}" role="menuitem"><i class="ti ti-help-circle"></i><span>Help</span></a>
    <button class="student-menu-item student-menu-item-danger" type="button" data-user-logout role="menuitem"><i class="ti ti-logout"></i><span>Logout</span></button>
  </div>
</div>
</header>

<main class="lesson-shell">
  <div id="pageRoot" class="loading-state">
    <div>
      <i class="ti ti-loader-2"></i>
      <p class="mt-3 mb-0">Loading node content...</p>
    </div>
  </div>
</main>

<script>
/* --- Inlined from student-learning-node.js --- */
﻿const token = localStorage.getItem('jwt_token');
  const urlParams = new URLSearchParams(window.location.search);
  const pathNodeMatch = window.location.pathname.match(/\/student\/learning-nodes\/(\d+)/);
  const nodeId = urlParams.get('nodeId') || pathNodeMatch?.[1] || '';
  const pageRoot = document.getElementById('pageRoot');
  const studentName = document.getElementById('studentName');

  studentName.textContent = localStorage.getItem('full_name') || localStorage.getItem('username') || 'Student';

  function authHeaders(includeJson = true) {
    const headers = { Authorization: `Bearer ${token}` };
    if (includeJson) headers['Content-Type'] = 'application/json';
    return headers;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  async function readError(response) {
    const text = await response.text();
    if (!text) return 'Something went wrong. Please try again.';
    try {
      const json = JSON.parse(text);
      return json.message || json.error || text;
    } catch {
      return text;
    }
  }

  function normalizeItemType(type) {
    return String(type || '').toUpperCase();
  }

  function itemUrl(item) {
    return item.fullUrl || item.url || '';
  }

  const resourceLogoSources = {
    DOC: '/uploads/anh/1200x630wa.jpg',
    VIDEO: '/uploads/anh/R.jpg',
    YOUTUBE: '/uploads/anh/OIP.jpg',
    PDF: '/uploads/anh/pdf-file-download-symbols-format-for-texts-vector.jpg',
    GOOGLE_DRIVE: '/uploads/anh/Google-Drive-Logo-2020-present.jpg'
  };

  function youtubeEmbedUrl(url) {
    const value = String(url || '');
    const watchMatch = value.match(/[?&]v=([^&]+)/);
    const shortMatch = value.match(/youtu\.be\/([^?&]+)/);
    const embedMatch = value.match(/youtube\.com\/embed\/([^?&]+)/);
    const id = watchMatch?.[1] || shortMatch?.[1] || embedMatch?.[1];
    return id ? `https://www.youtube.com/embed/${id}` : '';
  }

  function statusLabel(status) {
    const labels = {
      ACTIVE: 'Active',
      DRAFT: 'Draft',
      LOCKED: 'Locked',
      UNLOCKED: 'Unlocked',
      ARCHIVED: 'Archived',
      DELETED: 'Deleted'
    };
    return labels[status] || status || 'Unknown';
  }

  function nodeTypeLabel(type) {
    const labels = {
      LESSON: 'Lesson',
      VIDEO: 'Video',
      PRACTICE: 'Practice',
      QUIZ: 'Quiz',
      REVIEW: 'Review'
    };
    return labels[type] || type || 'Node';
  }

  function resourceTypeLabel(type) {
    const labels = {
      PDF: 'Document PDF',
      CODE: 'Source Code',
      QUIZ: 'Quiz',
      DISCUSSION: 'Discussion',
      VIDEO: 'Video'
    };
    return labels[normalizeItemType(type)] || 'Resource';
  }

  function resourceIcon(type) {
    const icons = {
      PDF: 'ti-file-type-pdf',
      CODE: 'ti-code',
      QUIZ: 'ti-brain',
      DISCUSSION: 'ti-message-circle',
      VIDEO: 'ti-video'
    };
    return icons[normalizeItemType(type)] || 'ti-file';
  }

  function resourceLogo(item) {
    const type = normalizeItemType(item?.itemType);
    const url = itemUrl(item).toLowerCase();
    const title = String(item?.title || '').toLowerCase();
    const sourceText = `${url} ${title}`;

    if (sourceText.includes('youtube') || sourceText.includes('youtu.be')) {
      return resourceLogoSources.YOUTUBE;
    }
    if (sourceText.includes('drive.google')) {
      return resourceLogoSources.GOOGLE_DRIVE;
    }
    if (type === 'PDF' || sourceText.includes('.pdf')) {
      return resourceLogoSources.PDF;
    }
    if (type === 'VIDEO' || /\.(mp4|webm|mov|avi|mkv)(?:$|[?#])/.test(url) || sourceText.includes('video')) {
      return resourceLogoSources.VIDEO;
    }
    if (sourceText.includes('.doc') || sourceText.includes('docx') || sourceText.includes('document')) {
      return resourceLogoSources.DOC;
    }
    return '';
  }

  function resourceIconTemplate(item) {
    const logo = resourceLogo(item);
    if (logo) {
      return `
      <span class="resource-icon resource-icon-image">
        <img class="resource-logo-img" src="${escapeHtml(logo)}" alt="${escapeHtml(resourceTypeLabel(item?.itemType))} logo" loading="lazy">
      </span>`;
    }
    return `<span class="resource-icon"><i class="ti ${resourceIcon(item?.itemType)}"></i></span>`;
  }

  function emptyLightTemplate(icon, message) {
    return `
      <div class="empty-light">
        <div>
          <i class="ti ${icon}"></i>
          ${escapeHtml(message)}
        </div>
      </div>`;
  }

  function videoTemplate(node, items) {
    const video = items.find((item) => normalizeItemType(item.itemType) === 'VIDEO' && itemUrl(item));
    if (!video) {
      return `
        <div class="empty-video">
          <div>
            <i class="ti ti-video-off"></i>
            Your instructor has not added a video for this node yet.
          </div>
        </div>`;
    }

    const url = itemUrl(video);
    const embedUrl = youtubeEmbedUrl(url);
    const player = embedUrl
      ? `<iframe src="${escapeHtml(embedUrl)}" title="${escapeHtml(video.title || node.title || 'Lesson Video')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`
      : `<video controls preload="metadata" src="${escapeHtml(url)}"></video>`;

    return `<div class="video-frame">${player}</div>`;
  }

  function resourceItemTemplate(item) {
    const type = normalizeItemType(item.itemType);
    const url = type === 'QUIZ' && item.quizId
      ? `/student/take-quiz?quizId=${encodeURIComponent(item.quizId)}`
      : itemUrl(item);
    const body = `
      ${resourceIconTemplate(item)}
      <span>
        <span class="resource-title">${escapeHtml(item.title || resourceTypeLabel(item.itemType))}</span>
        <span class="resource-meta">${escapeHtml(resourceTypeLabel(item.itemType))}</span>
      </span>
      <i class="ti ti-arrow-up-right text-primary"></i>`;

    return url
      ? `<a class="resource-item" href="${escapeHtml(url)}" ${type === 'QUIZ' ? '' : 'target="_blank" rel="noopener"'}>${body}</a>`
      : `<div class="resource-item">${body}</div>`;
  }

  function resourcesTemplate(items) {
    const resources = items.filter((item) => !['VIDEO', 'DISCUSSION'].includes(normalizeItemType(item.itemType)));
    if (!resources.length) return emptyLightTemplate('ti-folder-off', 'No resources have been added for this node yet.');
    return `<div class="resource-list">${resources.map((item) => resourceItemTemplate(item)).join('')}</div>`;
  }

  function commentsTemplate() {
    return `
      <div id="discussion-container" class="mt-3">
         <div class="empty-light">
            <div><i class="ti ti-loader-2 ti-spin"></i> Loading discussions...</div>
         </div>
      </div>
      <div class="comment-compose mt-3">
        <textarea id="discussion-input" placeholder="Write a comment or question..."></textarea>
        <button id="discussion-submit" type="button" onclick="submitDiscussion()">Send Comment</button>
      </div>`;
  }
  
  function renderDiscussionTree(discussions) {
    if (!discussions || discussions.length === 0) {
      return emptyLightTemplate('ti-message-off', 'No comments or questions yet. Be the first to ask!');
    }
    
    let html = '<div class="comment-list" style="max-height: 500px; overflow-y: auto; padding-right: 10px;">';
    discussions.forEach(d => {
       html += renderDiscussionItem(d, false, 0);
    });
    html += '</div>';
    return html;
  }
  
  function renderDiscussionItem(d, isReply, depth = 0) {
     const isPinned = d.pinned ? `<span class="badge bg-warning-subtle text-warning ms-2" style="font-size: 0.6rem;"><i class="ti ti-pin"></i> Pinned</span>` : '';
     const isSolved = d.status === 'SOLVED' ? `<span class="badge bg-success-subtle text-success ms-2" style="font-size: 0.6rem;"><i class="ti ti-check"></i> Solved</span>` : '';
     
     const roleBadge = d.authorRole === 'LECTURER' ? `<span class="badge bg-primary-subtle text-primary ms-2" style="font-size: 0.6rem;">Lecturer</span>` : 
                       (d.authorRole === 'SUPPORTER' ? `<span class="badge bg-info-subtle text-info ms-2" style="font-size: 0.6rem;">Supporter</span>` : '');

     const dateStr = new Date(d.createdAt).toLocaleString();
     
     let repliesHtml = '';
     if (d.replies && d.replies.length > 0) {
         repliesHtml = `<div class="replies-container">`;
         d.replies.forEach(r => {
             repliesHtml += renderDiscussionItem(r, true, depth + 1);
         });
         repliesHtml += `</div>`;
     }

     const avatar = d.authorAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(d.authorName)}&background=random`;

     const isTooDeep = depth >= 3;

     return `
        <div class="comment-node mt-3">
            <div class="d-flex align-items-stretch gap-2">
                ${(isTooDeep && isReply) ? '' : `
                <!-- Left Avatar & Thread Column -->
                <div class="d-flex flex-column align-items-center">
                    <img src="${avatar}" class="rounded-circle border border-2 border-white shadow-sm" style="width: 32px; height: 32px; object-fit: cover; z-index: 1;">
                    ${(d.replies && d.replies.length > 0) ? `<div class="thread-line mt-1" style="width: 2px; background-color: #e2e8f0; flex-grow: 1; border-radius: 2px; min-height: 20px;"></div>` : ''}
                </div>
                `}

                <!-- Right Content Column -->
                <div class="flex-grow-1" style="min-width: 0;">
                    <!-- Main Box -->
                    <div class="comment-content ${isReply ? '' : 'p-3 bg-white border rounded-3 shadow-sm'}" style="${d.pinned ? 'border-left: 4px solid #f59e0b !important;' : ''} ${isTooDeep && isReply ? 'border-left: 2px solid #e2e8f0; padding-left: 10px;' : ''}">
                        <div class="d-flex align-items-center justify-content-between mb-1">
                            <div class="d-flex align-items-center flex-wrap gap-1">
                                <span class="fw-bold text-dark" style="font-size: 0.9rem;">${escapeHtml(d.authorName)}</span>
                                ${roleBadge}
                                ${isPinned}
                                ${isSolved}
                                <span class="text-muted ms-2" style="font-size: 0.75rem;"><i class="ti ti-clock me-1"></i>${dateStr}</span>
                            </div>
                        </div>
                        <div class="comment-text text-dark mt-2" style="white-space: pre-wrap; word-break: break-word; font-size: 0.95rem; line-height: 1.5; color: #334155;">${escapeHtml(d.content)}</div>
                        
                        <div class="comment-actions mt-2 d-flex align-items-center justify-content-between">
                            <div>
                                <button class="btn btn-sm p-0 bg-transparent border-0 text-primary d-flex align-items-center gap-1" style="font-size: 0.8rem; font-weight: 600;" onclick="showReplyForm(${d.id})">
                                    <i class="ti ti-message-circle-2"></i> Reply
                                </button>
                            </div>
                        </div>

                        <!-- Reply Form -->
                        <div id="reply-form-${d.id}" class="mt-3 d-none">
                            <div class="d-flex gap-2 align-items-start">
                                <div class="flex-grow-1">
                                    <textarea id="reply-input-${d.id}" class="form-control form-control-sm border-secondary-subtle" rows="2" placeholder="Write a reply..." style="resize: none; border-radius: 8px;"></textarea>
                                    <div class="d-flex justify-content-end gap-2 mt-2">
                                        <button class="btn btn-light btn-sm rounded-pill px-3" onclick="hideReplyForm(${d.id})">Cancel</button>
                                        <button class="btn btn-primary btn-sm rounded-pill px-3" onclick="submitDiscussion(${d.id})">Post Reply</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Nested Replies Container -->
                    ${repliesHtml}
                </div>
            </div>
        </div>
     `;
  }
  
  function showReplyForm(id) {
      document.getElementById('reply-form-' + id).classList.remove('d-none');
  }
  function hideReplyForm(id) {
      document.getElementById('reply-form-' + id).classList.add('d-none');
  }

  async function loadDiscussions() {
      const container = document.getElementById('discussion-container');
      if (!container) return;
      try {
          const res = await fetch(\`/api/nodes/\${nodeId}/discussions\`, { headers: authHeaders(false) });
          if (res.ok) {
              const discussions = await res.json();
              container.innerHTML = renderDiscussionTree(discussions);
              // Update comments count on UI
              const countSpans = document.querySelectorAll('.discussions-count');
              countSpans.forEach(el => el.textContent = discussions.length + ' comments');
          }
      } catch (e) {
          console.error('Failed to load discussions', e);
      }
  }

  async function submitDiscussion(parentId = null) {
      const inputId = parentId ? 'reply-input-' + parentId : 'discussion-input';
      const inputEl = document.getElementById(inputId);
      const content = inputEl.value.trim();
      if (!content) return;
      
      const payload = { content: content };
      if (parentId) payload.parentId = parentId;
      
      try {
          const res = await fetch(\`/api/nodes/\${nodeId}/discussions\`, {
              method: 'POST',
              headers: authHeaders(true),
              body: JSON.stringify(payload)
          });
          if (res.ok) {
              inputEl.value = '';
              if (parentId) hideReplyForm(parentId);
              loadDiscussions();
          } else {
              alert(await readError(res));
          }
      } catch (e) {
          alert('Failed to send comment');
      }
  }

  function renderError(title, message) {
    pageRoot.className = 'error-state';
    pageRoot.innerHTML = `
      <div>
        <i class="ti ti-alert-circle"></i>
        <h1>${escapeHtml(title)}</h1>
        <p class="mb-4">${escapeHtml(message)}</p>
        <a class="back-link" href="/student/learning-spaces"><i class="ti ti-arrow-left"></i> Back to Roadmap</a>
      </div>`;
  }

  function renderNodePage(node, items) {
    const resources = items.filter((item) => normalizeItemType(item.itemType) !== 'VIDEO');
    const videoCount = items.some((item) => normalizeItemType(item.itemType) === 'VIDEO' && itemUrl(item)) ? 1 : 0;

    pageRoot.className = 'lesson-layout';
    pageRoot.innerHTML = `
      <section class="player-column">
        <section class="node-hero">
          <span class="eyebrow"><i class="ti ti-player-play"></i> Learning Spaces node</span>
          <h1 class="node-title">${escapeHtml(node.title || 'Learning Node')}</h1>
          <p class="node-description">${escapeHtml(node.content || 'Your instructor has not added a description for this node yet.')}</p>
          <div class="meta-row">
            <span class="soft-chip"><i class="ti ti-layers-subtract"></i>${escapeHtml(nodeTypeLabel(node.nodeType))}</span>
            <span class="soft-chip"><i class="ti ti-lock-open"></i>${escapeHtml(statusLabel(node.status))}</span>
            <span class="soft-chip"><i class="ti ti-video"></i>${videoCount ? 'Video available' : 'No video'}</span>
            <span class="soft-chip"><i class="ti ti-folder-open"></i>${resources.length} resource</span>
            <span class="soft-chip discussions-count"><i class="ti ti-messages"></i>0 comments</span>
          </div>
        </section>

        <section class="video-shell">
          ${videoTemplate(node, items)}
          <div class="player-controls">
            <button class="server-pill active" type="button">Lesson Video</button>
            <button class="server-pill" type="button">${resources.length} resource</button>
            <button class="server-pill discussions-count" type="button">0 comments</button>
          </div>
        </section>

        <section class="content-card">
          <h2>Node Content</h2>
          <p>${escapeHtml(node.content || 'Detailed content will be updated by your instructor later.')}</p>
        </section>
      </section>

      <aside class="side-column">
        <section class="side-card">
          <div class="side-card-header">
            <div>
              <h2>Comments & Q&A</h2>
              <p>Discussions and questions related to this node.</p>
            </div>
            <span class="soft-chip"><i class="ti ti-message-circle"></i></span>
          </div>
          ${commentsTemplate()}
        </section>
      </aside>`;
  }

  async function loadNodePage() {
    if (!nodeId) {
      renderError('Missing nodeId', 'Could not find the node to open. Please return to the roadmap and select a node again.');
      return;
    }

    try {
      const [nodeResponse, itemsResponse] = await Promise.all([
        fetch(`/api/learning-nodes/${encodeURIComponent(nodeId)}`, { headers: authHeaders(false) }),
        fetch(`/api/learning-nodes/${encodeURIComponent(nodeId)}/items`, { headers: authHeaders(false) })
      ]);

      if (!nodeResponse.ok) {
        throw new Error(await readError(nodeResponse));
      }

      const node = await nodeResponse.json();
      const items = itemsResponse.ok ? await itemsResponse.json() : [];
      const sortedItems = Array.isArray(items)
        ? [...items].sort((a, b) => (a.position || 0) - (b.position || 0))
        : [];

      renderNodePage(node, sortedItems);
      // Load actual discussions from API
      loadDiscussions();
    } catch (error) {
      renderError('Could not load node', error.message || 'Please try again later.');
    }
  }

  loadNodePage();

</script>
</body>
</html>
