<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{student/layout}">
<head>
  <title>Learning Spaces - FlippedClass</title>
  <th:block layout:fragment="head">
    <link rel="stylesheet" th:href="@{/assets/css/student-learning-spaces.css}">
  </th:block>
  <script>
(function() {
    function handleUnauthorized() {
        console.warn('Phiên đăng nhập đã hết hạn hoặc không hợp lệ. Đang chuyển hướng về trang đăng nhập...');
        localStorage.removeItem('jwt_token');
        sessionStorage.removeItem('jwt_token');
        window.location.href = '/signin';
    }
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        try {
            const response = await originalFetch.apply(this, args);
            if (response.status === 401) {
                handleUnauthorized();
            }
            return response;
        } catch (error) {
            throw error;
        }
    };
    const originalXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function() {
        this.addEventListener('load', function() {
            if (this.status === 401) {
                handleUnauthorized();
            }
        });
        originalXhrOpen.apply(this, arguments);
    };
})();
</script>
</head>
<body>
<span layout:fragment="topbar-title">Learning Spaces <span class="badge bg-primary-subtle text-primary rounded-pill">Roadmap</span></span>
<!-- MAIN CONTENT -->
<main id="content" class="content py-10" layout:fragment="content">
  <div class="container-fluid px-xl-5 page-shell">
    <section id="joinInviteSection" class="join-hero">
      <div>
        <span class="eyebrow"><i class="ti ti-door-enter"></i> Join learning space</span>
      </div>
      <form id="joinSpaceForm" class="join-form-card">
        <label for="inviteCode" class="form-label fw-bold text-dark">Class invite code</label>
        <div class="d-flex flex-column gap-3">
          <input id="inviteCode" class="form-control invite-input" type="text" placeholder="" autocomplete="off"
                 maxlength="24" required>
          <button id="joinSpaceButton" class="btn btn-primary rounded-pill fw-bold" type="submit">
            <i class="ti ti-door-enter me-2"></i>Join class
          </button>
        </div>
        <div id="joinMessage" class="message-box"></div>
      </form>
    </section>
    <section class="learning-layout">
      <aside class="panel-card">
        <div class="d-flex align-items-start justify-content-between gap-3">
          <div>
            <h4 class="section-title">LEARNING SPACES</h4>
          </div>
          <span id="spaceCount" class="soft-chip">classes</span>
        </div>
        <div class="mt-3">
          <input id="spaceSearch" class="form-control rounded-pill" type="search" placeholder="Search classes...">
        </div>
        <div id="spacesList" class="space-list">
          <div class="loading-state">Loading classes...</div>
        </div>
      </aside>
      <section class="panel-card detail-shell">
        <div id="spaceDetail">
          <div class="empty-state">
            <div>
              <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-route"></i></div>
            </div>
          </div>
        </div>
      </section>
    </section>
  </div>
  <!-- Join Confirmation Modal -->
  <div class="modal fade" id="joinConfirmModal" tabindex="-1" aria-labelledby="joinConfirmModalLabel"
       aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
        <div class="modal-header border-0 pb-0 position-absolute w-100 z-1 justify-content-start">
          <button type="button" class="btn-close m-4 opacity-50" data-bs-dismiss="modal" aria-label="Close"
                  style="width: 12px; height: 12px;"></button>
        </div>
        <div class="modal-body text-center pt-5 pb-4 px-4 position-relative">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
               style="width: 100px; height: 100px; background-color: #f4f5fa;">
            <i class="ti ti-door-enter" style="font-size: 3rem; color: #0d124b;"></i>
          </div>
          <h4 class="fw-bold mb-2 text-dark">Join Learning Space</h4>
          <p class="text-muted mb-4 px-3" style="font-size: 0.95rem;">You are requesting to join the following class.
            Are you sure you want to proceed?</p>
          <div class="p-4 bg-white rounded-3 mb-4 mx-3" style="border: 1px solid #eaeaef;">
            <h3 id="confirmSpaceName" class="fw-bolder mb-0" style="color: #0d124b; letter-spacing: -0.5px;"></h3>
          </div>
          <!-- Hidden invite code so JS can still use it -->
          <span id="confirmInviteCode" class="d-none"></span>
        </div>
        <div class="modal-footer border-0 pt-0 pb-5 px-4 justify-content-center gap-3">
          <button type="button" class="btn rounded-pill px-4 py-2 fw-bold text-dark border-0"
                  style="background-color: #f4f5f7;" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn rounded-pill px-5 py-2 fw-bold text-white" style="background-color: #0d124b;"
                  id="confirmJoinButton">Confirm Join</button>
        </div>
      </div>
    </div>
  </div>
</main>
<th:block layout:fragment="scripts">
  <script>
    const token = localStorage.getItem('jwt_token');
    const userId = localStorage.getItem('user_id');
    const state = {
      spaces: [],
      allSpaces: [],
      selectedSpaceId: null,
      searchTerm: '',
      focusRoadmapOnce: false,
      focusJoinOnce: false
    };
    const spacesList = document.getElementById('spacesList');
    const spaceDetail = document.getElementById('spaceDetail');
    const spaceCount = document.getElementById('spaceCount');
    const spaceSearch = document.getElementById('spaceSearch');
    const joinForm = document.getElementById('joinSpaceForm');
    const inviteCodeInput = document.getElementById('inviteCode');
    const joinButton = document.getElementById('joinSpaceButton');
    const joinMessage = document.getElementById('joinMessage');
    const joinConfirmModalElement = document.getElementById('joinConfirmModal');
    const confirmSpaceName = document.getElementById('confirmSpaceName');
    const confirmInviteCode = document.getElementById('confirmInviteCode');
    const confirmJoinButton = document.getElementById('confirmJoinButton');
    let pendingInviteCode = '';
    function authHeaders(includeJson = true) {
      const headers = { Authorization: `Bearer ${token}` };
      if (includeJson) headers['Content-Type'] = 'application/json';
      return headers;
    }
    function escapeHtml(value) {
      return String(value ?? '')
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;')
              .replaceAll("'", '&#039;');
    }
    function truncate(value, maxLength = 110) {
      const text = String(value || '').trim();
      if (!text) return '';
      return text.length > maxLength ? `${text.slice(0, maxLength - 1)}...` : text;
    }
    function statusLabel(status) {
      const labels = {
        ACTIVE: 'Active',
        DRAFT: 'Draft',
        LOCKED: 'Locked',
        UNLOCKED: 'Unlocked',
        ARCHIVED: 'Archived',
        DELETED: 'Deleted'
      };
      return labels[status] || status || 'Unknown';
    }
    function nodeTypeLabel(type) {
      const labels = {
        LESSON: 'Lesson',
        VIDEO: 'Video',
        PRACTICE: 'Practice',
        QUIZ: 'Quiz',
        REVIEW: 'Review',
        DOCUMENT: 'Document'
      };
      return labels[type] || type || 'Node';
    }
    function roleLabel(role) {
      const labels = {
        MEMBER: 'Student',
        OWNER: 'Owner',
        SUPPORTER: 'Teaching Assistant'
      };
      return labels[role] || role || 'Member';
    }
    function setJoinMessage(message, type) {
      joinMessage.textContent = message;
      joinMessage.className = `message-box show ${type}`;
    }
    function clearJoinMessage() {
      joinMessage.textContent = '';
      joinMessage.className = 'message-box';
    }
    function setJoinButtonLoading(isLoading, label = 'Joining...') {
      joinButton.disabled = isLoading;
      joinButton.innerHTML = isLoading
              ? `<span class="spinner-border spinner-border-sm me-2" role="status"></span>${label}`
              : '<i class="ti ti-door-enter me-2"></i>Join class';
    }
    function setConfirmJoinLoading(isLoading) {
      if (!confirmJoinButton) return;
      confirmJoinButton.disabled = isLoading;
      confirmJoinButton.innerHTML = isLoading
              ? '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Joining...'
              : 'Confirm Join';
    }
    function showJoinConfirmModal() {
      if (!joinConfirmModalElement) return;
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop fade show';
      backdrop.id = 'joinModalBackdrop';
      document.body.appendChild(backdrop);
      document.body.classList.add('modal-open');
      joinConfirmModalElement.style.display = 'block';
      joinConfirmModalElement.removeAttribute('aria-hidden');
      joinConfirmModalElement.setAttribute('aria-modal', 'true');
      requestAnimationFrame(() => {
        joinConfirmModalElement.classList.add('show');
      });
    }
    function hideJoinConfirmModal() {
      if (!joinConfirmModalElement) return;
      joinConfirmModalElement.classList.remove('show');
      const backdrop = document.getElementById('joinModalBackdrop');
      if (backdrop) backdrop.remove();
      document.body.classList.remove('modal-open');
      setTimeout(() => {
        joinConfirmModalElement.style.display = 'none';
        joinConfirmModalElement.setAttribute('aria-hidden', 'true');
        joinConfirmModalElement.removeAttribute('aria-modal');
      }, 200);
    }
    async function readError(response) {
      const text = await response.text();
      if (!text) return 'Something went wrong. Please try again.';
      try {
        const json = JSON.parse(text);
        return json.message || json.error || text;
      } catch {
        return text;
      }
    }
    function flattenQuizzes(learningSpaces) {
      return getJoinedSpaces(learningSpaces).flatMap((space) =>
              (space.quizzes || []).map((quiz) => ({ ...quiz, space }))
      );
    }
    function getJoinedSpaces(learningSpaces) {
      return (learningSpaces || []).filter((space) => {
        if (typeof space.joined === 'boolean') {
          return space.joined;
        }
        return true;
      });
    }
    function isJoinedSpace(space) {
      if (!space) return false;
      if (typeof space.joined === 'boolean') {
        return space.joined;
      }
      return true;
    }
    function readInitialSpaceId() {
      const value = new URLSearchParams(window.location.search).get('spaceId');
      const id = Number(value);
      return Number.isFinite(id) && id > 0 ? id : null;
    }
    function shouldFocusRoadmap() {
      const params = new URLSearchParams(window.location.search);
      return params.get('focus') === 'roadmap' || window.location.hash === '#roadmap';
    }
    function shouldFocusJoinInvite() {
      const params = new URLSearchParams(window.location.search);
      return params.get('focus') === 'join' || ['#join', '#joinSpaceForm'].includes(window.location.hash);
    }
    function focusRoadmapIfNeeded() {
      if (!state.focusRoadmapOnce) return;
      state.focusRoadmapOnce = false;
      requestAnimationFrame(() => {
        spaceDetail.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
    function focusJoinInviteIfNeeded() {
      if (!state.focusJoinOnce) return;
      state.focusJoinOnce = false;
      requestAnimationFrame(() => {
        const section = document.getElementById('joinInviteSection') || joinForm;
        section?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        inviteCodeInput?.focus({ preventScroll: true });
      });
    }
    async function loadSpaces(preferredSpaceId = null) {
      if (!token || !userId) {
        window.location.href = '/login';
        return;
      }
      spacesList.innerHTML = '<div class="loading-state">Loading class list...</div>';
      try {
        const response = await fetch(`/api/students/${userId}/dashboard`, {
          headers: authHeaders(false)
        });
        if (!response.ok) {
          throw new Error(await readError(response));
        }
        const data = await response.json();
        window.currentDashboardData = data;
        window.setStudentMenuUser?.(data.user);
        state.allSpaces = data.learningSpaces || [];
        state.spaces = getJoinedSpaces(state.allSpaces);

        // Let layout helper run notifications update
        if (typeof window.renderNotifications === 'function') {
          window.renderNotifications(flattenQuizzes(state.allSpaces), data.commentNotifications || []);
        }
        renderSpaces();
        const preferred = Number(preferredSpaceId);
        const preferredSpace = state.allSpaces.find((space) => space.id === preferred);
        if (Number.isFinite(preferred) && preferredSpace && !isJoinedSpace(preferredSpace)) {
          renderJoinPublicPrompt(preferredSpace);
          return;
        }
        const hasPreferred = Number.isFinite(preferred) && state.spaces.some((space) => space.id === preferred);
        const nextSpaceId = hasPreferred ? preferred : state.selectedSpaceId || (state.spaces[0] && state.spaces[0].id);
        if (nextSpaceId) {
          await selectSpace(nextSpaceId);
        } else {
          renderEmptyDetail();
        }
      } catch (error) {
        spacesList.innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`;
        renderEmptyDetail('Could not load learning space', 'Please check your login or try again later.');
      }
    }
    function renderSpaces() {
      const keyword = state.searchTerm.trim().toLowerCase();
      const filtered = state.spaces.filter((space) => {
        const haystack = `${space.name || ''} ${space.description || ''} ${space.inviteCode || ''}`.toLowerCase();
        return haystack.includes(keyword);
      });
      spaceCount.textContent = `${state.spaces.length} classes`;
      if (filtered.length === 0) {
        spacesList.innerHTML = `
        <div class="empty-state">
          <div>
            <div class="mb-2 text-primary" style="font-size: 2rem;"><i class="ti ti-school-off"></i></div>
            <p class="mb-0">No matching classes. Enter an invite code to join a learning space.</p>
          </div>
        </div>`;
        return;
      }
      const iconThemes = [
        { icon: 'ti-template', color: 'primary' },
        { icon: 'ti-flame', color: 'orange' },
        { icon: 'ti-database', color: 'info' },
        { icon: 'ti-brand-aws', color: 'warning' }
      ];
      spacesList.innerHTML = filtered.map((space, index) => {
        const theme = iconThemes[index % iconThemes.length];
        return `
      <button type="button" class="space-card theme-${theme.color} ${space.id === state.selectedSpaceId ? 'active' : ''}" data-space-id="${space.id}">
        <div class="d-flex align-items-start gap-2 mb-1">
          <i class="ti ${theme.icon} text-${theme.color}" style="font-size: 1.35rem; line-height: 1;"></i>
          <h3 class="space-card-title">${escapeHtml(space.name || 'Untitled Learning Space')}</h3>
        </div>
        <div class="space-meta">
          <span class="soft-chip border"><i class="ti ti-user"></i>${escapeHtml(roleLabel(space.memberRole))}</span>
          <span class="soft-chip border"><i class="ti ti-circle-check"></i>${escapeHtml(statusLabel(space.status))}</span>
        </div>
      </button>
    `}).join('');
      document.querySelectorAll('[data-space-id]').forEach((button) => {
        button.addEventListener('click', () => selectSpace(Number(button.dataset.spaceId)));
      });
    }
    function renderEmptyDetail(title = 'Select a learning space', message = 'Course roadmaps and nodes will appear here.') {
      spaceDetail.innerHTML = `
      <div class="empty-state">
        <div>
          <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-route"></i></div>
          <h2 class="section-title">${escapeHtml(title)}</h2>
          <p class="section-note">${escapeHtml(message)}</p>
        </div>
      </div>`;
    }
    function renderJoinPublicPrompt(space) {
      state.selectedSpaceId = null;
      renderSpaces();
      spaceDetail.innerHTML = `
      <div class="empty-state">
        <div>
          <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-door-enter"></i></div>
          <h2 class="section-title">${escapeHtml(space.name || 'Public class')}</h2>
          <p class="section-note">This is a public class. Join it before you can view the roadmap and learning nodes.</p>
          <button type="button" class="btn btn-primary rounded-pill fw-bold px-4 mt-3" id="joinPublicSpaceButton" data-space-id="${space.id}">
            <i class="ti ti-door-enter me-2"></i>Join class
          </button>
        </div>
      </div>`;
      document.getElementById('joinPublicSpaceButton')?.addEventListener('click', () => joinPublicSpace(space.id));
    }
    async function joinPublicSpace(spaceId) {
      const button = document.getElementById('joinPublicSpaceButton');
      const originalHtml = button?.innerHTML;
      if (button) {
        button.disabled = true;
        button.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Joining...';
      }
      try {
        const response = await fetch('/api/learning-spaces/join', {
          method: 'POST',
          headers: authHeaders(true),
          body: JSON.stringify({ spaceId: Number(spaceId) })
        });
        if (!response.ok) {
          throw new Error(await readError(response));
        }
        const data = await response.json();
        setJoinMessage(data.message || 'Joined class successfully.', 'success');
        await loadSpaces(data.learningSpaceId);
      } catch (error) {
        setJoinMessage(error.message, 'error');
        if (button) {
          button.disabled = false;
          button.innerHTML = originalHtml;
        }
      }
    }
    async function selectSpace(spaceId) {
      const selected = state.spaces.find((space) => space.id === Number(spaceId));
      if (!selected) {
        const publicSpace = state.allSpaces.find((space) => space.id === Number(spaceId));
        if (publicSpace && !isJoinedSpace(publicSpace)) {
          renderJoinPublicPrompt(publicSpace);
        }
        return;
      }
      if (!isJoinedSpace(selected)) {
        renderJoinPublicPrompt(selected);
        return;
      }
      state.selectedSpaceId = selected.id;
      renderSpaces();
      renderDetailLoading(selected);
      try {
        const response = await fetch(`/api/learning-spaces/${selected.id}/learning-paths`, {
          headers: authHeaders(false)
        });
        if (!response.ok) {
          throw new Error(await readError(response));
        }
        const paths = await response.json();
        renderDetail(selected, paths || []);
      } catch (error) {
        renderDetail(selected, [], error.message);
      } finally {
        focusRoadmapIfNeeded();
      }
    }
    function renderDetailLoading(space) {
      spaceDetail.innerHTML = `
      ${detailHeaderTemplate(space)}
      <div class="loading-state">Loading class roadmap...</div>`;
    }
    function detailHeaderTemplate(space) {
      return `
      <section class="detail-header" id="roadmap">
        <div>
          <span class="eyebrow"><i class="ti ti-route"></i> Class roadmap</span>
          <h2 class="detail-title">${escapeHtml(space?.name || 'Learning Space')}</h2>
          <p class="detail-desc">${escapeHtml(space?.description || 'Your instructor has not added a class description yet.')}</p>
          <div class="space-meta">
            <span class="soft-chip"><i class="ti ti-user"></i>${escapeHtml(roleLabel(space?.memberRole))}</span>
            <span class="soft-chip"><i class="ti ti-circle-check"></i>${escapeHtml(statusLabel(space?.status))}</span>
          </div>
        </div>
      </section>`;
    }
    function renderDetail(space, paths, errorMessage = '') {
      if (errorMessage) {
        spaceDetail.innerHTML = `
        ${detailHeaderTemplate(space)}
        <div class="empty-state">
          <div>
            <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-alert-circle"></i></div>
            <h2 class="section-title">Could not load roadmap</h2>
            <p class="section-note">${escapeHtml(errorMessage)}</p>
          </div>
        </div>`;
        return;
      }
      if (!paths.length) {
        spaceDetail.innerHTML = `
        ${detailHeaderTemplate(space)}
        <div class="empty-state">
          <div>
            <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="ti ti-map-off"></i></div>
            <h2 class="section-title">No Roadmap Yet</h2>
            <p class="section-note">Your instructor has not created courses or nodes for this learning space yet.</p>
          </div>
        </div>`;
        return;
      }
      const sortedPaths = [...paths].sort((a, b) => (a.position || 0) - (b.position || 0));
      spaceDetail.innerHTML = `
      ${detailHeaderTemplate(space)}
      <div class="roadmap-grid">
        ${sortedPaths.map((path, index) => pathTemplate(path, index)).join('')}
      </div>`;
    }
    function pathTemplate(path, index) {
      const nodes = [...(path.nodes || [])].sort((a, b) => (a.id || 0) - (b.id || 0));
      const openNodes = nodes.filter((node) => ['UNLOCKED', 'ACTIVE'].includes(node.status)).length;
      const percent = nodes.length ? Math.round((openNodes / nodes.length) * 100) : 0;
      return `
      <article class="path-card">
        <header class="path-header">
          <div>
            <span class="path-kicker">Course ${index + 1}</span>
            <h3 class="path-title">${escapeHtml(path.title || 'Untitled Course')}</h3>
          </div>
          <div class="path-progress">
            <div class="fw-bold text-primary mb-2">${percent}% unlocked</div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${percent}%;"></div>
            </div>
            <div class="small text-muted fw-semibold mt-2">${nodes.length} node</div>
          </div>
        </header>
        <div class="node-timeline">
          ${nodes.length ? nodes.map((node, nodeIndex) => nodeTemplate(node, nodeIndex)).join('') : emptyNodesTemplate()}
        </div>
      </article>`;
    }
    function nodeTemplate(node, index) {
      const isDocument = node.nodeType === 'DOCUMENT';
      const params = new URLSearchParams({
        nodeId: node.id,
        spaceId: state.selectedSpaceId || ''
      });

      if (isDocument) {
        return `
        <a class="node-card" href="javascript:void(0)" onclick="openDocumentNode(event, ${node.id})" style="cursor: pointer;">
          <div class="node-index">${index + 1}</div>
          <div>
            <h4 class="node-title">${escapeHtml(node.title || `Node ${index + 1}`)}</h4>
            <p class="node-content">${escapeHtml(node.content || 'Click to open document in new tab.')}</p>
          </div>
          <div class="node-badges">
            <span class="soft-chip"><i class="ti ti-layers-subtract"></i>${escapeHtml(nodeTypeLabel(node.nodeType))}</span>
            <span class="soft-chip"><i class="ti ti-lock-open"></i>${escapeHtml(statusLabel(node.status))}</span>
          </div>
          <span class="node-open" aria-hidden="true"><i class="ti ti-arrow-up-right"></i></span>
        </a>`;
      }

      const href = `/student/learning-node?${params.toString()}`;

      return `
      <a class="node-card" href="${href}">
        <div class="node-index">${index + 1}</div>
        <div>
          <h4 class="node-title">${escapeHtml(node.title || `Node ${index + 1}`)}</h4>
          <p class="node-content">${escapeHtml(node.content || 'Click to open this node learning page.')}</p>
        </div>
        <div class="node-badges">
          <span class="soft-chip"><i class="ti ti-layers-subtract"></i>${escapeHtml(nodeTypeLabel(node.nodeType))}</span>
          <span class="soft-chip"><i class="ti ti-lock-open"></i>${escapeHtml(statusLabel(node.status))}</span>
        </div>
        <span class="node-open" aria-hidden="true"><i class="ti ti-arrow-up-right"></i></span>
      </a>`;
    }

    async function openDocumentNode(event, nodeId) {
      event.preventDefault();
      const newWindow = window.open('', '_blank');
      if (newWindow) {
        newWindow.document.write('<div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;">Opening document...</div>');
      }
      try {
        const res = await fetch(`/api/learning-nodes/${nodeId}/items`, { headers: authHeaders(false) });
        if (!res.ok) throw new Error('Cannot fetch items');
        const items = await res.json();
        const docItem = items.find(i => ['PDF', 'DOC', 'DOCUMENT'].includes(String(i.itemType || '').toUpperCase()) && (i.fullUrl || i.url));
        if (docItem) {
          const docUrl = docItem.fullUrl || docItem.url;
          if (newWindow) {
            newWindow.location.href = docUrl;
          } else {
            window.open(docUrl, '_blank');
          }
        } else {
          if (newWindow) newWindow.close();
          alert('No document URL found for this node.');
        }
      } catch (err) {
        if (newWindow) newWindow.close();
        alert('Failed to load document: ' + err.message);
      }
    }
    function emptyNodesTemplate() {
      return `
      <div class="empty-state" style="min-height: 160px;">
        <div>
          <div class="mb-2 text-primary" style="font-size: 2rem;"><i class="ti ti-node-off"></i></div>
          <p class="mb-0">This course has no nodes yet.</p>
        </div>
      </div>`;
    }
    async function copyInviteCode(code) {
      if (!code) return;
      try {
        await navigator.clipboard.writeText(code);
        setJoinMessage(`Copied code ${code}.`, 'success');
      } catch {
        setJoinMessage(`Class code: ${code}`, 'success');
      }
    }
    async function previewSpaceByInviteCode(inviteCode) {
      const response = await fetch(`/api/learning-spaces/invite-code/${encodeURIComponent(inviteCode)}`, {
        headers: authHeaders(false)
      });
      if (!response.ok) {
        throw new Error(await readError(response));
      }
      return response.json();
    }
    async function joinSpaceByInviteCode(inviteCode) {
      const response = await fetch('/api/learning-spaces/join', {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify({ inviteCode })
      });
      if (!response.ok) {
        throw new Error(await readError(response));
      }
      return response.json();
    }
    async function handleJoinSuccess(data) {
      setJoinMessage(data.message || 'Joined class successfully.', 'success');
      inviteCodeInput.value = '';
      pendingInviteCode = '';
      await loadSpaces(data.learningSpaceId);
    }
    joinForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearJoinMessage();
      const inviteCode = inviteCodeInput.value.trim();
      if (!inviteCode) {
        setJoinMessage('Please enter an invite code.', 'error');
        return;
      }
      setJoinButtonLoading(true, 'Checking...');
      try {
        const space = await previewSpaceByInviteCode(inviteCode);
        if (!joinConfirmModalElement || !confirmSpaceName || !confirmInviteCode) {
          await handleJoinSuccess(await joinSpaceByInviteCode(inviteCode));
          return;
        }
        pendingInviteCode = inviteCode;
        confirmSpaceName.textContent = space.name || 'Learning Space';
        confirmInviteCode.textContent = inviteCode;
        showJoinConfirmModal();
      } catch (error) {
        setJoinMessage(error.message, 'error');
      } finally {
        setJoinButtonLoading(false);
      }
    });
    confirmJoinButton?.addEventListener('click', async () => {
      if (!pendingInviteCode) return;
      setConfirmJoinLoading(true);
      try {
        const data = await joinSpaceByInviteCode(pendingInviteCode);
        hideJoinConfirmModal();
        await handleJoinSuccess(data);
      } catch (error) {
        hideJoinConfirmModal();
        setJoinMessage(error.message, 'error');
      } finally {
        setConfirmJoinLoading(false);
      }
    });
    joinConfirmModalElement?.querySelector('[data-bs-dismiss="modal"]')?.addEventListener('click', hideJoinConfirmModal);
    spaceDetail.addEventListener('click', (event) => {
      const copyButton = event.target.closest('[data-copy-invite-code]');
      if (!copyButton) return;
      copyInviteCode(copyButton.dataset.copyInviteCode);
    });
    spaceSearch.addEventListener('input', () => {
      state.searchTerm = spaceSearch.value;
      renderSpaces();
    });
    document.addEventListener('DOMContentLoaded', () => {
      state.focusRoadmapOnce = shouldFocusRoadmap();
      state.focusJoinOnce = shouldFocusJoinInvite();
      loadSpaces(readInitialSpaceId()).finally(() => focusJoinInviteIfNeeded());
    });
  </script>
</th:block>
</body>
</html>
