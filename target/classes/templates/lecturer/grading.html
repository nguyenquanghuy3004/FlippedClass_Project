<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{lecturer/layout}">

<head>
  <meta charset="UTF-8" />
  <title>Student Grading - FlippedClass</title>
  <th:block layout:fragment="head">
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/assets/css/lecturer-grading.css}">
  </th:block>
</head>

<body>
<div layout:fragment="content">
  <div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
      <div>
        <h2 class="fw-bold mb-0">Evaluate Student</h2>
        <p class="text-muted mb-0">Review interaction logs and submit grades.</p>
      </div>
      <a href="javascript:history.back()" class="btn btn-light rounded-pill shadow-sm"><i class="ti ti-arrow-left"></i> Back</a>
    </div>

    <div id="loader" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div class="row g-4 d-none" id="gradingContent">
      <!-- LEFT COLUMN: CONTEXT -->
      <div class="col-12 col-xl-5">
        <div class="grading-card">

          <div class="student-header">
            <img th:src="@{/assets/images/avatar-2.jpg}" class="student-avatar" id="studentAvatar" alt="Student">
            <div>
              <h4 class="fw-bold mb-1" id="studentName">Student Name</h4>
              <div class="text-muted fs-7 mb-2" id="studentRoll">Roll Number</div>
              <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="openProfileModal()">
                <i class="ti ti-id"></i> View Full Profile
              </button>
            </div>
          </div>

          <h5 class="fw-bold mb-3"><i class="ti ti-history text-primary"></i> 20 Recent Interactions</h5>
          <div class="timeline" id="interactionTimeline">
            <!-- JS populated -->
          </div>

          <h5 class="fw-bold mb-3 mt-5"><i class="ti ti-award text-success"></i> Previous Grades</h5>
          <div id="pastGradesContainer">
            <!-- JS populated -->
          </div>

        </div>
      </div>

      <!-- RIGHT COLUMN: GRADE ENTRY -->
      <div class="col-12 col-xl-7">
        <div class="grading-card">
          <h4 class="fw-bold mb-4"><i class="ti ti-checkup-list text-primary"></i> Grade Entry</h4>

          <div id="alertMessage" class="alert d-none" role="alert"></div>

          <form id="gradeForm" onsubmit="submitGrades(event)">
            <div id="criteriaContainer">
              <!-- JS populated -->
            </div>

            <div class="d-grid gap-2 mt-4 pt-3 border-top">
              <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm" id="submitBtn">
                <i class="ti ti-device-floppy"></i> Submit Grades
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>

  </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
        <h4 class="modal-title fw-bold" id="profileModalLabel">Student Profile</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <div id="profileLoader" class="text-center py-4 d-none">
          <div class="spinner-border text-primary" role="status"></div>
        </div>
        <div id="profileContent">
          <!-- Tabs -->
          <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active rounded-pill px-4 fw-bold" id="pills-logs-tab" data-bs-toggle="pill" data-bs-target="#pills-logs" type="button" role="tab"><i class="ti ti-list"></i> All Interactions</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link rounded-pill px-4 fw-bold" id="pills-grades-tab" data-bs-toggle="pill" data-bs-target="#pills-grades" type="button" role="tab"><i class="ti ti-star"></i> All Grades</button>
            </li>
          </ul>
          <div class="tab-content" id="pills-tabContent">
            <div class="tab-pane fade show active" id="pills-logs" role="tabpanel">
              <div class="timeline mt-0" id="fullInteractionTimeline"></div>
            </div>
            <div class="tab-pane fade" id="pills-grades" role="tabpanel">
              <div id="fullGradesContainer"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<th:block layout:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Utility to get URL params
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('sessionId');
    const studentId = urlParams.get('studentId');

    const LECTURER_ID = localStorage.getItem('user_id') || 1;
    let currentCriteria = [];
    let currentStudentInfo = null;

    document.addEventListener("DOMContentLoaded", () => {
      if (!sessionId || !studentId) {
        showAlert('Missing sessionId or studentId in URL parameters.', 'danger');
        document.getElementById('loader').classList.add('d-none');
        return;
      }
      loadGradingContext();
    });

    function showAlert(message, type = 'success') {
      const alertEl = document.getElementById('alertMessage');
      alertEl.innerText = message;
      alertEl.className = `alert alert-${type} mb-4 fw-bold rounded-3 border-0`;
      alertEl.classList.remove('d-none');
      setTimeout(() => alertEl.classList.add('d-none'), 5000);
    }

    async function loadGradingContext() {
      const loader = document.getElementById('loader');
      const content = document.getElementById('gradingContent');

      try {
        const token = localStorage.getItem('jwt_token');
        const response = await fetch(`/api/evaluations/sessions/${sessionId}/grading-context?studentId=${studentId}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        if (!response.ok) {
          throw new Error('API not available, using mock data');
        }
        const data = await response.json();
        renderContext(data);
      } catch (error) {
        console.warn(error);
        // Fallback Mock Data for UI Demonstration
        const mockData = {
          student: { id: studentId, firstName: "Nguyen", lastName: "Van A", username: "SE123456" },
          criteria: [
            { id: 1, name: "Class Participation", maxScore: 10, description: "Active engagement in Q&A." },
            { id: 2, name: "Homework Completion", maxScore: 10, description: "Submission of pre-class exercises." }
          ],
          recentInteractions: [
            { id: 101, type: "CLASS_PARTICIPATION", summary: "Answered scenario question correctly", timestamp: new Date().toISOString() },
            { id: 102, type: "HOME_STUDY", summary: "Watched video Chapter 3", timestamp: new Date(Date.now() - 86400000).toISOString() },
            { id: 103, type: "CLASS_PARTICIPATION", summary: "Asked a very insightful question", timestamp: new Date(Date.now() - 172800000).toISOString() }
          ],
          previousGrades: []
        };
        renderContext(mockData);
      } finally {
        loader.classList.add('d-none');
        content.classList.remove('d-none');
      }
    }

    function renderContext(data) {
      currentStudentInfo = data.student;
      currentCriteria = data.session ? data.session.criteria : data.criteria; // fallback for mock data

      // Student Info
      if(data.student) {
        document.getElementById('studentName').innerText = data.student.fullName || data.student.username;
        document.getElementById('studentRoll').innerText = data.student.username;
      }

      // Interactions Timeline
      const timeline = document.getElementById('interactionTimeline');
      const interactions = data.interactionHistory || data.recentInteractions || [];
      timeline.innerHTML = '';
      if (interactions.length > 0) {
        interactions.forEach(log => {
          const type = log.interactionType || log.type;
          const isHome = type === 'HOME_STUDY';
          const iconClass = isHome ? 'home' : 'class';
          const icon = isHome ? 'ti-home-2' : 'ti-users';
          const dateStr = new Date(log.occurredAt || log.timestamp).toLocaleString();

          timeline.innerHTML += `
            <div class="timeline-item">
              <div class="timeline-icon ${iconClass}"><i class="ti ${icon} fs-7"></i></div>
              <div class="timeline-content">
                <div class="timeline-date">${dateStr} &bull; <span class="${isHome ? 'text-primary' : 'text-success'}">${type.replace('_', ' ')}</span></div>
                <div class="fw-bold text-dark fs-6">${log.summary}</div>
              </div>
            </div>
          `;
        });
      } else {
        timeline.innerHTML = '<p class="text-muted fst-italic">No recent interactions.</p>';
      }

      // Past Grades
      const pastContainer = document.getElementById('pastGradesContainer');
      const pastGrades = data.existingGrades || data.previousGrades || [];
      pastContainer.innerHTML = '';
      if (pastGrades.length > 0) {
        pastGrades.forEach(grade => {
          pastContainer.innerHTML += `
            <div class="p-3 bg-light rounded-3 mb-2 border">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="fw-bold text-dark fs-6">${grade.criterionName}</span>
                <span class="badge bg-success fs-6">${grade.score} ${grade.maxScore ? '/ ' + grade.maxScore : ''}</span>
              </div>
              <p class="mb-0 text-muted fs-7"><i class="ti ti-message-2 text-primary"></i> ${grade.comment}</p>
            </div>
          `;
        });
      } else {
        pastContainer.innerHTML = '<p class="text-muted fst-italic">No previous grades found.</p>';
      }

      // Render Grade Entry Form
      const criteriaContainer = document.getElementById('criteriaContainer');
      const renderCriteria = data.session ? data.session.criteria : data.criteria;
      criteriaContainer.innerHTML = '';
      if(renderCriteria && renderCriteria.length > 0) {
        renderCriteria.forEach(crit => {
          criteriaContainer.innerHTML += `
              <div class="criterion-box">
                <div class="d-flex justify-content-between">
                  <div>
                    <h5 class="criterion-title">${crit.name}</h5>
                    <p class="text-muted fs-7 mb-0">${crit.description || 'Evaluate this criterion'}</p>
                  </div>
                  <div class="text-end">
                    <label class="form-label text-muted fs-7 mb-1 fw-bold">Score (Max ${crit.maxScore})</label>
                    <div class="d-flex align-items-center justify-content-end gap-2">
                      <input type="number" class="form-control score-input" name="score_${crit.id}" min="0" max="${crit.maxScore}" step="0.5" required>
                    </div>
                  </div>
                </div>
                <div class="mt-3 bg-white p-3 border rounded-3">
                  <label class="form-label fw-bold"><i class="ti ti-message-circle-2 text-primary"></i> Mandatory Comment <span class="text-danger">*</span></label>
                  <textarea class="form-control border-0 bg-light" name="comment_${crit.id}" rows="2" placeholder="Explain the reasoning for this score..." required></textarea>
                  <div class="invalid-feedback">A comment is required for this grade.</div>
                </div>
              </div>
            `;
        });
      } else {
        criteriaContainer.innerHTML = '<div class="alert alert-warning">No grading criteria found for this session.</div>';
        document.getElementById('submitBtn').disabled = true;
      }
    }

    async function submitGrades(e) {
      e.preventDefault();
      const form = e.target;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Submitting...';

      let hasError = false;

      for (const crit of currentCriteria) {
        const score = form.elements[`score_${crit.id}`].value;
        const commentInput = form.elements[`comment_${crit.id}`];
        const comment = commentInput.value.trim();

        if (comment.length < 10) {
          showAlert('Comment must be at least 10 characters long.', 'danger');
          btn.disabled = false;
          btn.innerHTML = '<i class="ti ti-device-floppy"></i> Submit Grades';
          hasError = true;
          return;
        }

        const payload = {
          sessionId: parseInt(sessionId),
          studentId: parseInt(studentId),
          criterionId: crit.id,
          lecturerId: parseInt(LECTURER_ID),
          score: parseFloat(score),
          comment: comment
        };

        try {
          const token = localStorage.getItem('jwt_token');
          const response = await fetch('/api/evaluations/grades', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error('Submission failed');
        } catch(error) {
          console.error(error);
          hasError = true;
        }
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-device-floppy"></i> Submit Grades';

      if (hasError) {
        showAlert('Some grades failed to submit. Make sure the API is running correctly.', 'danger');
      } else {
        showAlert('All grades submitted successfully!', 'success');
        // Reload context to see past grades
        loadGradingContext();
        form.reset();
      }
    }

    let profileModal = null;

    async function openProfileModal() {
      if(!profileModal) {
        profileModal = new bootstrap.Modal(document.getElementById('profileModal'));
      }
      profileModal.show();
      const loader = document.getElementById('profileLoader');
      const content = document.getElementById('profileContent');

      loader.classList.remove('d-none');
      content.style.opacity = '0.3';

      try {
        const response = await fetch(`/api/evaluations/students/${studentId}/profile`);
        if (!response.ok) throw new Error('API not available');
        const data = await response.json();
        renderProfileModal(data);
      } catch (error) {
        console.warn(error);
        // Mock data fallback
        const mockData = {
          student: currentStudentInfo,
          allInteractions: [
            { type: "CLASS_PARTICIPATION", summary: "Answered scenario question correctly", timestamp: new Date().toISOString() },
            { type: "HOME_STUDY", summary: "Watched video Chapter 3", timestamp: new Date(Date.now() - 86400000).toISOString() },
            { type: "HOME_STUDY", summary: "Completed quiz prep", timestamp: new Date(Date.now() - 186400000).toISOString() }
          ],
          allGrades: [
            { criterionName: "Midterm Attendance", score: 10, maxScore: 10, comment: "Always present." }
          ]
        };
        renderProfileModal(mockData);
      } finally {
        loader.classList.add('d-none');
        content.style.opacity = '1';
      }
    }

    function renderProfileModal(data) {
      // Render Full Interactions
      const tl = document.getElementById('fullInteractionTimeline');
      const allInteractions = data.allInteractions || data.interactionHistory || [];
      tl.innerHTML = '';
      if(allInteractions.length > 0) {
        allInteractions.forEach(log => {
          const type = log.interactionType || log.type;
          const isHome = type === 'HOME_STUDY';
          const iconClass = isHome ? 'home' : 'class';
          const icon = isHome ? 'ti-home-2' : 'ti-users';
          tl.innerHTML += `
            <div class="timeline-item">
              <div class="timeline-icon ${iconClass}"><i class="ti ${icon} fs-7"></i></div>
              <div class="timeline-content">
                <div class="timeline-date">${new Date(log.occurredAt || log.timestamp).toLocaleString()} &bull; <span class="${isHome ? 'text-primary' : 'text-success'}">${type.replace('_', ' ')}</span></div>
                <div class="fw-bold text-dark fs-6">${log.summary}</div>
              </div>
            </div>
          `;
        });
      } else {
        tl.innerHTML = '<p class="text-muted fst-italic">No interactions recorded.</p>';
      }

      // Render Full Grades
      const gl = document.getElementById('fullGradesContainer');
      const allGrades = data.allGrades || data.existingGrades || [];
      gl.innerHTML = '';
      if(allGrades.length > 0) {
        allGrades.forEach(grade => {
          gl.innerHTML += `
            <div class="p-3 bg-light rounded-3 mb-2 border">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="fw-bold text-dark fs-6">${grade.criterionName}</span>
                <span class="badge bg-success fs-6">${grade.score} ${grade.maxScore ? '/ ' + grade.maxScore : ''}</span>
              </div>
              <p class="mb-0 text-muted fs-7"><i class="ti ti-message-2 text-primary"></i> ${grade.comment}</p>
            </div>
          `;
        });
      } else {
        gl.innerHTML = '<p class="text-muted fst-italic">No grades recorded.</p>';
      }
    }
  </script>
</th:block>
</body>
</html>
