<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
  <meta charset="UTF-8" />
  <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">FCMS Mentor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="manifest" th:href="@{/assets/site.webmanifest}">

  <script type="module" crossorigin th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin th:href="@{/assets/css/main.css}">
  <!-- FontAwesome for fallback -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" th:href="@{/assets/css/lecturer-layout.css}">
  <link rel="stylesheet" th:href="@{/assets/css/student-user-menu.css}">
  <th:block layout:fragment="head"></th:block>
</head>

<body>
  <div id="overlay" class="overlay"></div>
  <!-- TOPBAR -->
  <nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3">
    <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm ">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>

    <!-- MOBILE -->
    <button id="mobileBtn" class="btn btn-light btn-icon btn-sm d-lg-none me-2">
      <i class="ti ti-layout-sidebar-left-expand"></i>
    </button>
    <div>
      <ul class="list-unstyled d-flex align-items-center mb-0 gap-1">
          <li class="ms-3">
            <div class="student-user-menu topbar-user-menu" data-user-menu>
              <button class="student-menu-trigger bg-transparent border-0" type="button" data-user-menu-toggle aria-expanded="false" aria-label="Account menu">
                <img class="student-menu-avatar" data-user-avatar th:src="@{/assets/images/avatar-2.jpg}" alt="Lecturer avatar">
                <span class="student-menu-info">
                  <span class="student-menu-name" data-user-name>FCMS Mentor</span>
                  <span class="student-menu-role">Lecturer</span>
                </span>
                <i class="ti ti-chevron-down student-menu-chevron ms-1"></i>
              </button>
              <div class="student-menu-panel" role="menu" style="right:0; left:auto; top:100%; margin-top:0.5rem; position:absolute;">
                <a class="student-menu-item" th:href="@{/docs}" role="menuitem"><i class="ti ti-help-circle"></i><span>Help</span></a>
                <button class="student-menu-item student-menu-item-danger" type="button" onclick="logout()" role="menuitem"><i class="ti ti-logout"></i><span>Logout</span></button>
              </div>
            </div>
          </li>
      </ul>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar d-flex flex-column">
    <div class="logo-area py-3 px-4 mb-3 border-bottom" style="border-color: rgba(0,0,0,0.05) !important;">
      <a href="#" class="d-flex align-items-center text-decoration-none">
        <div class="d-flex align-items-center justify-content-center rounded-3 me-3" style="width: 40px; height: 40px; background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%); box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);">
          <i class="fa-solid fa-chalkboard-user text-white fs-5"></i>
        </div>
        <span class="logo-text fw-bolder fs-5 text-nowrap" style="white-space: nowrap; background: linear-gradient(135deg, #0f172a 0%, #334155 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; font-family: 'Inter', sans-serif;">
          FCMS <span style="font-weight: 500; background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Lecture</span>
        </span>
      </a>
    </div>
    <ul class="nav flex-column mb-auto">
      <li class="px-4 py-2"><small class="nav-text">Workspace</small></li>
      <li>
        <a class="nav-link" href="/lecturer/dashboard" data-nav-path="/lecturer/dashboard">
          <i class="ti ti-box-seam"></i><span class="nav-text">My Spaces</span>
        </a>
      </li>
      <li>
        <a class="nav-link" href="/lecturer/quizzes" data-nav-path="/lecturer/quizzes">
          <i class="ti ti-checklist"></i><span class="nav-text">My Quizzes</span>
        </a>
      </li>
      <li>
        <a class="nav-link" href="/lecturer/evaluation-sessions" data-nav-path="/lecturer/evaluation-sessions">
          <i class="ti ti-clipboard-list"></i><span class="nav-text">Eval Sessions</span>
        </a>
      </li>
      <li>
        <a class="nav-link" href="/lecturer/grading" data-nav-path="/lecturer/grading">
<!--          <i class="ti ti-pencil-star"></i><span class="nav-text">Grading</span>-->
        </a>
      </li>
    </ul>
    
    <div layout:fragment="sidebar-bottom" class="mt-auto w-100"></div>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="content" class="content py-10">
    <div class="container-fluid">

      <div layout:fragment="content">
        <!-- Dynamic Content goes here -->
      </div>

      <div class="row">
        <div class="col-12">
          <footer class="text-center py-2 mt-6 text-secondary ">
            <p class="mb-0">FCMS Mentor Workspace. Powered by InApp Theme</p>
          </footer>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // Setup AJAX to include JWT token if stored in localStorage
    $(function () {
      var token = localStorage.getItem('jwt_token');
      if (token) {
        $.ajaxSetup({
          headers: { 'Authorization': 'Bearer ' + token }
        });
      }
    });

    // User Menu Toggle Logic
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-user-menu]').forEach((menu) => {
        const toggle = menu.querySelector('[data-user-menu-toggle]');
        toggle?.addEventListener('click', (event) => {
          event.stopPropagation();
          const shouldOpen = !menu.classList.contains('is-open');
          document.querySelectorAll('[data-user-menu].is-open').forEach(m => m.classList.remove('is-open'));
          menu.classList.toggle('is-open', shouldOpen);
          toggle.setAttribute('aria-expanded', String(shouldOpen));
        });
      });
      document.addEventListener('click', () => {
        document.querySelectorAll('[data-user-menu].is-open').forEach(m => m.classList.remove('is-open'));
      });
    });

    function logout() {
      localStorage.removeItem('jwt_token');
      window.location.href = '/signin';
    }

    // Auto-highlight active sidebar menu item
    $(document).ready(function() {
      const path = window.location.pathname;
      $('.sidebar .nav-link').removeClass('active');
      
      let matched = false;
      $('.sidebar .nav-link').each(function() {
        const navPath = $(this).attr('data-nav-path');
        if (navPath && path.startsWith(navPath)) {
          $(this).addClass('active');
          matched = true;
        }
      });
      // Fallback
      if (!matched) {
        $('.sidebar .nav-link[data-nav-path="/lecturer/dashboard"]').addClass('active');
      }
    });
  </script>
  <th:block layout:fragment="scripts"></th:block>
</body>

</html>
